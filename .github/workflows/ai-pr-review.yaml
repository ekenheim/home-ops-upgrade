---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# AI review of every PR, after joryirving/home-ops (misospace/pr-reviewer-action).
# Phase 1b of kubernetes/apps/llm/PLATFORM-PLAN.md.
#
# Runs on the in-cluster runners because LiteLLM is internal-only (Jory's is
# public, so he uses ubuntu-latest). The key is the operator-minted
# litellm-key-pr-review, copied into the LITELLM_PR_REVIEW_API_KEY Actions
# secret (see kubernetes/apps/llm/litellm/keys/pr-review.yaml).
#
# It reviews against AGENTS.md's "PR Review Standards" and FAILS on a
# request_changes verdict, so it only gates auto-merge if "AI PR Review" is
# made a required check in branch protection. A model outage posts a notice
# and passes (on_model_failure: notice) -- LiteLLM being down must not freeze
# every Renovate merge.
name: AI PR Review

on:
  pull_request:
    branches: ["main"]
    # `labeled`: add the `ai-review` label to force a fresh review.
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to (re-)review
        required: true

concurrency:
  # Label events get their own group: Renovate adds several labels at
  # creation, and a shared group with cancel-in-progress would let those
  # cancel the real `opened` review.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}${{ github.event.action == 'labeled' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review-pr:
    name: AI PR Review
    # Never run a fork's PR on a self-hosted runner: the repo is public and the
    # runner sits inside the cluster network.
    #
    # Renovate's non-major PRs (patch, minor, digest; a major carries `!:` in
    # its conventional-commit title) skip the review: it runs on worker4's two
    # LLM slots and took minutes per routine bump (2026-10-19). A skipped job
    # counts as passing. Majors are still reviewed, and the `ai-review` label
    # forces a review on any PR. Renovate rebases majors only on conflict
    # (.github/renovate/packageRules.json5), so a major is not re-reviewed
    # every time main moves.
    if: >-
      ${{ (github.event_name == 'pull_request'
            && !github.event.pull_request.draft
            && github.event.pull_request.head.repo.full_name == github.repository
            && (!contains(fromJSON('["renovate[bot]","mini-smurf-cluster[bot]"]'), github.event.pull_request.user.login)
                || contains(github.event.pull_request.title, '!:')
                || contains(github.event.pull_request.labels.*.name, 'ai-review')))
          || github.event_name == 'workflow_dispatch' }}
    runs-on: gha-runner-scale-set
    # A review takes ~10 min (specialists on worker4, one MiniMax call). The
    # rest is headroom for implementation-pool falling through to worker4.
    timeout-minutes: 50
    steps:
      - name: Resolve PR head for re-review
        id: prctx
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          echo "head_sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || steps.prctx.outputs.head_sha }}

      - name: Review
        uses: misospace/pr-reviewer-action@0a2d2732f7358e509e6a85e11160eb25cc5b1b80 # v3.8.0
        with:
          github-token: ${{ github.token }}
          pr-number: ${{ github.event.pull_request.number || inputs.pr_number }}
          force-review: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          # Primary (the verdict): implementation-pool, which LiteLLM walks
          # MiniMax Flash -> ChatGPT -> worker4. Specialists: worker4. Smart:
          # reasoning-pool, which boring PRs never reach (review-routing-mode:
          # auto escalates only when the verdict asks for it).
          #
          # Until 2026-10-23 worker4 (local-pool) was the primary. Its tool
          # loop spent 10-15 min and produced no verdict in 10 of 12 reviews,
          # its verdict call timed out about half the time, and reviews ran
          # 25-50 min. In 3 days the loop sent local-pool 9.3M input tokens
          # in 372 requests. The loop is off: on MiniMax it would move those
          # tokens onto the Token Plan. Without it the reviewer cannot open
          # files on its own; it still gets the diff, AGENTS.md, the CI
          # results and the specialists' leads.
          ai-base-url: http://litellm.llm.svc.cluster.local:4000/v1
          ai-api-key: ${{ secrets.LITELLM_PR_REVIEW_API_KEY }}
          ai-model: implementation-pool
          ai-specialist-model: local-pool
          tool-mode: "off"
          ai-response-format: json_object
          # Both models think before they answer; the default budget can be
          # spent entirely on reasoning, leaving no JSON verdict.
          ai-max-tokens: "16000"
          # Sized for the specialists, which inherit it: worker4 writes ~45
          # tokens/s, so a full answer needs ~355 s, and the default 300 s cut
          # them off. MiniMax answers in seconds.
          ai-request-timeout-sec: "420"
          ai-primary-retries: "2"
          ai-primary-retry-delay-sec: "15"
          review-routing-mode: auto
          ai-smart-base-url: http://litellm.llm.svc.cluster.local:4000/v1
          ai-smart-api-key: ${{ secrets.LITELLM_PR_REVIEW_API_KEY }}
          ai-smart-model: reasoning-pool
          ai-fallback-base-url: http://litellm.llm.svc.cluster.local:4000/v1
          ai-fallback-api-key: ${{ secrets.LITELLM_PR_REVIEW_API_KEY }}
          # A different MiniMax model, for a Flash-specific failure; the
          # primary already falls through to ChatGPT and worker4 in LiteLLM.
          ai-fallback-model: MiniMax-M3-chat
          standards-file-candidates: "AGENTS.md"
          context-limit-mode: normal
          ci-status-check: "true"
          ci-timeout-sec: "600"
          on-model-failure: notice
          fail-on-request-changes: "true"
          publish-mode: review_comment
          inline-findings: "true"
