---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Deployment Restart"

on:
  workflow_dispatch:
  repository_dispatch:
    types: [nas-restart]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # kubectl at the cluster's version (see schemas.yaml).
  # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
  KUBECTL_VERSION: v1.35.10

jobs:
  sync:
    name: Deployment Restart
    runs-on: ["gha-runner-scale-set"]
    timeout-minutes: 30
    steps:
      # The secret holds the kubeconfig as plain YAML (as schemas and
      # volsync-drill read it), so it is written as-is, not base64-decoded.
      - name: Get Secrets
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            d7abec51-f77a-49fd-be89-b13400f196e8 > KUBECONFIG_CONTENT

      - name: Install kubectl
        run: |
          set -euo pipefail
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "$(curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256")  kubectl" | sha256sum --check
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Write kubeconfig
        run: |
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Restart NFS Deployments
        shell: bash
        run: |
          set -euo pipefail
          kubectl get deployments \
              --all-namespaces \
              -l nfsMount=true \
              -o custom-columns="NAMESPACE:.metadata.namespace,NAME:.metadata.name" \
              --no-headers |
            while read -r namespace name; do
              kubectl -n "$namespace" rollout restart "deployment/$name"
            done
