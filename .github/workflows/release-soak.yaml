---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release Soak

on:
  # pull_request_target runs this file from main, so a PR cannot change the
  # check that judges it. Nothing here checks out or runs PR code. No `paths:`
  # filter: `Release Soak` is a required check on main.
  pull_request_target:
    branches: ["main"]
    types: [opened, reopened, synchronize, labeled, unlabeled]
  # A hold ends with no event to trigger on, so every open PR is checked hourly.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || 'sweep' }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  soak:
    # The required check is the commit status this job posts, not the job: the
    # hourly run has to report on each PR's head commit, and it runs on main.
    name: Evaluate hold
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set the Release Soak status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
        run: bash .github/scripts/release-soak.sh
