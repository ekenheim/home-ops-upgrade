---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release Soak

on:
  # pull_request_target runs this file from main, so a PR cannot change the
  # check that judges it. Nothing here checks out or runs PR code. No `paths:`
  # filter: `Release Soak` is a required check on main.
  pull_request_target:
    branches: ["main"]
    types: [opened, reopened, synchronize, labeled, unlabeled]
  # Every run checks every open PR, because a hold ends with no event of its
  # own. GitHub drops many scheduled runs (2 of about 19 ran after this
  # workflow landed), so pushes to main and PR events also end holds.
  push:
    branches: ["main"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# One run at a time. A burst of events leaves one queued run, which starts
# after the running one and still sees every PR.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  soak:
    # The required check is the commit status this job posts, not the job:
    # each run reports on every open PR's head commit.
    name: Evaluate hold
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set the Release Soak status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/release-soak.sh
