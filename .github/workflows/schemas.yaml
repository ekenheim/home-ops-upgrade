---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: "Schemas"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Every day at midnight
  push:
    branches: ["main"]
    paths: [".github/workflows/schemas.yaml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

env:
  # kubectl at the cluster's version. Same depName as tuppr's
  # KubernetesUpgrade, so Renovate moves them in one PR.
  # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
  KUBECTL_VERSION: v1.35.9

jobs:
  publish:
    name: Schemas
    runs-on: ["gha-runner-scale-set"]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get Secrets
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          secrets: |
            e2c5d873-fea3-43c6-a5e8-b1650077db0d > CLOUDFLARE_API_KEY
            163f1577-1009-4bbd-84cc-b165007809c3 > CLOUDFLARE_ACCOUNT_ID
            d7abec51-f77a-49fd-be89-b13400f196e8 > KUBECONFIG_CONTENT
            d3349f37-6ff4-406b-861a-b16101048306 > BOT_APP_ID
            12826224-0a9e-45f2-b8bb-b1610104f8c4 > BOT_APP_PRIVATE_KEY

      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: "${{ env.BOT_APP_ID }}"
          private-key: "${{ env.BOT_APP_PRIVATE_KEY }}"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: "${{ steps.app-token.outputs.token }}"

      # Not Homebrew: its installer ran from HEAD with the admin kubeconfig,
      # the Cloudflare token and the App key in the environment, and it
      # installed kubectl 1.37 against a 1.35 cluster.
      - name: Install kubectl
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "$(curl -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl.sha256")  kubectl" | sha256sum --check
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x

      # The Bitwarden secret holds the kubeconfig as plain YAML (what
      # bitwarden:push-main writes), not base64.
      - name: Write kubeconfig
        shell: bash
        run: |
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      # crd-extractor exits 0 with "No CRDs found" when it can't reach the
      # cluster, which hid a stale credential from May to October 2026.
      - name: Check cluster access
        shell: bash
        run: kubectl get crd --request-timeout=30s > /dev/null

      # The pinned extractor still downloads openapi2jsonschema.py from
      # kubeconform's master and runs it with the secrets above in the
      # environment. Point it at the commit that last changed that script.
      - name: Download and run crd-extractor
        shell: bash
        run: |
          curl -fsSL -o $GITHUB_WORKSPACE/crd-extractor.sh \
              https://raw.githubusercontent.com/datreeio/CRDs-catalog/43e4407642d4c37683c88711f37caa6c9c20ca40/Utilities/crd-extractor.sh
          sed -i 's#yannh/kubeconform/master/#yannh/kubeconform/6ae8c45bc156ceeb1d421e9b217cfc0c7ba5828d/#' $GITHUB_WORKSPACE/crd-extractor.sh
          grep -q 'yannh/kubeconform/6ae8c45bc156ceeb1d421e9b217cfc0c7ba5828d/' $GITHUB_WORKSPACE/crd-extractor.sh
          chmod +x $GITHUB_WORKSPACE/crd-extractor.sh
          bash $GITHUB_WORKSPACE/crd-extractor.sh

      # Serves https://lds-schemas-5hg.pages.dev/ (Cloudflare suffixed the
      # project's subdomain; lds-schemas.pages.dev belongs to someone else).
      # The `$schema` headers and kubeconform read from it.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: "${{ env.CLOUDFLARE_API_KEY }}"
          accountId: "${{ env.CLOUDFLARE_ACCOUNT_ID }}"
          workingDirectory: /home/runner/.datree/crdSchemas
          command: pages deploy --project-name=lds-schemas --branch main .
