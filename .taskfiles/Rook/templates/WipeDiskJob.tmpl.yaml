---
apiVersion: batch/v1
kind: Job
metadata:
  name: ${job}
  namespace: default
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeName: ${node}
      containers:
        - name: main
          image: alpine:latest@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache sgdisk util-linux util-linux-misc parted device-mapper;
              sgdisk --zap-all ${disk};
              dd if=/dev/zero of=${disk} bs=1M count=100 oflag=direct;
              dd if=/dev/zero of=${disk} bs=1M count=100 oflag=direct;
              blkdiscard ${disk};
              partprobe ${disk};
          securityContext:
            privileged: true
          resources: {}
