---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gha-runner-scale-set-atlas
spec:
  interval: 30m
  chart:
    spec:
      chart: gha-runner-scale-set
      version: 0.15.0
      sourceRef:
        kind: HelmRepository
        name: actions-runner-controller
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: gha-runner-scale-set-controller
      namespace: actions-runner-system
  valuesFrom:
    - kind: Secret
      name: actions-runner-controller-auth-secret
      valuesKey: github_token
      targetPath: githubConfigSecret.github_token
  values:
    nameOverride: gha-runner-scale-set-atlas
    runnerScaleSetName: gha-runner-scale-set-atlas
    githubConfigUrl: https://github.com/ekenheim/atlas
    # 0, not 1: an idle runner holds its full 4 CPU / 8Gi request (sized for a
    # real run) on worker3 doing nothing. The first job after idle waits ~30-60s
    # for a runner pod, which a CI run of this length does not notice.
    minRunners: 0
    # Each Atlas CI run starts Postgres, an S3 server, Playwright and up to 8 pytest
    # workers. Ten unrequested runners at once starved each other past the 60-minute
    # job timeout (13 Renovate branches, 9 cancelled); excess jobs now queue in GitHub,
    # where the timeout does not run.
    maxRunners: 3
    containerMode:
      type: dind
    template:
      spec:
        containers:
          - name: runner
            image: ghcr.io/joryirving/actions-runner:2.338.1@sha256:1d2ccfb0343759ddcd0a963524b04205a87f944bffb20b9cb5f26013d4294358
            command: ["/home/runner/run.sh"]
            resources:
              requests:
                cpu: "4"
                memory: 8Gi
    controllerServiceAccount:
      name: gha-runner-scale-set-controller
      namespace: actions-runner-system
