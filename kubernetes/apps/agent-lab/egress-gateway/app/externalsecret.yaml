---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# The agent-lab LiteLLM virtual key, minted by litellm-operator into
# llm/litellm-key-agent-lab (apps/llm/litellm/keys/agent-lab.yaml) and read
# across namespaces through the litellm-key-secrets-agent-lab ClusterSecretStore
# (apps/llm/litellm/clustersecretstore/agent-lab.yaml), which can read only
# that one Secret and serves only agent-control.
#
# Shaped for envoy-gateway's credentialInjection filter: key `credential`
# holds the WHOLE header value, scheme included. Only the Envoy proxy reads
# this Secret; no agent pod mounts it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name agent-egress-litellm-credential
  namespace: agent-control
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: litellm-key-secrets-agent-lab
    kind: ClusterSecretStore
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        # Go templates cannot address a field named `api-key`, hence the
        # rename to apiKey below.
        credential: 'Bearer {{ .apiKey }}'
  data:
    - secretKey: apiKey
      remoteRef:
        key: litellm-key-agent-lab
        property: api-key
