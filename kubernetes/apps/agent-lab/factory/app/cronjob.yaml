---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/cronjob_v1.json
# The agent-factory orchestrator (private repo ekenheim/agent-factory). Each run
# claims issues, and for each one drives stage -> worker -> exec -> collect
# Jobs in agent-work and stage -> exec -> reviewer Jobs in agent-verify,
# reading every stage's JSON report from its pod log between
# ===FACTORY_REPORT_BEGIN=== and ===FACTORY_REPORT_END===. Results go to the
# `agentlab` Postgres ledger.
#
# SUSPENDED. Work through the README's "Before the first run" checklist
# (target repo, public images, dedicated GitHub token, orchestrator contract,
# network checks) before triggering a manual run or unsuspending.
#
# The images are pulled anonymously: the ghcr.io/ekenheim/agent-factory*
# packages are public (GHCR does not take fine-grained PATs, and a pull
# secret would copy a GitHub token into all three namespaces). All four refs
# below (the CronJob image and the three FACTORY_*_IMAGE values) are pinned by
# digest and are one release: bump tag and digest together, all four at once.
# Renovate does that in one PR (.github/renovate/customManagers.json5 matches
# the env values, groups.json5 groups the four packages).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-factory
  namespace: agent-control
spec:
  suspend: true
  schedule: "0 */6 * * *"
  timeZone: "${TIMEZONE}"
  # One run at a time: two orchestrators would double-claim issues and fight
  # over the sandbox quota.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A failed run is investigated, not retried: a retry re-claims issues
      # and re-spends the LiteLLM budget.
      backoffLimit: 0
      # Ends before the next schedule slot.
      activeDeadlineSeconds: 19800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            # Matched by the agent-control-orchestrator network policy.
            app.kubernetes.io/name: agent-factory
            app.kubernetes.io/component: orchestrator
        spec:
          serviceAccountName: agent-factory
          # The one pod in the lab that talks to the API server.
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: orchestrator
              image: ghcr.io/ekenheim/agent-factory:v0.3.1@sha256:8a063e19e3f9360586725c4a93f0e0768e36232b89ef0b379f9a8b6da6c5ebba
              env:
                # The repositories to work, from the agent-factory-repos
                # ConfigMap (configmap-repos.yaml). Replaces FACTORY_REPO:
                # setting both fails the run.
                - name: FACTORY_REPOS_FILE
                  value: /etc/agent-factory/repos.json
                # The agent-egress Service (pinned name, see
                # egress-gateway/app/envoyproxy.yaml). Workers get this URL
                # with a dummy key; the gateway injects the real one.
                - name: FACTORY_GATEWAY_URL
                  value: http://agent-egress.agent-control.svc/v1
                - name: FACTORY_WORK_NAMESPACE
                  value: agent-work
                - name: FACTORY_VERIFY_NAMESPACE
                  value: agent-verify
                - name: FACTORY_BASE_IMAGE
                  value: ghcr.io/ekenheim/agent-factory-base:v0.3.1@sha256:894a528f85a53daf2bc60857341b0e08e754b522f1db7adeb4893e3c02499edd
                - name: FACTORY_TOOLS_IMAGE
                  value: ghcr.io/ekenheim/agent-factory-tools:v0.3.1@sha256:4c3f7a5f4f21e0cc79ca9f74037125a47e170e88edf1450bb266e72464a0a20a
                # The analysis track's image (Python, marimo, PyMC) for the
                # exec and worker Jobs of `analytics` repositories. It only
                # takes effect for analytics repositories enabled in the repo
                # registry (configmap-repos.yaml). The package is public like
                # the others; the GitHub token must cover every enabled
                # analytics repository.
                - name: FACTORY_ANALYSIS_IMAGE
                  value: ghcr.io/ekenheim/agent-factory-analysis:v0.3.1@sha256:a68593c6368d82c399628974ead67efa4fc0a00bc08eecaa9199db7260bf0679
                # The analysis ledger: Trackinizer in its own namespace
                # (trackinizer/). Read only while FACTORY_ANALYSIS_IMAGE is
                # set, so the build track never depends on it. Every ledger
                # call that fails is logged and ignored, and the issue's stage
                # never changes because of it.
                - name: FACTORY_TRACKINIZER_URL
                  value: http://trackinizer.trackinizer.svc:8765
                # A writer-role key from the Bitwarden item
                # `agent_factory_trackinizer` (trackinizer/app/
                # externalsecret-token.yaml). Optional so the CronJob starts
                # before that item exists; until then ledger calls get 401.
                # Orchestrator only: agent-factory never copies it into a Job.
                - name: FACTORY_TRACKINIZER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: agent-factory-trackinizer
                      key: token
                      optional: true
                # MLflow in datasci (datasci/mlflow, Service mlflow:5000) would
                # get one run per run B, in experiment factory/<slug>. Off
                # until the human decides factory runs belong in that MLflow.
                # The orchestrator sends no credential, and the in-cluster
                # Service needs none. To turn it on, uncomment this and the
                # MLflow egress rule in network-policy/app/agent-control.yaml
                # together.
                # - name: FACTORY_MLFLOW_URL
                #   value: http://mlflow.datasci.svc:5000
                # Empty on purpose: the orchestrator defaults to `ghcr-pull`,
                # which does not exist here (public images, see above), and an
                # empty name makes it omit imagePullSecrets from the Jobs.
                - name: FACTORY_IMAGE_PULL_SECRET
                  value: ""
                # Three lanes, not five: every lane's triage and worker share
                # the local model's two llama.cpp slots. Run one (five lanes)
                # left reviewers queueing for minutes per call.
                - name: FACTORY_CONCURRENCY
                  value: "3"
                # Every model below is an agent-factory pool in LiteLLM
                # (llm/litellm/app/configmap.yaml): qwen3.8 27B on the owner's
                # RTX 5090 first, as the owner asked (2026-10-11), then the
                # hosted rungs. A PC that is off, or a prompt over its 64k
                # window, goes straight to the next rung. The agent-lab key
                # lists all three. Unset, these default to fast, fast,
                # implementation-pool and review.
                #
                # Triage (single non-streaming JSON calls) and OpenCode's
                # small_model in the agent pods: the PC with thinking off, then
                # `fast` (worker4). The planner is off here (no FACTORY_PLAN);
                # it would use FACTORY_PLAN_MODEL, default `review`.
                - name: FACTORY_TRIAGE_MODEL
                  value: factory-fast
                - name: FACTORY_SMALL_MODEL
                  value: factory-fast
                # The OpenCode worker (streams, calls tools): the PC with
                # thinking on, then implementation-pool's rungs (MiniMax-M2.7,
                # ChatGPT gpt-5.6-luna, worker4).
                - name: FACTORY_WORKER_MODEL
                  value: factory-agent
                # Reviews run on factory-review: the PC first, then
                # reasoning-pool's rungs -- ChatGPT (gpt-5.6-terra), MiniMax-M3,
                # worker4 last. On the local `review` alias (the Strix model's
                # two llama.cpp slots, shared with Home Assistant) v0.2.0's
                # read-only reviewer ran 13 min and failed with a gateway error
                # (af-analysis-2, 2026-10-10), which is why worker4 is the
                # floor here, not a lead. The analysis track's verifier uses
                # this model too. The name has no "gpt-" in it, so OpenCode
                # gives the reviewer no apply_patch and agent-factory's startup
                # check passes. The chatgpt rung needs a streaming caller, and
                # OpenCode streams.
                - name: FACTORY_REVIEW_MODEL
                  value: factory-review
                # Honoured from agent-factory v0.1.2: at most this many reviews
                # in flight regardless of lane count.
                - name: FACTORY_REVIEW_CONCURRENCY
                  value: "1"
                # Per-stage deadlines (seconds, v0.1.2 knobs), set wide on
                # purpose: everything runs on the local model, which is slow
                # under load, and a lane that finishes late is better than one
                # killed at the deadline. The Job's activeDeadlineSeconds (5.5 h)
                # and the gateway's 30 min upstream timeout still bound a run.
                - name: FACTORY_TRIAGE_TIMEOUT_S
                  value: "600"
                - name: FACTORY_WORK_TIMEOUT_S
                  value: "2400"
                - name: FACTORY_REVIEW_TIMEOUT_S
                  value: "1800"
                # Branches are <prefix>/issue-N. A new prefix per benchmark run
                # keeps its branches and PRs apart from the previous run's
                # (collect force-pushes, and GitHub refuses a second PR for the
                # same head). Bump it before each full rerun of the same repo.
                - name: FACTORY_BRANCH_PREFIX
                  value: factory/run2
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: agentlab-db-secret
                      key: uri
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: agent-factory-github
                      key: token
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              # The image sets HOME=/tmp and writes run records to /tmp/runs;
              # with a read-only root this is the only writable path.
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: repos
                  mountPath: /etc/agent-factory
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
            - name: repos
              configMap:
                name: agent-factory-repos
