---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/cronjob_v1.json
# The agent-factory orchestrator (private repo ekenheim/agent-factory). Each run
# claims issues, and for each one drives stage -> worker -> exec -> collect
# Jobs in agent-work and stage -> exec -> reviewer Jobs in agent-verify,
# reading every stage's JSON report from its pod log between
# ===FACTORY_REPORT_BEGIN=== and ===FACTORY_REPORT_END===. Results go to the
# `agentlab` Postgres ledger.
#
# SUSPENDED. Work through the README's "Before the first run" checklist
# (target repo, public images, dedicated GitHub token, orchestrator contract,
# network checks) before triggering a manual run or unsuspending.
#
# The images are pulled anonymously: the ghcr.io/ekenheim/agent-factory*
# packages are public (GHCR does not take fine-grained PATs, and a pull
# secret would copy a GitHub token into all three namespaces). All four refs
# below (the CronJob image and the three FACTORY_*_IMAGE values) are pinned by
# digest and are one release: bump tag and digest together, all four at once.
# Renovate does that in one PR (.github/renovate/customManagers.json5 matches
# the env values, groups.json5 groups the four packages).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-factory
  namespace: agent-control
spec:
  suspend: true
  schedule: "0 */6 * * *"
  timeZone: "${TIMEZONE}"
  # One run at a time: two orchestrators would double-claim issues and fight
  # over the sandbox quota.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A failed run is investigated, not retried: a retry re-claims issues
      # and re-spends the LiteLLM budget.
      backoffLimit: 0
      # Ends before the next schedule slot.
      activeDeadlineSeconds: 19800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            # Matched by the agent-control-orchestrator network policy.
            app.kubernetes.io/name: agent-factory
            app.kubernetes.io/component: orchestrator
        spec:
          serviceAccountName: agent-factory
          # The one pod in the lab that talks to the API server.
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: orchestrator
              image: ghcr.io/ekenheim/agent-factory:v0.2.0@sha256:a5a6a96247fae691d5dab231adb02eddab3ed693eb58499e8fce1be8e15c7a13
              env:
                # Target repository (owner/name form, `github.com/` prefixed,
                # as the upstream run.ts expects). Phase 1 points at a copy
                # of agent-factory's demo-repo/tinylinks benchmark.
                - name: FACTORY_REPO
                  value: github.com/ekenheim/tinylinks
                # The agent-egress Service (pinned name, see
                # egress-gateway/app/envoyproxy.yaml). Workers get this URL
                # with a dummy key; the gateway injects the real one.
                - name: FACTORY_GATEWAY_URL
                  value: http://agent-egress.agent-control.svc/v1
                - name: FACTORY_WORK_NAMESPACE
                  value: agent-work
                - name: FACTORY_VERIFY_NAMESPACE
                  value: agent-verify
                - name: FACTORY_BASE_IMAGE
                  value: ghcr.io/ekenheim/agent-factory-base:v0.2.0@sha256:c7957460542f2c7bb266a2840c81212c157f554418c432468716b3532c7cf2da
                - name: FACTORY_TOOLS_IMAGE
                  value: ghcr.io/ekenheim/agent-factory-tools:v0.2.0@sha256:58aeac652b8c7b0dd83ce1b01918f1d4960a7230dfa1183551219f420a36ea87
                # The analysis track's image (Python, marimo, PyMC) for the
                # exec and worker Jobs of `analytics` repositories. It only
                # takes effect for analytics repositories enabled in the repo
                # registry (FACTORY_REPOS_FILE). With FACTORY_REPO, as here,
                # the registry is a single `build` entry, so nothing reads it
                # and no Job uses it. Before enabling an analytics entry: make
                # the package public like the others, and widen the GitHub
                # token to that repository.
                - name: FACTORY_ANALYSIS_IMAGE
                  value: ghcr.io/ekenheim/agent-factory-analysis:v0.2.0@sha256:c6b66918d594bbeb42852bd9542c487ad51b646629ef8698bb3983ffc87fd88a
                # Empty on purpose: the orchestrator defaults to `ghcr-pull`,
                # which does not exist here (public images, see above), and an
                # empty name makes it omit imagePullSecrets from the Jobs.
                - name: FACTORY_IMAGE_PULL_SECRET
                  value: ""
                # Three lanes, not five: every lane's triage and worker share
                # the local model's two llama.cpp slots. Run one (five lanes)
                # left reviewers queueing for minutes per call.
                - name: FACTORY_CONCURRENCY
                  value: "3"
                # Reviews stay on the local `review` alias for now. In run one
                # the reviewer re-read the repository and sent ~60k-token
                # prompts; at ~380 prompt tokens/s that is 160 s before the
                # first output token, and three of them queued on two slots
                # exceeded the review deadline for 5 of 9 issues. agent-factory
                # v0.1.2 hands the reviewer the diff and the test output
                # instead, and the cap below keeps reviews from queueing. If
                # reviews still time out, point this at a hosted alias that is
                # on the agent-lab key's model list (MiniMax's plan is used up
                # until 2026-10-11; kimi-k3, glm-5.3 or chatgpt are the options).
                - name: FACTORY_REVIEW_MODEL
                  value: review
                # Honoured from agent-factory v0.1.2: at most this many reviews
                # in flight regardless of lane count.
                - name: FACTORY_REVIEW_CONCURRENCY
                  value: "1"
                # Per-stage deadlines (seconds, v0.1.2 knobs), set wide on
                # purpose: everything runs on the local model, which is slow
                # under load, and a lane that finishes late is better than one
                # killed at the deadline. The Job's activeDeadlineSeconds (5.5 h)
                # and the gateway's 30 min upstream timeout still bound a run.
                - name: FACTORY_TRIAGE_TIMEOUT_S
                  value: "600"
                - name: FACTORY_WORK_TIMEOUT_S
                  value: "2400"
                - name: FACTORY_REVIEW_TIMEOUT_S
                  value: "1800"
                # Branches are <prefix>/issue-N. A new prefix per benchmark run
                # keeps its branches and PRs apart from the previous run's
                # (collect force-pushes, and GitHub refuses a second PR for the
                # same head). Bump it before each full rerun of the same repo.
                - name: FACTORY_BRANCH_PREFIX
                  value: factory/run2
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: agentlab-db-secret
                      key: uri
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: agent-factory-github
                      key: token
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              # The image sets HOME=/tmp and writes run records to /tmp/runs;
              # with a read-only root this is the only writable path.
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
