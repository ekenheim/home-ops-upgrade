---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/cronjob_v1.json
# The agent-factory orchestrator (private repo ekenheim/agent-factory). Each run
# claims issues, and for each one drives stage -> worker -> exec -> collect
# Jobs in agent-work and stage -> exec -> reviewer Jobs in agent-verify,
# reading every stage's JSON report from its pod log between
# ===FACTORY_REPORT_BEGIN=== and ===FACTORY_REPORT_END===. Results go to the
# `agentlab` Postgres ledger.
#
# SUSPENDED. Work through the README's "Before the first run" checklist
# (target repo, public images, dedicated GitHub token, orchestrator contract,
# network checks) before triggering a manual run or unsuspending.
#
# The images are pulled anonymously: the three ghcr.io/ekenheim/agent-factory*
# packages are public (GHCR does not take fine-grained PATs, and a pull
# secret would copy a GitHub token into all three namespaces). All three are
# pinned by digest; bump the tag and digest together, they are one release.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-factory
  namespace: agent-control
spec:
  suspend: true
  schedule: "0 */6 * * *"
  timeZone: "${TIMEZONE}"
  # One run at a time: two orchestrators would double-claim issues and fight
  # over the sandbox quota.
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # A failed run is investigated, not retried: a retry re-claims issues
      # and re-spends the LiteLLM budget.
      backoffLimit: 0
      # Ends before the next schedule slot.
      activeDeadlineSeconds: 19800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            # Matched by the agent-control-orchestrator network policy.
            app.kubernetes.io/name: agent-factory
            app.kubernetes.io/component: orchestrator
        spec:
          serviceAccountName: agent-factory
          # The one pod in the lab that talks to the API server.
          automountServiceAccountToken: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: orchestrator
              image: ghcr.io/ekenheim/agent-factory:v0.1.1@sha256:a79992fbe509dd0c04ad45f4ae234476a8b78dc558d74d4a77a03130d1372b8b
              env:
                # Target repository (owner/name form, `github.com/` prefixed,
                # as the upstream run.ts expects). Phase 1 points at a copy
                # of agent-factory's demo-repo/tinylinks benchmark.
                - name: FACTORY_REPO
                  value: github.com/ekenheim/tinylinks
                # The agent-egress Service (pinned name, see
                # egress-gateway/app/envoyproxy.yaml). Workers get this URL
                # with a dummy key; the gateway injects the real one.
                - name: FACTORY_GATEWAY_URL
                  value: http://agent-egress.agent-control.svc/v1
                - name: FACTORY_WORK_NAMESPACE
                  value: agent-work
                - name: FACTORY_VERIFY_NAMESPACE
                  value: agent-verify
                - name: FACTORY_BASE_IMAGE
                  value: ghcr.io/ekenheim/agent-factory-base:v0.1.1@sha256:6139a64014838bb73a24fc7e51221ad60aee765fe987c9b386d2a8221cf61df2
                - name: FACTORY_TOOLS_IMAGE
                  value: ghcr.io/ekenheim/agent-factory-tools:v0.1.1@sha256:1a81ba939139d25bb50c2dda231aa061ff9208e268984be047c06b02f4eaeac1
                # Empty on purpose: the orchestrator defaults to `ghcr-pull`,
                # which does not exist here (public images, see above), and an
                # empty name makes it omit imagePullSecrets from the Jobs.
                - name: FACTORY_IMAGE_PULL_SECRET
                  value: ""
                # Three lanes, not five: every lane's triage and worker share
                # the local model's two llama.cpp slots. Run one (five lanes)
                # left reviewers queueing for minutes per call.
                - name: FACTORY_CONCURRENCY
                  value: "3"
                # Reviews go to a hosted model. The local qwen38-flash-next
                # ingests ~380 prompt tokens/s; a 60k-token review prompt is
                # 160 s before the first output token, and three of them on
                # two slots exceeded the review deadline for 5 of 9 issues in
                # run one. Triage (`fast`) and workers (`implementation-pool`)
                # stay local. The alias must be on the agent-lab key's model
                # list (llm/litellm/keys/agent-lab.yaml).
                - name: FACTORY_REVIEW_MODEL
                  value: MiniMax-M3
                # Honoured from agent-factory v0.1.2: at most this many reviews
                # in flight regardless of lane count.
                - name: FACTORY_REVIEW_CONCURRENCY
                  value: "2"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: agentlab-db-secret
                      key: uri
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: agent-factory-github
                      key: token
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              # The image sets HOME=/tmp and writes run records to /tmp/runs;
              # with a read-only root this is the only writable path.
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
