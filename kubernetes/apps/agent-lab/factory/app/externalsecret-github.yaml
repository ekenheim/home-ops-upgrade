---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Phase 1 GitHub credentials. NOT the shared agent PAT (`github_token`): that
# one belongs to the human account, can write to every repo dispatch and
# courier touch (home-ops-upgrade included, which Flux applies), and would
# sit next to code nobody reviewed. agent-lab gets a Bitwarden item of its own:
#
#   `agent_factory_github`
#     GITHUB_TOKEN           fine-grained PAT, ONLY the target repo
#                            (FACTORY_REPO): Contents, Issues and Pull
#                            requests read/write, Metadata read.
#     GITHUB_TOKEN_READONLY  fine-grained PAT, ONLY the target repo:
#                            Contents and Metadata read.
#
# Protect the target repo's default branch (PR required) so even the
# read/write token cannot push to it. A GitHub App with per-run installation
# tokens replaces both in a later phase.
#
# Who gets which:
#   agent-control  read/write  the orchestrator (issues, PRs).
#   agent-work     read/write  collect pushes the run branch; stage clones.
#   agent-verify   read-only   the verifier's stage only clones the branch.
# Worker and exec pods never mount any of them (README, "Orchestrator
# contract", says how stage and collect must use the token so worker-written
# files never run next to it).
#
# These live in agent-lab-factory, not agent-lab-ledger, so a missing
# Bitwarden item holds back only the factory (whose CronJob is suspended)
# and never the ledger or the gateway.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name agent-factory-github
  namespace: agent-control
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        token: '{{ .GITHUB_TOKEN }}'
        username: x-access-token
  dataFrom:
    - extract:
        key: agent_factory_github
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name agent-factory-github
  namespace: agent-work
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        token: '{{ .GITHUB_TOKEN }}'
        username: x-access-token
  dataFrom:
    - extract:
        key: agent_factory_github
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Read-only: everything agent-verify runs is downstream of the worker's
# branch, so nothing there may be able to write to GitHub.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name agent-factory-github
  namespace: agent-verify
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        token: '{{ .GITHUB_TOKEN_READONLY }}'
        username: x-access-token
  dataFrom:
    - extract:
        key: agent_factory_github
