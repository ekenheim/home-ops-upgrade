---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# The factory's run ledger (database `agentlab`, user `agentlab`, declared in
# apps/database/crunchy-postgres/cluster/cluster.yaml). Only the orchestrator
# in agent-control reads it; workers never see a database credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name agentlab-db-secret
  namespace: agent-control
spec:
  secretStoreRef:
    name: crunchy-pgo-secrets
    kind: ClusterSecretStore
  refreshInterval: 1m
  target:
    name: *name
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        # Same string as llm/dispatch's dispatch-db-secret, for the same
        # reasons: direct primary (not pgbouncer, so session features such as
        # advisory locks behave), TLS mandatory (pg_hba is hostssl-only), and
        # `no-verify` because the orchestrator is Node and node-postgres reads
        # `require` as verify-the-chain, which fails on Crunchy's own CA.
        uri: 'postgresql://{{ .user }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}?sslmode=no-verify'
  dataFrom:
    - extract:
        key: postgres-pguser-agentlab
