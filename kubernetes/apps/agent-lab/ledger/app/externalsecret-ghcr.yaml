---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Pull secret for the private ghcr.io/ekenheim/agent-factory* images, built
# from the same agent PAT. Needs `read:packages` on that token; if it lacks
# it, make the three packages public instead and drop these.
#
# Used as imagePullSecrets on the orchestrator (via its ServiceAccount) and
# on every Job the orchestrator creates. Kubelet consumes it, not the pod,
# so a worker that lists it can still not read the token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name ghcr-pull
  namespace: agent-control
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"ekenheim","password":"{{ .GITHUB_TOKEN }}","auth":"{{ printf "ekenheim:%s" .GITHUB_TOKEN | b64enc }}"}}}
  dataFrom:
    - extract:
        key: github_token
---
