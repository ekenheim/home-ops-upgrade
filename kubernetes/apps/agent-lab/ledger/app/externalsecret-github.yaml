---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Phase 1 GitHub credential: the shared agent PAT (Bitwarden `github_token`,
# the same one courier and dispatch use; see apps/llm/kustomization.yaml).
# A GitHub App scoped to the factory's repos replaces it in a later phase.
#
# In agent-control for the orchestrator. In agent-work / agent-verify ONLY
# for the stage and collect Jobs (component: tools). Worker and exec pods
# never mount it, and the network policy keeps them off github.com anyway.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name agent-factory-github
  namespace: agent-control
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        token: '{{ .GITHUB_TOKEN }}'
        username: x-access-token
  dataFrom:
    - extract:
        key: github_token
