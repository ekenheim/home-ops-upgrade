---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app agent-lab-ledger
  namespace: flux-system
spec:
  # Storage for the factory: the Postgres ledger credential and two buckets.
  # The GitHub credentials sit in agent-lab-factory instead.
  # No targetNamespace for the same reason as the other agent-lab components.
  path: ./kubernetes/apps/agent-lab/ledger/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  dependsOn:
    # crunchy-pgo-secrets, and the cluster that generates
    # postgres-pguser-agentlab from the `agentlab` user in cluster.yaml.
    - name: crunchy-postgres-stores
    - name: crunchy-postgres-operator-cluster
    # The ceph-bucket StorageClass behind the ObjectBucketClaims.
    - name: rook-ceph-cluster
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  postBuild:
    substitute:
      APP: *app
