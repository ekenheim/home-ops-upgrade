---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/apps/deployment_v1.json
# Trackinizer 0.1.6 (github.com/rekursiv-ai/trackinizer), the experiment ledger
# agent-factory's analysis track writes Intents, Experiments and Findings to.
# The image is agent-factory's own (images/trackinizer): a hash-pinned wheel
# install on Python 3.12 whose entrypoint is
#   trackinizer --host 0.0.0.0 --port 8765 --engine pg
# so the DSN is the only required input. With no DSN it exits with
# `requires --dsn`; there is no local fallback database.
#
# Plain manifests rather than app-template, like the rest of agent-lab: the
# network policies key on exact pod labels, and this keeps them in one place.
#
# The image is pulled anonymously (no pull secret, as for the other
# agent-factory packages), so the GHCR package must be public. It is pinned by
# digest. The sha- tag is not a version, so Renovate proposes nothing until it
# is switched to an agent-factory v* tag (images.yaml pushes this image on
# every v* tag too); groups.json5 then moves it with the other four.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trackinizer
  namespace: trackinizer
  labels:
    app.kubernetes.io/name: trackinizer
  annotations:
    # Restart when PGO rotates the password behind trackinizer-db-secret.
    reloader.stakater.com/auto: "true"
spec:
  # One server process, as agent-factory's README asks. Recreate so a rollout
  # never runs two at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trackinizer
  template:
    metadata:
      labels:
        # Matched by the trackinizer network policy and the orchestrator's
        # egress rule. Deliberately no app.kubernetes.io/component: the
        # factory's policies treat `tools`, `exec` and `worker` specially.
        app.kubernetes.io/name: trackinizer
    spec:
      # Talks to nothing in the Kubernetes API.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Idempotent superuser DDL that the trackinizer role cannot run itself,
        # immich's db-extension-update pattern. PG16 does not trust `vector`
        # for the owning role, and Trackinizer's first statements create
        # tables in public, so the init container creates the extension and
        # grants the role use of public before every start. Both statements
        # are no-ops once done. Primary, not pgbouncer; TLS because pg_hba is
        # hostssl-only.
        - name: db-init
          image: docker.io/library/postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
          envFrom:
            - secretRef:
                name: trackinizer-super-secret
          env:
            - name: PGSSLMODE
              value: require
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              export PGPASSWORD="$INIT_POSTGRES_PASS"
              psql -v ON_ERROR_STOP=1 -h "$INIT_POSTGRES_HOST" -U "$INIT_POSTGRES_USER" -d trackinizer \
                -c "CREATE EXTENSION IF NOT EXISTS vector;" \
                -c "GRANT USAGE, CREATE ON SCHEMA public TO trackinizer;"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        # Registers the in-cluster browser key (httproutefilter.yaml) as the
        # admin user's `browser` key, role writer, with Trackinizer's own
        # hashing, and revokes any other live `browser` key. A no-op when the
        # value is already registered. On a brand-new instance (no schema or
        # no user yet) it does nothing, and the next start registers the key.
        - name: register-web-key
          image: ghcr.io/ekenheim/agent-factory-trackinizer:sha-83345cf@sha256:f968490db81318b03d43332431a2465f9b72d4e759607f3ba197c4b9519da826
          env:
            - name: TRACKINIZER_DSN
              valueFrom:
                secretKeyRef:
                  name: trackinizer-db-secret
                  key: uri
            - name: WEB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: trackinizer-web-credential
                  key: token
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          command: ["python", "-c"]
          args:
            - |
              import asyncio, os, uuid
              import asyncpg
              from trackinizer.server.auth import TOKEN_PREFIX_LEN, hash_secret, revoke_api_key, verify_secret

              NAME = "browser"

              async def main():
                  token = os.environ["WEB_TOKEN"]
                  conn = await asyncpg.connect(os.environ["TRACKINIZER_DSN"])
                  try:
                      if await conn.fetchval("SELECT to_regclass('public.api_keys')") is None:
                          print("register-web-key: no schema yet, skipped")
                          return
                      uid = await conn.fetchval(
                          "SELECT id FROM users WHERE role = 'admin' AND status = 'active' ORDER BY created_at LIMIT 1")
                      if uid is None:
                          print("register-web-key: no admin user yet, skipped")
                          return
                      async with conn.transaction():
                          rows = await conn.fetch(
                              "SELECT id, secret_hash FROM api_keys WHERE user_id = $1 AND name = $2 AND revoked_at IS NULL",
                              uid, NAME)
                          kept = [r["id"] for r in rows if verify_secret(token, r["secret_hash"])]
                          revoked = 0
                          for r in rows:
                              if r["id"] not in kept and await revoke_api_key(conn, key_id=r["id"], user_id=uid):
                                  revoked += 1
                          if not kept:
                              await conn.execute(
                                  "INSERT INTO api_keys (id, user_id, name, secret_hash, prefix, role) "
                                  "VALUES ($1, $2, $3, $4, $5, 'writer')",
                                  uuid.uuid4(), uid, NAME, hash_secret(token), token[:TOKEN_PREFIX_LEN])
                      print(f"register-web-key: registered={not kept} revoked={revoked}")
                  finally:
                      await conn.close()

              asyncio.run(main())
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: trackinizer
          image: ghcr.io/ekenheim/agent-factory-trackinizer:sha-83345cf@sha256:f968490db81318b03d43332431a2465f9b72d4e759607f3ba197c4b9519da826
          env:
            - name: TRACKINIZER_DSN
              valueFrom:
                secretKeyRef:
                  name: trackinizer-db-secret
                  key: uri
            # Browser sessions: the gatewaylogin addon (addons/gatewaylogin.py,
            # mounted from the trackinizer-addons ConfigMap) trades the
            # gateway's `browser` key for a session cookie signed with this.
            # Workspaces, chats and presets refuse API keys, so the web app
            # needs a session, not just the injected key.
            - name: TRACKINIZER_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: trackinizer-session
                  key: TRACKINIZER_SESSION_SECRET
            - name: TRACKINIZER_ADDONS
              value: gatewaylogin.deployment
            - name: PYTHONPATH
              value: /opt/addons
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            # Never set TRACKINIZER_NO_AUTH or pass --no-auth: every call must
            # carry a Bearer key or a session.
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
          # /api/version needs no auth and answers 200 only once the schema is
          # bootstrapped. The startup probe gives the first start (migrations)
          # up to five minutes before liveness can kill it; a restart then
          # would also throw away the bootstrap token in /tmp.
          startupProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # A guess: one uvicorn process with the stub embedder (no model is
          # loaded unless TRACKINIZER_SESSION_EMBEDDER is set). The image
          # carries a CPU torch for the optional embedders, which is not
          # imported by default. Check real usage after a week and adjust.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The image points HOME and every XDG dir under /tmp, the only
          # writable path. It is an emptyDir, so the bootstrap token is gone
          # after any restart.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: addons
              mountPath: /opt/addons
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: addons
          configMap:
            name: trackinizer-addons
