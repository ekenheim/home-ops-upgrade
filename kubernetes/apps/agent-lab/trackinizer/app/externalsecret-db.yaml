---
# yaml-language-server: $schema=https://lds-schemas-5hg.pages.dev/external-secrets.io/externalsecret_v1.json
# Trackinizer's Postgres login (database `trackinizer`, user `trackinizer`,
# declared in apps/database/crunchy-postgres/cluster/cluster.yaml). Copied
# straight from PGO's user Secret, so nothing goes into Bitwarden and a PGO
# password rotation propagates on its own (Reloader restarts the pod).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name trackinizer-db-secret
  namespace: trackinizer
spec:
  secretStoreRef:
    name: crunchy-pgo-secrets
    kind: ClusterSecretStore
  refreshInterval: 1m
  target:
    name: *name
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        # Direct primary (PGO's `host` is postgres-primary), not pgbouncer:
        # Trackinizer holds a LISTEN connection for its NOTIFY fan-out and uses
        # asyncpg's prepared statements, and the bouncer runs pool_mode
        # transaction, which breaks both. TLS is mandatory (pg_hba is
        # hostssl-only). asyncpg reads `require` as encrypt-without-verify
        # unless a root.crt sits under HOME/.postgresql, which the image does
        # not have, so Crunchy's own CA is not a problem. (agentlab-db-secret
        # says `no-verify` because node-postgres reads `require` differently;
        # that value is not one of the sslmodes asyncpg documents.)
        uri: 'postgresql://{{ .user }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}?sslmode=require'
  dataFrom:
    - extract:
        key: postgres-pguser-trackinizer
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Superuser credentials for the db-init container only (immich-super-secret's
# pattern). HOST is the primary, not pgbouncer: pgbouncer's userlist does not
# include the postgres superuser, and CREATE EXTENSION must run on the primary.
# The trackinizer container never mounts this secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name trackinizer-super-secret
  namespace: trackinizer
spec:
  secretStoreRef:
    name: crunchy-pgo-secrets
    kind: ClusterSecretStore
  refreshInterval: 1m
  target:
    name: *name
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        INIT_POSTGRES_HOST: '{{ .host }}'
        INIT_POSTGRES_USER: '{{ .user }}'
        INIT_POSTGRES_PASS: '{{ .password }}'
  dataFrom:
    - extract:
        key: postgres-pguser-postgres
