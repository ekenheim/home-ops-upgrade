---
# TRACKINIZER_SESSION_SECRET, the HMAC key for the browser-session cookie the
# gatewaylogin addon issues (addons/gatewaylogin.py). Generated in-cluster once,
# like the browser key: nothing in Bitwarden. Regenerating it signs everyone
# out, and the next request signs them straight back in through the gateway.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: trackinizer-session
  namespace: trackinizer
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://lds-schemas-5hg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name trackinizer-session
  namespace: trackinizer
spec:
  refreshInterval: "0"
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        TRACKINIZER_SESSION_SECRET: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: trackinizer-session
