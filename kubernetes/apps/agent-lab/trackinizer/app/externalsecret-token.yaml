---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# The orchestrator's Trackinizer API key (FACTORY_TRACKINIZER_TOKEN in
# factory/app/cronjob.yaml). It lives in agent-control, next to the CronJob,
# and only the orchestrator container reads it: agent-factory never passes it
# or its name to a Job.
#
#   Bitwarden Secrets Manager item `agent_factory_trackinizer`
#     FACTORY_TRACKINIZER_TOKEN  a Trackinizer key with role `writer`, minted
#                                after the first start with the bootstrap
#                                admin's key (README, "Analysis ledger
#                                (Trackinizer)"). Never the admin key itself.
#
# In this Kustomization, not agent-lab-factory, because the key can only exist
# after Trackinizer has been bootstrapped: a missing item holds back only
# agent-lab-trackinizer, never the factory. The CronJob reads the key with
# `optional: true`, so a run before the item exists just gets 401s, which the
# orchestrator logs and ignores.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name agent-factory-trackinizer
  namespace: agent-control
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        token: '{{ .FACTORY_TRACKINIZER_TOKEN }}'
  dataFrom:
    - extract:
        key: agent_factory_trackinizer
