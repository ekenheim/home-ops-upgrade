---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# The web UI and API on the LAN, through envoy-internal. Open to anyone who
# reaches the gateway since 2026-10-22 (securitypolicy.yaml, which put
# Authentik in front of every path, is off). The browser runs on Trackinizer's
# own session cookie:
#
#   1. Signed out, Trackinizer sends the browser to /auth/login_page?next=...
#      Its page offers only a Google button this image cannot serve, so that
#      path is redirected to the gatewaylogin addon instead (query kept).
#   2. /api/addons/gatewaylogin/login is the ONLY path that gets the
#      gateway's `browser` key (httproutefilter.yaml). The addon trades it for
#      a session cookie and redirects back to `next`.
#   3. Everything else goes through untouched, so workspaces, chats and
#      presets (which refuse API keys) see a browser session.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: trackinizer
  namespace: trackinizer
  annotations:
    gethomepage.dev/description: "Analysis ledger for agent-factory"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Development"
    gethomepage.dev/icon: "mdi-notebook"
    gethomepage.dev/name: "Trackinizer"
spec:
  hostnames:
    - "trackinizer.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: Exact
            value: /auth/login_page
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /api/addons/gatewaylogin/login
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /api/addons/gatewaylogin
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: trackinizer-web-credential
      backendRefs:
        - name: trackinizer
          port: 8765
    - backendRefs:
        - name: trackinizer
          port: 8765
