---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# The web UI and API on the LAN, through envoy-internal. securitypolicy.yaml
# signs the browser in with Authentik first, and httproutefilter.yaml then adds
# the browser's Trackinizer key, so the server's own auth still sees a Bearer
# key on every request.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: trackinizer
  namespace: trackinizer
  annotations:
    gethomepage.dev/description: "Analysis ledger for agent-factory"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Development"
    gethomepage.dev/icon: "mdi-notebook"
    gethomepage.dev/name: "Trackinizer"
spec:
  hostnames:
    - "trackinizer.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: trackinizer-web-credential
      backendRefs:
        - name: trackinizer
          port: 8765
