---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.envoyproxy.io/httproutefilter_v1alpha1.json
# Adds the browser's Trackinizer key to every request that got past the
# SecurityPolicy (securitypolicy.yaml), so the web app at /app/ and its /api
# calls are authenticated. overwrite: whatever Authorization header the browser
# sent is replaced, so the signed-in user always acts as this one key.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: trackinizer-web-credential
  namespace: trackinizer
spec:
  credentialInjection:
    header: Authorization
    overwrite: true
    credential:
      valueRef:
        name: trackinizer-web-credential
---
# The browser key, generated in-cluster once (refreshInterval "0"), like
# openclaw's gateway token: nothing to create in Bitwarden. Trackinizer only
# accepts keys it has a row for, so the Deployment's `register-web-key` init
# container registers this value as the `browser` key (role writer) on every
# start and revokes any other `browser` key. If a spec change regenerates the
# value, Reloader restarts the pod and the new value is registered.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: trackinizer-web-credential
  namespace: trackinizer
spec:
  length: 43
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# `token` is read by register-web-key; `credential` is shaped for
# credentialInjection (the WHOLE header value, scheme included) and read only
# by the Envoy proxy. `trax_` is the prefix Trackinizer's own keys carry.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name trackinizer-web-credential
  namespace: trackinizer
spec:
  refreshInterval: "0"
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        token: 'trax_{{ .password }}'
        credential: 'Bearer trax_{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: trackinizer-web-credential
