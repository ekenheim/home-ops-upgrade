---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret-db.yaml
  # The orchestrator's key lives in agent-control, which is off with the
  # factory since 2026-10-18: applied now, it would fail on a missing
  # namespace and hold this Kustomization not-Ready. Uncomment with
  # ../../namespaces.yaml and the factory.
  #- ./externalsecret-token.yaml
  - ./externalsecret-session.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./httproute-internal.yaml
  - ./httproutefilter.yaml
  - ./securitypolicy.yaml
configMapGenerator:
  # Hashed name: an edit to the addon rolls the pod.
  - name: trackinizer-addons
    namespace: trackinizer
    files:
      - addons/gatewaylogin.py
