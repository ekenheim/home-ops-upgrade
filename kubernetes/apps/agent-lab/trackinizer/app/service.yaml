---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/service_v1.json
# FACTORY_TRACKINIZER_URL = http://trackinizer.trackinizer.svc:8765. ClusterIP;
# the LAN reaches it through the envoy-internal HTTPRoute, and the network
# policy admits only the orchestrator and envoy-internal. Same port as the container, so the
# Service view and Cilium's backend view of the policy agree.
apiVersion: v1
kind: Service
metadata:
  name: trackinizer
  namespace: trackinizer
  labels:
    app.kubernetes.io/name: trackinizer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: trackinizer
  ports:
    - name: http
      port: 8765
      targetPort: http
      protocol: TCP
