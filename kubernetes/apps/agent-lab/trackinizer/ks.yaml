---
# yaml-language-server: $schema=https://lds-schemas-5hg.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app agent-lab-trackinizer
  namespace: flux-system
spec:
  # Trackinizer, the analysis ledger the orchestrator writes to
  # (FACTORY_TRACKINIZER_URL), plus the orchestrator's Trackinizer token in
  # agent-control. No targetNamespace for the same reason as the other
  # agent-lab components: the token's ExternalSecret lives in agent-control.
  #
  # The only agent-lab component on since 2026-10-18: the owner keeps using
  # Trackinizer on its own, through the web UI. The token's ExternalSecret is
  # commented out in app/kustomization.yaml while agent-control is off.
  #
  # The one-time bootstrap (README, "Analysis ledger (Trackinizer)") was done
  # on 2026-10-11, and the `trackinizer` database kept its schema, admin and
  # rows through the 2026-10-18 pause. Nothing waits on this one:
  # agent-lab-factory does not depend on it, and the orchestrator treats every
  # ledger failure as logged-and-ignored.
  path: ./kubernetes/apps/agent-lab/trackinizer/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  dependsOn:
    # crunchy-pgo-secrets, and the cluster that generates
    # postgres-pguser-trackinizer from the `trackinizer` user in cluster.yaml.
    - name: crunchy-postgres-stores
    - name: crunchy-postgres-operator-cluster
    # bitwarden-secrets-manager, for agent-factory-trackinizer. Unused while
    # that ExternalSecret is off with the factory; kept so its re-enable needs
    # no change here.
    - name: external-secrets-stores
    # The trackinizer namespace's default-deny policy must exist before the
    # pod does, so it never runs unpoliced.
    - name: agent-lab-network-policy
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  postBuild:
    substitute:
      APP: *app
