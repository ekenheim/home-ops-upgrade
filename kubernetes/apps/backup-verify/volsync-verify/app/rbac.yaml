---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: volsync-verify
---
# Namespace-scoped on purpose: the verifier only creates restores and check
# pods in backup-verify. No Secret verbs; Flux renders the restic secrets
# (kubernetes/templates/volsync-verify) and only the VolSync mover reads them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: volsync-verify
rules:
  - apiGroups: ["volsync.backube"]
    resources: ["replicationdestinations"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: volsync-verify
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: volsync-verify
subjects:
  - kind: ServiceAccount
    name: volsync-verify
