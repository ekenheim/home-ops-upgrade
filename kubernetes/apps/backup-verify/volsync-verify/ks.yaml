---
# yaml-language-server: $schema=https://lds-schemas-5hg.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app volsync-verify
  namespace: flux-system
spec:
  targetNamespace: backup-verify
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: volsync
  path: ./kubernetes/apps/backup-verify/volsync-verify/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
# The MinIO restic secret for every app in app/apps.txt, and the R2 one for
# the apps in R2_APPS (app/cronjob.yaml). Adding an app to the rotation
# means a line in apps.txt, a minio block here and an entry in checks.json.
---
# yaml-language-server: $schema=https://lds-schemas-5hg.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: volsync-verify-minio-home-assistant
  namespace: flux-system
spec:
  targetNamespace: backup-verify
  commonMetadata:
    labels:
      app.kubernetes.io/name: volsync-verify
  dependsOn:
    - name: external-secrets-stores
  path: ./kubernetes/templates/volsync-verify/minio
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: home-assistant
