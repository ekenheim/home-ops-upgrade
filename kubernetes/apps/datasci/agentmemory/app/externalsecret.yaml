---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name agentmemory
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/managed-by: Helm
        annotations:
          meta.helm.sh/release-name: agentmemory
          meta.helm.sh/release-namespace: datasci
      data:
        # Embeddings go direct to ollama-igpu, which needs no real key.
        OPENAI_API_KEY: "ollama"
        # Enrichment calls reach litellm over its Anthropic-compatible
        # endpoint, so the app names the variable ANTHROPIC_API_KEY -- but the
        # value is a litellm virtual key, not an Anthropic one.
        #
        # It comes from this app's OWN `agentmemory` item, never litellm's
        # master key. That field is litellm's admin credential: using it here
        # let agentmemory bypass every team and model restriction, and tied
        # this app's key rotation to the proxy's own, with both sides only
        # re-reading env at container start.
        ANTHROPIC_API_KEY: '{{ .LITELLM_API_KEY }}'
        # App signing/session secret — store this field in the `agentmemory`
        # Bitwarden Secrets Manager item. Shared with hermes' plugin bearer.
        AGENTMEMORY_SECRET: '{{ .AGENTMEMORY_SECRET }}'
  dataFrom:
    # `litellm` is deliberately absent -- nothing here reads it any more, and
    # extracting it would hand this app the proxy's master key for no reason.
    - extract:
        key: agentmemory
