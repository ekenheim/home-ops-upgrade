---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: banditweb-analysis
  namespace: datasci
spec:
  hostnames:
    - "bandit.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    # nginx equivalent: regex path on /analysis with rewrite-target, i.e. strip the prefix.
    - matches:
        - path:
            type: PathPrefix
            value: /analysis
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: banditweb-analysis
          port: 8090
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: banditweb-api
  namespace: datasci
spec:
  hostnames:
    - "bandit.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    # nginx equivalent: regex path on /bandit with rewrite-target, i.e. strip the prefix.
    - matches:
        - path:
            type: PathPrefix
            value: /bandit
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: seldon-mesh
          port: 80
