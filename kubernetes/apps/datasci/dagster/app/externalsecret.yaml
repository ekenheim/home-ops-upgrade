spec:
  refreshInterval: 15m
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grid-reliance-entsoe
    creationPolicy: Owner
    template:
      engineVersion: v2
