---
# MinIO creds for alphaos run pods (market-data pipeline writes to the "stocks-us" bucket on
# the LAN MinIO). Reuses the SAME Bitwarden item as hempriser ("hempriser-minio") — same MinIO,
# same keys — just remapped to the names AlphaOS expects (MINIO_ENDPOINT_URL / *_ACCESS_KEY_ID /
# *_SECRET_ACCESS_KEY). The endpoint is non-secret (same s3-lan the dashboard uses) so it's a
# literal; only the access/secret keys come from Bitwarden.
# Attached to alphaos run pods ONLY, via the dagster-k8s/config env_from tag in marketdata/
# dagster_defs.py (v0.5.1) — NOT in the global runLauncher.envSecrets (avoids cred spray).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alphaos-minio-rw
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: alphaos-minio-rw
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        MINIO_ENDPOINT_URL: "http://s3-lan.ekenhome.se:9000"
        MINIO_ACCESS_KEY_ID: "{{ .MINIO_ACCESS_KEY }}"
        MINIO_SECRET_ACCESS_KEY: "{{ .MINIO_SECRET_KEY }}"
  dataFrom:
    - extract:
        key: hempriser-minio
---
# massive.com credentials for alphaos run pods (market-data fetch source).
# Attached to alphaos run pods ONLY, via the dagster-k8s/config env_from tag (v0.5.1).
#
# The flat-file S3 bucket (files.massive.com) is paid-plan only (Stocks Starter+); on the
# free Basic plan GetObject returns 403, which is why `ingest_massive` exited 1 from
# ~2026-08-19. The S3 keys were never the problem -- the plan was. alphaos 0.8.5 adds
# `--source rest` (env MASSIVE_SOURCE) and makes it the DEFAULT: one free grouped-daily
# REST call per weekday, rewritten into the exact day_aggs_v1 flat-file schema and
# uploaded to the same MinIO key, so build_bars is untouched. Daily bars only -- there is
# no free bulk minute source, and the rest path REFUSES minute_aggs_v1 rather than
# silently skipping it.
#
# NOTE THE FIELD RENAME. The app reads env MASSIVE_API_KEY, but the Bitwarden item stores
# it as MASSIVE_API -- so the template maps one to the other. Both live in this SAME
# `alphaos-massive` item; an earlier revision of this comment assumed the API key sat in a
# separate secret whose name was unknown, which is why a second dataFrom.extract was
# proposed. It is not needed: verified 2026-08-24 by extracting the whole item into a
# throwaway Secret, which returned MASSIVE_API (32 chars, non-empty) alongside the two
# MASSIVE_S3_* fields.
#
# The care that warning called for still applies to whoever edits this next: a field
# absent from the extracted item renders as an EMPTY STRING rather than failing the
# ExternalSecret, so a typo in the source field name syncs green and hands the run pods a
# blank key -- a silent failure much worse than the loud one it replaces. After changing
# any name here, confirm the rendered value is non-empty, do not just check for
# SecretSynced=True. Compare 9b16111ad, where an ExternalSecret pointed at a nonexistent
# item and the provider reported the miss as the rather flat "Secret does not exist".
#
# MASSIVE_SOURCE is left unset: `rest` is already the 0.8.5 default. Set it to `s3` (and
# keep the MASSIVE_S3_* fields) only if the account moves to a paid plan for intraday.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alphaos-massive
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: alphaos-massive
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        # Item field is MASSIVE_API; the app's env var is MASSIVE_API_KEY.
        MASSIVE_API_KEY: "{{ .MASSIVE_API }}"
        MASSIVE_S3_ACCESS_KEY_ID: "{{ .MASSIVE_S3_ACCESS_KEY_ID }}"
        MASSIVE_S3_SECRET_ACCESS_KEY: "{{ .MASSIVE_S3_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: alphaos-massive
