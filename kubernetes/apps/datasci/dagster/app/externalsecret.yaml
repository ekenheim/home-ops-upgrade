---
# MinIO creds for alphaos run pods (market-data pipeline writes to the "stocks-us" bucket on
# the LAN MinIO). Reuses the SAME Bitwarden item as hempriser ("hempriser-minio") — same MinIO,
# same keys — just remapped to the names AlphaOS expects (MINIO_ENDPOINT_URL / *_ACCESS_KEY_ID /
# *_SECRET_ACCESS_KEY). The endpoint is non-secret (same s3-lan the dashboard uses) so it's a
# literal; only the access/secret keys come from Bitwarden.
# Attached to alphaos run pods ONLY, via the dagster-k8s/config env_from tag in marketdata/
# dagster_defs.py (v0.5.1) — NOT in the global runLauncher.envSecrets (avoids cred spray).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alphaos-minio-rw
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: alphaos-minio-rw
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        MINIO_ENDPOINT_URL: "http://s3-lan.ekenhome.se:9000"
        MINIO_ACCESS_KEY_ID: "{{ .MINIO_ACCESS_KEY }}"
        MINIO_SECRET_ACCESS_KEY: "{{ .MINIO_SECRET_KEY }}"
  dataFrom:
    - extract:
        key: hempriser-minio
---
# massive.com credentials for alphaos run pods (market-data fetch source).
# Attached to alphaos run pods ONLY, via the dagster-k8s/config env_from tag (v0.5.1).
#
# INCOMPLETE AS OF alphaos 0.8.5 -- THIS SECRET NO LONGER CARRIES WHAT INGEST NEEDS.
#
# The flat-file S3 bucket (files.massive.com) is paid-plan only (Stocks Starter+); on the
# free Basic plan GetObject returns 403, which is why `ingest_massive` has exited 1 since
# ~2026-08-19. The S3 keys below were never the problem -- the plan was. So 0.8.5 adds
# `--source rest` (env MASSIVE_SOURCE) and makes it the DEFAULT: one free grouped-daily
# REST call per weekday, rewritten into the exact day_aggs_v1 flat-file schema and
# uploaded to the same MinIO key, so build_bars is untouched. Daily bars only -- there is
# no free bulk minute source, and the rest path REFUSES minute_aggs_v1 rather than
# silently skipping it.
#
# That path authenticates with MASSIVE_API_KEY, which IS NOT IN THE ITEM THIS EXTRACTS.
# Verified 2026-08-24 by extracting the whole item into a throwaway Secret: it holds
# exactly MASSIVE_S3_ACCESS_KEY_ID and MASSIVE_S3_SECRET_ACCESS_KEY, nothing else. The
# API creds live in a DIFFERENT Bitwarden Secrets Manager secret whose name/UUID is not
# recorded here yet.
#
# DO NOT just add `MASSIVE_API_KEY: "{{ .MASSIVE_API_KEY }}"` to the template below. A
# field absent from the extracted item renders as an EMPTY STRING rather than failing the
# ExternalSecret, so it would sync green and hand the run pods a blank API key -- a much
# worse failure than the current one. Add a SECOND dataFrom.extract naming the real
# secret instead:
#   dataFrom:
#     - extract: {key: alphaos-massive}       # MASSIVE_S3_*
#     - extract: {key: <the-real-one>}        # MASSIVE_API_KEY
#
# Finding that name cannot be automated from inside the cluster, so it has to be read off
# the Bitwarden SM UI by hand. Three dead ends, recorded so they are not retried:
#   - `bws` in this repo is unauthenticated and cannot list secrets.
#   - dataFrom.find is impossible: this ClusterSecretStore is a *webhook* provider
#     (GET /key/{{ .remoteRef.key }} against bitwarden-secrets-manager:5000, jsonPath
#     $.value), and ESO rejects it with "error getting all secrets: not implemented".
#     Lookup is by exact name or UUID only.
#   - No other Secret in any namespace carries a MASSIVE_* key, so it has never synced.
# Note names are not unique in BWS -- if the other item is ALSO called `alphaos-massive`,
# the webhook URL is ambiguous and it must be addressed by UUID. Compare 9b16111ad, where
# the API-key ExternalSecret pointed at a nonexistent item and the provider reported the
# miss as the rather flat "Secret does not exist".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alphaos-massive
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: alphaos-massive
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        MASSIVE_S3_ACCESS_KEY_ID: "{{ .MASSIVE_S3_ACCESS_KEY_ID }}"
        MASSIVE_S3_SECRET_ACCESS_KEY: "{{ .MASSIVE_S3_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: alphaos-massive
