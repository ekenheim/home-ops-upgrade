---
# yaml-language-server: $schema=https://kubernetes-schemas.solanyn.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dask
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  path: ./kubernetes/apps/datasci/dask/app
  # prune: true (was false until 2026-10-18): with false, disabling Dask in
  # datasci/kustomization.yaml left the operator and a 3-worker cluster
  # running unmanaged for months. They were deleted by hand that day.
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  targetNamespace: datasci
  timeout: 5m
  wait: true
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: dask
      VOLSYNC_CAPACITY: 5Gi
---
# yaml-language-server: $schema=https://kubernetes-schemas.solanyn.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dask-cluster
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: dask
  interval: 1h
  path: ./kubernetes/apps/datasci/dask/cluster
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: dask-cluster
  # prune: true (was false until 2026-10-18): with false, disabling Dask in
  # datasci/kustomization.yaml left the operator and a 3-worker cluster
  # running unmanaged for months. They were deleted by hand that day.
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  targetNamespace: datasci
  timeout: 5m
  wait: true