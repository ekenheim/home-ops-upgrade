---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name dispatch
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        ## --- Operator UI auth -------------------------------------------------
        # HTTP Basic Auth rather than upstream's OIDC: this cluster's Authentik
        # has no dispatch provider, and adding one means a tofu-controller
        # change. Basic mode needs USERNAME + PASSWORD and nothing else --
        # NEXTAUTH_SECRET/NEXTAUTH_URL are only read in oidc mode.
        #
        # Never `disabled`: that removes auth from the mutating API too, so
        # anything that can reach the ingress could queue coder Jobs that push
        # to GitHub with the agent PAT.
        DISPATCH_AUTH_MODE: "basic"
        DISPATCH_AUTH_USERNAME: '{{ .DISPATCH_AUTH_USERNAME }}'
        DISPATCH_AUTH_PASSWORD: '{{ .DISPATCH_AUTH_PASSWORD }}'
        ## --- Agent API --------------------------------------------------------
        # Bearer token for every mutating API call. The bridge CronJob reads the
        # SAME field from the same Bitwarden item -- they must match or the
        # bridge 401s on /api/agents/{name}/queue.
        DISPATCH_AGENT_TOKEN: '{{ .DISPATCH_AGENT_TOKEN }}'
        ## --- GitHub -----------------------------------------------------------
        # Issue sync + label/state writes. Shared with foreman so the issue
        # labels, the commits, and the PR all come from one identity.
        GITHUB_TOKEN: '{{ .GITHUB_TOKEN }}'
        ## --- Grooming ---------------------------------------------------------
        DISPATCH_LLM_API_KEY: '{{ .LITELLM_MASTER_KEY }}'
  dataFrom:
    - extract:
        key: dispatch
    - extract:
        key: github-agents
    - extract:
        key: litellm
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name dispatch-db-secret
spec:
  secretStoreRef:
    name: crunchy-pgo-secrets
    kind: ClusterSecretStore
  refreshInterval: 1m
  target:
    name: *name
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        # Direct primary, NOT pgbouncer -- same reason as litellm: the chart's
        # pre-upgrade hook runs `prisma migrate deploy`, and Prisma takes
        # session-scoped advisory locks that pgbouncer's transaction pooling
        # silently drops.
        #
        # The primary is TLS-only (pg_hba.conf ends at `hostssl ...
        # scram-sha-256`, no plaintext fallback), so sslmode is mandatory.
        # `require` not `verify-full`: Crunchy signs with its own CA.
        #
        # Key is `uri` to match the chart's database.key default.
        uri: 'postgresql://{{ .user }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}?sslmode=require'
  dataFrom:
    - extract:
        key: postgres-pguser-dispatch
