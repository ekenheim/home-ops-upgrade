---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name foreman-dispatch-bridge
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Same field as ../app/externalsecret.yaml pulls into the `dispatch`
        # Secret -- the bridge authenticates to dispatch's agent API with it.
        # They come from one Bitwarden field on purpose; two different values
        # means every bridge tick 401s on /api/agents/foreman-coder/queue.
        DISPATCH_AGENT_TOKEN: '{{ .DISPATCH_AGENT_TOKEN }}'
  dataFrom:
    - extract:
        key: dispatch
