---
apiVersion: foreman.llmkube.dev/v1alpha1
kind: Agent
metadata:
  name: coder
spec:
  role: coder
  provider: cloud-proxy
  providerConfig:
    # litellm's `self-hosted` alias -> ornith-35b on worker4's Strix iGPU.
    # A *reasoning* model: it spends output tokens thinking before answering, so
    # maxOutputTokens has to leave room for both (see ../../litellm/app/configmap.yaml).
    baseURL: http://litellm.datasci:4000/v1
    model: self-hosted
    apiKeySecretRef:
      name: foreman-agent
      key: LITELLM_API_KEY
  tools:
    - read_file
    - write_file
    - str_replace
    - grep
    - bash
    - fetch_issue
    - submit_result
  mcp:
    enabled: true
    servers:
      # The toolhive-hosted context7 in this namespace, NOT the public
      # mcp.context7.com -- so no CONTEXT7_API_KEY header is needed and the
      # MCPToolConfig's curated library-ID list (see
      # ../../toolhive/context7/mcptoolconfig.yaml) applies. Address the
      # *-proxy Service; the bare `mcp-context7` Service is the stdio backend.
      - name: context7
        transport: http
        url: http://mcp-context7-proxy.datasci:8080/mcp
  temperature: "0.2"
  maxTurns: 160
  maxRetries: 3
  maxOutputTokens: 20480
  stuckLoopDetection:
    # Sized to this cluster's actual per-request window, which is NOT the
    # model's 262144 native context: the InferenceService runs contextSize
    # 524288 across parallelSlots 8, so each request gets 65536. llama.cpp
    # rejects anything over that outright ("request exceeds the available
    # context size"), so cap well under it.
    editFreeTurnsLimit: 100
    contextSoftCap: 48000
    contextHardCap: 60000
  requestTurnTimeoutSeconds: 1800
  requestTimeoutSeconds: 7200
  bashTimeoutSeconds: 60
  execution:
    activeDeadlineSeconds: 7200
    image: ghcr.io/misospace/llmkube-coder:0.9.18@sha256:7cbb2e2dfa457015f27fa170b705ffed79f42567cbbffb501c9d524644ab6f0d
    mode: Job
    serviceAccountName: foreman-coder
  requiredCapability:
    # Matches the fleet's roles (worker,coder,verifier). accelerator "any"
    # because requiredCapability pins the *executor* node, not the model -- the
    # model's GPU placement is the llmkube InferenceService's problem.
    roles:
      - coder
    accelerator: any
  systemPrompt: |
    You are a coding agent resolving one GitHub issue in the referenced repo.

    Start by calling fetch_issue(repo, issue). On a retry the payload carries only the
    previous attempt's feedback — the original ask and acceptance criteria are not in it.
    If the repo has an AGENTS.md, read it: it carries conventions and the testing traps
    earlier attempts learned the hard way.

    Implement the fix, add a test for any behaviour change, and run the repo's own
    verification commands before finishing.

    How the harness works around you: it stages, commits, DCO-signs and pushes whatever
    your edit tools changed, using the commit message you pass to submit_result. Progress
    is measured by those edit-tool calls, so changes made another way do not register.

    Finish with submit_result:
      GO — the change is complete and verification passes.
      NO-GO + extra.outcome="ALREADY-RESOLVED" + extra.resolvedBy=<file and what it
        already does> — the code where the issue points already does what it asks.
      NO-GO + extra.escalation="DESIGN-DECISION" — a product or architecture call a
        human has to make.
      NO-GO + extra.escalation="NO-TECHNICAL-FIX" — nothing in this repo can fix it
        (wrong layer, upstream bug, external service).
    Put the specific blocker in your summary. These route the issue, so a wrong one
    removes real work from the queue. Being unable to find something is not one of them.
