---
# yaml-language-server: $schema=https://kubernetes-schemas.minuette.horse/kyverno.io/clusterpolicy_v1.json
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: foreman-coder-git-credentials
  annotations:
    policies.kyverno.io/title: Give foreman coder Jobs working git credentials
    policies.kyverno.io/category: foreman
    policies.kyverno.io/description: >-
      The foreman chart projects the git Secret into coder Jobs as a bare
      GITHUB_TOKEN env var, which it uses for "the clone + push" (its words).
      Nothing configures a git credential helper, so any git command the *model*
      runs through its own bash tool hits a remote with no credentials:

        git fetch origin foreman/wl-.../issue-8
        fatal: could not read Username for 'https://github.com'

      On a public repo this never surfaces -- an unauthenticated fetch just
      works. On a private one (ekenheim/nordic-housing) it breaks the loop:
      the coder pushes its branch fine, then fails to fetch it back, so no PR
      is opened, so coder-revision and the reviewer have nothing to act on and
      every task terminates as a human escalation no matter how good the model
      is. That is what stranded nordic-housing#8 after it had already produced
      a correct commit.

      There is no supported knob for this. The Agent CRD's execution block is
      only {activeDeadlineSeconds, image, mode, resources, serviceAccountName}
      -- no env, no volumes, no initContainers -- so the credential cannot be
      injected through foreman's own config. Hence admission mutation.

      Uses git's env-var config (GIT_CONFIG_COUNT/KEY/VALUE, git >= 2.31; the
      coder image ships 2.39.5) to install a url.insteadOf rewrite, so *every*
      git invocation authenticates rather than only the ones foreman makes
      itself. $(GITHUB_TOKEN) is Kubernetes env expansion, which resolves
      against the chart-provided var already present earlier in the container's
      env list -- Kyverno appends, so the ordering requirement holds.

      REMOVE THIS once llmkube configures the credential itself upstream.
spec:
  # Mutation applies at admission only. Coder pods are created per task and
  # never updated in place, so there is nothing for a background scan to do.
  background: false
  # Never block pod creation. A broken policy here would take the whole coder
  # fleet offline; a skipped mutation only reverts to today's behaviour.
  failurePolicy: Ignore
  rules:
    - name: inject-git-config-env
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["datasci"]
      preconditions:
        all:
          # The coder Job ServiceAccount, set by the chart (coder.serviceAccount
          # .name, default "foreman-coder"). Stable, unlike the per-task pod
          # names (foreman-coder-wl-<repo>-<issue>-...).
          - key: "{{ request.object.spec.serviceAccountName || '' }}"
            operator: Equals
            value: foreman-coder
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - (name): "*"
                env:
                  - name: GIT_CONFIG_COUNT
                    value: "1"
                  - name: GIT_CONFIG_KEY_0
                    value: "url.https://x-access-token:$(GITHUB_TOKEN)@github.com/.insteadOf"
                  - name: GIT_CONFIG_VALUE_0
                    value: "https://github.com/"
