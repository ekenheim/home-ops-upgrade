---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name foreman-agent
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # The coder-role executor clones the Workload's repo with this and
        # pushes its branch; the reviewer opens the PR with it. Needs `repo`
        # and `workflow` scope on a classic PAT (or Contents+PullRequests
        # read/write on a fine-grained one) for every repo the loop touches.
        #
        # Shared with dispatch and the dispatch bridge -- one agent PAT, so the
        # commits, the PR, and the issue label writes all come from the same
        # identity. Bitwarden item `github-agents`, field `GITHUB_TOKEN`.
        GITHUB_TOKEN: '{{ .GITHUB_TOKEN }}'
        # Every Agent below is provider: cloud-proxy pointed at litellm, which
        # authenticates with its master key (same pattern as agentmemory and
        # hermes). Upstream uses a per-consumer litellm virtual key; this
        # cluster's litellm has no key management wired, so the master key it is.
        LITELLM_API_KEY: '{{ .LITELLM_MASTER_KEY }}'
  dataFrom:
    - extract:
        key: github-agents
    - extract:
        key: litellm
