---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name foreman-agent
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # The coder-role executor clones the Workload's repo with this and
        # pushes its branch; the reviewer opens the PR with it. For every repo
        # the loop touches, a classic PAT needs `repo` + `workflow`; a
        # fine-grained one needs Contents read/write, Pull requests
        # read/write, Issues read/write, and Metadata read (Workflows
        # read/write only if the agents may edit .github/workflows).
        #
        # Issues is easy to miss and this comment used to omit it: dispatch
        # syncs issues and writes labels and state with the SAME token, so
        # without it pushes and PRs work while issue sync fails -- a
        # half-broken loop rather than a clean failure.
        #
        # Shared with dispatch and the dispatch bridge -- one agent PAT, so the
        # commits, the PR, and the issue label writes all come from the same
        # identity. Bitwarden item `github_token`, field `GITHUB_TOKEN`.
        GITHUB_TOKEN: '{{ .GITHUB_TOKEN }}'
        # Every Agent below is provider: cloud-proxy pointed at litellm.
        # Upstream uses a per-consumer litellm virtual key and so do we now --
        # key management IS wired on this cluster (teams + virtual keys), which
        # the previous note here predated. Field `LITELLM_API_KEY` on the
        # `foreman` item; NOT litellm's master key, which is the proxy's own
        # admin credential and bypasses every team and model restriction.
        LITELLM_API_KEY: '{{ .LITELLM_API_KEY }}'
  dataFrom:
    - extract:
        key: github_token
    - extract:
        key: foreman
