---
# yaml-language-server: $schema=https://kubernetes-schemas.minuette.horse/v1/configmap.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: foreman-git-config
data:
  # Mounted over /etc/gitconfig in every foreman pod that runs git -- the coder
  # Jobs and the agent Deployment -- by ./git-credentials-policy.yaml.
  #
  # Why the *system* config and not an env var: foreman's bash tool (the one the
  # model drives) hands the shell a fixed env allowlist,
  # pkg/foreman/agent/tools/bash.go:defaultBashEnvAllowlist =
  #   PATH HOME USER LANG LC_ALL TZ GIT_ASKPASS GIT_AUTHOR_* GIT_COMMITTER_*
  #   GITHUB_TOKEN
  # Everything else is scrubbed. GIT_CONFIG_COUNT/KEY/VALUE (what #6509 used) is
  # not on that list, so the credential never reached the model's git. A file at
  # /etc/gitconfig is read by every git process regardless of environment, and
  # GITHUB_TOKEN -- which the helper body expands at run time -- *is* allowlisted.
  #
  # The token stays out of config values and remote URLs, so it cannot leak into
  # `git remote -v`, error output, or the agent's own logs.
  gitconfig: |
    # safe.directory is copied from the image's own /etc/gitconfig
    # (ghcr.io/misospace/llmkube-coder). This mount SHADOWS that file, so
    # anything the image ships there has to be repeated here or it is lost.
    # Re-check it when bumping the image tag in ./helmrelease.yaml.
    [safe]
    	directory = *
    # Two token names, because two different callers run git here and neither
    # can see the other's environment:
    #   GITHUB_TOKEN       -- the model's bash tool. It is on that tool's env
    #                         allowlist; GIT_CONFIG_* is not, which is why this
    #                         is a file.
    #   FOREMAN_GIT_TOKEN  -- foreman's own git calls. repo.runGit builds the
    #                         subprocess env from scratch (PATH + repo.Auth.Env()
    #                         only), so GITHUB_TOKEN is NOT there.
    #
    # The `exit 0` on an empty token is load-bearing. A helper that answers with
    # an empty password is still an answer: git stops looking and never falls
    # back to the GIT_ASKPASS scaffolding repo.Auth sets up, and GitHub rejects
    # the request with "Invalid username or token" -- which is how a first cut of
    # this ConfigMap broke the coder's clone outright. Printing nothing means
    # "no credential", so git carries on to askpass exactly as it does today.
    #
    # Bare $VAR throughout, never ${VAR}: this file is rendered through Flux's
    # postBuild envsubst, which parses ${...} as its own syntax.
    [credential]
    	helper = "!f() { t=\"$GITHUB_TOKEN\"; [ -n \"$t\" ] || t=\"$FOREMAN_GIT_TOKEN\"; [ -n \"$t\" ] || exit 0; echo username=x-access-token; echo \"password=$t\"; }; f"
