---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: foreman
spec:
  chartRef:
    kind: OCIRepository
    name: foreman
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    foreman:
      # Foreman CRD status metrics via kube-state-metrics Custom Resource State.
      # Left off (chart default): the chart only renders a ConfigMap, and KSM
      # cannot mount a ConfigMap from another namespace -- making these land
      # would mean editing kube-prometheus-stack's
      # `kube-state-metrics.customResourceState` in observability. Turn on here
      # *and* there together, or not at all.
      crs:
        enabled: false
    operator:
      # Audit-record ConfigMaps (foreman.llmkube.dev/audit) are written WITHOUT
      # ownerReferences so they outlive the AgenticTask, and are only GC'd by
      # the operator's reaper. The 7d chart default piles up hundreds of CMs in
      # datasci under task churn; 48h is plenty for a homelab.
      audit:
        retention: 48h
    agent:
      # One task per FleetNode, and a Job-mode coder holds its node for the
      # whole Job -- so this is the cap on concurrent coder/gate/review steps.
      # Sized to the bridge's MAX_IN_PROGRESS=2 (two issues in flight, each
      # occupying one node per pipeline step) plus one spare. Each replica
      # requests 200m/256Mi and can burst to 2 CPU / 8Gi during a self-gate.
      replicaCount: 3
      # native = the real M3 agent loop. `stub` (the chart default) writes a
      # synthetic Succeeded result and would silently "pass" every task.
      mode: native
      # Pin to this namespace: the agent watches AgenticTasks, and an empty
      # value means all namespaces.
      taskNamespace: datasci
      # The scheduler rejects capability-pinned tasks when this is empty. These
      # pods hold no GPU -- worker4's Strix iGPU serves the model behind
      # litellm, so the executor node genuinely needs no accelerator. The Agent
      # CRs ask for `accelerator: any`, which matches.
      accelerator: none
      roles:
        - worker
        - coder
        - verifier
      # The chart default (ghcr.io/defilantech/llmkube-foreman-agent) is the
      # lean alpine runtime with no toolchain, so a coder-role agent cannot run
      # its in-workspace self-gate. This is the polyglot coder build (Go +
      # Python + Node), which is the right shape for this cluster's repos --
      # keep the tag in lockstep with ./ocirepository.yaml.
      image:
        repository: ghcr.io/misospace/llmkube-coder
        tag: "0.9.16@sha256:c99120f992ae588fdaa5000377da4da1d4e04f349ba681e27083f5a4008cc97f"
      githubToken:
        secretName: foreman-agent
        secretKey: GITHUB_TOKEN
      # gitRemoteURL deliberately unset: empty means each coder task clones and
      # pushes its own Workload payload.repo, so this one fleet serves every
      # repo the bridge dispatches. Setting it would pin all tasks to a single
      # fork.
      commitAuthorName: ekenheim
      commitAuthorEmail: ekenheim@gmail.com
      # run_gate_job reuses this across invocations for GOMODCACHE / pip / npm
      # caches. RWX because the gate Job and the agent pod that submits it are
      # not guaranteed to land on the same node.
      gateCache:
        storageClass: ceph-filesystem
        accessModes: ["ReadWriteMany"]
        size: 20Gi
    coder:
      # Job-mode Agents (./agents/coder.yaml et al) run under the chart's
      # foreman-coder ServiceAccount and project this Secret as GITHUB_TOKEN for
      # the clone + push. Reuse the agent's Secret rather than the chart's
      # default standalone foreman-git-credentials.
      gitCredentialsSecret: foreman-agent
      gitCredentialsSecretKey: GITHUB_TOKEN
    # webhook.failurePolicy stays at the chart default (Fail). Note the tradeoff
    # with a single operator replica: during an operator rollout there is a brief
    # window where every Agent/AgenticTask create is rejected cluster-wide. Flux
    # retries the foreman-agents Kustomization, and the operator being mid-restart
    # means nothing is dispatching anyway.
