---
# yaml-language-server: $schema=https://kubernetes-schemas.minuette.horse/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app foreman
  namespace: flux-system
spec:
  path: ./kubernetes/apps/datasci/foreman/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: datasci
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  dependsOn:
    # foreman is the LLMKube *add-on* control plane -- it ships its own CRDs
    # (Workload, AgenticTask, Agent, FleetNode) but every Agent resolves its
    # model through an llmkube InferenceService behind litellm.
    - name: llmkube
    - name: litellm
    - name: external-secrets-stores
    # ceph-filesystem backs the RWX gate-cache PVC the chart renders.
    - name: rook-ceph-cluster
  wait: true
  interval: 30m
  retryInterval: 1m
  # Longer than the 5m the rest of datasci uses: the agent Deployment pulls the
  # ~2GB polyglot coder image on every node it lands on, and `wait: true` does
  # not go Ready until those pods are up.
  timeout: 15m
  postBuild:
    substitute:
      APP: *app
---
# yaml-language-server: $schema=https://kubernetes-schemas.minuette.horse/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app foreman-agents
  namespace: flux-system
spec:
  path: ./kubernetes/apps/datasci/foreman/agents
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: datasci
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  # Split out of ./app deliberately -- these are Agent CRs whose CRD the ./app
  # HelmRelease installs, and the chart also fronts them with a validating
  # admission webhook that runs *inside the operator pod*. Applied in the same
  # Kustomization they fail on the first reconcile ("no matches for kind Agent",
  # then webhook connection refused) until Flux retries. Same crds-then-app
  # split toolhive uses.
  dependsOn:
    - name: foreman
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
