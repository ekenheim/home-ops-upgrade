---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grid-reliance-api
  namespace: datasci
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Data Science"
    gethomepage.dev/name: "Grid Reliance API"
spec:
  hostnames:
    - "grid-reliance.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: grid-reliance-api
          port: 8000
