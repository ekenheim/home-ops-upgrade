---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
data:
  # Run by the init container before every hermes start. Renders config.yaml
  # below onto the PVC *without* discarding the MCP servers hermes itself
  # wrote there, which a plain `sed > /opt/data/config.yaml` used to do.
  merge-config.py: |
    #!/usr/bin/env python3
    """Render /opt/data/config.yaml from the ConfigMap, preserving PVC state.

    Everything in the ConfigMap wins, except that MCP servers present only on
    the PVC are carried over. That keeps this repo authoritative for the
    tuning knobs while letting `hermes mcp add` and the dashboard's MCP page
    survive a pod restart.
    """
    import glob
    import os
    import shutil
    import time

    import yaml

    SRC = "/tmp/config.yaml"
    DST = "/opt/data/config.yaml"
    HERMES_UID = 10000
    HERMES_GID = 10000
    KEEP_SNAPSHOTS = 5
    # Flux runs envsubst in strict mode over this ConfigMap, so the literal is
    # written with a doubled dollar and reaches the container with one.
    HASH_PLACEHOLDER = "$${DASHBOARD_PASSWORD_HASH}"


    def log(message):
        print("[merge-config] " + message, flush=True)


    def load(path):
        try:
            with open(path) as handle:
                loaded = yaml.safe_load(handle)
        except (OSError, yaml.YAMLError) as exc:
            log("could not read " + path + ": " + str(exc))
            return {}
        return loaded if isinstance(loaded, dict) else {}


    def mapping(source, key):
        value = source.get(key)
        return value if isinstance(value, dict) else {}


    def snapshot():
        """Keep the last few pre-merge configs so a bad render is recoverable.

        hermes' own config.yaml.bak-* files cannot serve this purpose: it
        writes them when *it* rewrites the file, which is always after this
        script has run, so they only ever record post-merge content.
        """
        stamp = time.strftime("%Y%m%dT%H%M%SZ", time.gmtime())
        shutil.copy2(DST, DST + ".preinit-" + stamp)
        stale = sorted(glob.glob(DST + ".preinit-*"), reverse=True)[KEEP_SNAPSHOTS:]
        for path in stale:
            os.unlink(path)


    base = load(SRC)
    if not base:
        raise SystemExit("[merge-config] refusing to write an empty config from " + SRC)

    live = {}
    if os.path.exists(DST):
        live = load(DST)
        snapshot()

    # The dashboard hash is substituted here rather than by hermes. hermes
    # expands $${VAR} in providers.*.api_key but NOT in
    # dashboard.basic_auth.password_hash -- it registers the auth provider with
    # the literal placeholder as the hash, so every login fails with "invalid
    # username or password" while the container looks perfectly healthy. The
    # LITELLM_API_KEY placeholder is deliberately left alone so the proxy key
    # stays out of the on-disk config.
    auth = mapping(mapping(base, "dashboard"), "basic_auth")
    if auth.get("password_hash") == HASH_PLACEHOLDER:
        password_hash = os.environ.get("DASHBOARD_PASSWORD_HASH", "")
        if not password_hash:
            log("WARNING: DASHBOARD_PASSWORD_HASH is unset; dashboard login will fail")
        auth["password_hash"] = password_hash

    # Git-declared servers win on a name collision; anything else already on
    # the PVC is carried over. This is what makes a UI-added server durable.
    declared = mapping(base, "mcp_servers")
    carried = [name for name in mapping(live, "mcp_servers") if name not in declared]
    for name in carried:
        declared[name] = live["mcp_servers"][name]
    if declared:
        base["mcp_servers"] = declared
    log("mcp_servers " + repr(sorted(declared)) + ", carried from PVC " + repr(carried))

    # Write via a temp file: a container killed mid-write would otherwise leave
    # a truncated config that hermes refuses to start from.
    staged = DST + ".new"
    with open(staged, "w") as handle:
        yaml.safe_dump(base, handle, sort_keys=False, default_flow_style=False, width=100)
    os.chown(staged, HERMES_UID, HERMES_GID)
    os.chmod(staged, 0o600)
    os.replace(staged, DST)
    log("wrote " + DST)
  config.yaml: |
    # Pin the schema version. Without it hermes treats this as pre-v12 config
    # (~2 years old) and refuses to auto-migrate:
    #   [config-migrate] WARNING: This config predates version 12 and can no
    #   longer be auto-migrated. ... manually set _config_version: 12
    _config_version: 12
    model:
      default: self-hosted
      provider: litellm-anthropic
      # MUST match the InferenceService's per-slot window (contextSize /
      # parallelSlots). hermes reads context length from the provider's
      # /v1/models, but litellm answers with bare ids only --
      #   {"id":"self-hosted","object":"model","created":...}
      # -- so nothing in hermes's _CONTEXT_LENGTH_KEYS matches and it logs
      #   Could not determine context length for model 'self-hosted'
      #   ... falling back to 256,000 tokens
      # It then budgets against 256k while llama.cpp rejects at the real
      # window, so compression.threshold (0.50 -> 128k) is a line it can never
      # cross. Compaction only ever fires *reactively*, after a 400:
      #   request (65572 tokens) exceeds the available context size (65536)
      # and three consecutive compactions failed to get back under the limit.
      # The model also starts dropping tool arguments as it nears the unknown
      # ceiling -- hermes flags this itself as "missing required field
      # 'content' ... almost always a dropped-arg bug under context pressure",
      # which is why repeated write_file calls produced no file.
      # Raise this and contextSize together or the reactive-compaction loop
      # comes straight back.
      context_length: 131072
    fallback_providers:
      - provider: litellm
        model: self-hosted
    # stale_timeout_seconds is REQUIRED on both providers, and the reason is
    # subtle enough to be worth writing down.
    #
    # hermes arms a time-to-first-byte watchdog on non-streaming calls and
    # kills the request when it fires:
    #   RuntimeError: Non-streaming API call timed out after 90s with no
    #   response (threshold: 90s)
    # 90s is its default for *cloud* providers (run_agent.py
    # _resolved_api_call_stale_timeout_base). For local endpoints it is
    # supposed to disable the watchdog entirely:
    #   if uses_implicit_default and is_local_endpoint(base_url):
    #       return float("inf")
    #
    # It does not fire here, because is_local_endpoint (model_metadata.py)
    # only treats a hostname as local when it is loopback, an RFC-1918/CGNAT
    # literal, or has NO DOT in it:
    #   if host and "." not in host: return True
    # `litellm.datasci` has a dot and is not an IP, so our in-cluster proxy is
    # classified as a remote cloud provider and gets the 90s cloud default.
    #
    # Do NOT "fix" this by shortening base_url to http://litellm:4000 -- that
    # resolves identically (same namespace) and would make the check pass, but
    # it buys an INFINITE watchdog, so a genuinely dead connection would hang
    # the agent forever. An explicit, bounded value is the better answer, and
    # setting it also takes the local-endpoint branch out of play entirely
    # (it only applies to the implicit default).
    #
    # WHY 900
    #
    # This is a whole-call budget, not an idle timer: `streaming.enabled` is
    # false, so nothing arrives until generation finishes. The floor is set by
    # the slowest thing behind these aliases -- `deep` (Qwen3.8-27B, dense) is
    # a measured 8-9 t/s, so a 2k-token reasoning answer is ~4 minutes before
    # prompt processing, and `self-hosted` drops to ~24 t/s when the node is
    # busy. 90s could not cover either.
    #
    # 900 deliberately sits ABOVE litellm's own `request_timeout: 600` so the
    # ceiling is enforced in exactly one place. litellm gives up at 600 and
    # returns a real error; this watchdog then only ever catches a genuinely
    # dead connection rather than racing its own upstream.
    #
    # hermes scales its own floor for big contexts (240s over 100k tokens,
    # 150s over 50k) but never above an explicit setting, so this wins.
    providers:
      litellm:
        base_url: http://litellm.datasci:4000/v1
        api_key: $${LITELLM_API_KEY}
        stale_timeout_seconds: 900
      litellm-anthropic:
        base_url: http://litellm.datasci:4000/
        api_mode: anthropic_messages
        api_key: $${LITELLM_API_KEY}
        stale_timeout_seconds: 900
    # The dashboard is published at hermes.${SECRET_DOMAIN}, and since
    # v2026.8.3 the image refuses a non-loopback bind with no auth provider
    # registered ("There is no unauthenticated public-bind option") -- the old
    # --insecure flag is now inert. The doubled $$ below escapes Flux's
    # envsubst so hermes expands the variable from env itself, keeping the hash
    # out of Git; it arrives via envFrom the `hermes` secret. Do NOT write the
    # variable with a single $ anywhere in this file, comments included --
    # Flux runs envsubst in strict mode over the whole ConfigMap and fails the
    # build on an unset name.
    dashboard:
      basic_auth:
        username: admin
        password_hash: $${DASHBOARD_PASSWORD_HASH}
    toolsets:
      - hermes-cli
    terminal:
      backend: local
      cwd: /opt/data/workspace
      timeout: 180
      persistent_shell: true
    memory:
      provider: agentmemory
      auto_migrate: true
    compression:
      enabled: true
      threshold: 0.50
      target_ratio: 0.20
      protect_last_n: 20
    agent:
      max_turns: 90
      gateway_timeout: 1800
      restart_drain_timeout: 60
      api_max_retries: 2
      reasoning_effort: medium
    streaming:
      enabled: false
    security:
      redact_secrets: true
    privacy:
      redact_pii: true
    platform_toolsets:
      cli:
        - hermes-cli
    # toolhive exposes each MCPServer on its own in-cluster service (there is
    # no single vmcp gateway here). The MCP endpoint is on the `-proxy`
    # service, NOT the bare workload service -- `mcp-ha-mcp` also exists and
    # would connect to the wrong thing rather than fail cleanly. Confirm with:
    #   kubectl get mcpserver -A          # the URL column is authoritative
    #
    # `url` selects Streamable HTTP, which is what toolhive serves. No
    # skip_preflight needed: hermes content-type-probes the endpoint first and
    # these answer HEAD/GET with 405/400 text/plain, so the probe -- which only
    # rejects a 2xx carrying a non-MCP type -- fails open and hands off to the
    # SDK.
    #
    # Deliberately NOT enabled here, though both are verified working:
    #   ha-mcp      http://mcp-ha-mcp-proxy.datasci:8080/mcp      (78 tools)
    #   memory-mcp  http://mcp-memory-mcp-proxy.datasci:8080/mcp   (9 tools)
    # ha-mcp's 78 tool schemas are a large slice of the window next to a ~28k
    # base prompt, and models degrade at tool selection well before they run
    # out of context. memory-mcp overlaps with the agentmemory provider above
    # -- running both invites the agent to write to one and read from the
    # other. Add either by pasting its url below; add `enabled: false` to park
    # one without deleting it.
    # You do NOT have to declare servers here. The init container merges this
    # block with whatever is already in /opt/data/config.yaml, so a server
    # added from the dashboard or with `hermes mcp add` persists across pod
    # restarts on its own. Until 2026-08-17 the init container overwrote the
    # file outright and a UI-added `outline` server was silently lost on the
    # first restart; see the merge script in the HelmRelease.
    #
    # Precedence on a name collision is git-wins, so a server listed here
    # cannot be edited from the UI -- and deleting one here does NOT delete it
    # if a copy is already on the PVC (`hermes mcp remove <name>` does).
    # Entries below are therefore for servers that should exist on a rebuilt
    # PVC from scratch; anything experimental is better added from the UI.
    #
    # Format mirrors what `hermes mcp add` emits (url + enabled). Extra keys
    # such as `timeout` and `headers` are preserved fine -- they are simply
    # omitted here to keep this identical to what the tool itself writes.
    mcp_servers:
      context7:
        url: http://mcp-context7-proxy.datasci:8080/mcp
        enabled: true
      # Cross-namespace: this one lives in `downloads`, not `datasci`.
      arr:
        url: http://mcp-arr-proxy.downloads:8080/mcp
        enabled: true
    auxiliary:
      vision:
        provider: litellm-anthropic
        model: self-hosted
      compression:
        provider: litellm
        model: self-hosted
        timeout: 180
      web_extract:
        provider: litellm
        model: self-hosted
        timeout: 120
      approval:
        provider: litellm
        model: self-hosted
        timeout: 60
      session_search:
        provider: litellm
        model: self-hosted
        timeout: 120
