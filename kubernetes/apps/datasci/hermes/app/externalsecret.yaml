---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hermes
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/managed-by: Helm
        annotations:
          meta.helm.sh/release-name: hermes
          meta.helm.sh/release-namespace: datasci
      data:
        # Scoped virtual key for hermes -> litellm, from the `hermes` item's own
        # LITELLM_API_KEY field. Deliberately NOT litellm's master key: that
        # field is litellm's own admin credential (see litellm's
        # externalsecret.yaml), so sourcing it here gave hermes cluster-admin
        # rights over the proxy and made rotating one silently rotate the other
        # -- with the two pods picking up the change only on their next restart,
        # so whichever restarted first would mismatch the other.
        # The mapping is intentionally identity (field name == env var name):
        # the previous indirection meant edits to a `LITELLM_API_KEY` field in
        # Bitwarden were silently ignored, because the template read
        # LITELLM_MASTER_KEY instead.
        LITELLM_API_KEY: '{{ .LITELLM_API_KEY }}'
        # Bearer token for the agentmemory plugin -> agentmemory service.
        # Must match agentmemory's AGENTMEMORY_SECRET.
        AGENTMEMORY_SECRET: '{{ .AGENTMEMORY_SECRET }}'
        # bcrypt hash (NOT the password) for the dashboard's basic_auth gate.
        # Generate with hermes' own hasher, which is what validates it:
        #   kubectl -n datasci run hermes-hash --rm -it --restart=Never \
        #     --image=docker.io/nousresearch/hermes-agent:v2026.8.3 --command -- \
        #     python -c "import getpass; from plugins.dashboard_auth.basic import \
        #     hash_password; print(hash_password(getpass.getpass()))"
        DASHBOARD_PASSWORD_HASH: '{{ .DASHBOARD_PASSWORD_HASH }}'
  dataFrom:
    # `litellm` is deliberately absent: nothing here reads from it any more, and
    # extracting it would hand hermes the proxy's master key for no reason.
    - extract:
        key: agentmemory
    - extract:
        key: hermes
