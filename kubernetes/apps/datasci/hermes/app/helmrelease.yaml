---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hermes
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                # Substitute the dashboard password hash here rather than
                # letting hermes do it. hermes expands the LITELLM_API_KEY
                # placeholder in providers.*.api_key, but NOT the one in
                # dashboard.basic_auth.password_hash -- it registers the auth
                # provider and then compares submitted passwords against the
                # literal placeholder text, so every login fails with "invalid
                # username or password" while the container looks perfectly
                # healthy. Only the hash placeholder is replaced here; the
                # LITELLM_API_KEY one is deliberately left for hermes so the
                # proxy key stays out of the on-disk config.
                #
                # Note the doubled $$ below: Flux runs envsubst in strict mode
                # over this file too, so a single-$ reference fails the build
                # on an unset variable. Same reason the match pattern uses
                # character classes rather than a literal placeholder.
                # `|` delimiter because bcrypt hashes contain `/`; bcrypt's
                # alphabet has no `&`, so no further escaping is needed.
                sed "s|[$][{]DASHBOARD_PASSWORD_HASH[}]|$${DASHBOARD_PASSWORD_HASH}|" \
                  /tmp/config.yaml > /opt/data/config.yaml
                chown 10000:10000 /opt/data/config.yaml
                PLUGIN_DIR=/opt/data/plugins/agentmemory
                mkdir -p "$PLUGIN_DIR"
                cp /tmp/agentmemory-plugin/plugin.yaml "$PLUGIN_DIR/plugin.yaml"
                cp /tmp/agentmemory-plugin/__init__.py "$PLUGIN_DIR/__init__.py"
                chown -R 10000:10000 /opt/data/plugins
                # code-server runs as uid 1000 (coder) with supplementary
                # group 10000, but /opt/data is mode 700 -- mode 700 grants the
                # group nothing, not even traversal, so the IDE rendered an
                # empty tree with "Permission denied". fsGroup alone does not
                # fix it: fsGroupChangePolicy is OnRootMismatch and the gid
                # already matched, so Kubernetes skipped the chmod.
                # 0750, not 0770: the group needs traversal and listing, not
                # write. Everything sensitive under here keeps its own mode --
                # .env is 600 and logs/ is 700, both owned by hermes -- so they
                # stay unreadable to coder even with the directory opened up.
                chmod 0750 /opt/data
            envFrom:
              - secretRef:
                  name: hermes
        containers:
          app:
            image: &image
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e
            # The gateway is NOT started here. entrypoint-dispatch.sh execs
            # s6-overlay's /init with main-wrapper.sh as the "main program",
            # and s6's cont-init already brings up a supervised gateway:
            #   reconcile: profile=default prior_state=running action=started
            # So args only decide what runs in the *foreground*. Per
            # main-wrapper.sh's own routing:
            #   no args                       -> exec `hermes` (interactive CLI)
            #   first arg is an executable    -> exec it directly (sleep, ...)
            #   first arg is anything else    -> exec `hermes <args>`
            # `gateway run --no-supervise` (the original) started a second
            # gateway, which the binary refuses outright. No args at all ran
            # the interactive CLI, which exits immediately with
            # "Input is not a terminal (fd=0)". Both crashlooped the container.
            # A blocking no-op is the correct main program here: s6 owns the
            # gateway's lifecycle and its output still reaches kubectl logs.
            args: ["sleep", "infinity"]
            env:
              HERMES_HOME: /opt/data
              HOME: /opt/data
              TZ: "${TIMEZONE}"
              # The dashboard runs HERE, in the same container as the gateway,
              # rather than as its own container. gateway/status.py resolves
              # status from {HERMES_HOME}/gateway.pid -- shared on the PVC, so
              # every container reads the same PID -- and then checks liveness
              # with os.kill, which is namespace-local. A separate container
              # therefore read a valid PID, failed to find that process, and
              # reported "Gateway Status: Stopped" permanently while the gateway
              # was up and serving Discord. Its Restart button failed too:
              # /run is per-container, so gateway-default was missing from its
              # s6 scandir ("no such gateway 'default'").
              # Co-locating fixes both. Containers share the pod network
              # namespace, so the `dashboard` Service still reaches :9119
              # unchanged. The s6 slot is already declared in the image and
              # merely gated on HERMES_DASHBOARD.
              # NOT fixable with shareProcessNamespace: that makes the pause
              # container PID 1, and s6-overlay's /init requires PID 1.
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_PORT: "9119"
              GATEWAY_HEALTH_URL: http://localhost:8642
              AGENTMEMORY_URL: http://agentmemory.datasci:3111
              AGENTMEMORY_PROJECT: hermes
              AGENTMEMORY_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: hermes
                    key: AGENTMEMORY_SECRET
            envFrom:
              - secretRef:
                  name: hermes
            resources:
              requests:
                cpu: 500m
              # Absorbs the dashboard, which had its own 1Gi limit before it
              # moved in here.
              limits:
                memory: 3Gi
            ports:
              - name: http
                containerPort: 8642
                protocol: TCP
              - name: dashboard
                containerPort: 9119
                protocol: TCP
              - name: codeserver
                containerPort: 12321
                protocol: TCP
          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.132.0@sha256:b88ed46a6ace76a0294a17a24f39aa88032ed0a3692c3d8ab5433b47ab57ccbf
            args:
              - --auth
              - none
              - --user-data-dir
              - /home/node/.vscode
              - --extensions-dir
              - /home/node/.vscode
              - --port
              - "12321"
              # Open the agent's workspace (hermes' own terminal.cwd), not
              # /opt/data. This IDE runs --auth none behind an internal-only
              # ingress, so opening hermes' home would put .env -- which holds
              # DISCORD_BOT_TOKEN -- one click away for anyone on the LAN.
              # File modes still deny it, but there is no reason to point the
              # editor at the secret in the first place.
              - /opt/data/workspace
            env:
              TZ: "${TIMEZONE}"
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8642
          codeserver:
            port: 12321
      dashboard:
        controller: *app
        ports:
          http:
            port: 9119
    ingress:
      app:
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Data Science
          gethomepage.dev/name: Hermes
          gethomepage.dev/icon: mdi-robot
          gethomepage.dev/description: Hermes agent gateway
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
        hosts:
          - host: "{{ .Release.Name }}.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: dashboard
                  port: http
      code:
        className: internal
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
        hosts:
          - host: "{{ .Release.Name }}-code.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: codeserver
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /opt/data
      configmap:
        type: configMap
        name: hermes-config
        defaultMode: 0755
        globalMounts:
          - path: /tmp/config.yaml
            subPath: config.yaml
      plugin:
        type: configMap
        name: hermes-agentmemory-plugin
        globalMounts:
          - path: /tmp/agentmemory-plugin
