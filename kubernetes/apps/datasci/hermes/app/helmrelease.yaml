---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hermes
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                cp /tmp/config.yaml /opt/data/config.yaml
                chown 10000:10000 /opt/data/config.yaml
                PLUGIN_DIR=/opt/data/plugins/agentmemory
                mkdir -p "$PLUGIN_DIR"
                cp /tmp/agentmemory-plugin/plugin.yaml "$PLUGIN_DIR/plugin.yaml"
                cp /tmp/agentmemory-plugin/__init__.py "$PLUGIN_DIR/__init__.py"
                chown -R 10000:10000 /opt/data/plugins
        containers:
          app:
            image: &image
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e
            # The gateway is NOT started here. entrypoint-dispatch.sh execs
            # s6-overlay's /init with main-wrapper.sh as the "main program",
            # and s6's cont-init already brings up a supervised gateway:
            #   reconcile: profile=default prior_state=running action=started
            # So args only decide what runs in the *foreground*. Per
            # main-wrapper.sh's own routing:
            #   no args                       -> exec `hermes` (interactive CLI)
            #   first arg is an executable    -> exec it directly (sleep, ...)
            #   first arg is anything else    -> exec `hermes <args>`
            # `gateway run --no-supervise` (the original) started a second
            # gateway, which the binary refuses outright. No args at all ran
            # the interactive CLI, which exits immediately with
            # "Input is not a terminal (fd=0)". Both crashlooped the container.
            # A blocking no-op is the correct main program here: s6 owns the
            # gateway's lifecycle and its output still reaches kubectl logs.
            args: ["sleep", "infinity"]
            env:
              HERMES_HOME: /opt/data
              HOME: /opt/data
              TZ: "${TIMEZONE}"
              AGENTMEMORY_URL: http://agentmemory.datasci:3111
              AGENTMEMORY_PROJECT: hermes
              AGENTMEMORY_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: hermes
                    key: AGENTMEMORY_SECRET
            envFrom:
              - secretRef:
                  name: hermes
            resources:
              requests:
                cpu: 500m
              limits:
                memory: 2Gi
            ports:
              - name: http
                containerPort: 8642
                protocol: TCP
              - name: codeserver
                containerPort: 12321
                protocol: TCP
          dashboard:
            image: *image
            args:
              - dashboard
              - --host
              - "0.0.0.0"
            env:
              TZ: "${TIMEZONE}"
              GATEWAY_HEALTH_URL: http://localhost:8642
            # The dashboard reads config.yaml too, so it needs the same secret
            # as the app container -- without this it cannot expand the
            # password-hash variable and the auth gate stays unregistered.
            envFrom:
              - secretRef:
                  name: hermes
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 1Gi
            ports:
              - name: http
                containerPort: 9119
                protocol: TCP
          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.132.0@sha256:b88ed46a6ace76a0294a17a24f39aa88032ed0a3692c3d8ab5433b47ab57ccbf
            args:
              - --auth
              - none
              - --user-data-dir
              - /home/node/.vscode
              - --extensions-dir
              - /home/node/.vscode
              - --port
              - "12321"
              - /opt/data
            env:
              TZ: "${TIMEZONE}"
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8642
          codeserver:
            port: 12321
      dashboard:
        controller: *app
        ports:
          http:
            port: 9119
    ingress:
      app:
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Data Science
          gethomepage.dev/name: Hermes
          gethomepage.dev/icon: mdi-robot
          gethomepage.dev/description: Hermes agent gateway
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
        hosts:
          - host: "{{ .Release.Name }}.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: dashboard
                  port: http
      code:
        className: internal
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
        hosts:
          - host: "{{ .Release.Name }}-code.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: codeserver
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          - path: /opt/data
      configmap:
        type: configMap
        name: hermes-config
        defaultMode: 0755
        globalMounts:
          - path: /tmp/config.yaml
            subPath: config.yaml
      plugin:
        type: configMap
        name: hermes-agentmemory-plugin
        globalMounts:
          - path: /tmp/agentmemory-plugin
