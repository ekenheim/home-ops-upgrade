---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# A Jupyter kernel runs as root with passwordless sudo.
# The OIDC SecurityPolicy only guards the HTTPRoute; without this any pod, or
# any tailnet device (the Tailscale connector advertises the pod CIDR), could
# call the pod directly and skip the sign-in. Ingress: envoy-internal only
# (kubelet probes from the node are allowed by Cilium regardless). Egress
# stays open.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: jupyter-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: jupyter-notebook
      app.kubernetes.io/controller: main
  enableDefaultDeny:
    ingress: true
    egress: false
  ingress:
    # With kube-proxy replacement the policy sees the backend port.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
    # Pods in datasci may still connect, on any port: a Spark driver in a
    # notebook takes executor callbacks, and Ray/Dask clients may too.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: datasci
