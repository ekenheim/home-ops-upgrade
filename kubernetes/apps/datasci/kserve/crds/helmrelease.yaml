---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# The chart ships its CRDs as ordinary templates (not under crds/), so Helm
# upgrades them with every chart bump; no crds: CreateReplace needed.
# Uninstalling this release deletes the CRDs and every InferenceService with
# them. Keep it on the same version as ../app (Renovate group "KServe").
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kserve-crd
spec:
  interval: 30m
  chart:
    spec:
      chart: kserve-crd
      version: v0.21.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: kserve
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
