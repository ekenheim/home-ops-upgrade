  # The agentic coding loop: dispatch grooms GitHub issues into a queue, the
  # bridge CronJob turns claimed ones into foreman Workload CRs, and foreman
  # runs coder -> gate -> reviewer and opens the PR.
  #
  # Enabled 2026-08-22, once these Bitwarden Secrets Manager items existed:
  #   `github_token`  GITHUB_TOKEN -- the one agent PAT. Commits, PRs and issue
  #                   labels all come from this identity, on EVERY repo the loop
  #                   is pointed at, so scope it deliberately.
  #   `dispatch`      DISPATCH_AGENT_TOKEN (shared with the bridge -- one field
  #                   on purpose, two values means every tick 401s),
  #                   DISPATCH_AUTH_USERNAME / _PASSWORD, LITELLM_API_KEY.
  #   `foreman`       LITELLM_API_KEY, separate from dispatch's so either can be
  #                   revoked alone.
  #
  # foreman stands alone (it idles with no Workloads); dispatch additionally
  # needs the `dispatch` Postgres user, which is declared alongside this in
  # apps/database/crunchy-postgres/cluster/cluster.yaml -- it was commented out
  # there, so enabling dispatch without it leaves dispatch-db-secret unable to
  # render (postgres-pguser-dispatch does not exist) and the chart's
  # `prisma migrate deploy` pre-upgrade hook failing the HelmRelease.
  - ./foreman/ks.yaml
  - ./dispatch/ks.yaml
  - ./agentmemory/ks.yaml
  - ./hermes/ks.yaml
  - ./toolhive/ks.yaml
  - ./searxng/ks.yaml
  - ./jupyter-lab/ks.yaml
  - ./marimo/ks.yaml
  - ./qdrant/ks.yaml
  - ./falkordb/ks.yaml
  #- ./flyte/ks.yaml
  - ./label-studio/ks.yaml
  - ./bandit-demo/ks.yaml
  - ./banditweb/ks.yaml
  - ./seldon-core/ks.yaml
  - ./kubeflow/ks.yaml
  - ./kyverno-fixes/ks.yaml
  - ./kubeflow-secrets/ks.yaml
