  # uncomment ./foreman/ks.yaml and ./dispatch/ks.yaml below:
  #
  #   item `github-agents`
  #     GITHUB_TOKEN            PAT the coder pushes branches with and the
  #                             reviewer opens PRs with, and dispatch writes
  #                             issue labels with. Classic PAT needs `repo` +
  #                             `workflow`; fine-grained needs Contents and
  #                             Pull requests read/write on every repo the loop
  #                             is pointed at.
  #   item `dispatch`
  #     DISPATCH_AGENT_TOKEN    bearer token for dispatch's agent API; any long
  #                             random string. Shared by dispatch and the bridge.
  #     DISPATCH_AUTH_USERNAME  operator UI Basic Auth username.
  #     DISPATCH_AUTH_PASSWORD  operator UI Basic Auth password.
  #
  # ./foreman/ks.yaml stands alone (it just idles with no Workloads); dispatch
  # additionally needs the `dispatch` Postgres user, which is already declared in
  # apps/database/crunchy-postgres/cluster/cluster.yaml.
