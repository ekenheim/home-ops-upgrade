---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-configmap
data:
  config.yaml: |
    model_list:
      # --- Self-hosted via ollama-igpu (OpenAI-compatible /v1) ---
      # Model names here MUST exist in ollama-igpu -- litellm does not pull them,
      # so a name that is merely plausible 404s at request time rather than
      # failing at startup. Check with:
      #   kubectl -n datasci exec deploy/ollama-igpu -- ollama list
      # Currently pulled: qwen3.5:latest, gemma4:e4b, all-minilm:latest.
      # This previously pointed at llama3.1, which was never pulled.
      #
      # INTERIM: these run on the masters' Intel iGPUs. Once worker4 (Strix Halo)
      # serves via LLMKube, repoint api_base at that InferenceService.
      - model_name: self-hosted
        model_info:
          mode: chat
          supports_function_calling: true
        litellm_params:
          model: openai/qwen3.5:latest
          api_base: http://ollama-igpu.datasci:11434/v1
          api_key: ollama

      # `review` is the alias agentmemory points ANTHROPIC_MODEL at.
      - model_name: review
        model_info:
          mode: chat
          supports_function_calling: true
        litellm_params:
          model: openai/qwen3.5:latest
          api_base: http://ollama-igpu.datasci:11434/v1
          api_key: ollama

      - model_name: all-minilm
        model_info:
          mode: embedding
        litellm_params:
          model: openai/all-minilm
          api_base: http://ollama-igpu.datasci:11434/v1
          api_key: ollama

      # --- Cloud providers (placeholders) ---
      # Add the matching keys to the `litellm` Bitwarden item + externalsecret,
      # then uncomment. See jory's repo for the full reference set.
      # - model_name: MiniMax
      #   model_info:
      #     mode: messages
      #     supports_function_calling: true
      #     supports_vision: true
      #   litellm_params:
      #     model: minimax/MiniMax-M3
      #     api_base: https://api.minimax.io/anthropic/v1/messages
      #     api_key: os.environ/MINIMAX_API_KEY

    general_settings:
      health_check_endpoint: /v1/health

    router_settings:
      enable_pre_call_checks: true
      fallbacks:
        - review: ["self-hosted"]

    litellm_settings:
      drop_params: true
      request_timeout: 600
      num_retries: 2
      set_verbose: false
