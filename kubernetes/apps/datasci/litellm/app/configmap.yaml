---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-configmap
data:
  config.yaml: |
    model_list:
      # --- Chat: LLMKube on worker4's Strix Halo iGPU ---
      # Ornith-1.0-35B (MoE, ~3B of 35B active), served by llama.cpp/ROCm.
      # Replaced Qwen3.6-35B-A3B, which is the same architecture and size but
      # weaker on every agentic-coding benchmark -- see ornith-35b.yaml.
      #
      # Throughput measured on this endpoint 2026-08-14, immediately after the
      # Ornith rollout (llama.cpp build 0b1bad14f, gfx1151, rocm-6.4.4):
      #   50.5 t/s generation, three consecutive runs, variance under 0.1
      #   34 GiB GTT of 124 GiB with contextSize 1048576 across 8 slots
      #
      # That lands on kyuz0's public Strix Halo reference of 50.3 t/s for this
      # model class, quant and backend, i.e. this node performs as expected.
      #   https://kyuz0.github.io/amd-strix-halo-toolboxes/
      #
      # Worth recording because the *predecessor* served only ~24-28 t/s when
      # measured on a pod that had been up 46 hours, and that was briefly
      # mistaken for a hardware deficit. It was not: identical architecture,
      # identical quant, identical serving config, roughly double the
      # throughput on a fresh pod. The degradation tracks pod uptime, not the
      # model. If this endpoint drifts back toward the mid-20s, restart it
      # before investigating anything else.
      #
      # One lever remains untaken and is independent of model choice: MTP
      # self-speculative decoding is off because unsloth ships no MTP build of
      # these weights. Documented in ornith-35b.yaml, along with why the
      # faster-looking vulkan backends are NOT the win they appear to be.
      #
      # The served id must match the InferenceService's --alias. Verify with:
      #   curl http://ornith-35b.datasci:8080/v1/models
      # litellm does not validate this at startup; a wrong name 404s per request
      # while the proxy still reports healthy.
      #
      # NOTE this is a *reasoning* model: it emits reasoning_content and burns
      # output tokens thinking before answering. Callers with a tight max_tokens
      # get an empty content and finish_reason=length. drop_params below keeps
      # litellm from choking on the extra field.
      # max_input_tokens is the InferenceService's *per-slot* window
      # (contextSize / parallelSlots), not the total KV budget. openai/<custom>
      # is absent from litellm's cost map, so without this litellm has no idea
      # how big the window is and enable_pre_call_checks below is inert -- it
      # forwards a doomed request and surfaces the backend's 400 instead of
      # catching it. Note hermes does NOT learn the window from this: it reads
      # /v1/models, which returns bare ids. Set model.context_length in the
      # hermes ConfigMap too, and move all three with contextSize.
      - model_name: self-hosted
        model_info:
          mode: chat
          supports_function_calling: true
          supports_vision: true
          max_input_tokens: 131072
        litellm_params:
          model: openai/ornith-35b
          api_base: http://ornith-35b.datasci:8080/v1
          api_key: none

      # `review` is the alias agentmemory points ANTHROPIC_MODEL at.
      - model_name: review
        model_info:
          mode: chat
          supports_function_calling: true
          supports_vision: true
          max_input_tokens: 131072
        litellm_params:
          model: openai/ornith-35b
          api_base: http://ornith-35b.datasci:8080/v1
          api_key: none

      # `fast` is the same backend as `self-hosted` with thinking switched off.
      #
      # Ornith is a reasoning model -- its chat template opens the assistant
      # turn with a <think> block -- so it burns output budget thinking before
      # it answers. For mechanical work (translation, extraction,
      # classification) that is pure overhead. Measured on this cluster on the
      # predecessor, same prompt and same weights, translating one line to
      # Swedish:
      #
      #   self-hosted (thinking on)   7.9s   300 completion tokens
      #   fast        (thinking off)  0.4s     7 completion tokens
      #
      # Identical output ("Han är bakom dig."). ~20x faster for 43x fewer tokens.
      #
      # chat_template_kwargs is a server-side default here, so callers need not
      # send anything -- point them at `fast` and they get the non-thinking path.
      # It survives `drop_params: true` (verified) and reaches llama.cpp because
      # the InferenceService runs with `jinja: true`.
      #
      # Use `self-hosted`/`review` when the reasoning is the point; use `fast`
      # for bulk throughput.
      - model_name: fast
        model_info:
          mode: chat
          supports_function_calling: true
          supports_vision: true
          max_input_tokens: 131072
        litellm_params:
          model: openai/ornith-35b
          api_base: http://ornith-35b.datasci:8080/v1
          api_key: none
          chat_template_kwargs:
            enable_thinking: false

      # `deep` is the OTHER model on worker4 -- Qwen3.8-27B, dense, served by a
      # second llama.cpp pod sharing the same iGPU. See qwen38-27b.yaml.
      #
      # This is the slow-and-smarter endpoint, and the speed difference is not
      # marginal: ~12 t/s here against ornith-35b's measured 50.5, because a
      # dense model reads its entire 16.7 GiB per generated token while
      # ornith reads only its routed experts. Both numbers degrade further if
      # the two are generating at once -- they share one LPDDR5X pool.
      #
      # So route by task, not by preference:
      #   deep         cron jobs, hard one-shots, second-opinion review of
      #                ornith's output -- anywhere a 90s answer is fine
      #   self-hosted  interactive/agentic turns (hermes, foreman coder)
      #   fast         bulk mechanical work (Lingarr translation)
      #
      # Qwen3.8 beats Ornith on the published agentic-coding benchmarks
      # (Terminal Bench 2.1 73.0 vs 64.2, SWE-bench Pro 61.7 vs 50.4), though
      # those runs use different harnesses and are not apples-to-apples.
      #
      # NOTHING IN THIS REPO POINTS HERE YET, deliberately -- it is available
      # in Open WebUI's model picker and to anything you aim at it by hand. To
      # move the reviewer workloads over, change `model:` and `api_base:` on
      # the `review` block above to this backend; agentmemory
      # (ANTHROPIC_MODEL=review) and foreman's reviewer Agent both follow that
      # alias, and the router fallback below already catches an outage. Verify
      # tool calling on the live endpoint first -- see qwen38-27b.yaml.
      #
      # max_input_tokens is the per-slot window (contextSize 524288 /
      # parallelSlots 2) and is DELIBERATELY not the 131072 the ornith aliases
      # advertise. `deep` runs Qwen3.8-27B at its full native 262144 -- gguf
      # `qwen35.context_length = 262144`, no rope_scaling -- because the jobs
      # routed here are the ones that want the whole window and can wait.
      #
      # ornith is also a 262144-native model and is also running at half, but
      # raising it costs ~13 GiB of shared GTT across its 8 slots and its
      # consumers are latency-sensitive, so it stays at 131072 for now.
      #
      # Consequence: the two backends no longer share one context number. Do
      # not "tidy" these to match. Anything that hardcodes a window per
      # endpoint (hermes' model.context_length, currently 131072 for its
      # default self-hosted model) has to name which alias it means.
      - model_name: deep
        model_info:
          mode: chat
          supports_function_calling: true
          supports_vision: true
          max_input_tokens: 262144
        litellm_params:
          model: openai/qwen38-27b
          api_base: http://qwen38-27b.datasci:8080/v1
          api_key: none

      # --- Embeddings: still ollama-igpu on the Intel masters ---
      # Deliberately NOT moved. The Strix InferenceService reports capabilities
      # ["completion","multimodal"] -- it does not serve embeddings, and
      # agentmemory depends on this (OPENAI_EMBEDDING_MODEL=all-minilm, 384
      # dimensions). Moving it would need a separate embedding InferenceService.
      - model_name: all-minilm
        model_info:
          mode: embedding
        litellm_params:
          model: openai/all-minilm
          api_base: http://ollama-igpu.datasci:11434/v1
          api_key: ollama

      # --- Cloud providers (placeholders) ---
      # Add the matching keys to the `litellm` Bitwarden item + externalsecret,
      # then uncomment. See jory's repo for the full reference set.
      # - model_name: MiniMax
      #   model_info:
      #     mode: messages
      #     supports_function_calling: true
      #     supports_vision: true
      #   litellm_params:
      #     model: minimax/MiniMax-M3
      #     api_base: https://api.minimax.io/anthropic/v1/messages
      #     api_key: os.environ/MINIMAX_API_KEY

    general_settings:
      health_check_endpoint: /v1/health
      # Store prompt and completion bodies in LiteLLM_SpendLogs.messages /
      # .response so the admin UI's Logs view can show request + response.
      # Off by default: without it litellm redacts every prompt-carrying field
      # before the row is written, and the UI renders "Request/Response Data
      # Not Available". Read from general_settings -- see
      # get_store_prompts_in_spend_logs() in spend_tracking_utils.py.
      #
      # Only affects requests made after this lands; existing rows stay empty.
      #
      # Note this writes full subtitle text (and every other caller's prompts)
      # into the shared postgres cluster. If that grows uncomfortably, cap it
      # with -- these delete whole spend rows, not just the bodies, so they
      # trade history for space:
      #   maximum_spend_logs_retention_period: "30d"
      #   maximum_spend_logs_retention_interval: "24h"
      store_prompts_in_spend_logs: true

    router_settings:
      enable_pre_call_checks: true
      fallbacks:
        - review: ["self-hosted"]
        # Both models live on the same node and the same GPU, so this covers
        # one pod being down or mid-rollout -- NOT the node being down. Note it
        # silently swaps a slower, stronger model for a faster, weaker one:
        # the caller gets an answer rather than an error, but not the answer it
        # asked for. Acceptable for cron work; check the litellm logs before
        # concluding `deep` produced a given output.
        - deep: ["self-hosted"]

    litellm_settings:
      drop_params: true
      # WHOLE-CALL BUDGET, and it multiplies by num_retries.
      #
      # The real ceiling litellm imposes is request_timeout * (1 + num_retries),
      # because a timed-out attempt is itself a retryable error. That product is
      # the number hermes' `stale_timeout_seconds` has to sit above -- see the
      # long comment in the hermes ConfigMap. At 600 * 3 = 1800 it did not, so
      # hermes' watchdog fired at 900s mid-retry and killed a PyMC Teacher run
      # 2h42m in (2026-08-19). Change either value and re-check that pairing.
      #
      # 1800 per attempt is sized for the slowest real request: `deep`
      # (Qwen3.8-27B dense, ~8-9 t/s) answering with a long reasoning block on
      # top of prompt processing for a six-figure context. streaming.enabled is
      # false in hermes, so nothing comes back until the whole answer is done.
      #
      # num_retries dropped 2 -> 1 deliberately. Retries earn their keep against
      # the fast connection-error class (worker4 rebooting mid-call, which is
      # what killed the 12:00 run the same day); one is enough for that. Keeping
      # 2 here would push the product to 5400s and force a 90-minute watchdog,
      # which is far too long to notice a genuinely dead connection.
      request_timeout: 1800
      num_retries: 1
      set_verbose: false
