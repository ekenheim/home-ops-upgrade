---
# yaml-language-server: $schema=https://kubernetes-schemas.minuette.horse/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app litellm
  namespace: flux-system
spec:
  path: ./kubernetes/apps/datasci/litellm/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: datasci
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  dependsOn:
    - name: external-secrets-stores
    # litellm-chatgpt-auth is a ceph-block PVC (pvc.yaml). Without this the
    # Kustomization can reconcile before the storage class exists.
    - name: rook-ceph-cluster
    # general_settings.coordination_redis points at db 3 on this instance.
    - name: dragonfly-cluster
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
