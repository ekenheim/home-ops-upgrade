---
# Qwen3.6-35B-A3B on worker4's Strix Halo iGPU.
#
# Why this rather than a dense 27B/30B: Strix Halo is an iGPU on shared LPDDR5X
# at roughly 256 GB/s, an order of magnitude under a discrete card, so
# throughput tracks *active* bytes per token rather than model size. This is a
# Mixture-of-Experts (Qwen3_5MoeForConditionalGeneration) with ~3B of 35B params
# active per token, so it reads a fraction of its 22GB per token while a dense
# 27B reads all ~17GB. It ends up both larger and substantially faster here.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen3-35b-a3b
spec:
  source: hf://unsloth/Qwen3.6-35B-A3B-GGUF
  files:
    - Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
  # Vision projector -- the model is multimodal. F16 rather than F32: half the
  # size for no meaningful quality loss at Q4 weights.
  mmproj: mmproj-F16.gguf
  format: gguf
  quantization: UD-Q4_K_XL
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      vendor: amd
      # 99 = offload every layer. Unified memory means there is no host/device
      # copy to avoid, so partial offload only costs speed.
      layers: 99
      resourceClaims:
        - name: gpu
          resourceClaimTemplateName: llama-strix-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen3-35b-a3b
  labels:
    krr/ignore: "true"
spec:
  modelRef: qwen3-35b-a3b
  modelCache:
    claimName: llmkube-model-cache
  # Do NOT set skipModelInit here, despite the operator logging
  # MissingSkipModelInit and advising it. With it enabled the operator drops
  # the model-downloader init container and passes an empty --model:
  #   args: ["--model", "", ...]
  #   srv load_models: Loaded 0 cached model presets
  #   srv llama_server: starting server in router mode
  # llama.cpp then serves nothing -- /v1/models returns {"data":[]} -- while
  # the pod stays 1/1 Running and the InferenceService reports Ready, so the
  # breakage is invisible until a client gets "model not found".
  runtime: llamacpp
  # Purpose-built llama.cpp for Strix Halo. The stock runtime image does not
  # carry a ROCm build tuned for gfx1151.
  image: docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-6.4.4
  command:
    - llama-server
  replicas: 1
  # worker4 is the only node with an AMD GPU, and it is tainted as a dedicated
  # LLM node -- both are required or the pod cannot be placed.
  nodeSelector:
    topology.kubernetes.io/gpus: amd
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  # 65536 rather than the model's full ceiling: KV cache is unreclaimable GTT on
  # this UMA part, and over-allocating it is how the reference deployment
  # deadlocked its node. Raise once real usage is understood.
  # 2 slots was below llama.cpp's own default of 4 and is the real ceiling on
  # concurrency: each slot serves one request, so a third caller queued behind
  # two in-flight ones -- and a Lingarr batch occupies a slot for ~90s. With
  # several apps sharing this backend that reads as a multi-minute hang.
  #
  # contextSize is the total KV budget divided across slots, so it has to grow
  # with the slot count to keep a usable per-slot window: 131072/8 = 16384 each,
  # up from 65536/2 = 32768. Comfortably above Lingarr's ~1k-token batches.
  #
  # This stays far away from the GTT ceiling that deadlocked the reference
  # deployment. Measured on the live pod at contextSize 65536: 22.7 GiB of
  # 124 GiB GTT in use, of which the q8_0 KV cache is only ~1.7 GiB. Doubling
  # the context adds ~1.7 GiB, not tens.
  contextSize: 131072
  parallelSlots: 8
  # Restarting the server drops in-flight requests. waitForIdle holds the
  # pod-template update until llama.cpp reports its slots idle, so a rollout
  # does not kill a translation batch mid-flight.
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 600
  flashAttention: true
  jinja: true
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  batchSize: 2048
  uBatchSize: 512
  resources:
    cpu: "500m"
    memory: 32Gi
  endpoint:
    port: 8080
    type: ClusterIP
  extraArgs:
    - --alias
    - qwen3-35b-a3b
    - --cont-batching
