---
# Qwen3.8-27B -- the "slow but smarter" endpoint on worker4, co-resident with
# ornith-35b. Reached through litellm's `deep` alias.
#
# Evaluated 2026-08-14 and deliberately NOT made the default; deployed
# alongside the default on 2026-08-17 once the GPU was shown to be shareable.
# Read the two sections below in that order -- the first is why this is not
# the daily driver, the second is why it is nonetheless worth running.
#
# WHY THIS IS NOT THE DEFAULT
#
# Qwen3.8's published numbers are a large jump over Qwen3.6 in the same
# parameter class (TerminalBench 63.4 -> 73.0, SWE-bench Pro 53.5 -> 61.7), and
# the obvious read is "swap the daily driver". That read ignores what actually
# limits this node.
#
# The 3.8 generation ships no MoE in the 30B class -- it is either this dense
# 27B or Qwen3.8-2.4T-A95B, which is far out of reach here. (Re-confirmed
# 2026-08-17 against ollama's library: all 12 qwen3.8 tags are the same dense
# 27B; there is no a3b-style entry.) So "move to 3.8" necessarily means "move
# from a sparse model to a dense one", and this box is memory-bandwidth-bound,
# not capacity-bound:
#
#   incumbent  Ornith-1.0-35B UD-Q4_K_XL   ~21 GiB file, ~3B of 35B active
#              -> only the routed experts are read per token
#   this model Qwen3.8-27B    UD-Q4_K_XL   17.9 GB file, dense
#              -> the ENTIRE file is read per generated token
#
# Measured on worker4 (llama-bench, build 0b1bad14f, ROCm, gfx1151, -fa 1) on
# Qwen3.6-35B-A3B, which the incumbent Ornith-1.0-35B is architecturally
# identical to, so the figures carry over:
#                pp512 762 t/s   tg128 33.8 t/s
# and through the live server with this repo's serving config, 50.5 t/s.
#
# The dense penalty is not a projection. kyuz0's public Strix Halo table runs
# both shapes on this same silicon, and across five dense Q4-Q8 models from
# 13.5B to 30.7B the effective memory bandwidth is a tight 184-217 GiB/s --
# generation speed is simply that number divided by the file size. Directly
# comparable entries:
#
#   Qwen3.6-27B-UD-Q8_K_XL      dense  33.3 GiB   ->   6.4 t/s
#   gemma-4-31B-it-UD-Q4_K_XL   dense  17.5 GiB   ->  10.6 t/s
#   Qwen3.6-35B-A3B-UD-Q4_K_XL  MoE    21.3 GiB   ->  51.1 t/s
#
# Qwen3.8-27B UD-Q4_K_XL is 16.7 GiB dense, which puts it at ~11-13 t/s before
# speculation -- consistent with gemma-4-31B at nearly the same file size, and
# with third-party Strix reports of 10.5 t/s at Q5 and 7.5 t/s at Q8.
#
# MTP does not rescue it, because MTP helps a sparse model too. Same source,
# same harness, self-speculative decoding at n-max 3:
#   dense Qwen3.6-27B   6.4 -> 13.7 t/s  (2.14x)
#   MoE   35B-A3B      51.1 -> 70.3 t/s  (1.38x)
# So the honest ceiling is ~25 t/s for a dense 3.8 against ~70 t/s for a
# sparse 35B-A3B. Speculation widens the absolute gap rather than closing it.
#
# The latency-sensitive consumers make that trade a bad one: `fast` is bulk
# translation (Lingarr) where throughput IS the product, and `self-hosted` is
# Hermes, whose agentic loop carries ~28k tokens of prompt before it does any
# work. Those stay on ornith-35b.
#
# WHY IT IS WORTH RUNNING ANYWAY
#
# Because the two constraints are different. Speed is the constraint on the
# chatty, agentic, per-turn work; it is not the constraint on a nightly cron
# job or a hard one-shot question, where the answer arriving in 90s instead of
# 15s costs nothing and being right matters. The benchmark gap is real even
# after discounting it for harness differences (Ornith's SWE-Pro number is
# under OpenHands, Qwen3.8's under Claude Code, so the table is not
# apples-to-apples):
#
#   benchmark            Ornith-1.0-35B   Qwen3.8-27B
#   Terminal Bench 2.1             64.2          73.0
#   SWE-bench Pro                  50.4          61.7
#   NL2Repo                        34.6          42.3
#
# Under identical evaluation against its own predecessor the jump is
# generational rather than a refresh: DeepSWE 13.3 -> 42.2, OSWorld
# 63.9 -> 84.3, LiveCodeBench 83.9 -> 90.3.
#
# So this serves `deep`: cron work, hard one-shots, and second-opinion review
# of ornith's output. It is idle most of the time, which is what makes
# co-residency cheap -- see "WHY BOTH FIT" below.
#
# WHY UD-Q4_K_XL AND NOT Q6/Q8
#
# The common advice for a 128GB box is to size the quant up because there is
# headroom (UD-Q5_K_XL is 20.2GB, UD-Q8_K_XL far more). That optimises the
# wrong axis twice over. Capacity is not the constraint, bytes-read-per-token
# is, and on a dense model every extra byte is paid on every token -- the same
# reference set that gives 10.5 t/s at Q5 gives 7.5 t/s at Q8. And now that
# the GPU is shared, the quant also sets how much of a 124 GiB pool this model
# takes away from ornith-35b permanently, awake or not. Q4_K_XL also matches
# the incumbent's quant level, which keeps any A/B against it honest.
#
# WHY BOTH FIT
#
# The GPU is shared through a single long-lived ResourceClaim rather than a
# per-pod template; the mechanism and its caveats are in resourceclaim.yaml.
# The budget, measured rather than projected:
#
#   ornith-35b   live 2026-08-17                        34.9 GiB
#   this model   16.7 weights + ~0.9 mmproj + ~9 KV     ~27   GiB
#   -------------------------------------------------------------
#   total                                               ~62   GiB of 124 GiB
#
# The KV figure comes from the architecture, not a guess. config.json is 64
# layers on a 3:1 linear-to-full attention interleave, so only 16 layers carry
# a cache that grows with context, at num_key_value_heads 4 x head_dim 256:
#   2 (K+V) x 4 x 256 x 16 layers = 32768 B/token at q8_0, ~34 KB/token
#   x 262144 tokens = ~8.5 GiB
# The linear layers hold a fixed-size recurrent state per slot instead (~150
# MB/slot across 48 layers), which is why context is cheap here relative to a
# fully-quadratic model.
#
# VERIFY that estimate on the first rollout rather than trusting it, because
# over-allocating GTT deadlocks the node instead of OOM-killing a pod:
#   kubectl -n datasci exec deploy/qwen38-27b -- \
#     cat /sys/class/drm/card0/device/mem_info_gtt_used
# (that path is the whole device, so read it with both pods up and compare
# against the 34.9 GiB ornith-only baseline).
#
# WHY prefetch IS OFF
#
# prefetch: true is the documented way to pull weights into the shared cache
# ahead of serving. It does not work here, for two independent reasons:
#
#   1. The chart's ClusterRole grants no `batch` rule, so the controller cannot
#      create Jobs at all. Fixed in rbac.yaml -- prefetch reaches "Downloading"
#      with that applied.
#   2. The prefetch Job's pod template carries no tolerations and no
#      nodeSelector, so it cannot schedule onto worker4:
#        0/5 nodes are available: 1 node(s) had untolerated taint(s),
#        4 node(s) didn't match PersistentVolume's node affinity
#      There is no way to express our taint through the API: the only knob,
#      spec.hardware.gpu.tolerationKey, is validated against
#      '^[a-z0-9.\-]+/[a-z0-9._\-]+$' and rejects a bare key like
#      "llm-workload".
#
# (2) is not fixable from this repo, so prefetch stays off and the ~18GB
# download happens in the InferenceService's init container, which DOES
# inherit its tolerations. /models had 371GB free at 21% use when this landed.
#
# NO MTP, FOR NOW
#
# config.json carries mtp_num_hidden_layers: 1 and ollama now publishes
# 27b-mtp-* tags, so unlike Ornith this model genuinely has a shipping MTP
# head -- and at the dense 2.14x it is the single biggest lever available
# here, worth roughly 12 t/s -> 25 t/s.
#
# It is still off because unsloth/Qwen3.8-27B-GGUF carries no MTP tensors (9
# UD- quants, two mmproj, nothing matching MTP or nextn), and the repos that
# do -- Jackrong/Qwen3.8-27B-MTP-GGUF, esatapedico/Qwen3.8-27B-NVFP4-MTP-GGUF
# -- are unvetted third-party requants. Same call as Ornith's.
#
# To enable once a trustworthy build exists, confirm the tensors are really
# there and then add the flags:
#   llama-gguf /models/<cacheKey>/Qwen3.8-27B-UD-Q4_K_XL.gguf r n | \
#     grep -icE "nextn|mtp"
#   -> non-zero, then append: --spec-type draft-mtp --spec-draft-n-max 3
# Note the reference 2.14x is single-stream. With parallelSlots 2 and a second
# model contending for the same bandwidth, expect less.
#
# VERIFY TOOL CALLING BEFORE POINTING ANYTHING AT THIS
#
# A bare /v1/models check is NOT sufficient -- llama.cpp's --jinja template
# parser fails per request, not at startup, so a bad chat template leaves the
# pod 1/1 Running and Ready while every tool call 400s. This bit us on Ornith.
#   curl -s http://qwen38-27b.datasci:8080/v1/chat/completions \
#     -H 'Content-Type: application/json' -d '{
#       "model":"qwen38-27b",
#       "messages":[{"role":"user","content":"What is the weather in Oslo?"}],
#       "tools":[{"type":"function","function":{"name":"get_weather",
#         "parameters":{"type":"object","properties":{"city":{"type":"string"}},
#         "required":["city"]}}}]}' | jq '.choices[0].finish_reason'
# Expect "tool_calls". A 400 mentioning the parser means the template is
# incompatible and `deep` must stay unrouted.
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: qwen38-27b
spec:
  source: hf://unsloth/Qwen3.8-27B-GGUF
  files:
    - Qwen3.8-27B-UD-Q4_K_XL.gguf
  # Multimodal, like the incumbent -- litellm advertises supports_vision on
  # this alias, so the projector has to be here.
  mmproj: mmproj-F16.gguf
  format: gguf
  quantization: UD-Q4_K_XL
  # See "WHY prefetch IS OFF". Turning this on creates a Job that never
  # schedules and never surfaces an error on the Model CR.
  prefetch: false
  hardware:
    accelerator: rocm
    gpu:
      enabled: true
      vendor: amd
      # 99 = offload every layer. Unified memory means there is no host/device
      # copy to avoid, so partial offload only costs speed.
      layers: 99
      resourceClaims:
        # The SAME claim ornith-35b names, by design -- that is what puts both
        # pods on gpu-0-128 instead of leaving this one Pending. Must be
        # resourceClaimName; a template would mint a second, conflicting claim.
        - name: gpu
          resourceClaimName: llama-strix-gpu
---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: qwen38-27b
  labels:
    krr/ignore: "true"
spec:
  modelRef: qwen38-27b
  modelCache:
    claimName: llmkube-model-cache
  # Both serving pods mount this one PVC. That is legal because its accessMode
  # is ReadWriteOnce, which is node-scoped, and both pods are pinned to
  # worker4 -- ReadWriteOncePod would forbid it, RWO does not.
  #
  # Do NOT set skipModelInit here, despite the operator logging
  # MissingSkipModelInit and advising it. With it enabled the operator drops
  # the model-downloader init container and passes an empty --model, and
  # llama.cpp serves nothing while the pod stays 1/1 Running and the
  # InferenceService reports Ready.
  runtime: llamacpp
  # Same purpose-built llama.cpp image as ornith-35b, and specifically NOT a
  # vulkan-radv variant despite it benchmarking ~20% faster. Vulkan on AMD
  # produces subtle numerical errors that degrade reasoning into incoherence
  # and break tool calls from ~70-80k context; our per-slot window is 131072,
  # inside that range, and the symptom is bad output rather than an error.
  # Full citation in ornith-35b.yaml.
  image: docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-6.4.4
  command:
    - llama-server
  # PARKED AT 0 -- 2026-08-19. This is a bisect, not a capacity decision.
  #
  # worker4 ran 6 days 10h 43m without incident on Ornith alone, then started
  # hard-crashing 11h after this model reached full size, and crashed four times
  # in the next 34h. Every boot of the node lines up:
  #
  #   08-14 19:52  Ornith replaces Qwen3.6-35B (#6377) -- one model, ~35 GiB GTT
  #   08-11 20:25 -> 08-18 07:07   6d10h uptime, zero crashes
  #   08-17 15:45  this model lands beside it (#6396)   -- ~62 GiB GTT
  #   08-17 19:53  contextSize doubled to 524288 (#6402) -- ~72 GiB GTT
  #   08-18 07:07  crash 1 (+11h14m).  Then 08-18 14:04, 08-19 11:19, 08-19 17:27.
  #
  # Heat, host RAM exhaustion and the GTT *ceiling* are all ruled out with data:
  # 70-72C flat, MemAvailable flat, and GTT peaks at 72.07 of 124 GiB (58%) --
  # sampled every 30s for 6.5h. What actually halves is host headroom:
  # MemAvailable ~62 GiB with one model vs ~26 GiB with two. GTT is pinned and
  # is not charged to the pod cgroup, so the kernel cannot OOM-kill its way out
  # and panics instead -- exactly what ornith-35b.yaml warns about ("over-
  # allocating GTT deadlocks the node instead of OOM-killing a pod"), and it
  # matches the signature: no precursor in any metric, then the box is gone.
  #
  # Scaling the Deployment does NOT hold -- the llmkube controller restores
  # spec.replicas from this CR within ~70s. It has to be parked here.
  #
  # While parked, litellm's `deep` alias has no backend and falls through to
  # `deep: ["self-hosted"]`, i.e. ornith. Callers get a weaker answer, not an
  # error; check litellm logs before attributing any output to `deep`.
  #
  # TO RESTORE: if worker4 survives 48h+ on Ornith alone the hypothesis holds,
  # and the way back is to cut contextSize to 262144 (recovers ~9.5 GiB) rather
  # than returning to 524288. If it crashes anyway, this model is exonerated --
  # set this to 1 and go after the panic itself with netconsole.
  replicas: 0
  # worker4 is the only node with an AMD GPU, and it is tainted as a dedicated
  # LLM node -- both are required or the pod cannot be placed.
  nodeSelector:
    topology.kubernetes.io/gpus: amd
  tolerations:
    - key: llm-workload
      operator: Exists
      effect: NoSchedule
  # 524288 / 2 = 262144 per slot, which is this model's FULL native window --
  # gguf metadata `qwen35.context_length = 262144`, and config.json carries no
  # rope_scaling, so 262144 is trained rather than extended. There is nothing
  # left to give: raising contextSize further would only add idle KV, and
  # asking a slot for more than 262144 would need RoPE scaling and cost
  # quality.
  #
  # This was 262144/2 = 131072 per slot, chosen to match ornith. Matching is no
  # longer the priority -- `deep` exists for the jobs where the answer matters
  # more than the latency, and those are exactly the jobs that want the whole
  # window. ornith stays at 131072 per slot (it is also a 262144-native model,
  # so it is likewise at half) because its 8 slots make the same change cost
  # ~13 GiB rather than ~9, and its consumers are latency-sensitive.
  #
  # litellm's `deep` alias advertises max_input_tokens: 262144 to match. The
  # two backends no longer share one number -- self-hosted/review/fast stay at
  # 131072, deep is 262144.
  #
  # 2 slots, not ornith's 8, on purpose. This endpoint serves cron jobs and
  # one-shot hard questions, not a fan-out of chatty agents, so concurrency is
  # not the requirement -- and every slot's KV is GTT taken from a pool now
  # shared with ornith-35b.
  #
  # COST, measured rather than projected. At 262144 total this pod held 27.1
  # GiB (62 GiB combined, of 124): 16.7 weights + ~0.9 mmproj + ~9.5 KV, i.e.
  # ~38 KB per token of context. Doubling the KV to 524288 tokens adds ~9.5
  # GiB, so expect ~36.6 GiB here and ~72 GiB combined, leaving ~52 GiB free.
  #
  # That per-token cost is 3-4x ornith's (~10 KB/token) and it is architectural,
  # not a mistake: this model runs 64 layers on a 3:1 linear-to-full interleave
  # (16 full-attention layers) at num_key_value_heads 4, against ornith's 40
  # layers / 10 full / 2 KV heads. Budget from this number, not from ornith's.
  contextSize: 524288
  parallelSlots: 2
  # Restarting the server drops in-flight requests, and a `deep` request can
  # run for minutes at ~12 t/s. Hold the pod-template update until llama.cpp
  # reports its slots idle.
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 600
  flashAttention: true
  jinja: true
  cacheTypeK: q8_0
  cacheTypeV: q8_0
  batchSize: 2048
  uBatchSize: 512
  resources:
    cpu: "500m"
    memory: 32Gi
  endpoint:
    port: 8080
    type: ClusterIP
  extraArgs:
    # Must match litellm's `model: openai/<id>` for the `deep` alias.
    - --alias
    - qwen38-27b
    - --cont-batching
