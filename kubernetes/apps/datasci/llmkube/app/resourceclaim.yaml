---
# GPU claim for InferenceServices running on worker4's Radeon 8060S.
#
# deviceClassName gpu.amd.com is created by the ROCm k8s-gpu-dra-driver
# (kube-system). Confirm the device is actually advertised before relying on
# this:
#   kubectl get resourceslices.resource.k8s.io
#   -> node=worker4 driver=gpu.amd.com devices=['gpu-0-128']
#
# allocationMode: All with adminAccess -- Strix Halo presents a single iGPU
# sharing system memory, so there is nothing to partition between workloads;
# a serving pod takes the whole device. Mirrors the upstream reference config
# for this hardware.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: llama-strix-gpu
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.amd.com
            adminAccess: true
            allocationMode: All
