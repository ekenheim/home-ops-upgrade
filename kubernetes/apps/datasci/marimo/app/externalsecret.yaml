---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name marimo-s3-creds
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Remapped to the standard AWS_* names so boto3 / s3fs / polars /
        # duckdb pick them up with no per-notebook wiring. Same Bitwarden
        # item as alphaos and hempriser — the LAN MinIO behind s3-lan.
        AWS_ACCESS_KEY_ID: "{{ .MINIO_ACCESS_KEY }}"
        AWS_SECRET_ACCESS_KEY: "{{ .MINIO_SECRET_KEY }}"
  dataFrom:
    - extract:
        key: hempriser-minio
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name marimo-litellm
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # marimo's OpenAI provider reads this env var as its key (config.py
        # for_openai -> os_key("OPENAI_API_KEY")), but the value is a LiteLLM
        # virtual key and the endpoint is litellm.llm:4000 -- nothing here ever
        # talks to api.openai.com. Reaching gpt-5.4 is LiteLLM's job, via the
        # `chatgpt` alias and the subscription credentials it already holds.
        #
        # Its OWN item, never litellm's LITELLM_MASTER_KEY: that field is the
        # proxy's admin credential, and hermes and agentmemory both moved off it
        # so one app's key rotation could not silently rotate the proxy's.
        OPENAI_API_KEY: '{{ .LITELLM_API_KEY }}'
  dataFrom:
    - extract:
        key: marimo
