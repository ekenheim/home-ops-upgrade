---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app marimo
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      annotations:
        # A second container is present (shutdown-guard); keep bare
        # `kubectl logs`/`exec` on the marimo process.
        kubectl.kubernetes.io/default-container: app
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      marimo:
        initContainers:
          seed-notebooks:
            image:
              repository: busybox
              tag: latest
            command:
              - /bin/sh
              - -c
              - |
                for f in /seed/*.py; do
                  dest="/home/marimo/$(basename $f)"
                  if [ ! -f "$dest" ]; then
                    echo "Seeding $dest"
                    cp "$f" "$dest"
                  fi
                done
                # marimo searches CWD upward for .marimo.toml before falling
                # back to $HOME, which is ephemeral. Seed only if absent so
                # settings changed in the UI are not clobbered on restart.
                if [ ! -f /home/marimo/.marimo.toml ]; then
                  echo "Seeding /home/marimo/.marimo.toml"
                  cp /seed/marimo.toml /home/marimo/.marimo.toml
                fi
        containers:
          app:
            image:
              repository: ghcr.io/marimo-team/marimo
              tag: 0.24.0
            command:
              - /bin/sh
              - -c
            args:
              - |
                # The published image ships no `mcp` extra and marimo refuses to
                # start with --mcp without it. site-packages is writable by uid
                # 1000, so install at startup rather than maintaining a custom
                # image for one dependency; UV_CACHE_DIR is on the PVC, so every
                # start after the first is a cache hit.
                #
                # Pin to the image's own marimo version so the constraint
                # (mcp>=1.0.0,<2) comes from marimo itself and cannot drift when
                # the image tag is bumped. A bare `mcp` resolves to 2.x, which
                # relocated mcp.server.fastmcp. marimo's DependencyManager.mcp
                # declares no version bounds, so has() still returns True and the
                # break only surfaces at boot as:
                #   ModuleNotFoundError: No module named 'mcp.server.fastmcp'
                uv pip install --system --quiet "marimo[mcp]==$(marimo --version)"

                # --token-password-file replaces --no-token. The same value gates
                #   the web UI (login form at /auth/login, then a 14-day cookie)
                #   and the MCP endpoint (Authorization: Bearer <token>). marimo
                #   .strip()s the file, so the Secret's trailing newline is fine.
                #   This is not merely a password: with an empty token
                #   AuthBackend grants every caller the read+edit scope, and
                #   "edit" is exactly what the MCP mount's RequiresEditMiddleware
                #   checks — so --no-token would publish execute_code to the LAN.
                # --sandbox gives each notebook its own uv venv, built from the
                #   PEP 723 `# /// script` block in the notebook itself.
                # --mcp code-mode mounts /mcp/server with list_sessions +
                #   execute_code so an agent can drive the live kernel
                #   scratchpad; bare --mcp would give the read-only "tools" set.
                #   Enabling --mcp also forces watch mode on and skew protection
                #   off (_server/start.py) — the latter is what otherwise 401s
                #   MCP calls with {"error":"Missing server token"}.
                # --mcp-allow-remote disables the MCP SDK's DNS-rebinding
                #   protection, which rejects the Host header from the ingress.
                #
                # exec so marimo replaces the shell and receives SIGTERM directly.
                exec marimo edit \
                  --host 0.0.0.0 \
                  --port 2718 \
                  --token-password-file /secrets/token \
                  --sandbox \
                  --mcp code-mode \
                  --mcp-allow-remote
            workingDir: /home/marimo
            env:
              TZ: ${TIMEZONE}
              # Sandbox venvs are ephemeral (tempfile.mkdtemp under /tmp) and are
              # rebuilt every session, so the uv cache must survive restarts or
              # every notebook re-downloads from PyPI.
              UV_CACHE_DIR: /home/marimo/.cache/uv
              # S3 endpoint for notebooks reading via boto3/s3fs/polars/duckdb.
              # Credentials come from envFrom below; sandboxed kernels inherit
              # them (ipc.py spawns with base_env=os.environ.copy()).
              # s3-lan fronts the primary MinIO (LoadBalancer 192.168.50.190);
              # same endpoint dagster and alphaos use.
              AWS_ENDPOINT_URL: http://s3-lan.${SECRET_DOMAIN}:9000
              AWS_REGION: us-east-1
            envFrom:
              - secretRef:
                  name: marimo-s3-creds
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                # One kernel process per open notebook, each with its own venv.
                memory: 8Gi

          # POST /api/kernel/shutdown tears down the whole uvicorn process --
          # not just one kernel -- whenever it cannot resolve a live session
          # for the request. In _server/api/endpoints/execution.py both a
          # missing Marimo-Session-Id header and a close_session() that
          # returns False (session already gone) fall through to
          # shutdown_server(). So a browser tab left open past its session
          # kills every other notebook on its way out; that is what happened
          # on 2026-08-19 20:23 UTC, and the process exits 0 with marimo's
          # normal goodbye banner, so it reads as a clean shutdown rather
          # than a crash.
          #
          # marimo exposes no flag to disable the endpoint and no server
          # config key covers it, and a `server-snippet` on the Ingress is
          # rejected by the admission webhook (snippets are Critical risk,
          # the internal controller allows only High). So the Ingress routes
          # that one exact path to this stub instead.
          #
          # Shutting down a single notebook still works from the home page:
          # that uses POST /api/home/shutdown_session, which only ever closes
          # the session it names. The in-notebook "Shut down" button now
          # no-ops -- it shows its shutdown screen while the kernel keeps
          # running.
          #
          # Same image as the app container so this pulls nothing extra.
          shutdown-guard:
            image:
              repository: ghcr.io/marimo-team/marimo
              tag: 0.24.0
            command:
              - python
              - -c
              - |
                from http.server import BaseHTTPRequestHandler, HTTPServer


                class Guard(BaseHTTPRequestHandler):
                    def do_POST(self):
                        self.send_response(204)
                        self.end_headers()

                    def log_message(self, *args):
                        pass


                HTTPServer(("0.0.0.0", 2719), Guard).serve_forever()
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi

    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 2718
          shutdown-guard:
            port: 2719

    ingress:
      app:
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Data Science
          gethomepage.dev/name: Marimo
          gethomepage.dev/icon: https://marimo.io/favicon.ico
          gethomepage.dev/description: Reactive Python notebook environment
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
        hosts:
          - host: &host marimo.${SECRET_DOMAIN}
            paths:
              # Exact match, so nginx emits `location = /api/kernel/shutdown`,
              # which wins over the `location /` below regardless of order.
              - path: /api/kernel/shutdown
                pathType: Exact
                service:
                  identifier: app
                  port: shutdown-guard
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host

    persistence:
      notebooks:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: marimo-notebooks
        globalMounts:
          - path: /home/marimo
      token:
        enabled: true
        type: secret
        name: marimo-token
        # advancedMounts, not globalMounts: only marimo itself needs the auth
        # token. shutdown-guard is a stdlib HTTP stub that never reads it.
        advancedMounts:
          marimo:
            app:
              - path: /secrets
                readOnly: true
      seed:
        enabled: true
        type: configMap
        name: marimo-seed-notebooks
        globalMounts:
          - path: /seed
            readOnly: true
      tmp:
        enabled: true
        type: emptyDir
        # Each --sandbox session builds its own uv venv under /tmp, and a
        # pymc + pymc-marketing + numba set weighs ~920Mi. At 20Gi the ceiling
        # was ~21 concurrent sessions; this gives room for a full collection of
        # notebooks to be open at once. Counts against node ephemeral storage.
        sizeLimit: 60Gi
        globalMounts:
          - path: /tmp
