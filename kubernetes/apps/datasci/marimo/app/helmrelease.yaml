---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app marimo
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      marimo:
        initContainers:
          seed-notebooks:
            image:
              repository: busybox
              tag: latest
            command:
              - /bin/sh
              - -c
              - |
                for f in /seed/*.py; do
                  dest="/home/marimo/$(basename $f)"
                  if [ ! -f "$dest" ]; then
                    echo "Seeding $dest"
                    cp "$f" "$dest"
                  fi
                done
                # marimo searches CWD upward for .marimo.toml before falling
                # back to $HOME, which is ephemeral. Seed only if absent so
                # settings changed in the UI are not clobbered on restart.
                if [ ! -f /home/marimo/.marimo.toml ]; then
                  echo "Seeding /home/marimo/.marimo.toml"
                  cp /seed/marimo.toml /home/marimo/.marimo.toml
                fi
        containers:
          app:
            image:
              repository: ghcr.io/marimo-team/marimo
              tag: 0.24.0
            command:
              - marimo
            args:
              - edit
              - --host
              - "0.0.0.0"
              - --port
              - "2718"
              - --no-token
              # Each notebook gets its own uv venv, built from the PEP 723
              # `# /// script` block in the notebook itself.
              - --sandbox
            workingDir: /home/marimo
            env:
              TZ: ${TIMEZONE}
              # Sandbox venvs are ephemeral (tempfile.mkdtemp under /tmp) and are
              # rebuilt every session, so the uv cache must survive restarts or
              # every notebook re-downloads from PyPI.
              UV_CACHE_DIR: /home/marimo/.cache/uv
              # S3 endpoint for notebooks reading via boto3/s3fs/polars/duckdb.
              # Credentials come from envFrom below; sandboxed kernels inherit
              # them (ipc.py spawns with base_env=os.environ.copy()).
              # s3-lan fronts the primary MinIO (LoadBalancer 192.168.50.190);
              # same endpoint dagster and alphaos use.
              AWS_ENDPOINT_URL: http://s3-lan.${SECRET_DOMAIN}:9000
              AWS_REGION: us-east-1
            envFrom:
              - secretRef:
                  name: marimo-s3-creds
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                # One kernel process per open notebook, each with its own venv.
                memory: 8Gi

    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 2718

    ingress:
      app:
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Data Science
          gethomepage.dev/name: Marimo
          gethomepage.dev/icon: https://marimo.io/favicon.ico
          gethomepage.dev/description: Reactive Python notebook environment
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
        hosts:
          - host: &host marimo.${SECRET_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host

    persistence:
      notebooks:
        enabled: true
        type: persistentVolumeClaim
        existingClaim: marimo-notebooks
        globalMounts:
          - path: /home/marimo
      seed:
        enabled: true
        type: configMap
        name: marimo-seed-notebooks
        globalMounts:
          - path: /seed
            readOnly: true
      tmp:
        enabled: true
        type: emptyDir
        sizeLimit: 20Gi
        globalMounts:
          - path: /tmp
