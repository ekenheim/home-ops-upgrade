# Seeded to /home/marimo/.marimo.toml by the seed-notebooks init container.
#
# It must live on the PVC: marimo's config search walks CWD (/home/marimo)
# upward before falling back to $HOME, and $HOME is the container's ephemeral
# filesystem, so anything written there is lost on every pod restart.
#
# marimo rewrites this file when settings change in the UI, so the init
# container only seeds it if absent.

[ai]
enabled = true

[ai.open_ai]
# The cluster LiteLLM proxy, not OpenAI. marimo routes any model id prefixed
# `openai/` through this block (AnyProviderConfig.for_openai), so the prefix is
# a marimo-internal provider selector and says nothing about who serves the
# weights -- everything below lands on worker4's iGPU via llmkube.
#
# The /v1 suffix is required: marimo passes base_url to the OpenAI SDK
# unmodified and the SDK appends only the route.
#
# That route is /responses, NOT /chat/completions. marimo's OpenAIProvider
# builds a pydantic-ai OpenAIResponsesModel (providers.py create_model), so
# every `openai/` id above goes out as an OpenAI Responses API call. LiteLLM
# bridges /v1/responses to each backend's chat endpoint -- verified 2026-09-02,
# all five aliases below answered 200 -- but the bridge is lossy; see the
# autocomplete note under [ai.models].
#
# Cluster-internal DNS on purpose. The ingress (litellm.$${SECRET_DOMAIN}) would
# work too but adds a TLS hop and a round trip out to the LAN for traffic that
# never leaves the cluster.
base_url = "http://litellm.llm:4000/v1"
# `api_key` is deliberately absent here. marimo's _get_key falls back to the
# OPENAI_API_KEY environment variable when the field is missing or empty, which
# keeps the credential out of this file (this file is a ConfigMap in git AND is
# rewritten in place by the marimo UI, so it is the wrong home for a secret).
#
# LiteLLM enforces auth on every route -- verified 2026-09-01, `no header`,
# `Bearer `, `Bearer anything` and `Bearer sk-1234` all return 401 on
# /v1/models -- so without a key the AI panel is dead. Note the failure is
# LOUD by design: `openai` is the one provider marimo marks require_key=True,
# so a missing key surfaces as "OpenAI API key not configured" rather than an
# opaque 401. That is why this uses `openai/` rather than an [ai.custom_providers]
# entry, which sets require_key=False and would fail silently.

[ai.models]
# Every id is a LiteLLM alias, not a model name -- see litellm's configmap.yaml.
# Picking the model is LiteLLM's job, not marimo's: marimo names an alias and
# LiteLLM decides which backend serves it.
#
#   self-hosted / review / fast  Ornith-1.0-35B on worker4's iGPU (llmkube)
#   deep                         nominally Qwen3.8-27B, see the warning below
#   chatgpt                      gpt-5.4 on the metered ChatGPT subscription
#
# `chatgpt` is the one alias here that is NOT free local compute -- it spends a
# human subscription shared with hermes and the codex CLI. LiteLLM deliberately
# keeps it out of every router fallback so nothing reaches it by accident, so
# it is safe to list: it is only ever used when picked by name in the UI.
chat_model = "openai/self-hosted"
edit_model = "openai/self-hosted"
# AI inline completion is disabled ([completion] copilot = false), so this is
# currently inert. It is still set to `fast` as the least-bad choice if it is
# ever re-enabled. The reason it is off:
#
# `fast` is `self-hosted`'s backend with chat_template_kwargs enable_thinking =
# false, which is what makes it answer without an Ornith <think> block. But
# LiteLLM's /v1/responses bridge DROPS chat_template_kwargs -- verified
# 2026-09-02, dropped even when the caller sends them explicitly in the request
# body -- and marimo only ever calls /v1/responses. So over this route `fast`
# thinks. Measured on the same completion prompt:
#
#   /v1/chat/completions   2.0s,  99 output tokens, no reasoning block
#   /v1/responses          8.4s, 460 output tokens, 1242 chars of reasoning
#
# 8.4s is not a completion that arrives between keystrokes. Re-enable when the
# bridge forwards chat_template_kwargs; do not "fix" it by picking a different
# alias, since all of them are the same reasoning weights.
autocomplete_model = "openai/fast"
# custom_models is what puts non-catalogue ids in the picker at all; marimo has
# no way to enumerate a LiteLLM proxy's aliases. displayed_models then narrows
# the picker to exactly these -- without it the `openai/` provider drags in
# marimo's whole built-in OpenAI catalogue, none of which this proxy serves.
#
# `deep` is deliberately absent from both lists. Its backend (qwen38-27b) is
# parked at replicas 0 -- `kubectl -n llm get inferenceservice` reports it
# Stopped -- and LiteLLM falls it back to self-hosted, so listing it would put
# a second entry in the picker that silently serves Ornith. Add it back when
# qwen38-27b is running.
custom_models = [
  "openai/self-hosted",
  "openai/fast",
  "openai/review",
  "openai/chatgpt",
]
displayed_models = [
  "openai/self-hosted",
  "openai/fast",
  "openai/review",
  "openai/chatgpt",
]

# [ai.ollama] is gone on purpose. It pointed at a workstation Ollama on a pinned
# DHCP lease (192.168.1.182:11434) and was later hand-edited in the UI to point
# at litellm instead -- which cannot work: marimo only skips the API key for a
# base_url containing 127.0.0.1:11434, so every request went out with the
# literal string "ollama-placeholder" as its bearer token and came back 401.

[completion]
activate_on_typing = true
auto_close_pairs = true
# `copilot = "custom"` is what activates ai.models.autocomplete_model; false
# leaves editor autocomplete alone and only turns off the AI inline completion.
# Off because every alias thinks over marimo's /v1/responses route -- see the
# autocomplete_model note above.
copilot = false
signature_hint_on_typing = false

[package_management]
# Must stay "uv". Under --sandbox only UvPackageManager implements
# update_notebook_script_metadata; the base class is an explicit no-op. With
# "pip", installing a package never writes it into the notebook's
# `# /// script` block, and since sandbox venvs are ephemeral the package
# disappears when the session restarts.
manager = "uv"

[display]
theme = "light"

[runtime]
auto_instantiate = false

# Credentials arrive as environment variables from the marimo-s3-creds
# Secret (see externalsecret.yaml); sandboxed kernels inherit them because
# ipc.py spawns them with base_env=os.environ.copy().
#
# `dotenv` is deliberately not set. marimo only resolves it when a
# pyproject.toml is found (_resolve_dotenv returns early when
# pyproject_path is None), so enabling it means seeding a pyproject.toml
# at /home/marimo as well.
