---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ray
spec:
  interval: 15m
  chart:
    spec:
      chart: ray-cluster
      version: 1.7.1
      sourceRef:
        kind: HelmRepository
        name: kuberay
        namespace: flux-system
  install:
    disableWait: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    disableWait: true
    remediation:
      retries: 3
  # KubeRay never touches running pods when the RayCluster spec changes
  # unless spec.upgradeStrategy.type is Recreate (default None), and the
  # ray-cluster chart (1.7.1) has no value for it. Without it the image bump
  # in #7743 left the head on 2.54.0 while the autoscaler started a 2.59.0
  # worker, which sat in wait-gcs-ready (2026-10-18). With Recreate, any spec
  # change (an image bump from Renovate included) deletes the head and every
  # worker and starts them again from the new spec: a minute or two without
  # Ray, and jobs in flight are lost. Needs the CRD from kuberay-operator
  # 1.6+, which operator-helmrelease.yaml now keeps current.
  postRenderers:
    - kustomize:
        patches:
          - target:
              group: ray.io
              kind: RayCluster
              name: ray-kuberay
            patch: |
              - op: add
                path: /spec/upgradeStrategy
                value:
                  type: Recreate
  values:
    image:
      # One stock image for head AND workers: the worker group sets no image
      # of its own, so the chart renders this for both and they cannot drift
      # (Ray refuses a head/worker version mismatch, even a patch one).
      # The custom grid-resilience-ray-worker image is gone with
      # grid-resilience (disabled 2026-10-18); jobs that need libraries bring
      # them through runtime_env or their own driver image.
      # CPU variant with an explicit Python suffix: Ray Client drivers must
      # match the cluster's Ray version AND Python minor, and the suffix keeps
      # Renovate on py312 (the bare tag is py310, EOL 2026-10). 3.12 matches
      # jupyter-lab (3.12.9) and the alphaos Dagster image; marimo (3.13)
      # still cannot be a Ray Client driver and should use the Jobs API.
      # The examples under ../examples pin the same ref (Renovate "Ray" group).
      repository: rayproject/ray
      tag: 2.59.0-py312-cpu@sha256:0ffca209fb4c984d648db550b8dbe7879bdba3bbb5d96ee5894843cf6ac12eb5
      pullPolicy: IfNotPresent

    head:
      annotations:
        descheduler.alpha.kubernetes.io/evict: "false"
      enableInTreeAutoscaling: true
      rayStartParams:
        dashboard-host: '0.0.0.0'
        ray-client-server-port: '10001'
      resources:
        limits:
          cpu: "4"
          memory: "8G"
        # Requests are scheduler reservations only: KubeRay derives Ray's
        # num-cpus/memory from the limits above, so job capacity is unchanged.
        # Idle the head uses ~50m / 1.3Gi; at 2 CPU / 4G it held worker3 full.
        requests:
          cpu: 500m
          memory: "2G"
      containerEnv:
        - name: RAY_LOG_TO_STDERR
          value: "1"
        - name: RAY_PROMETHEUS_HOST
          value: "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090"
        - name: RAY_GRAFANA_HOST
          value: "http://grafana.observability.svc.cluster.local:80"
        - name: RAY_GRAFANA_IFRAME_HOST
          value: "https://grafana.${SECRET_DOMAIN}"
        - name: MLFLOW_S3_ENDPOINT_URL
          value: "http://minio-secondary.storage.svc.cluster.local:9000"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: mlflow-minio-creds
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: mlflow-minio-creds
              key: AWS_SECRET_ACCESS_KEY

    worker:
      annotations:
        descheduler.alpha.kubernetes.io/evict: "false"
      groupName: workergroup
      replicas: 2
      minReplicas: 1
      maxReplicas: 12
      resources:
        limits:
          cpu: "8"
          memory: "16G"
        # See the head: limits set Ray's capacity. The idle min-replica worker
        # uses ~25m / 300Mi, and every autoscaled worker reserves this again.
        requests:
          cpu: "1"
          memory: "2G"
      containerEnv:
        - name: RAY_LOG_TO_STDERR
          value: "1"
        - name: RAY_PROMETHEUS_HOST
          value: "http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090"
        - name: RAY_GRAFANA_HOST
          value: "http://grafana.observability.svc.cluster.local:80"
        - name: RAY_GRAFANA_IFRAME_HOST
          value: "https://grafana.${SECRET_DOMAIN}"
        - name: MLFLOW_S3_ENDPOINT_URL
          value: "http://minio-secondary.storage.svc.cluster.local:9000"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: mlflow-minio-creds
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: mlflow-minio-creds
              key: AWS_SECRET_ACCESS_KEY

    rayDashboard:
      enabled: true
      port: 8265

    rayClientServer:
      enabled: true
      port: 10001

    ingress:
      enabled: false  # moved to an HTTPRoute on envoy-gateway
      annotations:
        hajimari.io/enable: "true"
        hajimari.io/icon: mdi:ray
      className: internal
      hosts:
        - host: kuberay.${SECRET_DOMAIN}
          paths:
            - path: /
              service:
                name: ray-external
                port: 8265
      tls:
        - hosts:
            - kuberay.${SECRET_DOMAIN}

    service:
      type: ClusterIP  # Keep as ClusterIP since we're using ray-external for external access
      port: 8265

  dependsOn:
    - name: kuberay-operator
---
# LAN entry for Ray clients (ray://192.168.50.182:10001) and Serve apps.
# The dashboard (8265, which is also the unauthenticated job-submission API),
# GCS (6379) and the runtime-env agent (8080) are not published here: any LAN
# device could run code through them. In-cluster clients use
# ray-kuberay-head-svc; the dashboard is behind Authentik at kuberay.<domain>
# via the ray-dashboard Service below. Ray client on 10001 is still code
# execution for whoever reaches it.
apiVersion: v1
kind: Service
metadata:
  name: ray-external
  namespace: datasci
  annotations:
    io.cilium/lb-ipam-ips: "${SVC_SYNCTHING_ADDR}"
spec:
  type: LoadBalancer
  ports:
    - name: client
      port: 10001
      targetPort: 10001
    - name: serve
      port: 8000
      targetPort: 8000
  selector:
    ray.io/node-type: head
    ray.io/cluster: ray-kuberay
---
# The dashboard for the kuberay.<domain> HTTPRoute (httproute-internal.yaml),
# which carries the Authentik SecurityPolicy kuberay-oidc.
apiVersion: v1
kind: Service
metadata:
  name: ray-dashboard
  namespace: datasci
spec:
  type: ClusterIP
  ports:
    - name: dashboard
      port: 8265
      targetPort: 8265
  selector:
    ray.io/node-type: head
    ray.io/cluster: ray-kuberay

