---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kuberay-operator
  namespace: datasci
spec:
  interval: 15m
  chart:
    spec:
      chart: kuberay-operator
      # 1.7.1 is unusable: the chart defaults to quay.io/kuberay/operator:v1.7.1,
      # which upstream never pushed (404). Every upgrade ImagePullBackOffs, times
      # out and rolls back, leaving this HR failed and `ray` blocked behind it.
      # Renovate skips 1.7.1 (.github/renovate/packageRules.json5).
      version: 1.7.0
      sourceRef:
        kind: HelmRepository
        name: kuberay
        namespace: flux-system
  # The chart ships its CRDs in crds/, which Helm only creates on first
  # install; Flux's default (upgrade.crds: Skip) never updates them. On
  # 2026-10-18 the RayCluster CRD was still the one from the 2025-08-22
  # install: no spec.upgradeStrategy or spec.authOptions, so the API server
  # silently pruned those fields. CreateReplace keeps the CRDs on the chart's
  # version. (The `crds.enabled` value that used to sit below is not a key in
  # this chart and did nothing; dropping it also changes the values digest so
  # the first reconcile after this runs an upgrade and replaces the CRDs.)
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 30s
        honorLabels: true
