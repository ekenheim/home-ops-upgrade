---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kuberay-operator
  namespace: datasci
spec:
  interval: 15m
  chart:
    spec:
      chart: kuberay-operator
      # 1.7.1 is unusable: the chart defaults to quay.io/kuberay/operator:v1.7.1,
      # which upstream never pushed (404). Every upgrade ImagePullBackOffs, times
      # out and rolls back, leaving this HR failed and `ray` blocked behind it.
      # Renovate skips 1.7.1 (.github/renovate/packageRules.json5).
      version: 1.7.0
      sourceRef:
        kind: HelmRepository
        name: kuberay
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    crds:
      enabled: true
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 30s
        honorLabels: true
