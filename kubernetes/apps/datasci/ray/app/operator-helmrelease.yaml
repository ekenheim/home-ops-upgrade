---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kuberay-operator
  namespace: datasci
spec:
  interval: 15m
  chart:
    spec:
      chart: kuberay-operator
      # 1.7.1 was skipped from 2026-09-19: its default image
      # quay.io/kuberay/operator:v1.7.1 was not pushed yet, so every upgrade
      # ImagePullBackOff'd and rolled back, leaving `ray` blocked behind it.
      # The image exists since the v1.7.1 release (2026-09-21) and the
      # Renovate skip is gone, so expect a 1.7.1 patch PR.
      version: 1.7.0
      sourceRef:
        kind: HelmRepository
        name: kuberay
        namespace: flux-system
  # The chart ships its CRDs in crds/, which Helm only creates on first
  # install; Flux's default (upgrade.crds: Skip) never updates them. On
  # 2026-10-18 the RayCluster CRD was still the one from the 2025-08-22
  # install: no spec.upgradeStrategy or spec.authOptions, so the API server
  # silently pruned those fields. CreateReplace keeps the CRDs on the chart's
  # version. (The `crds.enabled` value that used to sit below is not a key in
  # this chart and did nothing; dropping it also changes the values digest so
  # the first reconcile after this runs an upgrade and replaces the CRDs.)
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 30s
        honorLabels: true
