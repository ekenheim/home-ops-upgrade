---
apiVersion: batch/v1
kind: Job
metadata:
  name: ray-data-smoke
  labels:
    app.kubernetes.io/name: ray-examples
    ray.example/subsystem: data
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: ray-data-smoke
          image: rayproject/ray:2.60.0-py312-cpu@sha256:307d271427cbca373affad1c1d406776acd5f5a5dd041523008c8d44a796e4fd
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -lc
            - |
              python - <<'PY'
              import ray

              ray.init(address="ray://ray-kuberay-head-svc.datasci.svc.cluster.local:10001")

              @ray.remote
              def run_data_pipeline():
                  import ray
                  import ray.data
                  ds = ray.data.range(50000).map_batches(
                      lambda b: {"id": [x * 2 for x in b["id"]]}
                  )
                  return ds.count(), ds.sum("id")

              total, total_sum = ray.get(run_data_pipeline.remote())
              print("data_count", total, "data_sum", total_sum)
              ray.shutdown()
              PY
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
