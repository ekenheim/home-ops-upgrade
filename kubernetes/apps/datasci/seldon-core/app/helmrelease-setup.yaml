---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seldon-core-v2-setup
spec:
  interval: 30m
  dependsOn:
    - name: seldon-core-v2-crds
  chart:
    spec:
      chart: kubernetes/apps/datasci/seldon-core/chart/seldon-core-v2-setup
      # Track git commit revisions so template changes are picked up without bumping Chart.yaml
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: home-kubernetes
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controller:
      # Watch all namespaces so bandit resources in development/datasci are reconciled
      clusterwide: true
      # The chart's values are flat (controller.resources.cpu/memory) and
      # render the same memory value as both request and limit; a nested
      # requests/limits block here is silently ignored. The manager's working
      # set sits at 58-63 MiB, so the 64Mi default killed it (exit 137) ~4
      # times a day.
      resources:
        cpu: 10m
        memory: 512Mi
