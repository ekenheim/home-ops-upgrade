---
# Rails' SECRET_KEY_BASE, generated in-cluster; nothing to create in
# Bitwarden. CreatedOnce: the value is never re-rolled, not even on a spec
# change. A new one would only sign everyone out (API keys and the OIDC link
# are stored in the database, not derived from it), but there is no reason to.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: dawarich-secret-key-base
spec:
  length: 128
  digits: 40
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name dawarich-secret
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        SECRET_KEY_BASE: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: dawarich-secret-key-base
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# The OIDC client secret Authentik holds for the `dawarich` application. It is
# generated in `security` (security/authentik/app/dawarich-oidc.yaml) and read
# here through a store that may get only that one Secret. If Authentik's side
# re-rolls it, this copy follows within the hour and Reloader restarts the pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name dawarich-oidc
spec:
  secretStoreRef:
    name: authentik-oidc-dawarich
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_SECRET: '{{ .clientSecret }}'
  data:
    - secretKey: clientSecret
      remoteRef:
        key: authentik-dawarich-oidc
        property: client-secret
