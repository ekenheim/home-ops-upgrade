---
# Rails' SECRET_KEY_BASE, generated in-cluster. CreatedOnce: the value is
# never re-rolled, not even on a spec change.
#
# It is more than a session key in 1.16.0. With no OTP_ENCRYPTION_* or
# ARCHIVE_ENCRYPTION_KEY set (none are), Dawarich derives from it the
# ActiveRecord encryption keys (config/application.rb) and the raw-data
# archive key (Points::RawData::Encryption). A regenerated value therefore
# signs everyone out AND makes unreadable: 2FA secrets (users.otp_secret),
# encrypted service/instance settings (service_settings.credentials,
# instance_settings secrets) and every archived raw-points file. API keys and
# the OIDC link are plain columns and survive.
#
# It exists only in this Secret, so a lost Secret (namespace wipe, or a
# VolSync restore of the PVC into a fresh cluster) regenerates it. Today that
# costs nothing: no 2FA, no stored secret settings, no archives. Before
# turning any of those on, copy the value into a Bitwarden item (owner only)
# and switch this to a store reference.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: dawarich-secret-key-base
spec:
  length: 128
  digits: 40
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name dawarich-secret
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        SECRET_KEY_BASE: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: dawarich-secret-key-base
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# The OIDC client secret Authentik holds for the `dawarich` application. It is
# generated in `security` (security/authentik/app/dawarich-oidc.yaml) and read
# here through a store that may get only that one Secret. If Authentik's side
# re-rolls it, this copy follows within the hour and Reloader restarts the pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name dawarich-oidc
spec:
  secretStoreRef:
    name: authentik-oidc-dawarich
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_SECRET: '{{ .clientSecret }}'
  data:
    - secretKey: clientSecret
      remoteRef:
        key: authentik-dawarich-oidc
        property: client-secret
---
# Basic-auth pair for Sidekiq's /metrics exporter (:9394, see
# helmrelease.yaml), generated in-cluster: read by the Sidekiq container
# (METRICS_USERNAME / METRICS_PASSWORD) and by ./servicemonitor.yaml.
# CreatedOnce like the key base: a generator re-rolls on every refresh.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: dawarich-metrics-password
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name dawarich-metrics
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        METRICS_USERNAME: prometheus
        METRICS_PASSWORD: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: dawarich-metrics-password
