---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dawarich
  namespace: flux-system
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # No dependsOn `authentik`, although the OIDC client secret comes from its
  # store (security/authentik/app/dawarich-oidc.yaml): the ExternalSecret just
  # retries until the store exists, and an unhealthy Authentik should not hold
  # Dawarich's own changes back.
  dependsOn:
    - name: dragonfly-cluster
    - name: external-secrets-stores
  path: ./kubernetes/apps/default/dawarich/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      # One PVC holds the PostGIS data directory and Dawarich's files (see
      # helmrelease.yaml), so one snapshot is consistent across both.
      VOLSYNC_CAPACITY: 20Gi
      # Mixed owners on the volume: postgres (70) for the database, 1000 for
      # Dawarich. Only root can read both.
      VOLSYNC_UID: "0"
      VOLSYNC_GID: "0"
