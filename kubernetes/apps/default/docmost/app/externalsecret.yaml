---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name docmost-secret
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        # openssl rand -hex 32
        APP_SECRET: "{{ .APP_SECRET }}"
  dataFrom:
    - extract:
        key: docmost
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name docmost-db-secret
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: crunchy-pgo-secrets
    kind: ClusterSecretStore
  target:
    name: docmost-secret
    creationPolicy: Merge
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        # Connect to the primary directly rather than via `pgbouncer-host`.
        # The pgbouncer pool runs in `transaction` mode, which drops the
        # session-scoped advisory locks Docmost's Kysely migrator takes on
        # startup. Docmost is low-connection-count, so it does not need the
        # pooler.
        DATABASE_URL: 'postgresql://{{ .user }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}'
  dataFrom:
    - extract:
        key: postgres-pguser-docmost
