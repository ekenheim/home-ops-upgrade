# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app docmost
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
  - name: rook-ceph-cluster
    namespace: rook-ceph
  - name: volsync
    namespace: storage
  values:
    controllers:
      docmost:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docmost/docmost
              tag: 0.95.0
            env:
              TZ: ${TIMEZONE}
              APP_URL: https://docmost.${SECRET_DOMAIN}
              PORT: &port 3000
              REDIS_URL: redis://dragonfly.database.svc.cluster.local:6379/1
              STORAGE_DRIVER: local
              FILE_UPLOAD_SIZE_LIMIT: 50mb
            envFrom:
            - secretRef:
                name: docmost-secret
            probes:
              # /api/health/live is a bare "ok" — restart only if the process
              # is truly wedged. /api/health also pings postgres and redis, so
              # it belongs on readiness: a DB blip should pull the pod out of
              # the endpoints list, not kill it.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health/live
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 1Gi
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    ingress:
      app:
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Home
          gethomepage.dev/name: Docmost
          gethomepage.dev/icon: docmost.png
          gethomepage.dev/description: Collaborative Wiki and Documentation
        hosts:
        - host: &host "{{ .Release.Name }}.${SECRET_DOMAIN}"
          paths:
          - path: /
            service:
              identifier: app
              port: http
        tls:
        - hosts:
          - *host
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /app/data/storage
