---
# yaml-language-server: $schema=https://lds-schemas-5hg.pages.dev/external-secrets.io/externalsecret_v1.json
# Frigate substitutes FRIGATE_* env vars into config.yml ("{FRIGATE_...}"),
# go2rtc streams included, so no credential is written to the config file.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name frigate
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # The hallway camera's RTSP login: Bitwarden item `frigate`.
        FRIGATE_RTSP_USER: "{{ .FRIGATE_RTSP_USER }}"
        FRIGATE_RTSP_PASSWORD: "{{ .FRIGATE_RTSP_PASSWORD }}"
        # The Mosquitto login Home Assistant uses (item `mqtt`). The broker
        # has no ACL file, so one user sees every topic either way.
        FRIGATE_MQTT_USER: "{{ .MQTT_USERNAME }}"
        FRIGATE_MQTT_PASSWORD: "{{ .MQTT_PASSWORD }}"
  dataFrom:
    - extract:
        key: frigate
    - extract:
        key: mqtt
