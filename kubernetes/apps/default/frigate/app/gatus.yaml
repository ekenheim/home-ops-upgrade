---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "${APP}-gatus-ep"
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      # The pod, on the unauthenticated in-cluster port: through the route
      # (8971) every API path but login answers 401.
      - name: "${APP}"
        group: internal
        url: "http://${APP}.default.svc.cluster.local:5000/api/version"
        interval: 1m
        ui:
          hide-hostname: true
          hide-url: true
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
