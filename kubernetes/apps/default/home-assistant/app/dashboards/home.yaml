                  - entity: sensor.riello_battery_charge
                    show_state: true
                    show_background: false
                  - entity: sensor.riello_load
                    icon: mdi:gauge
                    show_state: true
                    show_background: false
              - type: custom:bubble-card
                card_type: separator
                name: 3D printer
                icon: mdi:printer-3d
              - type: custom:ha-bambulab-print_status-card
