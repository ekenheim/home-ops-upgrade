                icon: mdi:robot-vacuum
                sub_button:
                  - entity: sensor.dreamebot_l10s_ultra_battery_level
                    show_state: true
                    show_background: false
                  - icon: mdi:play
                    tap_action:
                      action: call-service
                      service: vacuum.start
                      target: { entity_id: vacuum.dreamebot_l10s_ultra }
                  - icon: mdi:pause
                    tap_action:
                      action: call-service
                      service: vacuum.pause
                      target: { entity_id: vacuum.dreamebot_l10s_ultra }
                  - icon: mdi:home-import-outline
                    tap_action:
                      action: call-service
                      service: vacuum.return_to_base
                      target: { entity_id: vacuum.dreamebot_l10s_ultra }
              - type: custom:xiaomi-vacuum-map-card
                entity: vacuum.dreamebot_l10s_ultra
                vacuum_platform: default
                map_source:
                  camera: camera.dreamebot_l10s_ultra_map
                calibration_source:
                  camera: true
                map_locked: true
              - type: custom:bubble-card
                card_type: separator
                name: Music
                icon: mdi:speaker
              - type: custom:bubble-card
                card_type: media-player
                entity: media_player.kok
                name: Kök

          # Computer room
          - type: custom:bubble-card
            card_type: pop-up
            hash: "#computer-room"
            name: Computer room
            icon: mdi:desktop-tower-monitor
            entity: light.computer_room
            sub_button:
              - entity: sensor.computer_sensor_temperature
                show_state: true
              - entity: sensor.office_pm2_5
                icon: mdi:air-filter
                show_state: true
            cards:
              - type: custom:bubble-card
                card_type: separator
                name: Lights
                icon: mdi:lightbulb-group
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: custom:bubble-card
                    card_type: button
                    button_type: slider
                    entity: light.lifx_beam
                    name: Beam
                    icon: mdi:led-strip-variant
                  - type: custom:bubble-card
                    card_type: button
                    button_type: slider
                    entity: light.hue_essential_lamp_2
                    name: Lamp 2
                  - type: custom:bubble-card
                    card_type: button
                    button_type: slider
                    entity: light.hue_essential_lamp_3
