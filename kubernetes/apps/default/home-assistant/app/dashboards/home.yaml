                    card_type: button
                    button_type: slider
                    entity: light.tv_light
                  - type: custom:bubble-card
                    card_type: button
                    button_type: slider
                    entity: light.randa_pc
                  - type: custom:bubble-card
                    card_type: button
                    button_type: slider
                    entity: light.hue_play_left
                    name: Play left
                  - type: custom:bubble-card
                    card_type: button
                    button_type: slider
                    entity: light.hue_play_right
                    name: Play right
                  - type: custom:bubble-card
                    card_type: button
                    button_type: slider
                    entity: light.hue_essential_spot_1
                    name: Spot
                  - type: custom:bubble-card
                    card_type: button
                    button_type: slider
                    entity: light.extended_color_light_1
                    name: TV strip
                    icon: mdi:led-strip-variant
                  - type: custom:bubble-card
                    card_type: button
                    button_type: slider
                    entity: light.192_168_1_222
                    name: Desk strip
                    icon: mdi:led-strip-variant
                  - type: custom:bubble-card
                    card_type: button
                    button_type: slider
                    entity: light.192_168_1_231
                    name: Sofa strip
                    icon: mdi:led-strip-variant
              - type: custom:bubble-card
                card_type: separator
                name: Scenes
                icon: mdi:palette
              - type: grid
                columns: 4
                square: false
                cards:
                  - type: custom:bubble-card
                    card_type: button
                    button_type: name
                    name: Bright
                    icon: mdi:brightness-7
                    card_layout: large
                    button_action:
                      tap_action:
                        action: call-service
                        service: scene.turn_on
                        target: { entity_id: scene.tv_room_bright }
                  - type: custom:bubble-card
                    card_type: button
                    button_type: name
                    name: Relax
                    icon: mdi:sofa-outline
                    card_layout: large
                    button_action:
                      tap_action:
                        action: call-service
                        service: scene.turn_on
                        target: { entity_id: scene.tv_room_relax }
                  - type: custom:bubble-card
                    card_type: button
                    button_type: name
                    name: Dimmed
                    icon: mdi:brightness-4
                    card_layout: large
                    button_action:
                      tap_action:
                        action: call-service
                        service: scene.turn_on
                        target: { entity_id: scene.tv_room_dimmed }
                  - type: custom:bubble-card
                    card_type: button
                    button_type: name
                    name: Night
                    icon: mdi:weather-night
                    card_layout: large
                    button_action:
                      tap_action:
                        action: call-service
                        service: scene.turn_on
                        target: { entity_id: scene.tv_room_nightlight }
              - type: custom:bubble-card
                card_type: separator
                name: Plugs
                icon: mdi:power-socket-eu
              - type: custom:bubble-card
                card_type: button
                button_type: switch
                entity: switch.tv_plug
                name: TV
                icon: mdi:television
                sub_button:
                  - entity: sensor.tv_plug_power
                    show_state: true
                    show_background: false
              - type: custom:bubble-card
                card_type: button
                button_type: switch
                entity: switch.computer_desk
                name: Computer desk
                icon: mdi:desk
                sub_button:
                  - entity: sensor.computer_desk_power
                    show_state: true
                    show_background: false
              - type: custom:bubble-card
                card_type: button
                button_type: switch
                entity: switch.3_lamp
                name: Dog bowl lamp
                icon: mdi:lamp
                sub_button:
                  - entity: sensor.3_lamp_power
                    show_state: true
                    show_background: false
              - type: custom:bubble-card
                card_type: separator
                name: TV
                icon: mdi:television-play
              - type: custom:bubble-card
                card_type: media-player
                entity: media_player.lg_tv
                name: LG TV

          # Kitchen
          - type: custom:bubble-card
            card_type: pop-up
            hash: "#kitchen"
            name: Kitchen
            icon: mdi:countertop
            entity: light.kitchen
            sub_button:
              - entity: sensor.kitchen_sensor_temperature
                show_state: true
            cards:
              - type: custom:bubble-card
                card_type: separator
                name: Lights
                icon: mdi:lightbulb-group
              - type: grid
