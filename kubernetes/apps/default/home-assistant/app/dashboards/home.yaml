# Home dashboard (YAML mode). Mounted read-only at /config/dashboards/home.yaml
# from the home-assistant-dashboards ConfigMap; registered in configuration.yaml
# under lovelace.dashboards.dashboard-home. HA re-reads the file on its mtime,
# so a Flux sync + browser refresh picks up changes without a restart.
#
# Custom cards (HACS, already loaded as lovelace resources): Bubble Card,
# Mushroom, ha-bambulab cards, xiaomi-vacuum-map-card, custom-sonos-card.
#
# This repo is public: no credentials, URLs with userinfo, or address-derived
# entity IDs in here.
title: Home
views:
  # ---------------------------------------------------------------- Home ----
  - title: Home
    path: home
    icon: mdi:home-variant
    type: sections
    max_columns: 3
    header:
      layout: responsive
      card:
        type: markdown
        text_only: true
        content: >-
          ## {% set h = now().hour %}{{ 'Good night' if h < 5 else 'Good morning'
          if h < 12 else 'Good afternoon' if h < 18 else 'Good evening' }}, {{ user }}
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:mushroom-chips-card
            alignment: center
            grid_options:
              columns: full
            chips:
              - type: entity
                entity: person.robin
                use_entity_picture: true
              - type: weather
                entity: weather.forecast_home
                show_conditions: true
                show_temperature: true
              - type: entity
                entity: sensor.tibber_electricity_price
                icon: mdi:flash
                icon_color: amber
              - type: template
                icon: mdi:lightbulb-group
                icon_color: amber
                content: >-
                  {{ ['living_room', 'kitchen', 'computer_room', 'bedroom', 'bathroom', 'hallway']
                  | map('area_entities') | sum(start=[])
                  | select('match', 'light\.')
                  | reject('is_state_attr', 'is_hue_group', true)
                  | reject('search', 'chamber_light')
                  | select('is_state', 'on') | list | count }} on
              - type: conditional
                conditions:
                  - condition: state
                    entity: binary_sensor.door_window_door_is_open_2
                    state: "on"
                chip:
                  type: entity
                  entity: binary_sensor.door_window_door_is_open_2
                  name: Door open
                  icon_color: red
                  content_info: name
              - type: conditional
                conditions:
                  - condition: state
                    entity: vacuum.dreamebot_l10s_ultra
                    state_not: docked
                chip:
                  type: template
                  entity: vacuum.dreamebot_l10s_ultra
                  icon: mdi:robot-vacuum
                  icon_color: teal
                  content: >-
                    {{ states('vacuum.dreamebot_l10s_ultra') | replace('_', ' ') }}
                    · {{ states('sensor.dreamebot_l10s_ultra_battery_level') }}%
                  tap_action:
                    action: navigate
                    navigation_path: "#kitchen"

      # Room tiles: tap the card for the room pop-up, tap the icon to toggle
      # the room's Hue group.
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Rooms
            heading_style: title
          - type: custom:bubble-card
            card_type: button
            button_type: name
            card_layout: large
            entity: light.tv_room
            name: Living room
            icon: mdi:sofa
            grid_options: { columns: 6, rows: 2 }
            tap_action: { action: toggle }
            button_action:
              tap_action: { action: navigate, navigation_path: "#living-room" }
            sub_button:
              main: []
              bottom:
                - buttons_layout: inline
                  justify_content: start
                  group:
                    - entity: sensor.tv_room_sensor_temperature
                      show_state: true
                      show_background: false
                    - entity: binary_sensor.tv_room_sensor_motion
                      show_background: false
          - type: custom:bubble-card
            card_type: button
            button_type: name
            card_layout: large
            entity: light.kitchen
            name: Kitchen
            icon: mdi:countertop
            grid_options: { columns: 6, rows: 2 }
            tap_action: { action: toggle }
            button_action:
              tap_action: { action: navigate, navigation_path: "#kitchen" }
            sub_button:
              main: []
              bottom:
                - buttons_layout: inline
                  justify_content: start
                  group:
                    - entity: sensor.kitchen_sensor_temperature
                      show_state: true
                      show_background: false
                    - entity: binary_sensor.kitchen_sensor_motion
                      show_background: false
          - type: custom:bubble-card
            card_type: button
            button_type: name
            card_layout: large
            entity: light.computer_room
            name: Computer room
            icon: mdi:desktop-tower-monitor
            grid_options: { columns: 6, rows: 2 }
            tap_action: { action: toggle }
            button_action:
              tap_action: { action: navigate, navigation_path: "#computer-room" }
            sub_button:
              main: []
              bottom:
                - buttons_layout: inline
                  justify_content: start
                  group:
                    - entity: sensor.computer_sensor_temperature
                      show_state: true
                      show_background: false
                    - entity: sensor.office_pm2_5
                      icon: mdi:air-filter
                      show_state: true
                      show_background: false
          - type: custom:bubble-card
            card_type: button
            button_type: name
            card_layout: large
            entity: light.bedroom
            name: Bedroom
            icon: mdi:bed-king-outline
            grid_options: { columns: 6, rows: 2 }
            tap_action: { action: toggle }
            button_action:
              tap_action: { action: navigate, navigation_path: "#bedroom" }
            sub_button:
              main: []
              bottom:
                - buttons_layout: inline
                  justify_content: start
                  group:
                    - entity: sensor.bedroom_sensor_temperature
                      show_state: true
                      show_background: false
                    - entity: sensor.multisensor_6_humidity_2
                      show_state: true
                      show_background: false
          - type: custom:bubble-card
            card_type: button
            button_type: name
            card_layout: large
            entity: light.bathroom
            name: Bathroom
            icon: mdi:shower-head
            grid_options: { columns: 6, rows: 2 }
            tap_action: { action: toggle }
            button_action:
              tap_action: { action: navigate, navigation_path: "#bathroom" }
            sub_button:
              main: []
              bottom:
                - buttons_layout: inline
                  justify_content: start
                  group:
                    - entity: sensor.bathroom_sensor_temperature
                      show_state: true
                      show_background: false
                    - entity: binary_sensor.bathroom_sensor_motion
                      show_background: false
          - type: custom:bubble-card
            card_type: button
            button_type: name
            card_layout: large
            # No Hue group for the hallway; the ceiling panel stands in.
            entity: light.floalt_panel_ws_60x60
            name: Hallway
            icon: mdi:door
            grid_options: { columns: 6, rows: 2 }
            tap_action: { action: toggle }
            button_action:
              tap_action: { action: navigate, navigation_path: "#hallway" }
            sub_button:
              main: []
              bottom:
                - buttons_layout: inline
                  justify_content: start
                  group:
                    - entity: sensor.hallway_temperature
                      show_state: true
                      show_background: false
                    - entity: binary_sensor.door_window_door_is_open_2
                      show_background: false

      - type: grid
        cards:
          - type: heading
            heading: Quick actions
            heading_style: title
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Day lights
            icon: mdi:white-balance-sunny
            grid_options: { columns: 6 }
            button_action:
              tap_action:
                action: call-service
                service: scene.turn_on
                target: { entity_id: scene.day_time_lights }
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Kitchen lights
            icon: mdi:silverware-fork-knife
            grid_options: { columns: 6 }
            button_action:
              tap_action:
                action: call-service
                service: scene.turn_on
                target: { entity_id: scene.kitchen_lights }
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Bathroom night
            icon: mdi:weather-night
            grid_options: { columns: 6 }
            button_action:
              tap_action:
                action: call-service
                service: scene.turn_on
                target: { entity_id: scene.bathroom_night }
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: All lights off
            icon: mdi:lightbulb-group-off
            grid_options: { columns: 6 }
            button_action:
              tap_action:
                action: call-service
                service: light.turn_off
                target:
                  area_id: [living_room, kitchen, computer_room, bedroom, bathroom, hallway]
                confirmation:
                  text: Turn off every light in the house?

      # Only shows what is actually playing / running.
      - type: grid
        cards:
          - type: heading
            heading: Now
            heading_style: title
          - type: custom:bubble-card
            card_type: media-player
            entity: media_player.lg_tv
            name: LG TV
            grid_options: { columns: full }
            visibility:
              - condition: state
                entity: media_player.lg_tv
                state_not: "off"
              - condition: state
                entity: media_player.lg_tv
                state_not: unavailable
          - type: custom:bubble-card
            card_type: media-player
            entity: media_player.shield_android_tv
            name: Shield
            grid_options: { columns: full }
            visibility:
              - condition: state
                entity: media_player.shield_android_tv
                state: playing
          - type: custom:bubble-card
            card_type: media-player
            entity: media_player.kok
            name: Kök
            grid_options: { columns: full }
            visibility:
              - condition: state
                entity: media_player.kok
                state: playing
          - type: custom:bubble-card
            card_type: media-player
            entity: media_player.badrum
            name: Badrum
            grid_options: { columns: full }
            visibility:
              - condition: state
                entity: media_player.badrum
                state: playing
          - type: custom:bubble-card
            card_type: button
            button_type: state
            entity: vacuum.dreamebot_l10s_ultra
            name: Vacuum
            icon: mdi:robot-vacuum
            grid_options: { columns: full }
            visibility:
              - condition: state
                entity: vacuum.dreamebot_l10s_ultra
                state_not: docked
            button_action:
              tap_action: { action: navigate, navigation_path: "#kitchen" }
            sub_button:
              - entity: sensor.dreamebot_l10s_ultra_battery_level
                show_state: true
                show_background: false
              - icon: mdi:home-import-outline
                tap_action:
                  action: call-service
                  service: vacuum.return_to_base
                  target: { entity_id: vacuum.dreamebot_l10s_ultra }
          - type: markdown
            text_only: true
            content: "*Nothing playing.*"
            visibility:
              - condition: state
                entity: media_player.lg_tv
                state: ["off", unavailable]
              - condition: state
                entity: media_player.shield_android_tv
                state_not: playing
              - condition: state
                entity: media_player.kok
                state_not: playing
              - condition: state
                entity: media_player.badrum
                state_not: playing
              - condition: state
                entity: vacuum.dreamebot_l10s_ultra
                state: docked

      # ---- Room pop-ups (hidden until their #hash is opened) ----
      - type: grid
        cards:
          # Living room
          - type: custom:bubble-card
            card_type: pop-up
            hash: "#living-room"
            name: Living room
            icon: mdi:sofa
            entity: light.tv_room
