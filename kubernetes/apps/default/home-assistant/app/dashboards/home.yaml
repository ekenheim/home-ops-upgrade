                    entity: light.bedroom_lamp
                    name: Lamp
                  - type: custom:bubble-card
                    card_type: button
                    button_type: slider
                    entity: light.hue_go_1
                    name: Hue Go
              - type: custom:bubble-card
                card_type: separator
                name: Scenes
                icon: mdi:palette
              - type: grid
                columns: 4
                square: false
                cards:
                  - type: custom:bubble-card
                    card_type: button
                    button_type: name
                    name: Bright
                    icon: mdi:brightness-7
                    card_layout: large
                    button_action:
                      tap_action:
                        action: call-service
                        service: scene.turn_on
                        target: { entity_id: scene.bedroom_bright }
                  - type: custom:bubble-card
                    card_type: button
                    button_type: name
                    name: Read
                    icon: mdi:book-open-variant
                    card_layout: large
                    button_action:
                      tap_action:
                        action: call-service
                        service: scene.turn_on
                        target: { entity_id: scene.bedroom_read }
                  - type: custom:bubble-card
                    card_type: button
                    button_type: name
                    name: Relax
                    icon: mdi:sofa-outline
                    card_layout: large
                    button_action:
                      tap_action:
                        action: call-service
                        service: scene.turn_on
                        target: { entity_id: scene.bedroom_relax }
                  - type: custom:bubble-card
                    card_type: button
                    button_type: name
                    name: Night
                    icon: mdi:weather-night
                    card_layout: large
                    button_action:
                      tap_action:
                        action: call-service
                        service: scene.turn_on

          # Bathroom
          - type: custom:bubble-card
            card_type: pop-up
