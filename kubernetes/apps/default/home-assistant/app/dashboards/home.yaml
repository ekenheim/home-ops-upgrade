              - type: custom:bubble-card
                card_type: separator
                name: Air
                icon: mdi:air-purifier
              - type: custom:bubble-card
                card_type: button
                button_type: switch
                entity: fan.office
                name: Air purifier
                icon: mdi:air-purifier
                sub_button:
                  - entity: sensor.office_pm2_5
                    show_state: true
                    show_background: false
                  - entity: sensor.office_indoor_allergen_index
