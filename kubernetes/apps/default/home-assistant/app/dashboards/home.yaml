                    card_layout: large
                    button_action:
                      tap_action:
                        action: call-service
                        service: scene.turn_on
                        target: { entity_id: scene.kitchen_relax }
                  - type: custom:bubble-card
                    card_type: button
                    button_type: name
                    name: Night
                    icon: mdi:weather-night
                    card_layout: large
                    button_action:
                      tap_action:
                        action: call-service
                        service: scene.turn_on
                        target: { entity_id: scene.kitchen_nightlight }
              - type: custom:bubble-card
                card_type: separator
                name: Vacuum
                icon: mdi:robot-vacuum
              - type: custom:bubble-card
                card_type: button
                button_type: state
