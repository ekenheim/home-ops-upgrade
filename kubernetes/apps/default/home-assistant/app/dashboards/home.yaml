  # ------------------------------------------------------------- Climate ----
  - title: Climate
    path: climate
    icon: mdi:thermometer
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Temperature
            heading_style: title
          - type: statistics-graph
            chart_type: line
            period: hour
            days_to_show: 3
            stat_types: [mean]
            grid_options: { columns: full, rows: 5 }
            entities:
              - entity: sensor.tv_room_sensor_temperature
                name: Living room
              - entity: sensor.kitchen_sensor_temperature
                name: Kitchen
              - entity: sensor.computer_sensor_temperature
                name: Computer room
              - entity: sensor.bedroom_sensor_temperature
                name: Bedroom
              - entity: sensor.bathroom_sensor_temperature
                name: Bathroom
              - entity: sensor.hallway_temperature
                name: Hallway
          - type: heading
            heading: Humidity
            heading_style: title
          - type: statistics-graph
            chart_type: line
            period: hour
            days_to_show: 3
            stat_types: [mean]
            grid_options: { columns: full, rows: 4 }
            entities:
              - entity: sensor.multisensor_6_humidity_3
                name: Living room
              - entity: sensor.multisensor_6_humidity_2
                name: Bedroom
              - entity: sensor.multisensor_6_humidity
                name: Hallway
              - entity: sensor.multisensor2_6_humidity
                name: Hallway 2
      - type: grid
        cards:
          - type: heading
            heading: Outside
            heading_style: title
          - type: weather-forecast
            entity: weather.forecast_home
            forecast_type: daily
            show_current: true
            show_forecast: true
            entity: sensor.sun_next_rising
            name: Sunrise
            grid_options: { columns: 6 }
          - type: tile
            entity: sensor.sun_next_setting
            name: Sunset
            grid_options: { columns: 6 }
      - type: grid
        cards:
          - type: heading
            heading: Air quality
            heading_style: title
          - type: statistics-graph
            chart_type: line
            period: hour
            days_to_show: 3
            stat_types: [mean, max]
            entities:
              - entity: sensor.office_pm2_5
                name: PM2.5 (computer room)
          - type: tile
            entity: sensor.office_indoor_allergen_index
            name: Allergen index
          - type: tile
            entity: fan.office
            name: Air purifier
            features:
              - type: fan-preset-modes
                style: dropdown
      - type: grid
        cards:
          - type: heading
            heading: Motion (24h)
            heading_style: title
          - type: history-graph
            hours_to_show: 24
            grid_options: { columns: full, rows: 4 }
            entities:
              - entity: binary_sensor.tv_room_sensor_motion
                name: Living room
              - entity: binary_sensor.kitchen_sensor_motion
                name: Kitchen
              - entity: binary_sensor.computer_sensor_motion
                name: Computer room
              - entity: binary_sensor.bedroom_sensor_motion
                name: Bedroom
              - entity: binary_sensor.bathroom_sensor_motion
                name: Bathroom
              - entity: binary_sensor.hallway_motion
                name: Hallway
              - entity: binary_sensor.door_window_door_is_open_2
                name: Front door

