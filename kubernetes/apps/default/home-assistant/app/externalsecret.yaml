---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name home-assistant-db-secret
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: crunchy-pgo-secrets
    kind: ClusterSecretStore
  target:
    name: *name
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        # Full recorder connection string. HOST points to the primary (.host),
        # not pgbouncer: the pgbouncer proxy runs in transaction pool mode which
        # breaks SQLAlchemy server-side cursors / SET LOCAL used by the recorder.
        # configuration.yaml consumes this via: db_url: !env_var HASS_RECORDER_DB_URL
        # target_session_attrs=read-write: during a Patroni failover the primary
        # Service can briefly route to a member that is already a standby. Without
        # this, libpq accepts that connection and the recorder pool keeps it until
        # HA restarts. On 2026-11-14 2 of 5 pooled connections stayed on a replica
        # for 2.5 days, and about half the history and most statistics were lost.
        HASS_RECORDER_DB_URL: 'postgresql://{{ .user }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}?target_session_attrs=read-write'
  dataFrom:
    - extract:
        key: postgres-pguser-home-assistant
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Password for the code-server sidecar (hass-code). Bitwarden Secrets Manager
# secret `hass-code` holds {"CODE_SERVER_PASSWORD": "..."}, same shape as `mqtt`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name home-assistant-codeserver
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        PASSWORD: "{{ .CODE_SERVER_PASSWORD }}"
  dataFrom:
    - extract:
        key: hass-code
