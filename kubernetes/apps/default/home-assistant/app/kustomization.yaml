---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./rbac.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ../../../../templates/gatus/external
  - ../../../../templates/volsync
configMapGenerator:
  - name: home-assistant-dashboards
    files:
      - home.yaml=./dashboards/home.yaml
  # HA packages (included from configuration.yaml via
  # homeassistant.packages: !include_dir_named packages). Changes need
  # Developer tools -> YAML -> reload (or a restart), not a pod bounce.
  - name: home-assistant-packages
    files:
      - apple_health.yaml=./packages/apple_health.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # Dashboards reload on mtime and packages via a YAML reload; don't restart
    # the pod on edits.
    reloader.stakater.com/ignore: "true"
    # Keeps Flux from touching ${...} that card templates may contain.
    kustomize.toolkit.fluxcd.io/substitute: disabled
