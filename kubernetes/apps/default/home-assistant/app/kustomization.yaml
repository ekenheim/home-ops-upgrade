---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./rbac.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ../../../../templates/gatus/external
  - ../../../../templates/volsync
configMapGenerator:
  - name: home-assistant-dashboards
    files:
      - home.yaml=./dashboards/home.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # Dashboard YAML is reloaded by HA on mtime; don't restart the pod on edits.
    reloader.stakater.com/ignore: "true"
    # Keeps Flux from touching ${...} that card templates may contain.
    kustomize.toolkit.fluxcd.io/substitute: disabled
