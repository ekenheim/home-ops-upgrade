---
# Read grants newer Kubernetes integration releases need; without them HA
# raises a "Missing permissions" repair issue. 1.14: HPAs (scale guard, HPA
# badge). 1.17: Gateway API HTTPRoutes (Network tab). It is a separate role
# because rbac.yaml holds the ServiceAccount token Secret, and the SOPS guard
# rejects any changed file that contains a plain Secret.
# Upstream's full mode (manifests/full/) also grants pods/log, pods/eviction
# and patch on nodes; all stay out: logs carry tokens, and HA shouldn't cordon
# or drain nodes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homeassistant-kubernetes-integration-hpa
  labels:
    app.kubernetes.io/name: homeassistant-kubernetes-integration
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homeassistant-kubernetes-integration-hpa
  labels:
    app.kubernetes.io/name: homeassistant-kubernetes-integration
    app.kubernetes.io/component: rbac
subjects:
  - kind: ServiceAccount
    name: homeassistant-kubernetes-integration
    namespace: default
roleRef:
  kind: ClusterRole
  name: homeassistant-kubernetes-integration-hpa
  apiGroup: rbac.authorization.k8s.io
