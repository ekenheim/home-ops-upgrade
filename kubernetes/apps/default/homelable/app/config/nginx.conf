# Replaces the frontend image's whole nginx setup so it can run as a non-root
# user on a read-only root filesystem. The image's own entrypoint is skipped
# (command in helmrelease.yaml): it renders conf.d/homelable.conf from a
# template, which needs root and a writable conf.d, and it falls back to an
# upstream of `backend:8000`, a name that does not resolve in Kubernetes.
#
# The server block mirrors upstream docker/nginx.conf at v3.6.0, with the
# backend on 127.0.0.1:8000 (same pod) and listening on 8080 instead of 80.
# On a Homelable upgrade, diff upstream's docker/nginx.conf against this file:
# a new proxied path there has to be added here too.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    access_log off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Floor-plan uploads. Upstream's bare-metal site sets 20M; the Docker
        # config leaves nginx's 1M default, which rejects most images.
        client_max_body_size 20M;

        # WebSocket (must be before /api/ to take priority)
        location /api/v1/status/ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Interactive API docs (Swagger UI, ReDoc, OpenAPI schema).
        location /docs {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /redoc {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /openapi.json {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Legacy /ws/ path
        location /ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
