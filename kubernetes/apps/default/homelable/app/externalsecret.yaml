---
# SECRET_KEY signs Homelable's session JWTs (OIDC mode wants >= 32 bytes).
# Generated in-cluster, nothing to create in Bitwarden. CreatedOnce: a new
# value only signs everybody out, so it never rotates on its own; if the
# Secret is deleted, ESO makes a new one and the cost is a fresh sign-in.
# No symbols, so no `$` for the backend's quote handling to trip over.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: homelable-secret-key
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://lds-schemas-5hg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name homelable-secret
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: homelable-secret-key
      rewrite:
        - regexp:
            source: "password"
            target: "SECRET_KEY"
---
# yaml-language-server: $schema=https://lds-schemas-5hg.pages.dev/external-secrets.io/externalsecret_v1.json
# The Authentik OIDC client secret. Generated in `security` next to the
# blueprint that registers the provider (security/authentik/app/
# homelable-oidc.yaml) and read across namespaces through the
# authentik-oidc-secrets-homelable store, which serves only that Secret and
# only to `default`. Periodic, so a regenerated secret reaches Homelable
# within 15 minutes; Reloader restarts the pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name homelable-oidc
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: authentik-oidc-secrets-homelable
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_SECRET: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: authentik-homelable-oidc
        property: client-secret
---
# yaml-language-server: $schema=https://lds-schemas-5hg.pages.dev/external-secrets.io/externalsecret_v1.json
# MQTT credentials for the Zigbee2MQTT and Z-Wave JS UI mesh imports, the
# same Bitwarden item Mosquitto builds its password file from
# (default/mosquitto/app/externalsecret.yaml); nothing new to create.
# Homelable keeps these env-only: never written to disk, never returned by
# its API.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name homelable-mqtt
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        ZIGBEE_MQTT_USERNAME: "{{ .MQTT_USERNAME }}"
        ZIGBEE_MQTT_PASSWORD: "{{ .MQTT_PASSWORD }}"
        ZWAVE_MQTT_USERNAME: "{{ .MQTT_USERNAME }}"
        ZWAVE_MQTT_PASSWORD: "{{ .MQTT_PASSWORD }}"
  dataFrom:
    - extract:
        key: mqtt
---
# yaml-language-server: $schema=https://lds-schemas-5hg.pages.dev/external-secrets.io/externalsecret_v1.json
# UnPoller's local UniFi account, read-only on the controller, as the UniFi
# MCP in llm/toolhive uses it; nothing new to create. Homelable keeps these
# env-only: never written to disk, never returned by its API.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name homelable-unifi
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        UNIFI_USER: "{{ .UNPOLLER_UNIFI_USER }}"
        UNIFI_PASS: "{{ .UNPOLLER_UNIFI_PASS }}"
  dataFrom:
    - extract:
        key: unifi
