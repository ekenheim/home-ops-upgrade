---
# yaml-language-server: $schema=https://lds-schemas-5hg.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app homelable
  namespace: flux-system
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # No dependsOn `authentik`, although the OIDC client secret comes from its
  # store (security/authentik/app/homelable-oidc.yaml): the ExternalSecret just
  # retries until the store exists, as Dawarich's does.
  dependsOn:
    - name: external-secrets-stores
  path: ./kubernetes/apps/default/homelable/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      # Named explicitly rather than defaulting to ${APP}: the chart creates no
      # PVC of its own here, but an explicit name keeps it that way if one is
      # ever added (the Karakeep clash).
      CLAIM: homelable-data
      # SQLite, uploaded floor plans and scan_config.json; a few MB in practice.
      VOLSYNC_CAPACITY: 2Gi
      # The backend runs as 568:568, the VolSync template's default mover
      # UID/GID, so no VOLSYNC_UID/GID override is needed.
      GATUS_URL_PATH: /api/v1/health
