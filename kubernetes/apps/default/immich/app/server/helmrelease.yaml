---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app immich-server
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      enableServiceLinks: false
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [65537]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # Honor: skip nodes whose taints this pod does not tolerate (worker4, NotReady
          # nodes). Ignore counts them as empty domains, so maxSkew 1 wedges rollouts.
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: *app
      affinity:
        # Any node with a render node (devic.es/dri below) will do: Immich is set
        # to VAAPI, which drives worker3's Radeon and the Intel iGPUs alike. QSV
        # would give slightly better H.264 on Intel, but would pin Immich to the
        # Intel nodes, today only master2 (sole etcd member, Plex). For 720p
        # previews that is not worth it. Prefer non-control-plane so transcodes
        # stay off the etcd node while worker3 is up.
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: google.feature.node.kubernetes.io/coral
                      operator: In
                      values: ["true"]
                topologyKey: kubernetes.io/hostname

    controllers:
      immich:
        strategy: RollingUpdate
        labels:
          nfsMount: "true"
        annotations:
          reloader.stakater.com/auto: "true"
          configmap.reloader.stakater.com/reload: &configMap immich-configmap
          secret.reloader.stakater.com/reload: &secret immich-secret

        initContainers:
          # Idempotent superuser-only DDL that the immich app user cannot run
          # itself (e.g. ALTER EXTENSION). Connects to the primary directly
          # because pgbouncer rejects the postgres superuser.
          db-extension-update:
            image:
              repository: postgres
              tag: 18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
            envFrom:
              - secretRef:
                  name: immich-db-secret
              - secretRef:
                  name: immich-super-secret
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                export PGPASSWORD="$POSTGRES_SUPER_PASS"
                psql -v ON_ERROR_STOP=1 \
                  -h "$INIT_POSTGRES_HOST" \
                  -U "$INIT_POSTGRES_USER" \
                  -d "$DB_DATABASE_NAME" \
                  -c "ALTER EXTENSION vector UPDATE;"

        containers:
          app:
            image:
              repository: ghcr.io/immich-app/immich-server
              tag: v3.3.5@sha256:485d546a2e31d6a8b4db8423fcba5c109de8c218d93410af115fd1ccfc4352a6
            envFrom:
              - configMapRef:
                  name: *configMap
              - secretRef:
                  name: *secret
              - secretRef:
                  name: immich-db-secret
            env:
              LOG_LEVEL: log
              IMMICH_TELEMETRY_INCLUDE: all
              # IMMICH_CONFIG_FILE: /config/immich-config.json
              IMMICH_MEDIA_LOCATION: &mediaLocation /usr/src/app/upload
              # Database connection settings to prevent lock issues
              DB_CONNECTION_LIMIT: "5"
              DB_POOL_TIMEOUT: "20"
              DB_CONNECT_TIMEOUT: "10"
              # Disable motion photo extraction to prevent errors
              IMMICH_DISABLE_MOTION_PHOTOS: "true"
            resources:
              requests:
                cpu: 10m
                memory: 1Gi
              limits:
                memory: 2Gi
                # GPU render node for VAAPI transcoding, from generic-device-plugin
                # (kube-tools). Hardware acceleration itself is switched on in
                # Admin > Video Transcoding: the config file here is not loaded.
                devic.es/dri: 1
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/server/ping
                    port: &port 2283
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 30
              readiness: *probes
              startup:
                enabled: false
    service:
      app:
        controller: immich
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["photos.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 2283
    persistence:
      config:
        type: configMap
        name: immich-server-config
        globalMounts:
          - path: /config
      library:
        type: nfs
        server: ${NAS_IP:=temp}
        path: ${SECRET_NFS_DATA:=temp}
        globalMounts:
          - path: *mediaLocation
            subPath: photos
      # geocoding-dump:
      #   type: emptyDir
      #   globalMounts:
      #     - path: /usr/src/app/.reverse-geocoding-dump
      # transformers-cache:
      #   type: emptyDir
      #   globalMounts:
      #     - path: /usr/src/app/.transformers_cache
