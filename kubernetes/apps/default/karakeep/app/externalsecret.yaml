---
# Karakeep's two app secrets, generated in-cluster: nothing to create in
# Bitwarden. refreshPolicy CreatedOnce, so neither ever rotates on its own.
# NEXTAUTH_SECRET signs sessions (a new one signs everybody out) and
# MEILI_MASTER_KEY is what Meilisearch was started with; web and meilisearch
# read this one Secret, so they always agree, but a rotation for no reason is
# churn. If the Secret is ever deleted, ESO makes new values and the only cost
# is a fresh sign-in.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: karakeep-nextauth
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: karakeep-meili
spec:
  # Alphanumeric, as upstream's docs generate it.
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name karakeep-secret
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: karakeep-nextauth
      rewrite:
        - regexp:
            source: "password"
            target: "NEXTAUTH_SECRET"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: karakeep-meili
      rewrite:
        - regexp:
            source: "password"
            target: "MEILI_MASTER_KEY"
---
# The Prometheus Bearer token for /api/metrics and the workers' /metrics.
# Generated like the two above, but in its own Secret: karakeep-secret is
# CreatedOnce, so a key added to it would never reach the existing Secret.
# Letters and digits only: Karakeep answers 400 to a token with special
# characters. Prometheus reads it from the same Secret (the ServiceMonitor in
# helmrelease.yaml), so a regenerated token needs no other change.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: karakeep-metrics
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name karakeep-metrics
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: karakeep-metrics
      rewrite:
        - regexp:
            source: "password"
            target: "PROMETHEUS_AUTH_TOKEN"
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# The Authentik OIDC client secret. It is generated in `security` next to the
# blueprint that registers the provider (security/authentik/app/
# karakeep-oidc.yaml) and read across namespaces through the
# authentik-oidc-secrets-karakeep store, which serves only that Secret and only
# to `default`. Periodic, so a regenerated secret (a blueprint spec change
# regenerates it) reaches Karakeep within 15 minutes; Reloader restarts the pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name karakeep-oidc
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: authentik-oidc-secrets-karakeep
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        OAUTH_CLIENT_SECRET: "{{ .clientSecret }}"
  data:
    - secretKey: clientSecret
      remoteRef:
        key: authentik-karakeep-oidc
        property: client-secret
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Karakeep's LiteLLM virtual key, minted by litellm-operator into
# llm/litellm-key-karakeep (kubernetes/apps/llm/litellm/keys/karakeep.yaml)
# and read through the litellm-key-secrets-karakeep store, which serves only
# that Secret and only to `default`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name karakeep-litellm
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: litellm-key-secrets-karakeep
    kind: ClusterSecretStore
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        OPENAI_API_KEY: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: litellm-key-karakeep
        property: api-key
