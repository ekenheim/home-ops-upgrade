---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nas
  namespace: default
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Storage"
    gethomepage.dev/href: "https://nas.${SECRET_DOMAIN}"
    gethomepage.dev/icon: "unraid.png"
    gethomepage.dev/name: "Unraid"
spec:
  hostnames:
    - "nas.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: nas
          port: 80
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
