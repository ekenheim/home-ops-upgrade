---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name outline-secret
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        # Both generated with `openssl rand -hex 32`.
        SECRET_KEY: "{{ .SECRET_KEY }}"
        UTILS_SECRET: "{{ .UTILS_SECRET }}"
        # From the Authentik OAuth2/OIDC provider for the `outline` application.
        OIDC_CLIENT_ID: "{{ .OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: outline
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name outline-db-secret
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: crunchy-pgo-secrets
    kind: ClusterSecretStore
  target:
    # Its own secret, NOT creationPolicy: Merge into outline-secret. ESO
    # refuses to merge into a target owned by another ExternalSecret; the
    # HelmRelease mounts both secrets via envFrom instead.
    name: *name
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        # Direct to the primary, not `pgbouncer-host`: the pooler runs in
        # `transaction` mode, which breaks the session-scoped locks Sequelize
        # takes while running migrations on boot.
        #
        # No `?sslmode=` parameter needed here. Outline's Sequelize
        # config enables TLS with `rejectUnauthorized: false` whenever
        # NODE_ENV=production, unless PGSSLMODE=disable is set. That is exactly
        # right for the primary's `hostssl`-only pg_hba.conf plus Crunchy's
        # internal CA — so do NOT set PGSSLMODE.
        DATABASE_URL: 'postgres://{{ .user }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}'
  dataFrom:
    - extract:
        key: postgres-pguser-outline
