# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app outline
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
  - name: rook-ceph-cluster
    namespace: rook-ceph
  - name: volsync
    namespace: storage
  values:
    controllers:
      outline:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/outlinewiki/outline
              tag: 1.9.2
            env:
              NODE_ENV: production
              TZ: ${TIMEZONE}
              URL: https://outline.${SECRET_DOMAIN}
              PORT: &port 3000
              # TLS terminates at the ingress, so Outline must not try to
              # redirect to https itself or it will loop.
              FORCE_HTTPS: "false"
              REDIS_URL: redis://dragonfly.database.svc.cluster.local:6379/2
              # Attachments on the volsync-backed PVC. Switch to FILE_STORAGE=s3
              # against ceph-objectstore if this outgrows the claim.
              FILE_STORAGE: local
              FILE_STORAGE_LOCAL_ROOT_DIR: /var/lib/outline/data
              FILE_STORAGE_UPLOAD_MAX_SIZE: "262144000"
              # Outline has NO local password login; SSO is mandatory.
              # Endpoints are Authentik's generic OIDC ones; the slug in
              # OIDC_LOGOUT_URI must match the Authentik application slug.
              OIDC_DISPLAY_NAME: Authentik
              OIDC_AUTH_URI: https://sso.${SECRET_DOMAIN}/application/o/authorize/
              OIDC_TOKEN_URI: https://sso.${SECRET_DOMAIN}/application/o/token/
              OIDC_USERINFO_URI: https://sso.${SECRET_DOMAIN}/application/o/userinfo/
              OIDC_LOGOUT_URI: https://sso.${SECRET_DOMAIN}/application/o/outline/end-session/
              OIDC_USERNAME_CLAIM: preferred_username
              OIDC_SCOPES: openid profile email
            envFrom:
            - secretRef:
                name: outline-secret
            - secretRef:
                name: outline-db-secret
            probes:
              # /_health runs `SELECT 1`, so it belongs on readiness only —
              # a database blip should drop the pod from the endpoints list,
              # not restart it. Liveness stays a plain TCP check.
              liveness:
                enabled: true
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /_health
                    port: *port
                  initialDelaySeconds: 20
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 2Gi
        pod:
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            runAsNonRoot: true
            fsGroup: 1001
            fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    ingress:
      app:
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Home
          gethomepage.dev/name: Outline
          gethomepage.dev/icon: outline.png
          gethomepage.dev/description: Team Knowledge Base and Wiki
        hosts:
        - host: &host "{{ .Release.Name }}.${SECRET_DOMAIN}"
          paths:
          - path: /
            service:
              identifier: app
              port: http
        tls:
        - hosts:
          - *host
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /var/lib/outline/data
