---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# The Paperless API token. Minted by hand in Paperless (profile -> API auth
# token, for the admin user) and stored in the Bitwarden item `paperless-gpt`,
# field PAPERLESS_API_TOKEN. Not generated here: Paperless issues its own
# tokens.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paperless-gpt-secret
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        PAPERLESS_API_TOKEN: "{{ .PAPERLESS_API_TOKEN }}"
  dataFrom:
    - extract:
        key: paperless-gpt
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# The LiteLLM virtual key, minted by litellm-operator into
# llm/litellm-key-paperless-gpt (apps/llm/litellm/keys/paperless-gpt.yaml) and
# read across namespaces through litellm-key-secrets-paperless-gpt, which
# serves only that Secret and only to `default`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name paperless-gpt-litellm
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: litellm-key-secrets-paperless-gpt
    kind: ClusterSecretStore
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        OPENAI_API_KEY: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: litellm-key-paperless-gpt
        property: api-key
