---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app photon
  namespace: flux-system
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # Its own app, not a fourth container in Dawarich's pod: the index is a
  # throwaway download with no VolSync, it has its own Renovate cadence, and a
  # Photon restart must not Recreate the pod that carries Dawarich's PostGIS.
  # Dawarich does not dependsOn it either: a geocoding miss is not fatal, and
  # the nightly job retries every point still without reverse_geocoded_at.
  dependsOn:
    - name: rook-ceph-cluster
  path: ./kubernetes/apps/default/photon/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
