---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app wyoming-kokoro
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      wyoming-kokoro:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          affinity:
            # Same placement as the other voice services. Note this is CPU-only
            # BY CHOICE, not by limitation: Kokoro-82M synthesises at ~10x
            # realtime on worker3's CPU (measured ~570ms for 5.8s of audio), so
            # putting it on worker4's GPU would buy nothing while adding load to
            # a node that resets under GPU load and already hosts ornith-35b --
            # which is this pipeline's own conversation agent.
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/rocm-worker
                        operator: DoesNotExist
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
        containers:
          # Kokoro-FastAPI: the actual TTS engine, OpenAI-compatible HTTP.
          # Not exposed by the Service -- only the bridge talks to it, over
          # localhost.
          app:
            image:
              repository: ghcr.io/remsky/kokoro-fastapi-cpu
              tag: v0.8.0@sha256:d32322c61254a871e0bc9c38d4e60cd18539cf9b1a2fc8f3ae04409061d0793b
            env:
              TZ: ${TIMEZONE}
              USE_GPU: "false"
              OMP_NUM_THREADS: "8"
            probes:
              readiness: &kokoroprobe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/test
                    port: 8880
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 3
              liveness: *kokoroprobe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/test
                    port: 8880
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext: &ctrsec
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
              # Verified with the per-container tmp emptyDirs below. Both
              # images need a writable /tmp; wyoming-whisper taught us this
              # fails *silently* under a read-only root (a8aef752c), so it was
              # tested rather than assumed here.
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: "4"
                memory: 2Gi
              limits:
                memory: 8Gi
          # wyoming_openai: translates HA's Wyoming protocol to Kokoro's
          # OpenAI-compatible /v1/audio/speech.
          bridge:
            image:
              repository: ghcr.io/roryeckel/wyoming_openai
              tag: 0.5.0@sha256:6b4ceba5ed41249ae7a82a3ad1cec9bcb8bbc3d5246b5f90603320ec4e7a7315
            # The image entrypoint is `python -m wyoming_openai`. It resolves
            # the TTS backend at startup and exits(1) if the endpoint is not
            # answering yet, so without this gate it crash-loops 2-3 times on
            # every pod start while Kokoro loads. Containers in a pod start in
            # parallel, so a probe cannot order them -- hence the explicit wait.
            command: ["/usr/bin/sh", "-c"]
            args:
              - |
                until python3 -c 'import urllib.request; urllib.request.urlopen("http://localhost:8880/v1/test", timeout=2)' 2>/dev/null; do
                  echo "waiting for kokoro..."; sleep 2
                done
                echo "kokoro ready, starting bridge"
                exec python -m wyoming_openai
            env:
              TZ: ${TIMEZONE}
              WYOMING_URI: tcp://0.0.0.0:10200
              WYOMING_LOG_LEVEL: INFO
              WYOMING_LANGUAGES: en
              TTS_OPENAI_URL: http://localhost:8880/v1
              TTS_MODELS: kokoro
              TTS_BACKEND: KOKORO_FASTAPI
              # Kokoro-FastAPI needs no auth, but the OpenAI client refuses to
              # construct without a non-empty key.
              TTS_OPENAI_KEY: not-needed
              # Without this the bridge advertises
              # supports_synthesize_streaming=false and HA waits for the whole
              # utterance. With it, pySBD splits on sentence boundaries and up
              # to three synthesis requests run in flight.
              TTS_STREAMING_MODELS: kokoro
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10200
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 10200
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  failureThreshold: 60
            securityContext: *ctrsec
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    persistence:
      # Separate /tmp per container: both run read-only roots, and they should
      # not share scratch space.
      tmp-kokoro:
        type: emptyDir
        advancedMounts:
          wyoming-kokoro:
            app:
              - path: /tmp
      tmp-bridge:
        type: emptyDir
        advancedMounts:
          wyoming-kokoro:
            bridge:
              - path: /tmp
    service:
      # Add in HA via Settings -> Devices & Services -> Add Integration ->
      # Wyoming Protocol:
      #   host: wyoming-kokoro.default.svc.cluster.local   port: 10200
      # Only the Wyoming port is published; Kokoro's 8880 stays internal.
      app:
        controller: *app
        ports:
          wyoming:
            port: 10200
            protocol: TCP
