---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wyoming-piper
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      # Only holds downloaded voice models -- a piper voice is ~60MB, and this
      # serves one. Deliberately no volsync: re-downloadable from HuggingFace.
      storage: 2Gi
  storageClassName: ceph-block
