---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app wyoming-piper
  namespace: flux-system
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # No namespace: every Flux Kustomization lives in flux-system. Naming
    # `rook-ceph` here (as a HelmRelease dependsOn would) makes Flux look for a
    # Kustomization that does not exist and nothing ever applies -- that broke
    # wyoming-whisper on first deploy, see 6486.
    - name: rook-ceph-cluster
  path: ./kubernetes/apps/default/wyoming-piper/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
