---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Speech-to-Phrase reads Home Assistant's exposed entities, areas and floors
# over the websocket API to build its grammar, so it needs a long-lived token.
# Same Bitwarden item and field the ha-mcp server uses
# (llm/toolhive/ha-mcp/externalsecret.yaml); nothing new to create.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name wyoming-speech-to-phrase
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        HASS_TOKEN: "{{ .HASS_TOKEN }}"
  dataFrom:
    - extract:
        key: home-assistant
