# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app wyoming-speech-to-phrase
  namespace: flux-system
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # No namespace: every Flux Kustomization lives in flux-system (see
    # wyoming-piper/ks.yaml for what naming `rook-ceph` here broke).
    - name: rook-ceph-cluster
    - name: external-secrets-stores
  path: ./kubernetes/apps/default/wyoming-speech-to-phrase/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
