---
apiVersion: v1
kind: ConfigMap
metadata:
  name: "${APP}-gatus-ep"
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      # Deliberately not the shared templates/gatus/guarded or /infra
      # templates: both only resolve <app>.$${SECRET_DOMAIN} over DNS, and this
      # service has no ingress and no DNS record, so those would either fail
      # forever or pass against an unrelated hostname. Wyoming is raw TCP, so
      # the honest check is an actual connect to the service port.
      - name: "${APP}"
        group: guarded
        url: "tcp://${APP}.default.svc.cluster.local:10300"
        interval: 1m
        ui:
          hide-hostname: true
          hide-url: true
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: discord
