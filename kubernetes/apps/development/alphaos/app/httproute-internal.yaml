---
# envoy-gateway: replaces the `internal` Ingress of the same name at cutover.
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alphaos
  namespace: development
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Development"
    gethomepage.dev/name: "AlphaOS"
spec:
  hostnames:
    - "alphaos.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: alphaos
          port: 8503
