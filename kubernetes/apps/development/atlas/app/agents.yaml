---
# Scheduled research agents (atlas-beliefs ticket 17; the owner chose in-cluster CronJobs on
# 2026-10-15: Atlas is LAN-only, so Claude cloud routines can't reach its MCP server).
# Each runs headless Claude Code (agent/run.sh in the atlas repo) on the owner's subscription
# against the in-cluster MCP URL, with only Atlas's tools; nothing is judged or published by a
# routine: every output waits for the lead. Suspend a CronJob to stop it.
#
# The token: `claude setup-token` (the owner), stored in Bitwarden Secrets Manager as the
# secret `atlas-agent-claude` whose value is {"CLAUDE_CODE_OAUTH_TOKEN": "<token>"}.
# yaml-language-server: $schema=https://lds-schemas-5hg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlas-agent-claude
  namespace: development
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: atlas-agent-claude
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        CLAUDE_CODE_OAUTH_TOKEN: "{{ .CLAUDE_CODE_OAUTH_TOKEN }}"
  dataFrom:
    - extract:
        key: atlas-agent-claude
---
# The Scout, weekly: the theme's newest documents for bottleneck cues; opens question Issues.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: atlas-agent-scout
  namespace: development
spec:
  # Frozen 2026-10-20 (Atlas ADR 0004): the claude.ai scheduled tasks research now.
  suspend: true
  schedule: "0 5 * * 1"
  timeZone: UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 4
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 5400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: atlas
            app.kubernetes.io/component: agent-scout
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          containers:
            - name: agent
              image: ghcr.io/ekenheim/atlas-agent:0.6.22
              args: ["scout"]
              env:
                - name: ATLAS_MCP_URL
                  value: http://atlas.development.svc.cluster.local:8000/mcp
                - name: ATLAS_AGENT_THEME
                  value: photonics
              envFrom:
                - secretRef:
                    name: atlas-agent-claude
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests: { cpu: 50m, memory: 256Mi }
                limits: { memory: 1Gi }
          volumes:
            - name: tmp
              emptyDir: {}
---
# The Researcher, Tuesday and Thursday. Since 2026-10-18 (atlas ticket 33, the owner's ask to cover new
# companies): the memory-packaging theme's first thesis, DRAM and HBM supply, with a fixed question and
# seeds Micron and SK hynix instead of the next open Issue, so it never takes a SanDisk Issue before the
# early-call scorecard's SanDisk runs (atlas ticket 29, Amendment 1). Each session starts from the
# earlier ones' prior work. The Scout and the Skeptic stay on photonics for the same reason.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: atlas-agent-researcher
  namespace: development
spec:
  # Frozen 2026-10-20 (Atlas ADR 0004): the claude.ai scheduled tasks research now.
  suspend: true
  schedule: "0 5 * * 2,4"
  timeZone: UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 4
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 5400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: atlas
            app.kubernetes.io/component: agent-researcher
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          containers:
            - name: agent
              image: ghcr.io/ekenheim/atlas-agent:0.6.22
              args: ["researcher"]
              env:
                - name: ATLAS_MCP_URL
                  value: http://atlas.development.svc.cluster.local:8000/mcp
                - name: ATLAS_AGENT_THEME
                  value: memory-packaging
                - name: ATLAS_AGENT_QUESTION
                  value: "Is DRAM and HBM supply constrained, who holds the constraint, and what would relieve it?"
                - name: ATLAS_AGENT_SEEDS
                  value: "micron,sk-hynix"
              envFrom:
                - secretRef:
                    name: atlas-agent-claude
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests: { cpu: 50m, memory: 256Mi }
                limits: { memory: 1Gi }
          volumes:
            - name: tmp
              emptyDir: {}
---
