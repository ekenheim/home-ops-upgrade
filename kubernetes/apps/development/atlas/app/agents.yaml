---
# The early-call scorecard's runner (atlas tickets 29 and 29b): each firing runs the next unrun entry
# of the run list frozen in the image (agent/scorecard/runs.json) as an isolated Researcher session
# as of a past date, on the exact model ID; it does nothing while a scorecard session is open and
# prints {"scorecard":"done"} once all nine are run. Created SUSPENDED: a later PR un-suspends it
# once the pre-run steps are committed (coverage table, code readings, closed-book probes) and
# suspends the other agents for the runs' duration. One firing per ChatGPT 5-hour window.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: atlas-agent-scorecard
  namespace: development
spec:
  suspend: true
  schedule: "0 */6 * * *"
  timeZone: UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 10
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 5400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: atlas
            app.kubernetes.io/component: agent-scorecard
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          containers:
            - name: agent
              image: ghcr.io/ekenheim/atlas-agent:0.6.22
              command: ["/opt/atlas-agent/agent/scorecard-run.sh"]
              env:
                - name: ATLAS_MCP_URL
                  value: http://atlas.development.svc.cluster.local:8000/mcp
                - name: ATLAS_AGENT_MODEL
                  value: claude-opus-5-5
              envFrom:
                - secretRef:
                    name: atlas-agent-claude
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests: { cpu: 50m, memory: 256Mi }
                limits: { memory: 1Gi }
          volumes:
            - name: tmp
              emptyDir: {}
---
# The Chokepoint Watch, Saturdays (atlas Chokepoint Watch W2, the owner's ask of 2026-10-18): one
# week of a watch for supply-chain chokepoints in a theme. It settles due predictions, sweeps for
# what changed, updates the board, adds at most 3 candidates, deep-dives at most 2 and writes the
# week's memo (GET /api/v1/watch-runs). The first run is the architect run: it decomposes the
# industry from its demand driver and sweeps 90 days. It fires on a day no other judge-using agent
# fires, so it never shares the judge's 5-hour window. The theme starts with no companies.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: atlas-agent-watch-robotics
  namespace: development
spec:
  # Frozen 2026-10-20 (Atlas ADR 0004): the claude.ai scheduled tasks research now.
  suspend: true
  schedule: "0 5 * * 6"
  timeZone: UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 6
  failedJobsHistoryLimit: 6
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: atlas
            app.kubernetes.io/component: agent-watch
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          containers:
            - name: agent
              image: ghcr.io/ekenheim/atlas-agent:0.6.22
              args: ["watch"]
              env:
                - name: ATLAS_MCP_URL
                  value: http://atlas.development.svc.cluster.local:8000/mcp
                - name: ATLAS_AGENT_THEME
                  value: robotics
                - name: ATLAS_AGENT_MODEL
                  value: claude-opus-5-5
                - name: ATLAS_WATCH_DEMAND_DRIVER
                  value: "Factory automation and humanoid-robot programmes at automakers, electronics makers and logistics operators, and the robot makers scaling production to serve them"
              envFrom:
                - secretRef:
                    name: atlas-agent-claude
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests: { cpu: 50m, memory: 256Mi }
                limits: { memory: 1Gi }
          volumes:
            - name: tmp
              emptyDir: {}
---
