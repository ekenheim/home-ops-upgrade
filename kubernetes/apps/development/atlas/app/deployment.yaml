---
# Atlas Research (github.com/ekenheim/atlas): evidence-driven investment research on Hindsight.
# One image, two roles in ONE pod: `atlas api` (FastAPI + the static viewer) and `atlas worker`
# (the Postgres job queue: SEC ingest, Hindsight retain/poll, reflect, mental-model refresh).
# They share the RWO archive volume, hence one pod and strategy: Recreate.
# Memory lives in the shared Hindsight (llm/hindsight), bank atlas-ai-infrastructure.
# LiteLLM (llm/litellm) with Atlas's own key: readiness checks it, and each run records the
# deployments MiniMax-M3 routes to. Atlas calls MiniMax-M3 by name, not through atlas-* aliases.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas
  namespace: development
  labels:
    app.kubernetes.io/name: atlas
    app.kubernetes.io/component: app
  annotations:
    # Env comes from ESO-managed Secrets; restart the pod when they rotate.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: atlas
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas
        app.kubernetes.io/component: app
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Schema to head on the DIRECT primary (see externalsecret.yaml).
        - name: migrate
          image: &image ghcr.io/ekenheim/atlas:0.2.5
          args: ["migrate"]
          env: &env
            - name: ATLAS_ACTOR
              value: atlas-owner
            - name: ATLAS_ARCHIVE_ROOT
              value: /data/archive
            - name: ATLAS_HINDSIGHT_URL
              value: http://hindsight-api.llm.svc.cluster.local:8888
            - name: ATLAS_HINDSIGHT_BANK_ID
              value: atlas-ai-infrastructure
            - name: ATLAS_LITELLM_URL
              value: http://litellm.llm.svc.cluster.local:4000
            - name: ATLAS_LLM_EXTRACT_ALIAS
              value: MiniMax-M3
            - name: ATLAS_LLM_REFLECT_ALIAS
              value: MiniMax-M3
            # The MiniMax subscription is dedicated to Atlas (owner, 2026-10-01): the rolling 5 h
            # token budget goes from the cautious default 400k to 4M, an investigation may spend
            # 1M tokens, each Investigator reads 72 passages (default 24) and the Skeptic 48.
            # A 429 from MiniMax still pauses the queue; lower the budget if a quota pause shows.
            - name: ATLAS_MINIMAX_BUDGET_TOKENS
              value: "4000000"
            - name: ATLAS_RUN_TOKEN_BUDGET
              value: "1000000"
            - name: ATLAS_INVESTIGATION_MAX_PASSAGES
              value: "72"
            - name: ATLAS_INVESTIGATOR_MAX_PASSAGES
              value: "48"
            # TradingView (the owner's override, docs/decisions.md in the atlas repo) through the
            # cluster's read-only MCP proxy (kubernetes/apps/llm/toolhive/tradingview-mcp): the
            # proxy holds the sign-in, so Atlas needs no OAuth of its own. Atlas calls three
            # tools (the document catalog, transcript views, news headlines), at most 0.5/s.
            # The access token is a placeholder: the proxy ignores it and it is no secret.
            - name: ATLAS_TRADINGVIEW_ENABLED
              value: "true"
            - name: ATLAS_TRADINGVIEW_MCP_URL
              value: http://mcp-tradingview-mcp-proxy.llm.svc.cluster.local:8080/mcp
            - name: ATLAS_TRADINGVIEW_ACCESS_TOKEN
              value: unused-behind-the-cluster-proxy
            # SEC EDGAR fair access: live fetching with a contact address.
            - name: ATLAS_SEC_LIVE
              value: "true"
            - name: ATLAS_SEC_USER_AGENT
              value: "Atlas Research ${SECRET_ACME_EMAIL}"
            # Discovery (the Scout's web searches) through the in-cluster SearXNG.
            - name: ATLAS_SEARXNG_URL
              value: http://searxng.llm.svc.cluster.local:8080
            # The engines that answer after the 2026-10-01 SearXNG update: the default
            # bing,brave return nothing (bing) or are rate-limited (brave) from this egress IP.
            - name: ATLAS_SEARXNG_ENGINES
              value: duckduckgo,google,startpage,mojeek
            # Exchange sources (FCA NSM for IQE, AMF for Soitec) behind the fetch gate; they
            # send the generic AtlasResearch User-Agent. HKEXnews stays blocked by its terms.
            - name: ATLAS_EXCHANGE_LIVE
              value: "true"
            # Retention triage is on by default with LiteLLM; LLM work is paced by rolling
            # 5 h budgets per provider (runbook "Universe rollout and quota budgets").
            # TradingView (owner override) stays off: ATLAS_TRADINGVIEW_ENABLED unset.
          envFrom: &envFrom
            - secretRef:
                name: atlas-postgres
            - secretRef:
                name: atlas-hindsight
            - secretRef:
                name: atlas-litellm
          securityContext: &securityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: &mounts
            - name: archive
              mountPath: /data/archive
            - name: tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
        # Put Source Versions recorded before 0.2.0 into their Evidence Family (idempotent;
        # new versions get one at ingest).
        - name: assign-families
          image: *image
          args: ["ledger", "assign-families"]
          env: *env
          envFrom: *envFrom
          securityContext: *securityContext
          volumeMounts: *mounts
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
        # 0.2.5 pilot backfills (pilot fixes 07 and 11; both idempotent, so they stay).
        # Normalize companyfacts recorded before XBRL normalization existed (production had
        # no financial observation); a company's failure is logged, not fatal to the pod.
        - name: normalize-financials
          image: *image
          command: ["/bin/sh", "-c"]
          args: ["atlas financials normalize || echo 'financials normalize: a company failed or its submissions were unavailable (see above); the next ingest retries'"]
          env: *env
          envFrom: *envFrom
          securityContext: *securityContext
          volumeMounts: *mounts
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
        # Enqueue one re-parse (parser text-v3) of the Source Versions recorded under an earlier
        # parser; the worker does the work. The fixed key makes a repeat a no-op.
        - name: reparse
          image: *image
          args: ["ledger", "reparse", "--key", "reparse-text-v3-0.2.5"]
          env: *env
          envFrom: *envFrom
          securityContext: *securityContext
          volumeMounts: *mounts
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
        # Create or update the configured companies (configs/themes); idempotent.
        - name: seed-companies
          image: *image
          args: ["companies", "seed"]
          env: *env
          envFrom: *envFrom
          securityContext: *securityContext
          volumeMounts: *mounts
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
        # Apply the research bank template, but only when it changed: a re-import can re-queue
        # mental-model refreshes (LLM spend), so an unchanged template is skipped.
        - name: apply-template
          image: *image
          args: ["hindsight", "apply-template", "--if-changed"]
          env: *env
          envFrom: *envFrom
          securityContext: *securityContext
          volumeMounts: *mounts
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      containers:
        - name: api
          image: *image
          args: ["api"]
          env: *env
          envFrom: *envFrom
          securityContext: *securityContext
          volumeMounts: *mounts
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 15
            failureThreshold: 6
        - name: worker
          image: *image
          args: ["worker"]
          env: *env
          envFrom: *envFrom
          securityContext: *securityContext
          volumeMounts: *mounts
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 2Gi }
      volumes:
        - name: archive
          persistentVolumeClaim:
            claimName: atlas-archive
        - name: tmp
          emptyDir: {}
