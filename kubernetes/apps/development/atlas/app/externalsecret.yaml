---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Postgres for Atlas (database "atlas"): the source ledger, audit trail and job queue.
# DIRECT primary uri, never PgBouncer: migrations take advisory locks and the job queue's
# `FOR UPDATE SKIP LOCKED` needs session semantics. Atlas uses SQLAlchemy with psycopg 3, so
# the scheme is rewritten to postgresql+psycopg://.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlas-postgres
  namespace: development
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: crunchy-pgo-secrets
    kind: ClusterSecretStore
  target:
    name: atlas-postgres
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      data:
        ATLAS_DATABASE_URL: '{{ .uri | replace "postgresql://" "postgresql+psycopg://" }}'
  dataFrom:
    - extract:
        key: postgres-pguser-atlas
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Bearer key for the shared Hindsight (llm/hindsight). Same Bitwarden item the Hindsight
# release itself reads; Atlas keeps its research memory in its own bank there
# (atlas-ai-infrastructure). Note: this tenant key opens every bank on that server.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: atlas-hindsight
  namespace: development
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: atlas-hindsight
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: Opaque
      data:
        ATLAS_HINDSIGHT_API_KEY: "{{ .HINDSIGHT_API_TENANT_API_KEY }}"
  dataFrom:
    - extract:
        key: hindsight
