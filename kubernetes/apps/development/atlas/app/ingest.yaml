---
# Enqueue SEC ingest jobs; the worker in the atlas pod does the work (fetch, archive, parse,
# then retain into Hindsight). These pods only talk to Postgres.
#
# One-off bootstrap: the first ingest of each configured company. Fixed idempotency keys, so
# re-running it (a Flux re-apply, a recreated Job) never enqueues a second ingest.
apiVersion: batch/v1
kind: Job
metadata:
  name: atlas-ingest-bootstrap
  namespace: development
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlas
        app.kubernetes.io/component: ingest
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr-pull
      securityContext: &podSecurity
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: enqueue
          image: &image ghcr.io/ekenheim/atlas:0.1.0
          command: ["/bin/sh", "-c"]
          args:
            - >-
              atlas ingest --company lumentum --key bootstrap-lumentum &&
              atlas ingest --company coherent --key bootstrap-coherent
          env: &env
            - name: ATLAS_ACTOR
              value: atlas-owner
            - name: ATLAS_ARCHIVE_ROOT
              value: /tmp/archive
          envFrom: &envFrom
            - secretRef:
                name: atlas-postgres
          securityContext: &securityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: &mounts
            - name: tmp
              mountPath: /tmp
          resources: &resources
            requests: { cpu: 20m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes: &volumes
        - name: tmp
          emptyDir: {}
---
# Nightly ingest inside the backfill window (ATLAS_BACKFILL_WINDOW, default 01:00-07:00 UTC):
# picks up new filings. Unchanged filings create no new Source Version (conditional requests
# and content hashes), so re-fetching is cheap.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: atlas-ingest-nightly
  namespace: development
spec:
  schedule: "30 1 * * *"
  timeZone: UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: atlas
            app.kubernetes.io/component: ingest
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          containers:
            - name: enqueue
              image: ghcr.io/ekenheim/atlas:0.1.0
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  atlas ingest --company lumentum --backfill &&
                  atlas ingest --company coherent --backfill
              env:
                - name: ATLAS_ACTOR
                  value: atlas-owner
                - name: ATLAS_ARCHIVE_ROOT
                  value: /tmp/archive
              envFrom:
                - secretRef:
                    name: atlas-postgres
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests: { cpu: 20m, memory: 128Mi }
                limits: { memory: 512Mi }
          volumes:
            - name: tmp
              emptyDir: {}
