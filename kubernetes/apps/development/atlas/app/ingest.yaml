---
# Enqueue Atlas jobs; the worker in the atlas pod does the work (fetch, archive, parse,
# then retain into Hindsight). These pods only talk to Postgres. Ingest is bounded by a
# 2-year lookback since 0.1.1.
#
# One-off Jobs (bootstrap ingest, retry-failed 0.1.1, correct-availability 0.1.2) are removed
# once Complete: Renovate bumps their image tag with the Deployment, and a Job's pod template
# is immutable, so a bumped Job fails the dry-run and blocks this whole Kustomization.
# A new one-off gets a new, version-suffixed name and is deleted from Git after it completes.
#
# Nightly ingest as backfill class: since 0.2.0 backfill may run at any time, held by the
# rolling 5 h provider budgets (ATLAS_BACKFILL_WINDOW is unset). Picks up new filings.
# Unchanged filings create no new Source Version (conditional requests and content hashes),
# so re-fetching is cheap.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: atlas-ingest-nightly
  namespace: development
spec:
  schedule: "30 1 * * *"
  timeZone: UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: atlas
            app.kubernetes.io/component: ingest
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          containers:
            - name: enqueue
              image: ghcr.io/ekenheim/atlas:0.2.5
              command: ["/bin/sh", "-c"]
              args:
                # The photonics universe (0.2.1 rollout): SEC filers with at most 5 new retains
                # each per night (a rerun takes the next 5; triage decides what is retained and
                # the rolling 5 h budgets pace it), then IQE (FCA NSM) and Soitec (AMF).
                # Innolight is manual import only (HKEX terms). One failure doesn't stop the rest.
                # Then each company's TradingView catalog (transcripts and headline leads through the
                # cluster's MCP proxy; at most 20 calls a job, so a long history takes several nights).
                - >-
                  rc=0;
                  for c in lumentum coherent axt macom stmicroelectronics marvell
                  applied-optoelectronics fabrinet ciena; do
                  atlas ingest --company "$c" --backfill --max-retains 5 || rc=1; done;
                  for c in iqe soitec; do atlas ingest --company "$c" --backfill || rc=1; done;
                  for c in lumentum coherent axt applied-optoelectronics fabrinet marvell macom
                  ciena stmicroelectronics iqe soitec innolight; do
                  atlas jobs enqueue tradingview_catalog --backfill --key "tradingview-$c-$(date -u +%F)"
                  --payload "{\"company\": \"$c\"}" || rc=1; done;
                  exit $rc
              env:
                - name: ATLAS_ACTOR
                  value: atlas-owner
                - name: ATLAS_ARCHIVE_ROOT
                  value: /tmp/archive
              envFrom:
                - secretRef:
                    name: atlas-postgres
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests: { cpu: 20m, memory: 128Mi }
                limits: { memory: 512Mi }
          volumes:
            - name: tmp
              emptyDir: {}