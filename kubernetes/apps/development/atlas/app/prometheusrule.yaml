---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
# Copied from the atlas repo, configs/prometheus/atlas-alerts.yaml at v0.4.5; keep in step with it.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: atlas
  labels:
    app.kubernetes.io/name: atlas
spec:
  groups:
    - name: atlas.memory
      rules:
        # Repeated failures: Hindsight operations failing for reasons of their own (quota and
        # outage failures pause the queue instead, and are covered by AtlasQueuePausedLong).
        - alert: AtlasHindsightOperationsFailing
          expr: sum by (kind) (increase(atlas_hindsight_operations_total{error_class="permanent"}[1h])) >= 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Hindsight {{ $labels.kind }} operations keep failing"
            description: >-
              {{ $value | humanize }} {{ $labels.kind }} operations failed permanently in the last
              hour; their sections are marked failed. See GET /api/v1/source-versions/{id}/memory.
        - alert: AtlasJobsFailing
          expr: sum by (kind) (increase(atlas_jobs_failed_total[1h])) >= 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Atlas {{ $labels.kind }} jobs are failing with their retries exhausted"
            description: >-
              {{ $value | humanize }} {{ $labels.kind }} jobs failed in the last hour. Their
              failures are in GET /api/v1/jobs/{id}.
        # Zero-fact spike: sections that yielded no facts even after their one reprocess.
        - alert: AtlasZeroFactSpike
          expr: increase(atlas_zero_fact_sections_total[6h]) >= 5
          labels:
            severity: warning
          annotations:
            summary: "Many sections retained with zero facts"
            description: >-
              {{ $value | humanize }} sections were flagged zero_fact in the last 6 hours, which
              suggests the extraction model or the bank template is misbehaving.
        # Atlas's records and the research bank disagree (memory-quality ticket 22): a drift
        # kind above 0 in the nightly reconciliation, and still there a day later.
        - alert: AtlasMemoryDrift
          expr: max by (kind) (atlas_memory_drift) > 0
          for: 24h
          labels:
            severity: warning
          annotations:
            summary: "Atlas's records and Memory disagree: {{ $labels.kind }}"
            description: >-
              The last reconciliation found {{ $value | humanize }} {{ $labels.kind }}
              differences, and the one before found some too. GET /api/v1/memory/reconciliations
              lists the runs with their samples; docs/runbooks.md, "Memory reconciliation", says
              what each kind means and what to do.
        # The last reconciliation failed: a Hindsight listing or read failed, so it counted
        # nothing and the drift gauges still show the run before it.
        - alert: AtlasMemoryReconciliationFailed
          expr: atlas_memory_reconciliation_status{status="failed"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "The last reconciliation of Atlas's records with Memory failed"
            description: >-
              Its error is in GET /api/v1/memory/reconciliations (newest first). Nothing was
              counted; fix the cause and run `atlas memory reconcile --wait` (docs/runbooks.md,
              "Memory reconciliation").
        # No reconciliation has read everything for 36 hours: the nightly run failed (a listing
        # Hindsight could not answer) or stopped running.
        - alert: AtlasMemoryReconciliationStale
          expr: >-
            (time() - atlas_memory_reconciliation_last_success_timestamp_seconds > 129600)
            and atlas_memory_reconciliation_last_success_timestamp_seconds > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "No reconciliation of Atlas's records with Memory for 36 hours"
            description: >-
              The last reconciliation that read everything ended {{ $value | humanizeDuration }}
              ago. A failed run records its error (GET /api/v1/memory/reconciliations); check
              ATLAS_RECONCILE_AT and the worker.
    - name: atlas.financials
      rules:
        # A companyfacts document that couldn't be normalized: its ingest succeeded, so
        # AtlasJobsFailing stays quiet, but the company has no (new) as-of financials.
        - alert: AtlasFinancialNormalizationFailing
          expr: increase(atlas_financial_normalizations_total{outcome="failed"}[24h]) > 0
          labels:
            severity: warning
          annotations:
            summary: "XBRL companyfacts normalization failed"
            description: >-
              {{ $value | humanize }} normalization attempts failed in the last 24 hours. Each
              is a financial_normalization_failure row (and a failed financial_normalization in
              its ingest job's artifacts) with the error; the next ingest tries again.
    - name: atlas.queue
      rules:
        # Long pause: quota or outage failures have held back queued work for over 2 hours
        # (at least two backoffs at the 1 h cap), with no success in between.
        - alert: AtlasQueuePausedLong
          expr: atlas_queue_pause_duration_seconds > 7200
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "The Atlas queue has been paused for over 2 hours"
            description: >-
              Retains have waited {{ $value | humanizeDuration }} on quota or outage failures
              (no fallback model is used). See GET /api/v1/queue for the reason.
        - alert: AtlasStateMetricsDown
          expr: atlas_state_metrics_up == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Atlas can't read its database for metrics"
            description: >-
              The API's /metrics couldn't query the database, so the queue and memory alerts
              above are blind.
