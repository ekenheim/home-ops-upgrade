---
# envoy-gateway, side-by-side phase only. The harbor chart exposes through an
# Ingress OR an HTTPRoute, not both; this mirrors what `expose.type: route`
# renders so it can be tested first. Delete it in the cutover, where the chart
# takes over with its own `harbor-route`.
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor-envoy-canary
spec:
  hostnames:
    - "harbor.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api/}
        - path: {type: PathPrefix, value: /service/}
        - path: {type: PathPrefix, value: /v2/}
        - path: {type: PathPrefix, value: /c/}
      backendRefs:
        - name: harbor-core
          port: 80
    - backendRefs:
        - name: harbor-portal
          port: 80
