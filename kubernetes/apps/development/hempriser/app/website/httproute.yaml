---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hempriser-website
  namespace: development
  labels:
    app.kubernetes.io/name: hempriser
    app.kubernetes.io/component: website
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Hempriser"
    gethomepage.dev/group: "Development"
spec:
  hostnames:
    - "hempriser.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: hempriser-website
          port: 80
