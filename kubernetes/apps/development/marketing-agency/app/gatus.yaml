---
apiVersion: v1
kind: ConfigMap
metadata:
  name: marketing-agency-gatus-ep
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      # Served on the secondary domain, so the external template does not fit
      - name: marketing-agency
        group: external
        url: "https://${SECRET_SECONDARY_DOMAIN}/"
        interval: 1m
        client:
          dns-resolver: tcp://1.1.1.1:53
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: discord
