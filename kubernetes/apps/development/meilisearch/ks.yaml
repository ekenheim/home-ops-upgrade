---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: meilisearch
  namespace: flux-system
spec:
  targetNamespace: development
  commonMetadata:
    labels:
      app.kubernetes.io/name: meilisearch
  dependsOn:
    - name: external-secrets
  path: ./kubernetes/apps/development/meilisearch/app
  # prune: true (was false until 2026-10-18): with false, disabling it left
  # the HelmRelease running unmanaged.
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: meilisearch
      VOLSYNC_CAPACITY: 5Gi
      GATUS_SUBDOMAIN: meilisearch