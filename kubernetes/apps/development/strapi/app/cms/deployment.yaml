---
# Strapi CMS (admin + API) at strapi.${SECRET_DOMAIN}. /uploads/ is public; the rest is
# LAN/Tailscale only (httproute.yaml, securitypolicy.yaml).
#
# Bootstrap image (node + create-strapi-app). On first run it creates a vanilla Strapi v5
# project in /srv/app using the Postgres credentials from strapi-postgres secret.
# Runs in production mode since 2026-10-25: a built admin panel and no Vite dev server
# (which serves the project's files) and no Content-Type Builder. The content types live
# on the PVC (src/api), so to change one, set NODE_ENV=development, edit it in the admin,
# then set production again. Content editing and uploads work in production.
#
# naskio/strapi is NOT used: it is a v4 image and breaks on v5 admin panel builds.
# Strapi publishes NO official images: https://docs.strapi.io/dev-docs/installation/docker
# Upgrades: the image tag is the Strapi version (pinned in build/strapi-bootstrap/Dockerfile,
# bumped by Renovate). The project itself lives on the PVC, so the init container runs
# strapi-sync.sh, which upgrades the PVC whenever the image is newer. It never downgrades.
# A rebuild at the same version (base-image or dependency security fixes) re-pushes the
# same tag with a new digest; Renovate bumps the digest here, and strapi-sync.sh then
# refreshes the PVC's node_modules because the template's package-lock.json changed.
#
# See README.md for the production Dockerfile and bootstrap image instructions.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: strapi-cms
  namespace: development
  labels:
    app.kubernetes.io/name: strapi
    app.kubernetes.io/component: cms
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: strapi
      app.kubernetes.io/component: cms
  template:
    metadata:
      labels:
        app.kubernetes.io/name: strapi
        app.kubernetes.io/component: cms
    spec:
      restartPolicy: Always
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: seed-and-schema
          image: ghcr.io/ekenheim/strapi-bootstrap:5.59.0@sha256:c3e7f81cf8c7b8ceda011959e0ba6e3b7a16843382441f712e9a2ee273f60952
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              APP_DIR="/srv/app"
              # Seed the project on first run, upgrade it when the image ships a
              # newer Strapi than the PVC, and sync the image-owned config.
              /usr/local/bin/strapi-sync.sh
              # Write the Arm content type schema if not already present.
              # Strapi v5 reads schema.json on startup and auto-generates REST endpoints.
              SCHEMA_DIR="$APP_DIR/src/api/arm/content-types/arm"
              if [ ! -f "$SCHEMA_DIR/schema.json" ]; then
                echo "Installing Arm content type schema..."
                mkdir -p "$SCHEMA_DIR"
                cp /schemas/schema.json "$SCHEMA_DIR/schema.json"
              fi
          env:
            # Also sync config/plugins.ts (DeepL translate plugin) from the image.
            - name: SYNC_PLUGINS_CONFIG
              value: "true"
          volumeMounts:
            - name: strapi-data
              mountPath: /srv/app
            - name: arm-schema
              mountPath: /schemas
              readOnly: true
      containers:
        - name: cms
          image: ghcr.io/ekenheim/strapi-bootstrap:5.59.0@sha256:c3e7f81cf8c7b8ceda011959e0ba6e3b7a16843382441f712e9a2ee273f60952
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              cd /srv/app
              if [ "$NODE_ENV" = "production" ]; then
                # Build on every start (about 30 s): the content types are on
                # the PVC, and strapi-sync.sh deletes dist/ when it upgrades.
                echo "Building Strapi..."
                npm run build
                echo "Starting Strapi in production mode..."
                exec npm run start
              fi
              echo "Starting Strapi in development mode..."
              exec npm run develop
          ports:
            - name: http
              containerPort: 1337
              protocol: TCP
          env:
            # development only while changing a content type (see the top).
            - name: NODE_ENV
              value: production
            - name: NODE_OPTIONS
              value: "--max-old-space-size=3072"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "1337"
            - name: URL
              value: "https://strapi.${SECRET_DOMAIN}"
            - name: CORS_ORIGIN
              value: "https://strapi.${SECRET_DOMAIN},https://marketing-agency.${SECRET_DOMAIN},https://${SECRET_SECONDARY_DOMAIN}"
          envFrom:
            - secretRef:
                name: strapi-postgres
            - secretRef:
                name: strapi-app-keys
            - secretRef:
                name: strapi-deepl
          volumeMounts:
            - name: strapi-data
              mountPath: /srv/app
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /_health
              port: http
            failureThreshold: 60
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /_health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: strapi-data
          persistentVolumeClaim:
            claimName: strapi-data
        - name: arm-schema
          configMap:
            name: strapi-arm-schema
