---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: strapi-cms
  namespace: development
  labels:
    app.kubernetes.io/name: strapi
    app.kubernetes.io/component: cms
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Strapi"
    gethomepage.dev/group: "Development"
spec:
  hostnames:
    - "strapi.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: strapi-cms
          port: 1337
---
# Public on purpose: digitomara.com (marketing-agency) builds image URLs as
# NEXT_PUBLIC_STRAPI_URL + /uploads/..., so visitors' browsers fetch media here.
# This longer prefix beats strapi-cms's catch-all, which is private (securitypolicy.yaml).
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: strapi-cms-uploads
  namespace: development
  labels:
    app.kubernetes.io/name: strapi
    app.kubernetes.io/component: cms
spec:
  hostnames:
    - "strapi.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /uploads
      backendRefs:
        - name: strapi-cms
          port: 1337
