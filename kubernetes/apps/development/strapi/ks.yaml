---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: strapi
  namespace: flux-system
spec:
  targetNamespace: development
  commonMetadata:
    labels:
      app.kubernetes.io/name: strapi
  path: ./kubernetes/apps/development/strapi/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
    namespace: flux-system
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: external-secrets
    - name: crunchy-postgres-operator-cluster
    - name: crunchy-postgres-stores
  postBuild:
    substitute:
      APP: strapi
      CLAIM: strapi-data
      VOLSYNC_CAPACITY: 2Gi
      # The app runs as root and leaves root-only files on the PVC; the default
      # uid 568 mover cannot read them all.
      VOLSYNC_UID: "0"
      VOLSYNC_GID: "0"
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
      - kind: Secret
        name: cluster-secrets
