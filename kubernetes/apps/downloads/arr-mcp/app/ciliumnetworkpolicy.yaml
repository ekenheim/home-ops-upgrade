---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
# The arr MCP proxy holds the Sonarr, Radarr and Prowlarr API keys and has no
# auth of its own, so it admits only its callers in config (ingress
# default-deny; kubelet probes from the node are allowed by Cilium
# regardless; egress stays open):
#
#   proxy :8080 <- llm/mcp-gateway (gateway/entries.yaml) and llm/hermes
#
# The server pod (arr-0) is stdio, attached through the API server, and
# listens on nothing. The ToolHive policies in llm/toolhive/app explain the
# labels.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arr-mcp-proxy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mcpserver
      app.kubernetes.io/instance: arr
  enableDefaultDeny:
    ingress: true
    egress: false
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: llm
            app.kubernetes.io/name: virtualmcpserver
            app.kubernetes.io/instance: mcp-gateway
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: llm
            app.kubernetes.io/name: hermes
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
