---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: arr
spec:
  image: docker.io/node:24-alpine
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  # stdio backends serve a single client connection and cannot be scaled.
  backendReplicas: 1
  toolConfigRef:
    name: arr
  audit:
    enabled: true
  env:
    - name: HOME
      value: /tmp
    - name: NPM_CONFIG_CACHE
      value: /tmp/.npm
    - name: SONARR_URL
      value: http://sonarr.downloads.svc.cluster.local
    - name: RADARR_URL
      value: http://radarr.downloads.svc.cluster.local
    - name: PROWLARR_URL
      value: http://prowlarr.downloads.svc.cluster.local
  secrets:
    - name: toolhive-sonarr
      key: SONARR_API_KEY
      targetEnvName: SONARR_API_KEY
    - name: toolhive-radarr
      key: RADARR_API_KEY
      targetEnvName: RADARR_API_KEY
    - name: toolhive-prowlarr
      key: PROWLARR_API_KEY
      targetEnvName: PROWLARR_API_KEY
  # The CRD documents spec.resources as "the resource requirements for the MCP
  # server container", but on operator v0.42.0 it is applied to the toolhive
  # proxy Deployment instead — the backend StatefulSet's `mcp` container comes
  # out with resources:{}. Set both here so limits hold either way.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          image: docker.io/node:24-alpine
          command:
            - npx
          args:
            - -y
            - mcp-arr-server@1.5.4
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
