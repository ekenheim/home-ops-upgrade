---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/toolhive.stacklok.dev/mcptoolconfig_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: arr
spec:
  # Explicit allow list. mcp-arr-server is pulled at pod start via `npx -y
  # mcp-arr-server@1.5.4`, so a version bump can change the tool surface; this
  # list pins what reaches the LLM. New upstream tools stay hidden until added
  # here. To expose a read-only server, delete the six entries marked WRITE.
  toolsFilter:
    - arr_status
    - arr_search_all
    # Sonarr (TV) — read
    - sonarr_get_quality_profiles
    - sonarr_get_health
    - sonarr_get_root_folders
    - sonarr_get_download_clients
    - sonarr_get_naming
    - sonarr_get_tags
    - sonarr_review_setup
    - sonarr_get_series
    - sonarr_get_episodes
    - sonarr_get_queue
    - sonarr_get_calendar
    - sonarr_search
    # Sonarr (TV) — WRITE
    - sonarr_add_series
    - sonarr_search_missing
    - sonarr_search_episode
    # Radarr (Movies) — read
    - radarr_get_quality_profiles
    - radarr_get_health
    - radarr_get_root_folders
    - radarr_get_download_clients
    - radarr_get_naming
    - radarr_get_tags
    - radarr_review_setup
    - radarr_get_movies
    - radarr_get_queue
    - radarr_get_calendar
    - radarr_search
    # Radarr (Movies) — WRITE
    - radarr_add_movie
    - radarr_search_movie
    # Prowlarr (Indexers) — read
    - prowlarr_get_indexers
    - prowlarr_get_stats
    - prowlarr_search
    # Prowlarr (Indexers) — WRITE
    - prowlarr_test_indexers
    # TRaSH Guides — read-only reference data, no *arr mutation
    - trash_list_profiles
    - trash_get_profile
    - trash_list_custom_formats
    - trash_get_naming
    - trash_get_quality_sizes
    - trash_compare_profile
    - trash_compare_naming

  # Only `name` and `description` are honoured. toolsOverride.annotations is
  # accepted by the CRD schema but the operator (v0.42.0) drops it when
  # building the RunConfig, so the readOnlyHint/destructiveHint route is a
  # no-op here — verified against downloads/arr-runconfig. mcp-arr-server
  # itself publishes no annotations either, so the read/write split has to be
  # carried in prose. Every entry MUST set name or description; an
  # annotations-only entry fails reconcile with "tool override for <x> must
  # have either Name or Description set".
  #
  # MCP's server-level `instructions` field is not settable through any
  # ToolHive CRD, so arr_status doubles as the orientation tool — its
  # description is the only place that says what this server is.
  toolsOverride:
    arr_status:
      description: >-
        Entry point for the "arr" MCP server, which fronts this cluster's media
        automation stack: Sonarr (TV series), Radarr (movies) and Prowlarr
        (indexers), plus read-only TRaSH Guides reference data for comparing
        quality profiles and naming schemes against community recommendations.
        Call this first to confirm which services are reachable and their
        versions before using any sonarr_*, radarr_* or prowlarr_* tool. Tools
        prefixed sonarr_/radarr_/prowlarr_ act on that service only; arr_* and
        trash_* span all of them. This server publishes no tool annotations, so
        treat every tool as read-only EXCEPT these six, which change state or
        start downloads: sonarr_add_series, sonarr_search_missing,
        sonarr_search_episode, radarr_add_movie, radarr_search_movie,
        prowlarr_test_indexers.

    # --- WRITE tools: upstream text, prefixed with an explicit warning ---
    sonarr_add_series:
      description: >-
        WRITE — adds a series to the Sonarr library and starts monitoring it;
        confirm with the user before calling. Use sonarr_search first to find
        the tvdbId, and sonarr_get_root_folders / sonarr_get_quality_profiles
        to get valid values for rootFolderPath and qualityProfileId. Use
        sonarr_get_tags to get valid tag IDs.
    sonarr_search_missing:
      description: >-
        WRITE — triggers a search for all missing episodes in a series, which
        queues real downloads and consumes indexer quota. Not idempotent;
        confirm with the user before calling.
    sonarr_search_episode:
      description: >-
        WRITE — triggers a search for specific episode(s), which queues real
        downloads and consumes indexer quota. Not idempotent; confirm with the
        user before calling.
    radarr_add_movie:
      description: >-
        WRITE — adds a movie to the Radarr library and starts monitoring it;
        confirm with the user before calling. Use radarr_search first to find
        the tmdbId, and radarr_get_root_folders / radarr_get_quality_profiles
        to get valid values. Use radarr_get_tags to get valid tag IDs.
    radarr_search_movie:
      description: >-
        WRITE — triggers a search to download a movie already in the library,
        which queues a real download and consumes indexer quota. Not
        idempotent; confirm with the user before calling.
    prowlarr_test_indexers:
      description: >-
        WRITE-ish — changes no local state, but sends live test requests to
        every configured indexer, which counts against rate limits. Returns
        each indexer's health status.
