# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app whisper
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      whisper:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          affinity:
            # This used to be a hard podAffinity onto ollama-igpu, which
            # bought nothing: whisper never requested gpu.intel.com/i915, and
            # the image cannot drive an Intel iGPU anyway (app/config.py picks
            # a device with `"cuda" if torch.cuda.is_available() else "cpu"`,
            # and the only accelerated variant upstream is Dockerfile.gpu,
            # which is CUDA). All it actually did was pin a CPU-saturating
            # transcription service onto a control-plane node.
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  # Never worker4. It is the ROCm node and hosts ornith-35b;
                  # its CPU and iGPU share one memory controller, so a
                  # bandwidth-hungry neighbour costs LLM decode throughput.
                  # Whisper cannot use that GPU regardless -- there is no
                  # ROCm build of this image, and the GPU is handed out
                  # through DRA rather than as an extended resource.
                  - matchExpressions:
                      - key: node-role.kubernetes.io/rocm-worker
                        operator: DoesNotExist
              # Preferred, not required: worker3 is the only non-master,
              # non-rocm node, so requiring this would leave whisper Pending
              # whenever it is drained. Subtitles are not worth that.
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
        containers:
          app:
            image:
              repository: onerahmet/openai-whisper-asr-webservice
              tag: v1.10.0@sha256:0616c3d5fc6924e9d59aa8a7a3a944fbe8f3a5d701e5fc1fa2ce5b933dfecb73
            env:
              TZ: ${TIMEZONE}
              ASR_MODEL: turbo # tiny, base, small, medium, large, large-v1, large-v2, large-v3 and turbo
              # Was ASR_ENGINEL -- a typo the image silently ignored, so this
              # ran the reference `openai_whisper` implementation (the default
              # in app/config.py) rather than faster-whisper, for as long as
              # the typo existed.
              ASR_ENGINE: faster_whisper # openai_whisper, faster_whisper
              # Explicit rather than inherited. app/config.py derives the
              # default from `torch.cuda.is_available()`, so it is int8 today
              # only because there is no CUDA device; naming it keeps the
              # quantization from silently changing to float32 if this ever
              # lands somewhere with a GPU.
              ASR_QUANTIZATION: int8
              # The real throughput knob. FasterWhisperASR builds WhisperModel
              # without a `cpu_threads` argument, so faster-whisper leaves
              # CTranslate2's intra_threads at 0, which means "use
              # OMP_NUM_THREADS, else 4". Unset, this pegs at 4 threads on a
              # 32-core node. Raise together with the cpu request below.
              OMP_NUM_THREADS: "8"
            resources:
              requests:
                # Matches OMP_NUM_THREADS closely enough for the scheduler to
                # place this honestly; 500m badly understated a service that
                # saturates every thread it is given while transcribing.
                cpu: "2"
                memory: 2Gi
              # No cpu limit on purpose: cgroup throttling against a fixed
              # OpenMP thread pool wastes far more time in context switches
              # than it saves. OMP_NUM_THREADS is the bound.
              limits:
                # Back up, and past the 8Gi this was before 4a89cb798. That
                # commit cut the limit to 6Gi on a ~4.1 GiB observation, and
                # the pod has been OOMKilled ever since -- worker3's kernel log
                # records constraint=CONSTRAINT_MEMCG with anon-rss:6250312kB
                # (5.96 GiB), i.e. it hit this cgroup limit, not node pressure.
                #
                # Do NOT re-tune this from a short test transcription. Peak RSS
                # scales with the length of the file Bazarr submits: a 30s clip
                # and a 600s clip both peak at only ~2.0 GiB, so a short-clip
                # benchmark will wrongly justify a low limit. The 6 GiB peaks
                # come from full-length submissions.
                memory: 12Gi
    # defaultPodOptions:
    #   securityContext:
    #     runAsNonRoot: true
    #     runAsUser: 1000
    #     runAsGroup: 100
    #     fsGroup: 100
    #     fsGroupChangePolicy: OnRootMismatch
    #     seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: whisper
        ports:
          http:
            port: 9000
    persistence:
      cache:
        existingClaim: *app
        globalMounts:
          - path: /root/.cache/whisper
      data:
        type: nfs
        server: ${NAS_IP:=temp}
        path: ${SECRET_NFS_DATA:=temp}
        globalMounts:
        - path: /data
      add-ons:
        type: emptyDir
      tmp:
        type: emptyDir