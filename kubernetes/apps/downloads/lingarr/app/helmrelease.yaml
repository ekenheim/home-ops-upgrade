# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lingarr
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      lingarr:
        labels:
          nfsMount: "true"
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/lingarr-translate/lingarr
              tag: 1.4.0@sha256:8f392cf1efe718e0fcbc735d6d82df0b0bf86594bf64998aad85e8f306263774
            # Automation settings live in Lingarr's SQLite DB, not in env (Lingarr only
            # reads integration / language / AI-service keys from the environment).
            # Set 2026-10-12 via POST /api/setting/multiple/set:
            #   translation_schedule      = "0 1,7,13,19 * * *"  (was "0 1 * * *")
            #   max_translations_per_run  = 25                   (was 200)
            # Why: `translate` is MiniMax-M3 on the flat plan, ~300 prompts per
            # rolling 5 h window shared with every other MiniMax caller. At 150
            # lines per batch an episode is 5-11 prompts, so a 200-episode run
            # capped out after ~30 episodes and the rest failed (Oct 10-12). 25
            # episodes six hours apart is ~200 prompts per window and ~100 a day.
            # Change these in the Lingarr UI (Settings > Automation), not here.
            env:
              TZ: ${TIMEZONE}
              ASPNETCORE_URLS: "http://+:9876"
              DB_CONNECTION: sqlite
              MAX_CONCURRENT_JOBS: "3"
            resources:
              requests:
                cpu: 10m
                memory: 256M
              limits:
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
      # Collapses frame-split subtitles before Lingarr sees them: ASS -> SRT
      # conversion turns each frame of an animated sign into its own cue, and
      # Lingarr translates every cue (One-Punch Man S02E01 had 24,359 cues,
      # 19,354 of them one sign; My Hero Academia S02 ~80k each). See
      # scripts/srt-dedupe.py. Runs 15 min before each Lingarr run; keep this
      # schedule in step with translation_schedule above (it lives in Lingarr's
      # DB, not here).
      subtitle-dedupe:
        type: cronjob
        cronjob:
          schedule: "45 0,6,12,18 * * *"
          timeZone: ${TIMEZONE}
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          app:
            image:
              repository: docker.io/library/python
              tag: 3.15-slim@sha256:ea4f1f290e071bf7d28199cfb3e09f5dbad31b50e9c32fd58f2f2d7be915f3ae
            command:
              - python3
              - /scripts/srt-dedupe.py
              - --write
              - --backup-dir=/Media/appdata/lingarr-subtitle-backup
              - --lingarr-url=http://lingarr.downloads.svc.cluster.local:9876
              - /Media/series
              - /Media/series4k
              - /Media/cartoons
              - /Media/movies
              - /Media/movies4k
            env:
              PYTHONDONTWRITEBYTECODE: "1"
            probes:
              liveness: &noProbes
                enabled: false
              readiness: *noProbes
              startup: *noProbes
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: 9876
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Downloads"
          gethomepage.dev/name: "Lingarr"
          gethomepage.dev/icon: "mdi-translate"
          gethomepage.dev/description: "Subtitle Translation"
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 9876
    persistence:
      config:
        existingClaim: *app
        # RWO and VolSync-backed: Lingarr only, not the dedupe CronJob.
        advancedMounts:
          lingarr:
            app:
              - path: /app/config
      scripts:
        type: configMap
        name: lingarr-scripts
        defaultMode: 0555
        advancedMounts:
          subtitle-dedupe:
            app:
              - path: /scripts
      media:
        type: nfs
        server: ${NAS_IP:=temp}
        path: ${SECRET_NFS_DATA:=temp}
        globalMounts:
          - path: /Media
            subPath: Media
