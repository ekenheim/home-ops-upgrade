---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ../../../../templates/volsync
  - ../../../../templates/gatus/guarded
configMapGenerator:
  - name: lingarr-scripts
    files:
      - scripts/srt-dedupe.py
      - scripts/quota-topup.py
generatorOptions:
  # Referenced by name from the HelmRelease values, which kustomize does not rewrite.
  disableNameSuffixHash: true
