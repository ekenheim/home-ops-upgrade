---
# yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json

# Guide-backed profiles: each profile follows a TRaSH Guides quality profile (trash_id),
# so its custom formats, scores and default CF groups (Unwanted, Golden Rule, Streaming
# Services, ...) track the guide on every sync. `name` keeps our existing profile names,
# `qualities` keeps our lower-resolution fallbacks, and `custom_format_groups.add` opts
# into the non-default TRaSH groups we want on top.
# Discover ids with: recyclarr list quality-profiles / list custom-format-groups

###############################################################################
# Sonarr - TV Shows (HD + UHD + Anime)
###############################################################################
sonarr:
  sonarr:
    base_url: http://sonarr.downloads.svc.cluster.local
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true

    quality_definition:
      type: series

    quality_profiles:
      - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
        name: HD
        reset_unmatched_scores:
          enabled: true
        # TRaSH allows WEB 1080p only; keep 720p and HDTV fallbacks
        qualities:
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
              - HDTV-720p

      - trash_id: d1498e7d189fbe6c7110ceaabb7473e6  # WEB-2160p
        name: UHD
        reset_unmatched_scores:
          enabled: true
        # TRaSH allows WEB 2160p only; keep 1080p and 720p fallbacks
        qualities:
          - name: WEB 2160p
            qualities:
              - WEBDL-2160p
              - WEBRip-2160p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
              - HDTV-720p

      - trash_id: 20e0fc959f1f1704bed501f23bdae76f  # [Anime] Remux-1080p
        name: HD - Anime
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: e0b2774083df4265f25c9e5bc6c80940  # [HDR Formats] DV Boost
          assign_scores_to:
            - name: UHD
        - trash_id: 7d366c213e5c23a052b157356fac1921  # [HDR Formats] HDR10+ Boost
          assign_scores_to:
            - name: UHD
        - trash_id: d776a1ea912a117d66d83b880ff2055d  # [HDR Formats] DV (w/o HDR fallback)
          assign_scores_to:
            - name: UHD
        - trash_id: e1053c0ef622df3749fa43c22865663a  # [HDR Formats] SDR
          assign_scores_to:
            - name: UHD
          select:
            - 2016d1676f5ee13a5b7257ff86ac9a93  # SDR
        - trash_id: f60f4401ce880aad62e9d21c8bb6b91a  # [Streaming Services] Dutch (NLZ, VDL)
          assign_scores_to:
            - name: HD
            - name: UHD
        - trash_id: 7832db22b71ab669458c17a2850d6913  # [Streaming Services] Miscellaneous
          assign_scores_to:
            - name: HD
            - name: UHD
          select:
            - 4e9a630db98d5391aec1368a0256e2fe  # CRAV
            - fb1a91cdc0f26f7ca0696e0e95274645  # OViD
            - 3ac5d84fce98bab1b531393e9c82f467  # QIBI
            - c30d2958827d1867c73318a5a2957eb1  # RED

    custom_formats:
      # UHD keeps 1080p/720p fallbacks, so block x265 HD encodes there as HD does
      - trash_ids:
          - 47435ece6b99a0b477caf360e79ba0bb  # x265 (HD)
        assign_scores_to:
          - name: UHD

###############################################################################
# Radarr - Movies (HD 1080p + Anime)
###############################################################################
radarr:
  radarr:
    base_url: http://radarr.downloads.svc.cluster.local
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true

    quality_definition:
      type: movie

    quality_profiles:
      - trash_id: e8c5acb741363a0dbda67d3978f4912f  # WEB 1080p
        name: HD
        reset_unmatched_scores:
          enabled: true
        # TRaSH allows WEB 1080p only; keep 720p and HDTV fallbacks
        qualities:
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
          - name: WEB 720p
            qualities:
              - WEBDL-720p
              - WEBRip-720p
              - HDTV-720p

      - trash_id: 722b624f9af1e492284c4bc842153a38  # [Anime] Remux-1080p
        name: HD - Anime
        reset_unmatched_scores:
          enabled: true

    custom_format_groups:
      add:
        - trash_id: f4f1474b963b24cf983455743aa9906c  # [Optional] Movie Versions
          assign_scores_to:
            - name: HD
          select:
            - 0f12c086e289cf966fa5948eac571f44  # Hybrid
            - 570bc9ebecd92723d2d21500f4be314c  # Remaster
            - e0c07d59beb37348e975a930d5e50319  # Criterion Collection
            - 9d27d9d2181838f76dee150882bdc58c  # Masters of Cinema
            - db9b4c4b53d312a3ca5f1378f6440fc9  # Vinegar Syndrome
            - 957d0f44b592285f26449575e8b1167e  # Special Edition
            - eecf3a857724171f968a66cb5719e152  # IMAX
            - 9f6cbff8cfe4ebbc1bde14c7b7bec0de  # IMAX Enhanced
        - trash_id: 088a792e0561c927fb396664b0db5c8f  # [Streaming Services] Dutch (Pathe, VDL)
          assign_scores_to:
            - name: HD
        - trash_id: 9fc645b3cef52b149ec13ba3972245d1  # [Streaming Services] Miscellaneous
          assign_scores_to:
            - name: HD
          select:
            - f6ff65b3f4b464a79dcc75950fe20382  # CRAV
            - fbca986396c5e695ef7b2def3c755d01  # OViD

###############################################################################
