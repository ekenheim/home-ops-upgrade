---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Apply namespace and CRDs first
  - namespace.yaml
  - gateway-api-ks.yaml
  # Apply the Istio components in order
  - istio-base-ks.yaml
  - istio-istiod-ks.yaml
  - istio-gateway-ks.yaml
  - istio-extras-ks.yaml

  # Seldon Core v1: its directory is gone. Disabling it here with prune: false
  # left the operator HelmRelease (istio-system/seldon-core) running unmanaged;
  # found 2026-10-19 and deleted by hand, keeping the machinelearning.seldon.io
  # CRD.
  #- ./seldon-core/ks.yaml
