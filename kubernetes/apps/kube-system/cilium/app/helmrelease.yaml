---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: 1.20.1
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    disableWait: true
    remediation:
      retries: 3
    timeout: 15m
  upgrade:
    cleanupOnFail: true
    disableWait: true
    remediation:
      strategy: rollback
      retries: 3
    timeout: 15m
  uninstall:
    keepHistory: false
    timeout: 10m
  valuesFrom:
    - kind: ConfigMap
      name: cilium-helm-values
  values:
    hubble:
      metrics:
        enabled:
          - dns:query
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - http
        serviceMonitor:
          enabled: true
        dashboards:
          enabled: true
          annotations:
            grafana_folder: Network
      # relay and ui are off: hubble-relay could not complete its TLS handshake
      # to hubble-peer and crashlooped every ~90s (1780 restarts, ~360/day),
      # relisting on every start, and nothing consumed the UI. The flow/DNS/
      # drop metrics above come straight from the per-node agents and do not
      # need relay, so the Grafana dashboards keep working.
      relay:
        enabled: false
      ui:
        enabled: false
