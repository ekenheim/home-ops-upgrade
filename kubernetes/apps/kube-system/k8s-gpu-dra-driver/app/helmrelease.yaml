---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gpu-dra-driver
spec:
  interval: 30m
  chart:
    spec:
      chart: k8s-gpu-dra-driver
      version: v1.0.1
      sourceRef:
        kind: HelmRepository
        name: rocm
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Creates the gpu.amd.com DeviceClass that ResourceClaimTemplates target.
    deviceClass:
      create: true
    cdi:
      dynamicPath: /var/run/cdi
    kubeletPlugin:
      # Only worker4 has an AMD GPU (Ryzen AI MAX+ 395 "Strix Halo", Radeon
      # 8060S). Without this selector the plugin DaemonSet lands on every node
      # and CrashLoops on the four with no amdgpu device.
      nodeSelector:
        topology.kubernetes.io/gpus: amd
      # worker4 is a dedicated LLM node tainted llm-workload=true:NoSchedule.
      # The plugin is a DaemonSet, so without this it cannot run on the only
      # node that actually has the GPU it manages.
      tolerations:
        - key: llm-workload
          operator: Exists
          effect: NoSchedule
