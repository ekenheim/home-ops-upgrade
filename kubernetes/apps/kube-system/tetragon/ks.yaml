---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tetragon
  namespace: flux-system
spec:
  targetNamespace: kube-system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/kube-system/tetragon/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true # tetragon-policies needs the TracingPolicy CRDs this installs
  interval: 30m
  retryInterval: 1m
  timeout: 10m
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tetragon-policies
  namespace: flux-system
spec:
  # No targetNamespace: the policies are namespaced into the agent-lab
  # sandboxes, and targetNamespace would override every one of them.
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: tetragon
  path: ./kubernetes/apps/kube-system/tetragon/policies
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
