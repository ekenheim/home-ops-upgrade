---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: descheduler
spec:
  interval: 30m
  chart:
    spec:
      chart: descheduler
      version: 0.37.0
      sourceRef:
        kind: HelmRepository
        name: descheduler
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    replicas: 2
    kind: Deployment
    deschedulerPolicyAPIVersion: descheduler/v1alpha2
    deschedulerPolicy:
      maxNoOfPodsToEvictPerNode: 3
      maxNoOfPodsToEvictPerNamespace: 2
      profiles:
        - name: Default
          pluginConfig:
            - name: DefaultEvictor
              args:
                evictFailedBarePods: true
                evictLocalStoragePods: true
                evictSystemCriticalPods: false
                nodeFit: true
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/created-by
                      operator: NotIn
                      values:
                        - volsync
            # Namespace filters live under each plugin's `args`; the
            # v1alpha2 policy ignores a `namespaces:` key next to `name:`.
            #
            # Agent sandboxes (apps/agent-lab) are short Jobs with a
            # run-scoped PVC: any eviction kills the run mid-turn and wastes
            # its budget, so every evicting plugin skips them.
            - name: RemovePodsViolatingInterPodAntiAffinity
              args:
                namespaces:
                  exclude: &agent-sandboxes
                    - agent-work
                    - agent-verify
            - name: RemovePodsViolatingNodeAffinity
              args:
                namespaces:
                  exclude: *agent-sandboxes
                nodeAffinityType:
                  - requiredDuringSchedulingIgnoredDuringExecution
            - name: RemovePodsViolatingNodeTaints
              args:
                namespaces:
                  exclude: *agent-sandboxes
            - name: RemovePodsViolatingTopologySpreadConstraint
              args:
                namespaces:
                  exclude: *agent-sandboxes
                constraints:
                  - DoNotSchedule
            - name: LowNodeUtilization
              args:
                # LowNodeUtilization takes evictableNamespaces (exclude only).
                evictableNamespaces:
                  exclude:
                    - database
                    - media
                    - remote
                    - agent-work
                    - agent-verify
                thresholds:
                  cpu: 35
                  memory: 35
                  pods: 30
                targetThresholds:
                  cpu: 70
                  memory: 70
                  pods: 70
          plugins:
            balance:
              enabled:
                - RemovePodsViolatingTopologySpreadConstraint
                - LowNodeUtilization
            deschedule:
              enabled:
                - RemovePodsViolatingInterPodAntiAffinity
                - RemovePodsViolatingNodeAffinity
                - RemovePodsViolatingNodeTaints
    service:
      enabled: true
    serviceMonitor:
      enabled: true
    leaderElection:
      enabled: true
