---
# Talos API credentials for the snapshot. Talos writes a talosconfig into the
# Secret of the same name. os:etcd:backup allows the etcd snapshot call and
# nothing else; it must be listed in talconfig.yaml's
# kubernetesTalosAPIAccess.allowedRoles and applied to the control plane
# before Talos fills the Secret.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-backup
spec:
  roles:
    - os:etcd:backup
