---
# Talos API credentials for the defrag. Talos writes a talosconfig into the
# Secret of the same name. EtcdDefragment needs os:operator (or os:admin);
# operator is the narrower one: it cannot reset, wipe or reconfigure a node.
# It must be listed in talconfig.yaml's kubernetesTalosAPIAccess.allowedRoles
# and applied to the control plane before Talos fills the Secret.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-defrag
spec:
  roles:
    - os:operator
