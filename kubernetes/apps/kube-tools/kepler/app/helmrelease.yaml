---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Kepler: per-node, per-namespace and per-pod CPU power, attributed from RAPL.
# This is the 0.10+ rewrite; guides for the older eBPF/model-server Kepler
# (kepler-helm-chart, estimator, model-server) do not apply.
#
# app-template rather than upstream's chart: that one is only published at
# oci://quay.io/sustainable_computing_io/charts, and the underscore in the path
# makes helm print a warning on stdout that flux-local then parses as YAML,
# failing the test job. What follows is that chart's DaemonSet, RBAC and
# ConfigMap (v0.12.0, manifests/helm/kepler) one for one.
#
# Readings are RAPL-measured on every node, not modelled. node-exporter
# already reads the same powercap counters (node_rapl_*_joules_total):
#   master2 (Intel Alder Lake)  package, core, uncore, psys
#   worker3 (AMD Zen 5)         package, core
#   worker4 (AMD Strix Halo)    package, core
# Query one zone, `package`, everywhere: zones overlap and must not be summed.
#
# Kepler attributes CPU power only. worker4's iGPU (where llama.cpp actually
# runs) is not attributed to pods: NVML is the only GPU backend. But on Strix
# Halo the RAPL package zone is the whole APU socket, iGPU included: package
# tracks amdgpu's power1_average, which on an APU is the SMU's socket PPT
# (24h mean difference 1.3 W, 2026-10-18). worker4's node total is CPU+iGPU;
# don't add the two.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kepler
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      kepler:
        type: daemonset
        annotations:
          reloader.stakater.com/auto: "true"
        serviceAccount:
          identifier: *app
        pod:
          # The pod informer authenticates to kubelet with this token.
          automountServiceAccountToken: true
          hostPID: true
          hostUsers: true
          # One per node, worker4 and the sole etcd member included: a node
          # agent that skips a node reports a cluster total that is quietly short.
          tolerations:
            - operator: Exists
        containers:
          app:
            image:
              repository: quay.io/sustainable_computing_io/kepler
              tag: v0.12.0@sha256:7681d8b453e4e10ac67c183e0b68238c3d19d3a8af80743354ef57b8511553b0
            command: ["/usr/bin/kepler"]
            args:
              - --config.file=/etc/kepler/config.yaml
              - --kube.enable
              - --kube.node-name=$(NODE_NAME)
            env:
              NODE_NAME:
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            probes:
              # The /probe/* endpoints are cheap; /metrics triggers a power
              # computation on every hit.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /probe/livez
                    port: &port 28282
                  initialDelaySeconds: 10
                  periodSeconds: 60
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /probe/readyz
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 10
            securityContext:
              # Reads RAPL energy_uj, which has been root-only since the
              # PLATYPUS fix, and every process's /proc entry.
              privileged: true
            resources:
              # One value for a DaemonSet, so the busiest node sets it. p95 of
              # rate(container_cpu_usage_seconds_total[5m]) over the first 6.6h
              # (2026-10-18, 5s monitor interval): worker3 710m, master2 560m,
              # worker4 70m; working set peaked at 170Mi on worker3. Expected to
              # drop several-fold with the 30s interval below: re-measure after
              # a week and lower this to the new p95.
              requests:
                cpu: 700m
                memory: 192Mi
              limits:
                memory: 512Mi
    serviceAccount:
      kepler: {}
    rbac:
      roles:
        kepler:
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources: ["pods", "nodes"]
              verbs: ["get", "list", "watch"]
            # The pod informer polls the local kubelet's /pods, which kubelet
            # authorizes as nodes/proxy.
            - apiGroups: [""]
              resources: ["nodes/proxy"]
              verbs: ["get"]
      bindings:
        kepler:
          type: ClusterRoleBinding
          roleRef:
            identifier: kepler
          subjects:
            - identifier: kepler
    configMaps:
      config:
        data:
          # Unset keys keep Kepler's defaults (rapl first, hwmon as backup).
          config.yaml: |
            log:
              level: warn
              format: text
            # Upstream's 5s/500ms made Kepler walk /proc on every node every 5s
            # and again on nearly every scrape: on master2 one computation took
            # 6-10s (the 10s scrape timeout cut it off), so 17.5% of its scrapes
            # failed (up = 0.81 over 6h, 2026-10-18). The cost: a process that
            # starts and exits within one 30s interval is not attributed to its
            # pod (its energy stays in the node total). Staleness stays below the
            # interval, as upstream requires, and covers both Prometheus
            # replicas scraping within 10s of each other with one computation.
            monitor:
              interval: 30s
              staleness: 10s
            host:
              sysfs: /host/sys
              procfs: /host/proc
            kube:
              podInformer:
                mode: kubelet
                pollInterval: 15s
            exporter:
              prometheus:
                enabled: true
                debugCollectors: []
                # No `process` or `vm`: per-PID series churn on every exec,
                # and there are no VMs. `container` is kept for drill-down.
                metricsLevel:
                  - node
                  - pod
                  - container
            web:
              listenAddresses:
                - :28282
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        service:
          identifier: app
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            # The cluster-wide scrape interval; upstream's 5s would make every
            # scrape a power computation. A scrape older than monitor.staleness
            # still computes inline, which took up to 10s on master2 and 9.3s on
            # worker3 (2026-10-18), so the timeout gets the headroom.
            interval: 1m
            scrapeTimeout: 30s
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/kepler
            readOnly: true
      sysfs:
        type: hostPath
        hostPath: /sys
        hostPathType: Directory
        globalMounts:
          - path: /host/sys
            readOnly: true
      procfs:
        type: hostPath
        hostPath: /proc
        hostPathType: Directory
        globalMounts:
          - path: /host/proc
            readOnly: true
