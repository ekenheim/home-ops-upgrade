---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nfs-stale-watchdog
spec:
  # Scans pod events for stale NFS handles (and the symptomatic subPath-prep
  # failure that follows a NAS re-export), then deletes the offending pod so
  # kubelet unmounts and re-mounts on reschedule. See
  # project_nfs_stale_handle_silent_break in memory for background.
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          annotations:
            descheduler.alpha.kubernetes.io/evict: "false"
        spec:
          serviceAccountName: nfs-stale-watchdog
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: watchdog
              image: docker.io/alpine/kubectl:1.35.4@sha256:9ccd823647622b620dce092d0f1406b8b41d152ce08ac963e3d4683770b14dfd
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              command:
                - /bin/sh
                - -ec
                - |
                  set -euo pipefail

                  # Only act on events within the last LOOKBACK_MIN minutes so
                  # we don't re-target a recovered pod whose old event is still
                  # within the API's 1h retention window. This matters for
                  # StatefulSet pods (stable names) where a stale event from
                  # 40min ago could otherwise nuke a healthy replacement.
                  # NOTE: this image ships busybox date, not GNU date. It has
                  # no relative-date parsing ("15 minutes ago" is rejected) and
                  # cannot read RFC3339 without an explicit -D format. Both
                  # idioms were used here originally, so `set -e` aborted this
                  # script on the CUTOFF_EPOCH line on every single run from
                  # 2026-05-25 until 2026-08-31 -- the watchdog never scanned
                  # anything, and posterizarr and tautulli both sat wedged for
                  # 3d16h on 2026-08-28 with it "running" every 5 minutes.
                  # The cutoff is now computed in awk via systime(), and the
                  # event timestamp is parsed with -D below. Keep it that way.
                  LOOKBACK_MIN=15

                  # A matching event does not mean the pod is still broken. A
                  # fresh NFS mount of the Unraid share often starts with a
                  # stale handle that clears by itself within ~3 minutes. The
                  # event stays inside LOOKBACK_MIN long after that, so deleting
                  # on the event alone killed the recovered pod, whose
                  # replacement hit the same transient: posterizarr and tautulli
                  # were recreated every 5 minutes, 118+ times, from 2026-09-18.
                  # Only delete a pod that is still not Ready after MIN_AGE_MIN.
                  MIN_AGE_MIN=10

                  TMPL='{range .items[*]}{.metadata.namespace}|{.involvedObject.kind}|{.involvedObject.name}|{.lastTimestamp}|{.message}{"\n"}{end}'

                  # grep returns 1 on no matches; under pipefail that aborts the
                  # script even though "nothing to clean" is the happy path.
                  { kubectl get events -A --field-selector reason=Failed -o jsonpath="$TMPL" \
                      | grep -E "stale file handle|failed to prepare subPath for volumeMount" || true; } \
                    | awk -F'|' -v lookback="$LOOKBACK_MIN" '
                        BEGIN { cutoff = systime() - lookback * 60 }
                        $2 == "Pod" && $4 != "" {
                          cmd = "date -u -D \"%Y-%m-%dT%H:%M:%SZ\" -d \"" $4 "\" +%s 2>/dev/null"
                          ts = 0
                          cmd | getline ts
                          close(cmd)
                          if (ts >= cutoff) print $1 "\t" $3
                        }' \
                    | sort -u \
                    | while IFS=$'\t' read -r ns pod; do
                        [ -z "$ns" ] && continue
                        [ -z "$pod" ] && continue
                        state=$(kubectl -n "$ns" get pod "$pod" --ignore-not-found \
                          -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}|{.metadata.creationTimestamp}')
                        [ -z "$state" ] && continue
                        ready=$(echo "$state" | cut -d'|' -f1)
                        created=$(echo "$state" | cut -d'|' -f2)
                        if [ "$ready" = "True" ]; then
                          echo "[nfs-watchdog] skipping $ns/$pod: recovered, pod is Ready"
                          continue
                        fi
                        created_s=$(date -u -D "%Y-%m-%dT%H:%M:%SZ" -d "$created" +%s)
                        age_s=$(( $(date -u +%s) - created_s ))
                        if [ "$age_s" -lt $(( MIN_AGE_MIN * 60 )) ]; then
                          echo "[nfs-watchdog] skipping $ns/$pod: only $age_s s old, may still recover"
                          continue
                        fi
                        echo "[nfs-watchdog] deleting $ns/$pod"
                        kubectl -n "$ns" delete pod "$pod" --ignore-not-found --wait=false
                      done

                  echo "[nfs-watchdog] scan complete"
