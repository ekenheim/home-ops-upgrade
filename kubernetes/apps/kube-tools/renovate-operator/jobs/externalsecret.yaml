---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name renovate-github-app
spec:
  # The existing GitHub App `mini-smurf-cluster` (the one the labels and
  # flux-local workflows already use). Its permissions were checked against
  # Renovate's list on 2026-09-28: contents, pull requests, issues, checks,
  # statuses, workflows write; administration, dependabot alerts read.
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        appId: '{{ .BOT_APP_ID }}'
        # Not secret: the app's installation on the ekenheim account
        # (GET /app/installations with the app JWT).
        installationId: "45660126"
        pem: '{{ .BOT_APP_PRIVATE_KEY }}'
  data:
    - secretKey: BOT_APP_ID
      remoteRef:
        key: BOT_APP_ID
    - secretKey: BOT_APP_PRIVATE_KEY
      remoteRef:
        key: BOT_APP_PRIVATE_KEY
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name renovate-secrets
spec:
  # Renovate's `secrets` for .github/renovate.json5, which references
  # {{ secrets.hempriser }}: a PAT for the private ekenheim/nordic-housing API
  # and GHCR tag lookups. With the hosted Mend app it lived in Mend's UI; here
  # it is the GHCR_TOKEN field on the `github_token` Bitwarden item (a classic
  # PAT with repo + read:packages). REQUIRED in practice: `index` keeps the
  # ExternalSecret itself from failing, but Renovate treats an empty secret
  # as missing (interpolator.ts: `if (input?.[key])`) and rejects the whole
  # repo config ("Unknown secrets name: hempriser"). Do not paper over it
  # with a placeholder: a bogus token on the ghcr.io host rule breaks every
  # GHCR lookup, public images included.
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        RENOVATE_SECRETS: '{"hempriser":"{{ index . "GHCR_TOKEN" }}"}'
  dataFrom:
    - extract:
        key: github_token
