---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name renovate-github-app
spec:
  # The existing GitHub App `mini-smurf-cluster` (the one the labels and
  # flux-local workflows already use). Its permissions were checked against
  # Renovate's list on 2026-09-28: contents, pull requests, issues, checks,
  # statuses, workflows write; administration, dependabot alerts read.
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        appId: '{{ .BOT_APP_ID }}'
        # Not secret: the app's installation on the ekenheim account
        # (GET /app/installations with the app JWT).
        installationId: "45660126"
        pem: '{{ .BOT_APP_PRIVATE_KEY }}'
  data:
    - secretKey: BOT_APP_ID
      remoteRef:
        key: BOT_APP_ID
    - secretKey: BOT_APP_PRIVATE_KEY
      remoteRef:
        key: BOT_APP_PRIVATE_KEY
