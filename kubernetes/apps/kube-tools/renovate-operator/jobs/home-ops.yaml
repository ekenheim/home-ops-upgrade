---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: home-ops
spec:
  # Only this repo, which is what the Mend app covered. Its config is the
  # repo's own .github/renovate.json5 -- unchanged by the move.
  discoveryFilters: ["ekenheim/home-ops-upgrade"]
  image: ghcr.io/renovatebot/renovate:44.134.3@sha256:e6080ca2e19263106f51bfcea4c8aaacf14da7f74b71265c1ccff362f5784b94
  parallelism: 1
  provider:
    name: github
  # Hourly, like the hosted app; on demand in between via the webhook.
  schedule: "20 * * * *"
  githubAppReference:
    secretName: renovate-github-app
    appIdSecretKey: appId
    installationIdSecretKey: installationId
    pemSecretKey: pem
  extraEnv:
    - name: LOG_LEVEL
      value: info
    # Commits through the API as the app, so they show as verified.
    - name: RENOVATE_PLATFORM_COMMIT_ENABLED
      value: "true"
    # ghcr.io credential for the private ghcr.io/ekenheim/* images. GHCR only
    # accepts a classic PAT for those: the app's installation token is denied
    # ("installation not allowed to Read organization package") even with the
    # source repos in the installation (tested 2026-10-04). The PAT is
    # read:packages only. Renovate turns these two variables into a
    # {hostType: docker, matchHost: ghcr.io} host rule. The secret is optional:
    # without it, public GHCR lookups still work anonymously and only the
    # private images fail.
    - name: RENOVATE_DETECT_HOST_RULES_FROM_ENV
      value: "true"
    - name: RENOVATE_DOCKER_GHCR_IO_USERNAME
      value: ekenheim
    - name: RENOVATE_DOCKER_GHCR_IO_PASSWORD
      valueFrom:
        secretKeyRef:
          name: renovate-ghcr
          key: token
          optional: true
    # Package cache on the renovate-cache PVC (see pvc.yaml) instead of the
    # per-pod /tmp emptyDir, so lookups survive between runs.
    - name: RENOVATE_CACHE_DIR
      value: /cache
  extraVolumes:
    - name: cache
      persistentVolumeClaim:
        claimName: renovate-cache
  extraVolumeMounts:
    - name: cache
      mountPath: /cache
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  webhook:
    enabled: true
    # The webhook server is cluster-internal only (no route), and the only
    # caller is the trigger workflow on the in-cluster runners.
    authentication:
      enabled: false
