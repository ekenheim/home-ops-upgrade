---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app renovate-operator
  namespace: flux-system
spec:
  path: ./kubernetes/apps/kube-tools/renovate-operator/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: kube-tools
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app renovate-jobs
  namespace: flux-system
spec:
  # The RenovateJob and its GitHub App credentials. Separate because the
  # RenovateJob CRD ships with the operator chart above.
  path: ./kubernetes/apps/kube-tools/renovate-operator/jobs
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: kube-tools
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  dependsOn:
    - name: renovate-operator
    - name: external-secrets-stores
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
