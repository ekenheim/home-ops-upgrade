---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tuppr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: tuppr
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Single replica with leader election OFF. Two replicas + leader election
    # deadlocked every upgrade: this cluster's API server latency spikes during
    # a drain (mass pod eviction), the lease renewal misses its deadline, and the
    # manager exits(1) *mid-drain* -- leaving the node cordoned and un-upgraded.
    # On restart it picks a different node and cordons that one too, so
    # `parallelism: 1` ended up with two nodes cordoned and zero upgraded.
    # With one replica there is nothing to elect, and no lease to lose.
    # Set this to 0 to hold upgrades whenever Ceph cannot lose a host. The drain
    # uses disableEviction, so the Rook PDBs do not protect OSDs. On 2026-10-15,
    # with two masters dead, draining worker3 left 71 PGs with a single copy,
    # blocked I/O cluster-wide and deadlocked the drain. Held until 2026-10-22,
    # when the DeskMini masters joined and Ceph was back to five OSD hosts.
    replicaCount: 1
    controller:
      leaderElection:
        enabled: false
    monitoring:
      serviceMonitor:
        enabled: true
