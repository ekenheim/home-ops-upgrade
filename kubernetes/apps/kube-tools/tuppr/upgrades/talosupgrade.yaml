---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/installer-base
    version: v1.14.4
  policy:
    # These nodes need a hard power-cycle: the graceful reboot deadlocks
    # unmounting Ceph RBD volumes when the cluster is degraded.
    rebootMode: powercycle
  # tuppr version-swaps each node's own .machine.install.image, so the Intel
  # (master*) and AMD (worker3) factory schematics are each preserved.
  drain:
    enabled: true
    # Force-delete instead of evicting: rook-ceph-mon-pdb (maxUnavailable: 0)
    # blocks eviction of the on-node mon, which otherwise stalls the drain
    # until the job times out. Talos powercycles the node next anyway.
    disableEviction: true
  healthChecks:
    - apiVersion: v1
      kind: Node
      expr: |-
        status.conditions.exists(c, c.type == "Ready" && c.status == "True")
      timeout: 10m
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      # tuppr runs these checks before draining each node, and retries every
      # minute while they fail. So this holds the next drain until the previous
      # node's OSD is back and its PGs have recovered. "Not HEALTH_ERR" alone
      # was not enough: on 2026-10-22 master3's OSD took ~3 min to rejoin after
      # the node went Ready, tuppr drained master1 meanwhile, and with two hosts
      # down 24% of PGs went inactive. HEALTH_OK is too strict: the muted
      # auth-key warnings and the noout flag Rook leaves on drained hosts stay.
      expr: |-
        status.ceph.health != 'HEALTH_ERR' && (!has(status.ceph.details) || !(
          'OSD_DOWN' in status.ceph.details ||
          'OSD_HOST_DOWN' in status.ceph.details ||
          'PG_AVAILABILITY' in status.ceph.details ||
          'PG_DEGRADED' in status.ceph.details
        ))
      timeout: 30m
    # Belt and braces for the check above: Rook refreshes the CephCluster
    # status only every minute, so also require every OSD pod to be back.
    - apiVersion: apps/v1
      kind: Deployment
      namespace: rook-ceph
      labelSelector:
        matchLabels:
          app: rook-ceph-osd
      expr: |-
        has(status.readyReplicas) && status.readyReplicas == spec.replicas
      timeout: 30m
    - apiVersion: volsync.backube/v1alpha1
      kind: ReplicationSource
      expr: |-
        status.conditions.filter(c, c.type == "Synchronizing").all(c, c.status == "False")
      timeout: 10m
