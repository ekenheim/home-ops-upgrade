---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name ai-marketplace-monitor
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # All three come from a NEW `ai-marketplace-monitor` Bitwarden Secrets
        # Manager item. A missing FIELD renders empty while this still reports
        # SecretSynced, so a typo shows up as a failed Facebook login or a 401
        # from litellm, not here.
        #
        # The Facebook account the scraper logs in as. config.toml reads these
        # through its own env substitution, so they never sit on the PVC.
        # Use an account you can afford to have challenged: Facebook does flag
        # automated browsing.
        FACEBOOK_USERNAME: '{{ .FACEBOOK_USERNAME }}'
        FACEBOOK_PASSWORD: '{{ .FACEBOOK_PASSWORD }}'
        # litellm VIRTUAL key, never the master key. Only `fast` is called.
        LITELLM_API_KEY: '{{ .LITELLM_API_KEY }}'
  dataFrom:
    - extract:
        key: ai-marketplace-monitor
