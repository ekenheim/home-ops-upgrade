---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
#
# BoPeng/ai-marketplace-monitor: watches Facebook Marketplace searches in a
# real (headful, Xvfb) Chromium, has a model rate each new listing against a
# plain-language description, and notifies on good ones. After
# joryirving/home-ops (kubernetes/apps/base/llm/ai-marketplace-monitor).
#
# THE WEB UI LOGIN IS THE FACEBOOK LOGIN. Upstream binds the UI to 127.0.0.1
# (no password, port-forward only). Here it listens on 0.0.0.0 behind the
# internal ingress instead, and the app's own rule for that case applies: it
# refuses to start without credentials and asks for them at the door, and the
# credentials it means are the marketplace ones -- FACEBOOK_USERNAME /
# FACEBOOK_PASSWORD from the Secret. There is no separate UI password, and
# the username is shown as a hint on the login page to anyone who loads it.
# config.toml must NOT carry those two as env placeholders: see the init
# container, which removes them, and configmap.yaml for why.
# What sits behind that login is a config editor and a noVNC view ("Browser")
# of a Chromium that is logged in to Facebook, so: internal class only.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ai-marketplace-monitor
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      # Not worker4 (tainted anyway), and not master1 if it can be helped: a
      # headful Chromium on a node that throttles at 95C is a poor neighbour.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["master1"]
    controllers:
      ai-marketplace-monitor:
        # RWO PVC: RollingUpdate would hang on Multi-Attach (hindsight did).
        strategy: Recreate
        annotations:
          secret.reloader.stakater.com/reload: *app
        initContainers:
          seed-config:
            image: &image
              repository: ghcr.io/bopeng/ai-marketplace-monitor
              tag: 0.10.2@sha256:0f5c180cca0317475a7fd3b199054abb64b98845b3a29c74fb1dcdf2a1257835
            # Copy the starter only if there is no config yet; see
            # configmap.yaml. No braces or positional parameters in here: Flux
            # envsubst runs over this file too.
            command:
              - sh
              - -c
              - |
                set -eu
                F=/root/.ai-marketplace-monitor/config.toml
                if [ ! -f "$F" ]; then
                  cp /seed/config.toml "$F"
                  echo "seeded starter config.toml"
                fi
                # The one edit made to a config that already exists. The first
                # seed (and upstream's default template) wrote the Facebook
                # credentials as env placeholders; the web UI compares its
                # login against the raw text, so with the UI on 0.0.0.0 those
                # lines make the login a guessable literal. Without them both
                # the monitor and the UI use the real values from the
                # environment. See configmap.yaml. Real credentials typed into
                # the file by hand do not match these patterns and are kept.
                sed -i -e '/^username *= *.*FACEBOOK_USERNAME/d' -e '/^password *= *.*FACEBOOK_PASSWORD/d' "$F"
                if grep -q '^[^#]*FACEBOOK_\(USERNAME\|PASSWORD\)' "$F"; then
                  echo "placeholder credentials still in config.toml, refusing to start" >&2; exit 1
                fi
                echo "config.toml carries no placeholder credentials"
        containers:
          app:
            image: *image
            env:
              TZ: "${TIMEZONE}"
              AIMM_WEBUI_HOST: 0.0.0.0
            envFrom:
              - secretRef:
                  name: *app
            probes:
              # exec against loopback, as upstream: a request from 127.0.0.1 is
              # never asked to log in, so the probe needs no credentials.
              liveness:
                enabled: true
                custom: true
                spec:
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 5
                  exec: &probe
                    command:
                      - /usr/bin/curl
                      - --fail
                      - --silent
                      - --output
                      - /dev/null
                      - http://127.0.0.1:8467/
              readiness:
                enabled: true
                custom: true
                spec:
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  timeoutSeconds: 5
                  exec: *probe
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8467
    ingress:
      app:
        enabled: true
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: LLM
          gethomepage.dev/name: Marketplace Monitor
          gethomepage.dev/icon: mdi-storefront-outline
          gethomepage.dev/description: Facebook Marketplace watcher (login = the Facebook credentials)
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
          # Live log stream and the noVNC browser view are long-lived websockets.
          nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
          nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        hosts:
          - host: &host marketplace.${SECRET_DOMAIN}
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /root/.ai-marketplace-monitor
      seed:
        type: configMap
        name: ai-marketplace-monitor-seed
        advancedMounts:
          ai-marketplace-monitor:
            seed-config:
              - path: /seed
                readOnly: true
