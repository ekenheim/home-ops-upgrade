---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name alert-triage
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # The same channel Alertmanager posts to. Triage digests land next to
        # the raw alerts they explain; give it its own webhook if that is noisy.
        DISCORD_WEBHOOK_URL: '{{ .DISCORD_WEBHOOK_URL }}'
  dataFrom:
    - extract:
        key: discord
