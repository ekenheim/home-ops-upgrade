---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app alert-triage
  namespace: flux-system
spec:
  path: ./kubernetes/apps/llm/alert-triage/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: llm
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  dependsOn:
    - name: external-secrets-stores
    - name: rook-ceph-cluster
    # LITELLM_API_KEY is the operator-minted Secret litellm-key-alert-triage.
    - name: litellm-keys
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
