---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name courier-dispatch
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # The one dispatch agent token (also the bridge's and hermes').
        token: '{{ .DISPATCH_AGENT_TOKEN }}'
  dataFrom:
    - extract:
        key: dispatch
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name courier-github
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # The same agent PAT foreman used. Courier's contract asks for a token
        # that cannot push to or merge a protected default branch; this PAT
        # inherits whatever the owner account can do, and main's protection
        # does not enforce admins -- the same exposure foreman had.
        token: '{{ .GITHUB_TOKEN }}'
        username: x-access-token
  dataFrom:
    - extract:
        key: github_token
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name courier-executor
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # courier's own operator-minted key (../../litellm/keys/courier.yaml),
        # read through the litellm-key-secrets-courier store below. The
        # executor takes ONE Secret, so this ExternalSecret merges the key with
        # the Bitwarden GITHUB_TOKEN. Until 2026-10-11 it was the hand-made
        # key on the retired `foreman` item.
        LITELLM_API_KEY: '{{ index . "api-key" }}'
        GITHUB_TOKEN: '{{ .GITHUB_TOKEN }}'
        # OpenCode provider config for the LaneProfile roles. Context limits
        # are each alias' smallest rung (see litellm's configmap). The
        # timeout is long because the worker4 model and MiniMax can take minutes on a
        # large diff.
        OPENCODE_CONFIG_CONTENT: |-
          {
            "provider": {
              "litellm": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "LiteLLM",
                "options": {
                  "baseURL": "http://litellm.llm.svc.cluster.local:4000/v1",
                  "apiKey": "{env:LITELLM_API_KEY}",
                  "timeout": 1800000
                },
                "models": {
                  "reasoning-pool": {
                    "name": "Reasoning pool (ChatGPT -> MiniMax M3 -> Qwen3.8 Flash-Next)",
                    "limit": { "context": 262144, "output": 32768 }
                  },
                  "implementation-pool": {
                    "name": "Implementation pool (MiniMax M2.7 -> ChatGPT luna -> Qwen3.8 Flash-Next)",
                    "limit": { "context": 204800, "output": 32768 }
                  },
                  "self-hosted": {
                    "name": "Qwen3.8 Flash-Next (worker4)",
                    "limit": { "context": 262144, "output": 16384 }
                  }
                }
              }
            }
          }
  dataFrom:
    - sourceRef:
        storeRef:
          name: litellm-key-secrets-courier
          kind: ClusterSecretStore
      extract:
        key: litellm-key-courier
    - extract:
        key: github_token
