---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name courier-dispatch
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # The one dispatch agent token (also the bridge's and hermes').
        token: '{{ .DISPATCH_AGENT_TOKEN }}'
  dataFrom:
    - extract:
        key: dispatch
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name courier-github
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # The same agent PAT foreman used. Courier's contract asks for a token
        # that cannot push to or merge a protected default branch; this PAT
        # inherits whatever the owner account can do, and main's protection
        # does not enforce admins -- the same exposure foreman had.
        token: '{{ .GITHUB_TOKEN }}'
        username: x-access-token
  dataFrom:
    - extract:
        key: github_token
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name courier-executor
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # foreman's LiteLLM key, inherited with the job (verified it can call
        # reasoning-pool, implementation-pool and self-hosted). The executor
        # takes ONE Secret, so it cannot also mount an operator-minted key.
        LITELLM_API_KEY: '{{ .LITELLM_API_KEY }}'
        GITHUB_TOKEN: '{{ .GITHUB_TOKEN }}'
        # OpenCode provider config for the LaneProfile roles. Context limits
        # are each alias' smallest rung (see litellm's configmap). The
        # timeout is long because Ornith and MiniMax can take minutes on a
        # large diff.
        OPENCODE_CONFIG_CONTENT: |-
          {
            "provider": {
              "litellm": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "LiteLLM",
                "options": {
                  "baseURL": "http://litellm.llm.svc.cluster.local:4000/v1",
                  "apiKey": "{env:LITELLM_API_KEY}",
                  "timeout": 1800000
                },
                "models": {
                  "reasoning-pool": {
                    "name": "Reasoning pool (ChatGPT -> MiniMax M3 -> Ornith)",
                    "limit": { "context": 262144, "output": 32768 }
                  },
                  "implementation-pool": {
                    "name": "Implementation pool (MiniMax M2.7 -> ChatGPT luna -> Ornith)",
                    "limit": { "context": 204800, "output": 32768 }
                  },
                  "self-hosted": {
                    "name": "Ornith 35B (worker4)",
                    "limit": { "context": 262144, "output": 16384 }
                  }
                }
              }
            }
          }
  dataFrom:
    - extract:
        key: foreman
    - extract:
        key: github_token
