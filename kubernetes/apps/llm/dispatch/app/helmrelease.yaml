---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dispatch
spec:
  chartRef:
    kind: OCIRepository
    name: dispatch
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            env:
              DISPATCH_EXCLUDED_LABELS: renovate
              # --- Grooming: rewrite raw issues into agent-ready specs --------
              DISPATCH_HOSTED_GROOMER_ENABLED: "true"
              DISPATCH_GROOMER_DRY_RUN: "false"
              DISPATCH_GROOMER_REPO_CONTEXT_ENABLED: "true"
              DISPATCH_LLM_BASE_URL: http://litellm.llm:4000/v1
              # `self-hosted`, not `fast`: grooming is the one step where the
              # reasoning is load-bearing -- it has to judge scope and write
              # acceptance criteria. `fast` is the same weights with thinking
              # off, which is right for extraction, not for this.
              DISPATCH_GROOMER_MODEL: self-hosted
              DISPATCH_SCHEDULER_ENABLED: "true"
              # --- PR follow-up: CI failures / review comments -> pr-fix queue -
              # The `pr-followup` scheduler job drops every PR whose author is
              # not in this list before it looks at anything, and the default is
              # exactly ["github-actions[bot]"]. foreman opens its PRs with the
              # shared agent PAT, so today they are authored by `ekenheim` and
              # every one of them is filtered out: the sync reports
              # `prsScanned: 0` and the whole pr-fix half of the loop -- CI
              # failures, CHANGES_REQUESTED reviews, merge conflicts -- has
              # never run, no matter what ../bridge/helmrelease.yaml's
              # PR_FIX_ENABLED says.
              #
              # Deliberately NOT set to `ekenheim`. That identity is also the
              # human's, so it would make every hand-opened PR in a synced repo
              # eligible for an agent to amend on a red check. The fix is a
              # dedicated machine account. A GitHub App is not a substitute:
              # dispatch supports one, but *foreman* is what opens the PR and
              # its agent binary understands nothing but a static GITHUB_TOKEN,
              # so App auth moves who syncs issues while PR authorship -- the
              # only thing this filter reads -- stays put.
              #
              # To switch:
              #   1. Register the account, invite it with write access to every
              #      synced repo (alphaos, marketing-agency, nordic-housing),
              #      and accept from that account.
              #   2. Signed in as it, mint a PAT -- classic needs `repo` +
              #      `workflow`; fine-grained needs Contents r/w, Pull requests
              #      r/w, Issues r/w and Metadata read on every synced repo
              #      (Issues because the same token does dispatch's issue sync).
              #      Replace field `GITHUB_TOKEN` on the `github_token`
              #      Bitwarden item with it -- one item feeds both the
              #      `dispatch` and `foreman-agent` Secrets, so sync, commits,
              #      PRs and label writes move identity together. Keep the field
              #      name exact: a renamed field renders empty and the
              #      ExternalSecret still reports SecretSynced.
              #   3. Point commitAuthorName / commitAuthorEmail in
              #      ../../foreman/app/helmrelease.yaml at the new account.
              #   4. Uncomment PR_FOLLOWUP_BOT_IDENTITIES below, set to its login.
              #   5. Force-sync and restart. dispatch self-reloads via
              #      reloader.stakater.com/auto; foreman does NOT -- the chart
              #      exposes only agent.podAnnotations and Reloader watches
              #      Deployment annotations, so the restart is manual:
              #        kubectl annotate externalsecret -n llm dispatch \
              #          foreman-agent force-sync=<any-new-value> --overwrite
              #        kubectl rollout restart -n llm deploy/foreman-agent
              #   6. Verify: the next PR foreman opens should make `prsScanned`
              #      non-zero in POST /api/pr-followup/sync. PRs opened before
              #      the switch stay invisible -- still the old author.
              #
              # PR_FOLLOWUP_BOT_IDENTITIES: ekenheim-agent
              #
              # Note PR_FOLLOWUP_BRANCH_OWNERS is not a way around this: despite
              # the name it is matched against the repo owner, not the branch
              # prefix, so it cannot scope follow-up to `foreman/*` branches.
              # --- Lanes ------------------------------------------------------
              # Two lanes, not upstream's three. Upstream's `frontier` lane is
              # an escalation target backed by a cloud model (MiniMax-M3 via
              # litellm); this cluster serves only ornith-35b, so there is
              # nothing to escalate TO and a claimable frontier lane would just
              # re-run the same model. Add it here (and ESCALATION_LANE in
              # ../bridge/helmrelease.yaml) if a cloud model is ever enabled in
              # ../../litellm/app/configmap.yaml.
              DISPATCH_LANE_CONFIG_JSON: >-
                {"lanes":[{"id":"local","title":"Local","claimable":true,"role":"default","description":"Local
                model lane (ornith-35b on worker4) — all groomed, ready work
                starts here.","color":"#3b82f6"},{"id":"backlog","title":"Backlog","claimable":false,"description":"Needs
                grooming before work can start. Not directly
                claimable.","color":"#6b7280"}],"laneAliases":{"normal":"local","escalated":"local","cloud":"local","frontier":"local"}}
              # The chart never creates this Secret; ../app/externalsecret.yaml
              # renders it from the crunchy cluster's pguser Secret.
              DATABASE_URL: &dburl
                valueFrom:
                  secretKeyRef:
                    name: dispatch-db-secret
                    key: uri
            envFrom:
              - secretRef:
                  name: dispatch
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi
    ingress:
      main:
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Data Science
          gethomepage.dev/name: Dispatch
          gethomepage.dev/icon: mdi-clipboard-list
          gethomepage.dev/description: GitHub issue assignment queue for coding agents
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
        hosts:
          - host: "{{ .Release.Name }}.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: main
                  port: http
    # Pre-install/pre-upgrade hook Job that runs `prisma migrate deploy`, so the
    # server pods never migrate (they always start with SKIP_DB_MIGRATIONS=true).
    # It needs DATABASE_URL of its own -- the container env above does not reach
    # the hook.
    migrations:
      env:
        DATABASE_URL: *dburl
