---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dispatch
  namespace: llm
  annotations:
    gethomepage.dev/description: "GitHub issue assignment queue for coding agents"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "Data Science"
    gethomepage.dev/icon: "mdi-clipboard-list"
    gethomepage.dev/name: "Dispatch"
spec:
  hostnames:
    - "dispatch.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: dispatch
          port: 3000
