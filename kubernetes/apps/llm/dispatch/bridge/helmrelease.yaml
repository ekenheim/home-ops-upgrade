---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app foreman-dispatch-bridge
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      # app-template defaults this off; the bridge needs its SA token to create
      # Workload CRs through the in-cluster API (load_incluster_config).
      automountServiceAccountToken: true
    controllers:
      foreman-dispatch-bridge:
        type: cronjob
        cronjob:
          schedule: "*/15 * * * *"
          timeZone: "${TIMEZONE}"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
        serviceAccount:
          identifier: *app
        containers:
          app:
            image:
              repository: ghcr.io/misospace/foreman-dispatch-bridge
              tag: 0.7.6@sha256:f6d61c9a161647acded1b7c7060050495f03292a1378ec31d7e9447a5d926e34
            env:
              DISPATCH_URL: http://dispatch.llm:3000
              # Dash, not slash: agents auto-register, but a "/" splits the queue
              # URL path (/api/agents/{name}/queue) and 404s.
              DISPATCH_AGENT_NAME: foreman-coder
              # Single lane -- see DISPATCH_LANE_CONFIG_JSON in
              # ../app/helmrelease.yaml for why upstream's `frontier` escalation
              # lane is dropped. ESCALATION_LANE is deliberately unset: with no
              # second model to escalate to, re-laning an exhausted issue would
              # just re-run ornith-35b. Exhausted issues tombstone instead.
              DISPATCH_LANES: local
              # One coder Agent, so no round-robin list (upstream rotates across
              # coder/coder-strix/coder-frontier, which were model variants this
              # cluster does not have).
              LANE_CODER_AGENTS: '{"*":"coder"}'
              REVISION_CODER_AGENTS: '{"*":"coder-revision"}'
              FOREMAN_NAMESPACE: llm
              # Concurrent issues in flight. Each one occupies a FleetNode per
              # pipeline step, so keep this at or below
              # ../../foreman/app/helmrelease.yaml's agent.replicaCount.
              MAX_IN_PROGRESS: "2"
              # Emits the `verify` step, so the pipeline is the documented
              # code -> verify -> review rather than code -> review. False (as
              # this shipped, carried over from the initial port) drops the
              # deterministic `gate` Agent from every workload, which leaves the
              # coder's own self-gate as the only thing between the model and a
              # PR -- and a coder that writes an impossible test also self-gates
              # it green. Costs one extra FleetNode occupancy per workload,
              # which agent.replicaCount: 3 against MAX_IN_PROGRESS: 2 covers.
              VERIFY_ENABLED: "true"
              VERDICT_SELF_GO: "code-fix,docs,packaging,config,ci-policy"
              # Per-repo gate commands (fmt/lint/build/test) the deterministic
              # `gate` Agent runs, keyed by owner/repo with a "*" fallback.
              #
              # A profile has to mirror that repo's CI, because CI is what
              # decides whether the PR foreman opens is actually mergeable. The
              # "*" fallback is a no-op (every command `true`) -- fine for a repo
              # with no CI, useless for one with tests: alphaos#3 was opened on a
              # reviewer GO carrying a self-written test that could never pass,
              # because nothing between the coder and GitHub Actions ran pytest.
              #
              # `format`/`lint` stay `true` where the repo configures no formatter
              # or linter -- inventing one here red-gates code its own CI accepts.
              # The install is repeated in `build` and `test` because the two
              # commands are not guaranteed to share a container; the agent's
              # gateCache PVC (../../foreman/app/helmrelease.yaml) holds the pip
              # cache across invocations, so the second install is nearly free.
              #
              # alphaos: .github/workflows/test.yml is `pip install -e ".[dev]"`
              # then `python -m pytest -q` on python 3.12. Match that minor
              # version -- the dependency set drags in pandas/pyarrow/duckdb/
              # dagster wheels and 3.13 is not what the suite is resolved against.
              GATEPROFILE_MAP: >-
                {"ekenheim/alphaos":{"language":"python","image":"python:3.12","commands":{"format":"true","lint":"true","build":"pip install -q -e '.[dev]'","test":"pip install -q -e '.[dev]' && python -m pytest -q"}},
                "*":{"language":"generic","image":"python:3.13","commands":{"format":"true","lint":"true","build":"true","test":"true"}}}
              # Drains the pr-fix queue: review comments on an open PR come back
              # as a revision task rather than a new issue.
              PR_FIX_ENABLED: "true"
              PR_FIX_MAX_ATTEMPTS: "3"
              PR_FIX_LANE_AGENTS: '{"NORMAL":"coder","ESCALATED":"coder"}'
            envFrom:
              - secretRef:
                  name: *app
            resources:
              requests:
                cpu: 25m
              limits:
                memory: 128Mi
    serviceAccount:
      foreman-dispatch-bridge: {}
    rbac:
      roles:
        # The bridge creates Workloads and reconciles failed ones: list/get to
        # find Failed Workloads, delete + create to retry them (bounded) --
        # retry is delete-then-recreate, never in-place mutation. No `update`.
        #
        # `patch` is for something else: once a Workload's issue reaches a
        # terminal state in dispatch, the bridge stamps the CR so it stops
        # reconsidering it. Without it every 15m tick logs
        # `stamp-terminal-since-failed status=403` and re-reports the same
        # finished Workload forever.
        foreman-dispatch-bridge:
          type: Role
          rules:
            - apiGroups: ["foreman.llmkube.dev"]
              resources: ["workloads"]
              verbs: ["create", "get", "list", "delete", "patch"]
            # Reads a failed Workload's task results (reviewer NO-GO findings,
            # coder errors) to build feedback-carrying retries.
            - apiGroups: ["foreman.llmkube.dev"]
              resources: ["agentictasks"]
              verbs: ["get", "list"]
      bindings:
        foreman-dispatch-bridge:
          type: RoleBinding
          roleRef:
            identifier: foreman-dispatch-bridge
          subjects:
            - identifier: foreman-dispatch-bridge
              serviceAccount: foreman-dispatch-bridge
