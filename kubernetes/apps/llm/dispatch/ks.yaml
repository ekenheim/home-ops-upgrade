---
# yaml-language-server: $schema=https://kubernetes-schemas.minuette.horse/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dispatch
  namespace: flux-system
spec:
  path: ./kubernetes/apps/llm/dispatch/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: llm
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  dependsOn:
    - name: external-secrets-stores
    # The `dispatch` Postgres user lives in the crunchy cluster and its
    # postgres-pguser-dispatch Secret is served by crunchy-postgres-stores.
    # Unlike the other llm apps this is a hard ordering requirement: the
    # chart runs `prisma migrate deploy` as a pre-install/pre-upgrade hook Job,
    # so a missing database fails the HelmRelease outright rather than just
    # crash-looping a pod.
    - name: crunchy-postgres-operator-cluster
    - name: crunchy-postgres-stores
    # Grooming calls litellm (DISPATCH_HOSTED_GROOMER_ENABLED).
    - name: litellm
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
# foreman-dispatch-bridge (./bridge) retired 2026-09-28: courier claims dispatch
# work now (../courier). Two workers polling one queue would both claim it.
# ./bridge is left in git until foreman itself is removed.
