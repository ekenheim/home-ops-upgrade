---
# Second member of the embedding pool. Identical to embed-1.yaml but for the
# name; every comment lives there.
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: embed-2
  labels:
    krr/ignore: "true"
spec:
  modelRef: embed
  # NOT the operator's shared cache: that PVC is a hostPath PV pinned to
  # worker4 (../../llmkube/app/model-cache-pv.yaml), and mounting it would
  # drag memory onto the node that hard-resets under GPU load. This is our own
  # CephFS RWX claim (./pvc.yaml), so both members read one copy from any node.
  modelCache:
    claimName: embeddings
  runtime: llamacpp
  # No spec.command here, deliberately: llmkube >= 0.9.28 drops its generated
  # args when command is set (why the chart is held at 0.9.27). The stock
  # image's entrypoint is llama-server already.
  image: ghcr.io/ggml-org/llama.cpp:server-b11459@sha256:33868c035b21dc63f7c60b7438774283fd99215bc319114eb03de5df4ce7cd6b
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 600
  replicas: 1
  priority: normal
  # `embedding` makes the operator append --embedding --pooling last, which
  # is what Qwen3-Embedding needs (last-token pooling; bge-m3 was cls).
  mode: embedding
  podLabels:
    cpu-inference: "true"
    embed-pool: "true"
  affinity:
    podAntiAffinity:
      # Preferred, never required, and weighted below the control-plane
      # preference (see embed-1.yaml).
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 50
          podAffinityTerm:
            labelSelector:
              matchLabels:
                embed-pool: "true"
            topologyKey: kubernetes.io/hostname
    nodeAffinity:
      # REQUIRED off the control plane, unlike embed-1. The preference alone
      # (weight 100, 2026-10-14) still lost to resource-balance scoring: with
      # worker3 at 89% requested and master2 nearly empty, the rollout put
      # embed-2 straight back on master2, the sole etcd member. Requiring it
      # here and only preferring it on embed-1 keeps etcd's node free of
      # re-index load while still leaving one member schedulable on a master
      # if worker3 is down (embed-2 then waits Pending; LiteLLM routes to
      # embed-1). Revisit when the DeskMini control-plane nodes are in.
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
  # THE WINDOW is contextSize, shared by all slots (--kv-unified), not
  # ubatch: with last-token pooling llama-server feeds a long input through
  # in several physical batches (a ~5,200-token input returned 200 at ubatch
  # 2048), where bge-m3's cls pooling needed the whole input in one. So ubatch
  # is only a memory/speed knob here. Upstream runs 32768/32 slots for a
  # busier cluster; the largest thing our clients send is ~1,400 tokens
  # (memini caps a turn at 1000+3000 chars, hindsight chunks at 3000 chars)
  # and memini embeds at most two at a time.
  contextSize: 16384
  parallelSlots: 4
  flashAttention: true
  batchSize: 2048
  uBatchSize: 2048
  env:
    - name: HOME
      value: /tmp
  resources:
    # The operator renders cpu as a request only (no limit: a throttled
    # embedding is a slow recall) and memory as request = limit.
    cpu: 500m
    memory: 5Gi
  # runAsNonRoot goes on the container, NOT in podSecurityContext: the
  # operator's model-cache-prep init container runs as uid 0 to chown the
  # cache, and a pod-level runAsNonRoot leaves it in
  # CreateContainerConfigError forever.
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  extraVolumes:
    - name: tmp
      emptyDir: {}
  extraVolumeMounts:
    - name: tmp
      mountPath: /tmp
  extraArgs:
    - --alias
    - embed
    - --cont-batching
    - --cache-ram
    - "0"
    - --kv-unified
    # Alder Lake masters have 16 threads, worker3 has 32.
    - --threads
    - "8"
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    # /health is 503 while the model loads and 200 once it serves. The
    # startup budget covers a first download plus a cold CephFS read.
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 5
      failureThreshold: 120
    liveness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 2
