---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
#
# Text embeddings for the memory services (memini, hindsight), published
# through litellm as `bge-m3`. Replaces `all-minilm` on ollama-igpu.
#
# Model: BAAI/bge-m3 (MIT, 568M, 1024 dims, 100+ languages, trained for
# cross-lingual retrieval). Chosen over Qwen3-Embedding and arctic-embed-v2
# because it needs NO query/document prefix, and hindsight's OpenAI-style
# embedding client has no hook to add one. all-MiniLM-L6-v2 is English-only
# with a ~256-token window: on 2026-09-18 it missed Swedish queries outright,
# ranked cross-language matches behind unrelated same-language text, and gave
# cosine 1.0000 for two 2,500-char texts that differed only at the end.
# bge-m3 put BOTH the Swedish and the English copy of the right memory in the
# top two for 4 of 4 queries.
#
# Server: llama.cpp on CPU, not TEI, not Ollama, not llmkube. All measured on
# worker3 with this model, same day:
#                          short fact   ~640 tok   cold start   peak memory
#   TEI cpu-1.8.3 (ONNX)     201 ms     1468 ms     ~4 min       10.8 GiB (2k window; 25 GiB at 8k)
#   llama.cpp Q8_0 + FA       24 ms      392 ms      16 s         3.9 GiB (4k window)
# Q8_0 vectors match full precision at cosine 0.9993. Ollama was the previous
# host and had silently fallen back to CPU ("dropping integrated GPU; to
# enable, set OLLAMA_IGPU_ENABLE=1"), pulled its model from nowhere in git, and
# evicts on LRU even with keep_alive=-1. llmkube would put memory on worker4,
# the node that hard-resets under GPU load, sharing ornith's single GPU claim.
#
# "Always ready" is structural here: llama-server loads the model before
# /health returns 200 and holds it for the life of the process. There is no
# keep-alive timer and nothing else in the pod to evict it. Idle cost is ~1m CPU.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app embeddings
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # ScheduleAnyway, never DoNotSchedule: a hard hostname spread has wedged
      # RollingUpdates here before (cloudflared, pgbouncer). worker4 is out of
      # reach anyway behind its llm-workload taint, which is the point.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: *app
      affinity:
        nodeAffinity:
          # master1 throttles at 95C and flaps NotReady on SATA stalls. It is
          # allowed as a last resort, not as a first choice.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: ["master1"]
    controllers:
      embeddings:
        replicas: 2
        strategy: RollingUpdate
        rollingUpdate:
          unavailable: 0
          surge: 1
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          fetch-model:
            image: &image
              repository: ghcr.io/ggml-org/llama.cpp
              tag: server-b11011@sha256:b97738dc7c62a5eefbfc2f910ff727cc2bcc7dbe9e613d95532fcc32f9374025
            # One exact file, by repo revision and checksum, instead of
            # llama-server's own `-hf` fetch (which follows the repo's HEAD).
            # Vectors from different weights are not comparable, so the weights
            # must not move under memini and hindsight.
            # ggml-org/bge-m3-Q8_0-GGUF is published by the llama.cpp org.
            # Once the file is on the PVC a restart needs no network. Both
            # replicas may race on first install: each downloads to its own
            # temp name and the rename is atomic, so the loser just overwrites
            # an identical file.
            command:
              - sh
              - -c
              - |
                set -eu
                F=/models/bge-m3-q8_0.gguf
                SUM=aa473d51f451a22f0fcf39ba3330c14bed38a385712b1113440f69df4047a173
                REV=9eba04c5d75ba5a1595e45de734d36bef4e5cb98
                # No positional parameters or braces in here: Flux envsubst
                # runs over this file in strict mode.
                if [ -f "$F" ] && echo "$SUM  $F" | sha256sum -c - >/dev/null 2>&1; then
                  echo "model present, checksum ok"; exit 0
                fi
                T="$F.$HOSTNAME.part"
                curl -fsSL --retry 5 --retry-delay 5 -o "$T" \
                  "https://huggingface.co/ggml-org/bge-m3-Q8_0-GGUF/resolve/$REV/bge-m3-q8_0.gguf"
                if ! echo "$SUM  $T" | sha256sum -c - >/dev/null 2>&1; then
                  echo "checksum mismatch" >&2; rm -f "$T"; exit 1
                fi
                mv -f "$T" "$F"
                echo "model downloaded, checksum ok"
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        containers:
          app:
            image: *image
            args:
              - --model
              - /models/bge-m3-q8_0.gguf
              - --alias
              - bge-m3
              - --embedding
              # bge-m3 is XLM-RoBERTa: CLS pooling. Do not rely on the default.
              - --pooling
              - cls
              - --flash-attn
              - "on"
              # THE WINDOW. A pooled embedding model must fit the whole input
              # in one physical batch, so ctx = batch = ubatch. llama-server
              # does NOT truncate: longer input is an HTTP 500 ("input is too
              # large to process"). 4096 tokens is >2.5x the largest thing the
              # clients send: memini caps a turn at 1000+3000 chars and
              # hindsight chunks at 3000 chars, ~1,400 tokens even in Swedish.
              # Memory scales with this: 2048 = 2.3 GiB, 4096 = 3.9 GiB,
              # 8192 = 6.2 GiB peak. Raise all three together, and the memory
              # limit with them.
              - --ctx-size
              - "4096"
              - --batch-size
              - "4096"
              - --ubatch-size
              - "4096"
              - --parallel
              - "1"
              # Alder Lake masters have 16 threads, worker3 has 32. 8 was
              # measured; more buys little on inputs this short.
              - --threads
              - "8"
              - --metrics
              - --host
              - 0.0.0.0
              - --port
              - "8080"
            env:
              HOME: /tmp
            probes:
              # /health is 503 while the model loads and 200 once it serves.
              # Load took ~2 s from a warm PVC; the startup budget is for a
              # cold CephFS read on a busy node.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &health
                    path: /health
                    port: 8080
                  periodSeconds: 5
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *health
                  periodSeconds: 20
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *health
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 2
            resources:
              requests:
                cpu: 500m
                memory: 3Gi
              limits:
                # No CPU limit: a throttled embedding is a slow recall.
                memory: 5Gi
            securityContext: *securityContext
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8080
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
    persistence:
      models:
        existingClaim: *app
        globalMounts:
          - path: /models
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
