---
# yaml-language-server: $schema=https://kubernetes-schemas.minuette.horse/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app embeddings
  namespace: flux-system
spec:
  path: ./kubernetes/apps/llm/embeddings/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: llm
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  dependsOn:
    # The model file lives on a CephFS PVC shared by both replicas.
    - name: rook-ceph-cluster
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
