---
apiVersion: foreman.llmkube.dev/v1alpha1
kind: Agent
metadata:
  name: coder
spec:
  role: coder
  provider: cloud-proxy
  providerConfig:
    # litellm's `chatgpt` alias -> chatgpt/gpt-5.4 on the ChatGPT subscription,
    # with a fallback to `self-hosted` (ornith-35b on worker4's Strix iGPU).
    #
    # Safe in both directions. llmkube gives no way to force streaming (the
    # Agent CRD's providerConfig is only {apiKeySecretRef, baseURL, model}), and
    # chatgpt/ can only serve /chat/completions when stream=True -- see the long
    # note in ../../litellm/app/configmap.yaml. Verified against the live router
    # on 2026-08-22: stream=False returns model "ornith-35b" (the fallback
    # caught it), stream=True returns model "chatgpt". So a non-streaming coder
    # silently lands on ornith, exactly where it ran before; a streaming one
    # gets gpt-5.4's 1050000-token window. Subscription calls price at $0.
    #
    # The fallback itself is currently declared in litellm's *UI* (Postgres),
    # not in configmap.yaml -- see the drift note in this PR.
    baseURL: http://litellm.llm:4000/v1
    model: chatgpt
    apiKeySecretRef:
      name: foreman-agent
      key: LITELLM_API_KEY
  tools:
    - read_file
    - write_file
    - str_replace
    - grep
    - bash
    - fetch_issue
    # Reads an open PR's reviews, review comments and check runs. Verified
    # present in llmkube-coder 0.9.24 (the CRD rejects unknown tool names at
    # agent startup, so a wrong name here fails the whole fleet loud).
    - fetch_pull_request
    - submit_result
  mcp:
    enabled: true
    servers:
      # The toolhive-hosted context7 in this namespace, NOT the public
      # mcp.context7.com -- so no CONTEXT7_API_KEY header is needed and the
      # MCPToolConfig's curated library-ID list (see
      # ../../toolhive/context7/mcptoolconfig.yaml) applies. Address the
      # *-proxy Service; the bare `mcp-context7` Service is the stdio backend.
      - name: context7
        transport: http
        url: http://mcp-context7-proxy.llm:8080/mcp
  temperature: "0.2"
  maxTurns: 160
  maxRetries: 3
  maxOutputTokens: 20480
  stuckLoopDetection:
    # Sized to this cluster's actual per-request window: the InferenceService
    # runs contextSize 2097152 across parallelSlots 8, so each request gets
    # 262144 -- which is now also the model's full native context. llama.cpp
    # rejects anything over that outright ("request exceeds the available
    # context size"), so cap well under it -- and note the window has to hold
    # maxOutputTokens (20480) as well, leaving ~241k for input.
    #
    # 192000/208000 as of 2026-09-01, the same ~73%/79% of the window the
    # previous 96000/104000 were of 131072. The margin is deliberate and is
    # kept proportional rather than spent: a cap that sits right on the window
    # turns a soft-cap stop into a hard 400 from llama.cpp.
    #
    # These were once 48000/60000, sized against contextSize 524288 (=65536 per
    # slot) and never revisited when #6402 doubled it on 2026-08-17. That stale
    # 48000 is what killed nordic-housing#8: the coder was terminated by
    # ContextSoftCap at turn 18 after 76s ("wire-token count 49631 >= soft cap
    # 48000"), having read a 1665-line h3ZoneData.ts, and the escalation read
    # as "too hard" when it was simply out of budget. Move these whenever
    # contextSize moves.
    editFreeTurnsLimit: 100
    contextSoftCap: 192000
    contextHardCap: 208000
  requestTurnTimeoutSeconds: 1800
  requestTimeoutSeconds: 7200
  bashTimeoutSeconds: 60
  execution:
    activeDeadlineSeconds: 7200
    image: ghcr.io/misospace/llmkube-coder:0.9.24@sha256:1b23b7d2b18e2e94d24c86bbff5d047d3c315e33e043a194397d07d180bf8945
    mode: Job
    serviceAccountName: foreman-coder
  requiredCapability:
    # Matches the fleet's roles (worker,coder,verifier). accelerator "any"
    # because requiredCapability pins the *executor* node, not the model -- the
    # model's GPU placement is the llmkube InferenceService's problem.
    roles:
      - coder
    accelerator: any
  systemPrompt: |
    You are a coding agent resolving one GitHub issue in the referenced repo.

    Start by calling fetch_issue(repo, issue). On a retry the payload carries only the
    previous attempt's feedback — the original ask and acceptance criteria are not in it.
    If the repo has an AGENTS.md, read it: it carries conventions and the testing traps
    earlier attempts learned the hard way.

    Implement the fix, add a test for any behaviour change, and run the repo's own
    verification commands before finishing.

    How the harness works around you: it stages, commits, DCO-signs and pushes whatever
    your edit tools changed, using the commit message you pass to submit_result. Progress
    is measured by those edit-tool calls, so changes made another way do not register.

    Finish with submit_result:
      GO — the change is complete and verification passes.
      NO-GO + extra.outcome="ALREADY-RESOLVED" + extra.resolvedBy=<file and what it
        already does> — the code where the issue points already does what it asks.
      NO-GO + extra.escalation="DESIGN-DECISION" — a product or architecture call a
        human has to make.
      NO-GO + extra.escalation="NO-TECHNICAL-FIX" — nothing in this repo can fix it
        (wrong layer, upstream bug, external service).
    Put the specific blocker in your summary. These route the issue, so a wrong one
    removes real work from the queue. Being unable to find something is not one of them.
