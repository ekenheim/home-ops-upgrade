---
# yaml-language-server: $schema=https://kubernetes-schemas.minuette.horse/kyverno.io/clusterpolicy_v1.json
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: foreman-git-credentials
  annotations:
    policies.kyverno.io/title: Give foreman's git a working credential
    policies.kyverno.io/category: foreman
    # Autogen would emit a Deployment/Job twin of this rule whose precondition
    # reads request.object.spec.serviceAccountName -- a field a Deployment does
    # not have -- so the twin never fires. The Pod rule is the one that matters.
    pod-policies.kyverno.io/autogen-controllers: none
    policies.kyverno.io/description: >-
      foreman projects the git Secret as a bare GITHUB_TOKEN env var and
      configures no credential, so every git command that talks to a remote
      hits it unauthenticated:

        git fetch origin foreman/wl-.../issue-8
        fatal: could not read Username for 'https://github.com'

      On a public repo this never surfaces -- an unauthenticated fetch just
      works. On a private one (ekenheim/nordic-housing) it breaks the loop in
      two places at once, and neither is the coder:

        1. The REVIEWER's step 1 is "git fetch origin <branch> && git checkout"
           through its bash tool. It fails, the reviewer submits verdict ERROR,
           normalizeModelVerdict maps ERROR -> INCOMPLETE, and the PR only opens
           on a reviewer GO (executor_native.go maybeOpenPullRequest). No PR,
           ever, no matter how good the branch is.
        2. repo.BaseBranchSHA fetches the upstream base with baseEnv() -- no
           auth at all -- so the reviewer also silently falls back to diffing
           against a stale local main.

      That is the loop nordic-housing#8 and #10 died in: coder pushes a good
      branch, gate says GO, reviewer cannot reach the branch, three attempts
      burn, dispatch has no escalation lane, issue tombstones as needs-human.

      There is no supported knob. The Agent CRD's execution block is only
      {activeDeadlineSeconds, image, mode, resources, serviceAccountName} and
      the chart's agent Deployment template has no extraVolumes, so the
      credential cannot be injected through foreman's own config. Hence
      admission mutation.

      Delivered as a file rather than an env var because foreman's bash tool
      scrubs the shell env down to a fixed allowlist that does not include
      GIT_CONFIG_COUNT/KEY/VALUE -- see ./gitconfig-configmap.yaml.

      REMOVE THIS once llmkube configures the credential itself upstream.
spec:
  # Mutation applies at admission only. Coder pods are created per task and
  # never updated in place; the agent Deployment must be restarted by hand
  # after a change here, because its running pods were admitted under the old
  # rule.
  background: false
  # Never block pod creation. A broken policy here would take the whole foreman
  # fleet offline; a skipped mutation only reverts to today's behaviour.
  failurePolicy: Ignore
  rules:
    - name: mount-system-gitconfig
      match:
        any:
          - resources:
              kinds: ["Pod"]
              namespaces: ["llm"]
      preconditions:
        all:
          # The two ServiceAccounts the chart gives pods that run git:
          # foreman-coder for the per-task coder Jobs, foreman-agent for the
          # agent Deployment (where the reviewer and gate run InProcess).
          # Stable, unlike the per-task pod names.
          - key: "{{ request.object.spec.serviceAccountName || '' }}"
            operator: AnyIn
            value:
              - foreman-coder
              - foreman-agent
      mutate:
        patchStrategicMerge:
          spec:
            volumes:
              - name: foreman-git-config
                configMap:
                  name: foreman-git-config
            containers:
              - (name): "*"
                volumeMounts:
                  - name: foreman-git-config
                    mountPath: /etc/gitconfig
                    subPath: gitconfig
                    readOnly: true
