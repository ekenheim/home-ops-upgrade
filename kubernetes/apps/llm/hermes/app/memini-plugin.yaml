---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-memini-plugin
data:
  plugin.yaml: |
    name: memini
    version: 1.0.0
    description: "Persistent cross-session memory for Hermes Agent via memini (REST)."
    homepage: "https://github.com/eleboucher/memini"
    hooks:
      - on_session_end
      - on_pre_compress
      - on_memory_write
  __init__.py: |
    """hermes memory provider backed by memini's REST API.

    Same shape as the agentmemory provider this replaced (2026-09-17): a
    briefing goes into the system prompt, a search runs before each turn,
    every turn is captured as an episodic memory, and two tools let the
    agent recall/save explicitly. memini does the tiering, dedup and decay
    server-side (see memini/app/helmrelease.yaml), so this stays thin.

    Auth is the `hermes` named key on memini (memini-api-keys), whose
    default_namespace is `hermes`; nothing here can read another key's
    namespace. Endpoints from memini's api/openapi.yaml.
    """
    from __future__ import annotations

    import json
    import os
    import sys
    import threading
    from typing import Any
    from urllib.error import HTTPError, URLError
    from urllib.parse import urlencode, urlparse
    from urllib.request import Request, urlopen

    try:
        from agent.memory_provider import MemoryProvider
    except ImportError:
        from abc import ABC, abstractmethod

        class MemoryProvider(ABC):
            @property
            @abstractmethod
            def name(self) -> str: ...
            @abstractmethod
            def is_available(self) -> bool: ...
            @abstractmethod
            def initialize(self, session_id: str, **kwargs: Any) -> None: ...
            @abstractmethod
            def get_tool_schemas(self) -> list[dict]: ...
            @abstractmethod
            def handle_tool_call(self, name: str, args: dict) -> str: ...
            def system_prompt_block(self) -> str: return ""
            def prefetch(self, query: str, **kwargs: Any) -> str: return ""
            def queue_prefetch(self, query: str, **kwargs: Any) -> None: pass
            def sync_turn(self, user: str, assistant: str, **kwargs: Any) -> None: pass
            def on_session_end(self, messages: list, **kwargs: Any) -> None: pass
            def on_pre_compress(self, messages: list, **kwargs: Any) -> None: pass
            def on_memory_write(self, action: str, target: str, content: str, **kwargs: Any) -> None: pass
            def shutdown(self, **kwargs: Any) -> None: pass


    DEFAULT_BASE_URL = "http://memini.llm:8080"
    TIMEOUT = 5


    def _log(msg: str) -> None:
        print(f"[memini] {msg}", file=sys.stderr)


    def _validate_url(url: str) -> bool:
        try:
            p = urlparse(url)
        except ValueError:
            return False
        return p.scheme in ("http", "https") and bool(p.netloc)


    class _Client:
        def __init__(self, base: str, key: str, namespace: str | None) -> None:
            self.base = base.rstrip("/")
            self.key = key
            self.namespace = namespace
            self._warned_auth = False

        def call(self, method: str, path: str, body: dict | None = None, params: dict | None = None) -> dict | None:
            url = f"{self.base}{path}"
            if params:
                url += "?" + urlencode(params, doseq=True)
            headers = {"Authorization": f"Bearer {self.key}", "Accept": "application/json"}
            if self.namespace:
                headers["X-Memini-Namespace"] = self.namespace
            data = None
            if body is not None:
                headers["Content-Type"] = "application/json"
                data = json.dumps(body).encode()
            try:
                with urlopen(Request(url, data=data, headers=headers, method=method), timeout=TIMEOUT) as resp:
                    raw = resp.read()
                    return json.loads(raw.decode()) if raw else {}
            except HTTPError as e:
                if e.code in (401, 403) and not self._warned_auth:
                    self._warned_auth = True
                    _log(f"{e.code} from {path}: MEMINI_API_KEY is wrong or missing")
                elif e.code >= 500:
                    _log(f"{e.code} from {path}")
                return None
            except (URLError, TimeoutError, json.JSONDecodeError, OSError):
                return None

        def call_bg(self, method: str, path: str, body: dict | None = None) -> None:
            threading.Thread(target=self.call, args=(method, path, body), daemon=True).start()


    def _content(item: dict) -> str:
        mem = item.get("memory", item)
        return (mem.get("summary") or mem.get("content") or "").strip()


    class MeminiProvider(MemoryProvider):
        @property
        def name(self) -> str:
            return "memini"

        def is_available(self) -> bool:
            if not os.environ.get("MEMINI_API_KEY"):
                _log("MEMINI_API_KEY is not set; provider disabled")
                return False
            return _validate_url(os.environ.get("MEMINI_URL", DEFAULT_BASE_URL))

        def initialize(self, session_id: str, **kwargs: Any) -> None:
            self._session_id = session_id
            self._c = _Client(
                os.environ.get("MEMINI_URL", DEFAULT_BASE_URL),
                os.environ.get("MEMINI_API_KEY", ""),
                os.environ.get("MEMINI_NAMESPACE") or None,
            )
            # memini v0.7.x rejects unknown fields outright (400 on
            # client_name), so the body is the minimum the server requires.
            hs = self._c.call("POST", "/v1/handshake", {
                "project": {"cwd_basename": "hermes"},
            }) or {}
            # Pin the namespace memini resolved for this key so every later
            # call is explicit rather than relying on the key default.
            if hs.get("namespace") and not self._c.namespace:
                self._c.namespace = hs["namespace"]
            self._settings = hs.get("settings") or {}

        # --- context injection -------------------------------------------
        def _briefing(self) -> str:
            b = self._c.call("GET", "/v1/namespaces/briefing")
            if not b:
                return ""
            s = self._settings
            sections = [
                ("Pinned", b.get("pinned") or [], int(s.get("inject_briefing_pinned", 5))),
                ("Facts", b.get("facts") or [], int(s.get("inject_briefing_facts", 5))),
                ("Procedures", b.get("procedures") or [], int(s.get("inject_briefing_procedures", 3))),
                ("Recent", b.get("recent") or [], 3),
            ]
            out = []
            for title, items, n in sections:
                lines = [f"- {_content(i)[:300]}" for i in items[:n] if _content(i)]
                if lines:
                    out.append(f"{title}:\n" + "\n".join(lines))
            return "\n".join(out)

        def system_prompt_block(self) -> str:
            return self._briefing()

        def prefetch(self, query: str, **kwargs: Any) -> str:
            r = self._c.call("POST", "/v1/search", {
                "query": query, "limit": 5, "source": "pretool", "response_format": "concise",
            })
            return "\n".join(f"- {_content(i)[:200]}" for i in (r or {}).get("results", []) if _content(i))

        def queue_prefetch(self, query: str, **kwargs: Any) -> None:
            # Warm the cache without counting as an access.
            self._c.call_bg("POST", "/v1/search", {"query": query, "limit": 3, "reinforce": False, "source": "pretool"})

        # --- tools --------------------------------------------------------
        def get_tool_schemas(self) -> list[dict]:
            return [
                {
                    "name": "memory_recall",
                    "description": "Search Hermes' long-term memory (memini) for prior facts, decisions and events.",
                    "parameters": {
                        "type": "object",
                        "properties": {
                            "query": {"type": "string"},
                            "limit": {"type": "integer", "default": 10},
                        },
                        "required": ["query"],
                    },
                },
                {
                    "name": "memory_save",
                    "description": "Save a durable fact, decision or preference to Hermes' long-term memory.",
                    "parameters": {
                        "type": "object",
                        "properties": {
                            "content": {"type": "string"},
                            "tier": {"type": "string", "enum": ["episodic", "semantic", "procedural"], "description": "Omit to let memini classify."},
                            "tags": {"type": "array", "items": {"type": "string"}},
                        },
                        "required": ["content"],
                    },
                },
            ]

        def handle_tool_call(self, name: str, args: dict) -> str:
            if name == "memory_recall":
                r = self._c.call("POST", "/v1/search", {
                    "query": args["query"], "limit": int(args.get("limit", 10)), "source": "api",
                })
                results = []
                for i in (r or {}).get("results", []):
                    m = i.get("memory", {})
                    results.append({
                        "id": m.get("id"), "content": m.get("content"), "tier": m.get("tier"),
                        "tags": m.get("tags"), "created_at": m.get("created_at"), "score": i.get("score"),
                    })
                return json.dumps({"results": results})
            if name == "memory_save":
                body: dict[str, Any] = {
                    "content": args["content"],
                    "tags": list(dict.fromkeys(["hermes", *args.get("tags", [])])),
                    "metadata": {"source": "hermes", "session_id": self._session_id},
                }
                if args.get("tier"):
                    body["tier"] = args["tier"]
                r = self._c.call("POST", "/v1/memories", body)
                if r is None:
                    return json.dumps({"success": False})
                return json.dumps({"success": True, "id": r.get("id"), "stored": r.get("stored", True), "reason": r.get("reason")})
            return json.dumps({"error": f"Unknown tool: {name}"})

        # --- passive capture ----------------------------------------------
        def sync_turn(self, user: str, assistant: str, **kwargs: Any) -> None:
            s = self._settings
            if not s.get("capture_turns", True) or not (user or assistant):
                return
            u = (user or "")[: int(s.get("capture_user_max_chars", 1000))]
            a = (assistant or "")[: int(s.get("capture_assistant_max_chars", 3000))]
            self._c.call_bg("POST", "/v1/memories", {
                "content": f"User: {u}\nAssistant: {a}",
                "tier": "episodic",
                "tags": ["hermes", "turn"],
                "metadata": {"source": "hermes", "session_id": self._session_id},
            })

        def on_pre_compress(self, messages: list, **kwargs: Any) -> None:
            context = self._briefing()
            if context:
                messages.insert(0, {
                    "role": "user",
                    "content": f"[memini context before compaction]\n{context}",
                })

        def on_memory_write(self, action: str, target: str, content: str, **kwargs: Any) -> None:
            if action in ("add", "update") and content:
                self._c.call_bg("POST", "/v1/memories", {
                    "content": content,
                    "tags": ["hermes", "memory_write", str(target)[:64]],
                    "metadata": {"source": "hermes", "session_id": self._session_id},
                })

        def on_session_end(self, messages: list, **kwargs: Any) -> None:
            pass

        def shutdown(self, **kwargs: Any) -> None:
            pass


    def register(ctx: Any) -> None:
        ctx.register_memory_provider(MeminiProvider())
