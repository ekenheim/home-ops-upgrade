---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name hindsight
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # The chart takes ONE Secret (`existingSecret`) and mounts it envFrom on
        # both the API and the control plane, so every credential lands here.
        #
        # Postgres: the chart composes HINDSIGHT_API_DATABASE_URL around
        # $(POSTGRES_PASSWORD), which it reads from this exact key. The value
        # comes from PGO's own user Secret via the per-entry sourceRef below
        # (same two-store trick zigbee2mqtt uses), so there is nothing to copy
        # into Bitwarden and a PGO password rotation propagates on its own.
        postgres-password: '{{ .PG_PASSWORD }}'
        # Bearer for every /v1 and /mcp call, enforced by the built-in tenant
        # extension (HINDSIGHT_API_TENANT_EXTENSION in the HelmRelease). Pick
        # any long random string on the NEW `hindsight` Bitwarden Secrets
        # Manager item. The control plane presents the same key to the API.
        HINDSIGHT_API_TENANT_API_KEY: '{{ .HINDSIGHT_API_TENANT_API_KEY }}'
        HINDSIGHT_CP_DATAPLANE_API_KEY: '{{ .HINDSIGHT_API_TENANT_API_KEY }}'
        # litellm VIRTUAL key on the same item; it only ever calls `bge-m3`.
        # Embeddings are the only thing that goes through litellm here.
        HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: '{{ .LITELLM_API_KEY }}'
        # The Codex provider ignores this but config validation wants a
        # non-empty LLM key for the primary provider; keep it a placeholder.
        HINDSIGHT_API_LLM_API_KEY: 'codex-oauth'
  data:
    - secretKey: PG_PASSWORD
      sourceRef:
        storeRef:
          name: crunchy-pgo-secrets
          kind: ClusterSecretStore
      remoteRef:
        key: postgres-pguser-hindsight
        property: password
  dataFrom:
    - extract:
        key: hindsight
