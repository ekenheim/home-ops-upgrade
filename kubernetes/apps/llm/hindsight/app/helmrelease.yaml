---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hindsight
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 30m
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # The API Deployment mounts the RWO `hindsight` PVC (Codex auth.json), and
  # the chart hardcodes no strategy, so it defaults to RollingUpdate: the new
  # pod waits on a Multi-Attach error for a volume the old pod will not
  # release until the new one is Ready. Every chart bump or values change
  # would hang there. The chart has no knob for this, hence the patch.
  # If this is ever applied to a Deployment that was created as RollingUpdate,
  # strip the API-server-defaulted rollingUpdate from the live object first or
  # Helm's server-side apply is rejected:
  #   kubectl -n llm patch deploy hindsight-api --type=merge \
  #     -p '{"spec":{"strategy":{"type":"Recreate","rollingUpdate":null}}}'
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: hindsight-api
            patch: |
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
  values:
    # One Secret for everything; see externalsecret.yaml for what is in it.
    existingSecret: *app
    # External Postgres on the Crunchy cluster. The chart's own helper builds
    # a URL without sslmode, and the Crunchy primary is TLS-only (hostssl
    # only in pg_hba), so the URL is spelled out here. $(POSTGRES_PASSWORD)
    # is expanded by the kubelet: the chart defines that env var from the
    # Secret's `postgres-password` key just above this one. Direct primary,
    # not pgbouncer: Hindsight runs alembic migrations on boot and the pool
    # is in transaction mode, which drops session-scoped advisory locks.
    databaseUrl: postgresql://hindsight:$$(POSTGRES_PASSWORD)@postgres-primary.database.svc:5432/hindsight?sslmode=require
    postgresql:
      enabled: false
    podSecurityContext:
      fsGroup: 1000
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    api:
      image:
        repository: ghcr.io/vectorize-io/hindsight-api
        # `-slim` ships no local models (~500 MB instead of ~9 GB). LLM,
        # embeddings and reranking are all external here, so nothing needs
        # torch or a model cache in this pod.
        tag: 0.10.2-slim@sha256:3c7b54a7e7dc92c3ad6a6b874aa9b3e96603b2c6fc4b215d9890a93578d2de99
      env:
        # --- LLM: the ChatGPT subscription, via Hindsight's own Codex provider ---
        #
        # NOT litellm. litellm's `chatgpt` alias only works for streaming
        # /chat/completions (documented at length in litellm/app/configmap.yaml)
        # and Hindsight makes non-streaming calls; verified failing again on
        # litellm v1.101.0 on 2026-09-17 ("Unknown items in responses API
        # response: []"). Hindsight's `openai-codex` provider speaks the Codex
        # SSE backend natively, so it goes straight to chatgpt.com with its
        # own OAuth grant and no proxy in between. Cost is the subscription
        # quota, shared with hermes, the codex CLI and litellm's chatgpt alias.
        #
        # This is a FOURTH independent device login (see the litellm ConfigMap
        # for why grants cannot be shared: refresh tokens are single-use and
        # rotate). It lives in auth.json on the `hindsight` PVC mounted below.
        # How to perform it is in kubernetes/apps/llm/README.md.
        HINDSIGHT_API_LLM_PROVIDER: openai-codex
        HINDSIGHT_API_LLM_CODEX_HOME: /codex-auth
        # Models are whatever the Codex backend lists for the account, NOT the
        # OpenAI API catalogue and NOT Hindsight's defaults: its default for
        # this provider is gpt-5.4-mini, which the backend no longer serves.
        # Authoritative list (needs a Codex access token):
        #   GET https://chatgpt.com/backend-api/codex/models?client_version=0.0.0
        # On 2026-09-17 it returned gpt-6-astra, gpt-5.6-{sol,terra,luna},
        # gpt-5.5, gpt-reserve, codex-auto-review. luna is the light tier
        # (litellm prices it at $0.20/M in) and carries the high-volume
        # per-turn fact extraction; reflect (query-time synthesis) gets 5.6-sol
        # (was 5.5 until 2026-09-28; sol is its like-for-like successor).
        HINDSIGHT_API_LLM_MODEL: gpt-5.6-luna
        HINDSIGHT_API_REFLECT_LLM_PROVIDER: openai-codex
        HINDSIGHT_API_REFLECT_LLM_MODEL: gpt-5.6-sol
        # --- A second extraction model, for Atlas's retains only ---
        #
        # Hindsight's multi-LLM chain with the `metadata` strategy (retain only,
        # since 0.10.0): a retained item whose own metadata says
        # `extractor: minimax` is extracted by member 1 (MiniMax-M3 through
        # litellm, thinking off, as Atlas's bake-off measured it); every other
        # item, from every bank, stays on the Codex primary above. Recall,
        # reflect, consolidation and mental-model refresh are unaffected: they
        # always use the primary. Nothing is routed until a client sends that
        # metadata key, so this is inert on its own. Atlas sends it so its
        # filing and transcript backfill stops spending the ChatGPT quota that
        # hermes and the codex CLI share.
        #
        # A routed item does NOT fall back: if member 1 fails, that item's
        # retain operation fails (verified on 0.10.2), and the client retries.
        # Member 1's key is the litellm key this release already uses for
        # embeddings (HINDSIGHT_API_LLM_1_API_KEY in externalsecret.yaml); that
        # key must be allowed to call MiniMax-M3.
        HINDSIGHT_API_LLM_1_PROVIDER: openai
        HINDSIGHT_API_LLM_1_BASE_URL: http://litellm.llm:4000/v1
        HINDSIGHT_API_LLM_1_MODEL: MiniMax-M3
        HINDSIGHT_API_LLM_1_EXTRA_BODY: '{"thinking":{"type":"disabled"}}'
        HINDSIGHT_API_LLM_STRATEGY: '{"mode":"metadata","routes":[{"key":"extractor","value":"minimax","member":1}]}'
        # Per-request Codex deadlines. Reflect's upstream default is 30s
        # (DEFAULT_REFLECT_LLM_TIMEOUT) and mental-model refresh inherits it;
        # a refresh is a multi-step tool loop on the reflect model that streams past
        # 30s, so every atlas-dev refresh died with CodexRunawayStreamError
        # and retried into the same wall (2026-09-28). Refresh is background
        # work: give it 10 minutes (was 5 until 2026-09-30, see below).
        # Interactive reflect gets 120s, the general LLM default; its whole
        # operation is capped by REFLECT_WALL_TIMEOUT below.
        HINDSIGHT_API_REFLECT_LLM_TIMEOUT: "120"
        HINDSIGHT_API_MENTAL_MODEL_REFRESH_LLM_TIMEOUT: "600"
        # Reflect gathers evidence until this budget, then forces a final synthesis
        # over everything it holds (default 100k). Once atlas-ai-infrastructure grew,
        # every refresh hit ~125k and each synthesis call on 5.6-sol streamed past
        # 300s, three attempts in a row (2026-09-30). A smaller budget keeps the
        # synthesis prompt tractable; the per-call refresh deadline above allows
        # 10 minutes for the rest.
        HINDSIGHT_API_REFLECT_MAX_CONTEXT_TOKENS: "64000"
        # Whole-task ceiling, shared by interactive reflect and mental-model refresh
        # (the worker has no separate knob for refresh; the 300s default equalled the
        # old per-call deadline, so retries never ran). Tool phase + two 600s
        # synthesis attempts + backoff. Interactive reflect calls stay capped at
        # 120s each by REFLECT_LLM_TIMEOUT.
        HINDSIGHT_API_REFLECT_WALL_TIMEOUT: "1500"
        # --- Embeddings: litellm -> embeddings (Qwen3-Embedding-0.6B, 1024 dims) ---
        # Same model memini uses. Why this model and how it is served:
        # ../../embeddings/app/model.yaml. It replaced bge-m3 on 2026-09-18,
        # while this store still held 0 memory units.
        #
        # Known cost: Qwen3-Embedding wants an "Instruct: ...\nQuery: " prefix
        # on queries and this client has no way to add one (memini does). Qwen
        # puts the loss at 1-5% of retrieval score; recall here is also fused
        # with BM25 and reranked, which does not depend on it.
        #
        # THE DIMENSION IS A ONE-WAY DOOR. ensure_embedding_dimension() alters
        # memory_units.embedding and mental_models.embedding on startup only
        # while those tables are EMPTY, and refuses to start once they hold
        # rows. It was switched on 2026-09-18 with 0 banks for exactly that
        # reason. Changing the model after this means new banks, not a switch.
        #
        # Retain chunks are 3000 chars, far inside the 16384-token window.
        HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
        HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: http://litellm.llm:4000/v1
        HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: qwen3-embedding-0.6b
        HINDSIGHT_API_EMBEDDINGS_OPENAI_DIMENSIONS: "1024"
        # --- Auth ---
        # Off by default upstream. The built-in extension turns every /v1 and
        # /mcp call into "Authorization: Bearer $HINDSIGHT_API_TENANT_API_KEY"
        # (key in the Secret). One key for the whole server; per-client
        # isolation is by bank, one bank per consumer.
        HINDSIGHT_API_TENANT_EXTENSION: hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension
        HINDSIGHT_API_VECTOR_EXTENSION: pgvector
      extraVolumes:
        - name: codex-auth
          persistentVolumeClaim:
            # ../../../../templates/volsync renders this claim (named ${APP}).
            claimName: *app
      extraVolumeMounts:
        - name: codex-auth
          mountPath: /codex-auth
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          # Upstream recommends 4Gi for the API pod; the built-in worker runs
          # inside it (worker.enabled stays false).
          memory: 4Gi
    controlPlane:
      # Web UI. It has no login of its own (vectorize-io/hindsight#1148), so
      # it is only reachable on the internal ingress class below. It reaches
      # the API server-side with HINDSIGHT_CP_DATAPLANE_API_KEY from the Secret.
      enabled: true
      image:
        repository: ghcr.io/vectorize-io/hindsight-control-plane
        tag: 0.10.2@sha256:f6e3802e558a0c57feff84d52dfc276d0a841bc21de114629a90444eadc5a3f3
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi
    tei:
      reranker:
        # Hindsight reranks recall results by default with a local
        # cross-encoder, which the slim image cannot run (no torch). The chart
        # can run the same ms-marco MiniLM cross-encoder as a CPU
        # text-embeddings-inference sidecar; the chart then points the API at
        # it. ~85 MB model, pulled on first start. Set enabled: false to fall
        # back to plain reciprocal-rank fusion if this is ever in the way.
        enabled: true
        image:
          repository: ghcr.io/huggingface/text-embeddings-inference
          tag: cpu-1.8.3@sha256:8de25e75ce39617f17f2f6c77d60a4f75b65e779ed5005420eb1400072a15c1c
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
    ingress:
      enabled: false  # moved to an HTTPRoute on envoy-gateway
      className: internal
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: LLM
        gethomepage.dev/name: Hindsight
        gethomepage.dev/icon: mdi-brain
        gethomepage.dev/description: Agent memory (banks per consumer, MCP per bank)
        external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
      hosts:
        - host: hindsight.${SECRET_DOMAIN}
          paths:
            - path: /
              pathType: Prefix
              service: controlPlane
            # API + per-bank MCP for clients outside the cluster (Claude Code,
            # laptops). Bearer-gated by the tenant extension.
            - path: /v1
              pathType: Prefix
              service: api
            - path: /mcp
              pathType: Prefix
              service: api
    metrics:
      serviceMonitor:
        enabled: true
