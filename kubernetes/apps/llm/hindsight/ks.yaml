---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hindsight
  namespace: flux-system
spec:
  path: ./kubernetes/apps/llm/hindsight/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: llm
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  dependsOn:
    - name: volsync
    - name: external-secrets-stores
    - name: rook-ceph-cluster
    # The store is a database on the Crunchy cluster (pgvector is installed
    # there); the user is declared in crunchy-postgres/cluster/cluster.yaml.
    - name: crunchy-postgres-operator-cluster
    # Embeddings go through litellm (`all-minilm`). The LLM does NOT: it is the
    # ChatGPT subscription via Hindsight's own Codex provider, see helmrelease.
    - name: litellm
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  postBuild:
    substitute:
      APP: *app
      # This PVC holds only the Codex OAuth grant (auth.json) for the ChatGPT
      # subscription -- the memory store itself is in Postgres. It is
      # volsync-backed so a PVC rebuild does not force a new device login.
      VOLSYNC_CAPACITY: 1Gi
      # The chart runs everything as uid/gid 1000.
      VOLSYNC_UID: "1000"
      VOLSYNC_GID: "1000"
