---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# The UI pod (nginx in front of Next.js; nginx proxies /api to the
# controller). Its own HTTPRoute rather than the chart's ui.httpRoute, so the
# SecurityPolicy's targetRef is pinned here. Chat responses stream as SSE;
# the gateway-wide BackendTrafficPolicy already sets requestTimeout 0s.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent
  annotations:
    gethomepage.dev/description: "Read-only Kubernetes agents (test)"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "LLM"
    gethomepage.dev/icon: "kubernetes.png"
    gethomepage.dev/name: "kagent"
spec:
  hostnames:
    - "kagent.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: kagent-ui
          port: 8080
