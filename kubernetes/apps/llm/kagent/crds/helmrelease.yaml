---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# The chart ships its CRDs as ordinary templates (not under crds/), so Helm
# upgrades them with every chart bump; no crds: CreateReplace needed.
# Uninstalling this release deletes the CRDs and every Agent/ModelConfig with
# them.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kagent-crds
spec:
  interval: 30m
  # Same HelmRepository as ../app (flux/repositories/helm/kagent.yaml), so
  # both charts come from one source; keep them on the same version. This
  # chart's CRDs carry no version label, so the digest suffix an
  # OCIRepository source adds never broke it, but its templates are no more
  # careful with .Chart.Version than the main chart's.
  chart:
    spec:
      chart: kagent-crds
      version: 0.10.3
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: kagent
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # kmcp's MCPServer CRD stays installed even though the kmcp controller is
    # off in ../app: the kagent controller's role lists mcpservers, and a
    # missing CRD can wedge its informers. The CRD alone is inert.
    kmcp:
      enabled: true
    substrate:
      enabled: false
