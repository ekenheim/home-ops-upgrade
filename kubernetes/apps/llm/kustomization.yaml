---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Pre Flux-Kustomizations
  - ./namespace.yaml
  # Flux-Kustomizations | Gateway
  #
  # litellm-operator renders LiteLLM proxy config from CRDs (LiteLLMProxy,
  # LiteLLMModel, LiteLLMVirtualKey, LiteLLMTeam, LiteLLMGuardrail,
  # LiteLLMMCPServer). It is installed here but currently drives NOTHING: the
  # litellm below is still the bjw-s app-template HelmRelease with its
  # hand-written config.yaml ConfigMap. Adopting the CRDs is a separate change.
  - ./litellm-operator/ks.yaml
  - ./litellm/ks.yaml
  # Flux-Kustomizations | Inference
  - ./llmkube/ks.yaml
  # Text embeddings (Qwen3-Embedding-0.6B, llmkube InferenceServices on CPU)
  # for memini and hindsight. Needs llmkube's CRDs, hence listed after it.
  # ollama-igpu used to sit here; retired 2026-09-18 with open-webui, its
  # last other consumer. It had silently been running on CPU anyway.
  - ./embeddings/ks.yaml
  # Flux-Kustomizations | GPU apps outside llmkube (after joryirving/home-ops)
  #
  # All three are `privileged` pods pinned to worker4 rather than DRA
  # consumers, each on a static hostPath volume (no provisioner can serve that
  # node). They share the iGPU and its unreclaimable GTT with ornith-35b and
  # gemma3-27b; see the warning at the top of comfyui/app/helmrelease.yaml
  # before running image generation next to the LLMs.
  - ./comfyui/ks.yaml
  - ./lemonade-tts/ks.yaml
  - ./whisper/ks.yaml
  # Flux-Kustomizations | Tooling & memory
  - ./toolhive/ks.yaml
  # Two memory services. memini is what hermes' provider plugin talks to
  # (agentmemory was removed 2026-09-17; its author had already moved to
  # memini). hindsight is the candidate to consolidate on: open source, one
  # bank per consumer, MCP per bank, LLM on the ChatGPT subscription. Nothing
  # is wired to it yet. supermemory was trialled for a day and dropped: the
  # engine is a closed binary and every multi-client feature is enterprise.
  # See README.md.
  - ./memini/ks.yaml
  - ./hindsight/ks.yaml
  - ./searxng/ks.yaml
  # Gallery over ComfyUI's output on the NAS, and LLM-written wikis of my
  # repos (a CronJob on `self-hosted`). Both after joryirving/home-ops.
  - ./miso-gallery/ks.yaml
  - ./repo-wiki/ks.yaml
  # Flux-Kustomizations | Frontends
  - ./hermes/ks.yaml
  - ./langflow/ks.yaml
  - ./sillytavern/ks.yaml
  # Facebook Marketplace watcher; listings are rated by litellm's `fast`.
  # Web UI is loopback-only by design (port-forward), see its helmrelease.
  - ./ai-marketplace-monitor/ks.yaml
  # Flux-Kustomizations | The agentic coding loop
  #
  # dispatch grooms GitHub issues into a queue, the bridge CronJob turns claimed
  # ones into foreman Workload CRs, and foreman runs coder -> gate -> reviewer
  # and opens the PR.
  #
  # Enabled 2026-08-22, once these Bitwarden Secrets Manager items existed:
  #   `github_token`  GITHUB_TOKEN -- the one agent PAT. Commits, PRs and issue
  #                   labels all come from this identity, on EVERY repo the loop
  #                   is pointed at, so scope it deliberately.
  #   `dispatch`      DISPATCH_AGENT_TOKEN (shared with the bridge -- one field
  #                   on purpose, two values means every tick 401s),
  #                   DISPATCH_AUTH_USERNAME / _PASSWORD, LITELLM_API_KEY.
  #   `foreman`       LITELLM_API_KEY, separate from dispatch's so either can be
  #                   revoked alone.
  #
  # foreman stands alone (it idles with no Workloads); dispatch additionally
  # needs the `dispatch` Postgres user, which is declared alongside this in
  # apps/database/crunchy-postgres/cluster/cluster.yaml.
  #
  # Moved out of `datasci` on 2026-08-29. foreman's Workloads now land in `llm`
  # (foreman.taskNamespace) and the git-credentials Kyverno policy follows them,
  # so a Workload scheduled into `datasci` will no longer get its credentials.
  - ./foreman/ks.yaml
  - ./dispatch/ks.yaml
