---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langflow
  namespace: llm
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  maxHistory: 3
  install:
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      langflow:
        replicas: 1
        # Langflow runs its Alembic migrations on startup and its docs ask for
        # a single instance while they run. RollingUpdate would start the new
        # version beside the old one against the same database.
        strategy: Recreate
        containers:
          app:
            image:
              repository: langflowai/langflow
              tag: 1.12.7@sha256:d2df4bb593c49ce385a3862d74278cf119bb9c7672ba69ee6e727530911a12f9
            envFrom:
              - secretRef:
                  name: langflow-db-secret
            env:
              LANGFLOW_DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: langflow-db-secret
                    key: LANGFLOW_DATABASE_URL
              # The image has set LANGFLOW_AUTO_LOGIN=false since 1.11
              # (langflow#14164), and no superuser password is set here. With
              # auto-login off, startup first tears down the default `langflow`
              # superuser if it has never logged in (its folders, flows,
              # variables and API keys cascade with it), then fails on the
              # empty password. Keep the 1.5 behaviour explicitly.
              LANGFLOW_AUTO_LOGIN: "true"
              # Absolute path: the 1.12 image runs as uid 1000 in a root-owned
              # /app, so the old relative `app/langflow` (/app/app/langflow)
              # cannot be created. /app/langflow is pre-created for that user
              # (checked in the 1.12.6 image, 2026-10-19). No PVC: the secret
              # key is regenerated on restart, as before.
              LANGFLOW_CONFIG_DIR: /app/langflow
              LANGFLOW_MCP_ENABLED: "true"
              LANGFLOW_MCP_DEBUG: "true"
    service:
      app:
        controller: langflow
        ports:
          http:
            port: 7860
    route:
      app:
        hostnames: ["langflow.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 7860
