---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# Single-node ClickHouse for Langfuse, shaped like rybbit-clickhouse. Not the
# chart's own: langfuse 2.x deploys ClickHouse as a ClickHouseCluster CR with
# three Keeper replicas, which needs the ClickHouse operator and is far beyond
# one trace store. Langfuse runs against it with CLICKHOUSE_CLUSTER_ENABLED=false.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: langfuse-clickhouse
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      langfuse-clickhouse:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &image
              repository: clickhouse/clickhouse-server
              tag: 26.9-alpine@sha256:ebfa2210dce4d75af8f73ef02588d1a8fc67a44dcdd573a6c8055597177c1ca1
            env:
              CLICKHOUSE_DB: default
              CLICKHOUSE_USER: default
              CLICKHOUSE_DO_NOT_CHOWN: "1"
              CLICKHOUSE_PASSWORD: &password
                valueFrom:
                  secretKeyRef:
                    name: langfuse-secret
                    key: CLICKHOUSE_PASSWORD
            # Langfuse's guidance is 2Gi+ for production; this one holds a
            # homelab's traces, and the caches below are cut to fit. ClickHouse
            # sizes itself from the cgroup limit, not the node, so the limit
            # stays at 3Gi. The request was 1Gi; working set p95 was 314Mi
            # (max 318Mi) over its first ~5h of traffic on 2026-10-18. 512Mi
            # leaves room for the weekly retention mutation below, which
            # rewrites the oldest month's parts.
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 3Gi
      # RETENTION. Langfuse's own data retention is an Enterprise Edition
      # feature when self-hosted (https://langfuse.com/docs/administration/data-retention),
      # so nothing in this ClickHouse ever expires without this job. At the
      # first day's rate (~100 MiB/day on disk in events_full) the 20Gi volume
      # would fill in about 7 months.
      #
      # Langfuse 4 writes every span to events_full; events_core_mv copies a
      # slim version into events_core on INSERT only, so a delete on
      # events_full never reaches events_core and both are trimmed here. The
      # legacy traces/observations/scores tables hold 0 rows on 4.63 and are
      # left alone. The cut is on start_time, the column Langfuse's own
      # retention uses for observations, and the partition key
      # (toYYYYMM(start_time)), so a run only rewrites the month that
      # straddles the cut. Weekly rather than daily for the same reason:
      # each run rewrites that whole month, so rows live 90 to 97 days.
      #
      # blob_storage_file_log is Langfuse's index of the event files in S3.
      # Langfuse's blob-storage docs say to give it a TTL matching the bucket
      # lifecycle (30 days, ./objectbucketclaim.yaml). It is set here, and only
      # when missing (a repeated MODIFY TTL would re-materialize every part),
      # so a Langfuse migration that recreates the table gets it back.
      #
      # mutations_sync=1 makes a run fail visibly if a mutation does. No
      # shell parameter expansion with braces: Flux's post-build substitution
      # would read it as a variable.
      retention:
        type: cronjob
        cronjob:
          schedule: "30 3 * * 0"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          backoffLimit: 2
          activeDeadlineSeconds: 7200
        containers:
          app:
            image: *image
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                for t in events_full events_core; do
                  n=$(clickhouse-client --query "SELECT count() FROM $t WHERE start_time < now() - INTERVAL 90 DAY")
                  echo "$t: $n rows older than 90 days"
                  if [ "$n" -gt 0 ]; then
                    clickhouse-client --mutations_sync=1 --query "ALTER TABLE $t DELETE WHERE start_time < now() - INTERVAL 90 DAY"
                    echo "$t: deleted"
                  fi
                done
                if clickhouse-client --query "SELECT create_table_query FROM system.tables WHERE database = currentDatabase() AND name = 'blob_storage_file_log'" | grep -q ' TTL '; then
                  echo "blob_storage_file_log: TTL already set"
                else
                  clickhouse-client --query "ALTER TABLE blob_storage_file_log MODIFY TTL created_at + INTERVAL 30 DAY DELETE"
                  echo "blob_storage_file_log: TTL set to 30 days"
                fi
            # clickhouse-client reads these, so the password is never on a
            # command line.
            env:
              CLICKHOUSE_HOST: langfuse-clickhouse.llm.svc.cluster.local
              CLICKHOUSE_USER: default
              CLICKHOUSE_PASSWORD: *password
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: langfuse-clickhouse
        ports:
          http:
            port: 8123
          # Native protocol, used by Langfuse's migrations.
          tcp:
            port: 9000
    # Server only: the retention job talks to the Service and must not mount
    # the RWO volume.
    persistence:
      data:
        existingClaim: langfuse-clickhouse
        advancedMounts:
          langfuse-clickhouse:
            app:
              - path: /var/lib/clickhouse
      config:
        type: configMap
        identifier: config
        advancedMounts:
          langfuse-clickhouse:
            app:
              - path: /etc/clickhouse-server/config.d/langfuse.xml
                subPath: config.xml
    configMaps:
      config:
        data:
          # The system log tables are most of an idle ClickHouse's writes and
          # memory; query_log stays, kept for an hour, for debugging slow
          # Langfuse pages. Same trimming as rybbit-clickhouse.
          config.xml: |
            <clickhouse>
                <logger>
                    <level>warning</level>
                    <console>true</console>
                </logger>
                <listen_host>0.0.0.0</listen_host>
                <mark_cache_size>268435456</mark_cache_size>
                <index_mark_cache_size>67108864</index_mark_cache_size>
                <uncompressed_cache_size>67108864</uncompressed_cache_size>
                <query_log>
                    <database>system</database>
                    <table>query_log</table>
                    <partition_by>toYYYYMM(event_date)</partition_by>
                    <flush_interval_milliseconds>60000</flush_interval_milliseconds>
                    <ttl>event_date + INTERVAL 1 HOUR DELETE</ttl>
                </query_log>
                <query_thread_log remove="remove"/>
                <metric_log remove="remove"/>
                <asynchronous_metric_log remove="remove"/>
                <trace_log remove="remove"/>
                <text_log remove="remove"/>
                <part_log remove="remove"/>
                <session_log remove="remove"/>
                <processors_profile_log remove="remove"/>
                <query_views_log remove="remove"/>
                <query_metric_log remove="remove"/>
                <asynchronous_insert_log remove="remove"/>
                <error_log remove="remove"/>
                <interserver_http_port remove="remove"/>
                <mysql_port remove="remove"/>
                <postgresql_port remove="remove"/>
            </clickhouse>
