---
# Every value Langfuse keeps for its lifetime, generated once in-cluster so
# there is nothing to create in Bitwarden.
#
#   !!! langfuse-secret MUST NEVER BE REGENERATED !!!
#   ENCRYPTION_KEY encrypts columns in Postgres (LLM connection keys) and SALT
#   hashes every API key. A new value makes the encrypted columns unreadable
#   and invalidates every project key, LiteLLM's included. Hence
#   refreshPolicy CreatedOnce (ESO writes the Secret only if it does not exist
#   and never touches it again) and creationPolicy Orphan + deletionPolicy
#   Retain (deleting or pruning the ExternalSecret leaves the Secret behind,
#   and a re-created ExternalSecret adopts it unchanged). Do not delete the
#   Secret to "rotate" it. A template edit here also does NOT reach the
#   existing Secret; add new keys to a separate ExternalSecret instead.
#
# Langfuse wants ENCRYPTION_KEY as 64 hex characters: 32 generated characters,
# hex-encoded.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: langfuse-hex
spec:
  length: 32
  encoding: hex
  secretKeys:
    - ENCRYPTION_KEY
---
# Alphanumeric on purpose: CLICKHOUSE_PASSWORD is interpolated into the
# migration URL's query string, and Langfuse's entrypoint refuses & = # ? %.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: langfuse
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - SALT
    - NEXTAUTH_SECRET
    - CLICKHOUSE_PASSWORD
    - PUBLIC_KEY
    - SECRET_KEY
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name langfuse-secret
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        SALT: '{{ .SALT }}'
        ENCRYPTION_KEY: '{{ .ENCRYPTION_KEY }}'
        NEXTAUTH_SECRET: '{{ .NEXTAUTH_SECRET }}'
        CLICKHOUSE_PASSWORD: '{{ .CLICKHOUSE_PASSWORD }}'
        # The `litellm` project's API key pair, created at first boot by
        # LANGFUSE_INIT_* (helmrelease.yaml). LiteLLM reads the same two keys
        # straight from this Secret (litellm/app/helmrelease.yaml), so neither
        # side is ever typed in by hand.
        LANGFUSE_INIT_PROJECT_PUBLIC_KEY: 'pk-lf-{{ .PUBLIC_KEY }}'
        LANGFUSE_INIT_PROJECT_SECRET_KEY: 'sk-lf-{{ .SECRET_KEY }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: langfuse-hex
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: langfuse
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name langfuse-db-secret
spec:
  secretStoreRef:
    name: crunchy-pgo-secrets
    kind: ClusterSecretStore
  refreshInterval: 1m
  target:
    name: *name
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        # Host, user and database are in helmrelease.yaml; the chart takes only
        # the password from a Secret.
        password: '{{ .password }}'
  dataFrom:
    - extract:
        key: postgres-pguser-langfuse
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name langfuse-oidc
spec:
  # The client secret is generated next to the Authentik blueprint in
  # `security` (security/authentik/app/langfuse-oidc.yaml); this store may
  # read only that one Secret, and only from `llm`. A regenerated secret
  # reaches Langfuse within the hour and Reloader restarts the pods.
  secretStoreRef:
    name: authentik-oidc-langfuse
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        client-secret: '{{ index . "client-secret" }}'
  dataFrom:
    - extract:
        key: authentik-langfuse-oidc
