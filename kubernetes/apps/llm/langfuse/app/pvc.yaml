---
# No VolSync: traces are an observability store, not a record. Losing them
# costs history, not function, same as rybbit-clickhouse.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: langfuse-clickhouse
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 20Gi
