---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app langfuse
  namespace: flux-system
spec:
  path: ./kubernetes/apps/llm/langfuse/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: llm
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  dependsOn:
    - name: external-secrets-stores
    # The `langfuse` user is declared in crunchy-postgres/cluster/cluster.yaml;
    # crunchy-pgo-secrets hands its password to langfuse-db-secret.
    - name: crunchy-postgres-operator-cluster
    - name: crunchy-postgres-stores
    # Queue and cache on db 5 of the shared Dragonfly.
    - name: dragonfly-cluster
    # ceph-block for ClickHouse, ceph-bucket for the event bucket.
    - name: rook-ceph-cluster
    # authentik-oidc-langfuse, the store that hands the OIDC client secret
    # from `security` to this namespace (security/authentik/app/langfuse-oidc.yaml).
    - name: authentik
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  postBuild:
    substitute:
      APP: *app
