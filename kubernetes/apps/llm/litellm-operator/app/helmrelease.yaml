---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm-operator
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: litellm-operator
  install:
    # The chart ships six CRDs under crds/. Helm only installs those on FIRST
    # install and never touches them again, so CreateReplace on upgrade is what
    # actually picks up schema changes when the chart version bumps.
    crds: Create
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    controller:
      logLevel: info
      leaderElection:
        # Single replica, so nothing to elect -- but unlike tuppr this manager
        # does no draining, so a missed lease renewal is cheap. Left on to match
        # upstream defaults and to make scaling to 2 safe later.
        enabled: true
    llmkube:
      # OFF since 2026-10-11. On, the operator mints a LiteLLMModel per Ready
      # InferenceService (embed-1, embed-2, qwen38-flash-next), but nothing
      # served them: the only LiteLLMProxy, litellm-admin, selects no models,
      # and the real gateway reads the hand-written config.yaml in
      # ../../litellm/app. They were a second model inventory that looked
      # authoritative and was not. Models stay file-based (one `&worker4`
      # anchor there names the server once); see the "Cloud plans" notes in
      # that ConfigMap.
      #
      # With this off the operator runs its llmkube-model-cleanup controller
      # instead, which deletes the LiteLLMModels it minted (labelled
      # managed-by=llmkube and owned by their InferenceService) -- no manual
      # cleanup. Note the operator's API mode could push models without a
      # gateway restart, but it keys models by name, so no pools and no
      # two-backend embedding model; not worth splitting the inventory for.
      autoRegister: false
    webhook:
      # Self-managed serving cert; no cert-manager Certificate needed. The
      # operator patches its own CA bundle into the ValidatingWebhookConfiguration.
      enabled: true
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
