---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app litellm-operator
  namespace: flux-system
spec:
  path: ./kubernetes/apps/llm/litellm-operator/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: llm
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  # NOT a dependency of ./litellm/ks.yaml, and that is intentional. The proxy
  # there is a plain app-template HelmRelease reading a hand-written
  # config.yaml, and models stay there. The operator manages only virtual keys
  # and teams (../litellm/keys, through the inert litellm-admin LiteLLMProxy),
  # so `litellm-keys` depends on it, but the gateway's availability never does.
  #
  # No dependsOn llmkube since 2026-10-11: that existed only for
  # `llmkube.autoRegister: true`, which needs the inference.llmkube.dev CRDs at
  # start. It is off now, and the cleanup controller that replaces it does not
  # need them.
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
