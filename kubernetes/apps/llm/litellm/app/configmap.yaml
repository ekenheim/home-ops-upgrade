---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-configmap
data:
  config.yaml: |
    model_list:
      # --- Chat: LLMKube on worker4's Strix Halo iGPU ---
      # Qwen3.8-Flash-Next (MoE, 6B of 125B active, plus a 51B n-gram table
      # that stays in page cache), served by llama.cpp/ROCm. Replaced Ornith
      # 2026-10-04: `deep`-class coding quality (SWE-bench Pro 62.5 vs Ornith's
      # 50.4) at roughly half Ornith's speed -- ~23 t/s generation and ~530 t/s
      # prefill on this APU by community numbers, unmeasured here yet. See
      # ../../llmkube/app/qwen38-flash-next.yaml for the budget, the runtime
      # caveats, and the rollback to ornith-35b (parked, weights still cached).
      #
      # EVERY local alias below is this one server. They differ only in how
      # hard the model thinks, set per alias through chat_template_kwargs:
      #   reasoning_effort  xhigh (the template default) | medium | low | none
      # chat_template_kwargs is a server-side default here, so callers need not
      # send anything. It survives `drop_params: true` (verified on Ornith's
      # enable_thinking) and reaches llama.cpp because the InferenceService
      # runs with `jinja: true`. It does NOT survive litellm's /v1/responses
      # bridge -- see marimo.toml -- so thinking-off callers must use chat.
      #
      # medium, not the default xhigh, for the general aliases: at ~23 t/s an
      # xhigh answer can spend minutes thinking, and every response is capped
      # at 16384 tokens (--n-predict) including the thinking. `deep` keeps
      # xhigh for the jobs that can wait.
      #
      # The served id must match the InferenceService's --alias. Verify with:
      #   curl http://qwen38-flash-next.llm:8080/v1/models
      # litellm does not validate this at startup; a wrong name 404s per request
      # while the proxy still reports healthy.
      #
      # NOTE this is a *reasoning* model: it emits reasoning_content and burns
      # output tokens thinking before answering. Callers with a tight max_tokens
      # get an empty content and finish_reason=length. drop_params below keeps
      # litellm from choking on the extra field.
      #
      # max_input_tokens is the InferenceService's *per-slot* window
      # (contextSize / parallelSlots), not the total KV budget. openai/<custom>
      # is absent from litellm's cost map, so without this litellm has no idea
      # how big the window is and enable_pre_call_checks below is inert -- it
      # forwards a doomed request and surfaces the backend's 400 instead of
      # catching it. Note hermes does NOT learn the window from this: it reads
      # /v1/models, which returns bare ids. Set model.context_length in the
      # hermes ConfigMap too, and move all of them with contextSize.
      #
      # 131072 = contextSize 262144 / parallelSlots 2, half the model's native
      # 262144 (lowered 2026-10-17, see qwen38-flash-next.yaml). Every local
      # alias and pool rung must carry the same value. In the mixed pools a
      # longer prompt skips the worker4 rung via enable_pre_call_checks and
      # lands on a hosted rung; the local pools use context_window_fallbacks.
      #
      # `&worker4` below is the one place the server is named. Every other
      # worker4 entry (review, fast, home-assistant, local-pool*, the pool
      # rungs) merges it with `<<: *worker4`, so a model swap edits model and
      # api_base once. Each of them MUST still set its own chat_template_kwargs:
      # a merge copies the anchor's keys into a new dict, but a nested dict it
      # does not override is the SAME object in every entry -- the PyYAML trap
      # the model_info note under "Cloud plans" describes. model_info stays
      # spelled out per entry for the same reason.
      - model_name: self-hosted
        model_info:
          mode: chat
          supports_function_calling: true
          supports_vision: true
          max_input_tokens: 131072
        litellm_params: &worker4
          model: openai/qwen38-flash-next
          api_base: http://qwen38-flash-next.llm:8080/v1
          api_key: none
          chat_template_kwargs:
            reasoning_effort: medium

      # `review` was the alias agentmemory pointed ANTHROPIC_MODEL at (removed 2026-09-17).
      - model_name: review
        model_info:
          mode: chat
          supports_function_calling: true
          supports_vision: true
          max_input_tokens: 131072
        litellm_params:
          <<: *worker4
          chat_template_kwargs:
            reasoning_effort: medium

      # `fast` is the same backend as `self-hosted` with thinking switched off.
      #
      # For mechanical work (extraction, classification, the `auto` router's
      # classifier) thinking is pure overhead. Measured on this cluster on an
      # earlier model, same prompt and same weights:
      #
      #   self-hosted (thinking on)   7.9s   300 completion tokens
      #   fast        (thinking off)  0.4s     7 completion tokens
      #
      # Thinking goes off with enable_thinking: false, not reasoning_effort:
      # none. This template accepts only xhigh/medium/low (and high, read as
      # xhigh) and raises on anything else, so `none` 500s every request; the
      # check sits inside `if enable_thinking`, which false skips.
      #
      # Use `self-hosted`/`review` when the reasoning is the point; use `fast`
      # for bulk throughput.
      - model_name: fast
        model_info:
          mode: chat
          supports_function_calling: true
          supports_vision: true
          max_input_tokens: 131072
        litellm_params:
          <<: *worker4
          chat_template_kwargs:
            enable_thinking: false

      # Home Assistant's Assist agent (Extended OpenAI Conversation in HA).
      # Same local backend as `fast` -- thinking off, tool calls supported --
      # but with a voice-sized per-call timeout: the global request_timeout
      # (1800 s) is sized for long reasoning jobs, and nobody waits that long
      # for "turn off the lights". When worker4 is down or slow, the router
      # falls back to the ChatGPT subscription (see router_settings.fallbacks).
      # Never to MiniMax: HA prompts carry home state, which the PRIVACY rule
      # below keeps off the China-based plans. HA only ever asks for
      # `home-assistant`, so reordering or swapping providers never needs a
      # change in HA.
      - model_name: home-assistant
        model_info:
          mode: chat
          supports_function_calling: true
          supports_vision: true
          max_input_tokens: 131072
        litellm_params:
          <<: *worker4
          timeout: 20
          chat_template_kwargs:
            enable_thinking: false

      # Lingarr's en->sv subtitle work, MiniMax only. gemma3-27b was the
      # order-2 fallback and was removed with it from worker4 on 2026-10-04,
      # so when MiniMax cools down (a 429 when the Token Plan's 5-hour window
      # is spent, a 402 when the week is, an outage) Lingarr gets errors and retries rather than a slow local
      # answer. If that starts to matter, add a `translate: ["fast"]` fallback
      # -- but check this model's Swedish first: Ornith's was not usable, which
      # is why gemma existed at all.
      #
      # MiniMax-M3 on the flat plan, thinking OFF. Load-bearing: with thinking
      # on M3 spends ~900 reasoning tokens and 6-17 s on five subtitle lines
      # and its first 400 output tokens are all reasoning (finish=length,
      # empty content); off, 1-1.4 s and ~95 tokens, and the Swedish is
      # idiomatic (tested 2026-09-30 through this gateway). `extra_body` is how
      # the flag reaches MiniMax: top-level `thinking` / `reasoning_effort` are
      # dropped by drop_params. Lingarr runs 25 episodes every six hours
      # (its own settings, see apps/downloads/lingarr); the plan's windows, the
      # quota exporter and the process around them are in
      # apps/observability/exporters/minimax-quota-exporter/README.md.
      - model_name: translate
        model_info:
          mode: chat
          supports_function_calling: false
          supports_vision: false
          max_input_tokens: 65536
        litellm_params:
          model: openai/MiniMax-M3
          api_base: https://api.minimax.io/v1
          api_key: os.environ/MINIMAX_API_KEY
          extra_body:
            thinking:
              type: disabled

      # `deep` (this server at the template's full xhigh effort) was removed
      # 2026-10-11: no caller in 30 days and nothing in the repo pointed at it.
      # Bring it back as one more `<<: *worker4` entry with
      # chat_template_kwargs.reasoning_effort: xhigh if a job wants it.

      # --- ChatGPT subscription (OpenAI Codex OAuth) ---
      #
      # Same backend hermes reaches through its `openai-codex` provider plugin
      # -- https://chatgpt.com/backend-api/codex, originator codex_cli_rs --
      # but via litellm's own first-class `chatgpt/` provider, which has
      # shipped since well before the v1.97.0 we pin. No API key exists or is
      # needed: auth is an OAuth device-code grant on the PVC (see pvc.yaml),
      # and litellm prices these at cost None, so subscription calls correctly
      # land at $0 in LiteLLM_SpendLogs rather than at API list price.
      #
      # THIS IS A THIRD, INDEPENDENT LOGIN. Do NOT copy hermes'
      # /opt/data/auth.json here, and do not copy the codex CLI's either. A
      # Codex refresh token is single-use and rotates on every use, so two
      # clients sharing one grant means whichever refreshes second is logged
      # out -- the same trap hermes' own ConfigMap documents at length. Three
      # separate device logins (codex CLI, hermes, litellm) is the supported
      # arrangement; OpenAI allows concurrent sessions per account.
      #
      # HOW TO LOG IN, AND WHY IT IS NOT AN `exec` COMMAND. There is no
      # `litellm auth` subcommand, and -- corrected after watching it happen --
      # the flow is NOT lazy per-request. litellm resolves this model while
      # loading config.yaml, so with no auth.json on the PVC the device login
      # runs during STARTUP and the proxy never binds :4000 until it finishes.
      # You therefore cannot exec into a running pod to seed it: there is no
      # running pod to exec into. The procedure is:
      #
      #   1. Let the pod start. Once per container start it prints:
      #        Sign in with ChatGPT using device code:
      #        1) Visit https://auth.openai.com/codex/device
      #        2) Enter code: XXXX-XXXXX
      #      Read it with:
      #        kubectl -n llm logs -l app.kubernetes.io/name=litellm \
      #          --tail=40 | grep -a "Enter code"
      #   2. Enter that code at the URL within 15 minutes. The SAME container
      #      then finishes booting -- no restart needed. The startup probe is
      #      sized at 20 minutes precisely so this can complete; see the
      #      comment on it in helmrelease.yaml.
      #   3. Confirm the grant landed on the PVC:
      #        kubectl -n llm exec deploy/litellm -c app -- \
      #          ls -la /chatgpt-auth/auth.json
      #
      # Do NOT edit the pod template while a code is pending -- that rolls the
      # pod and invalidates the code. Re-run this after any PVC rebuild; there
      # is nothing in Bitwarden to restore, by design.
      #
      # MODEL CHOICE. gpt-5.4, not the gpt-5.5 hermes defaults to: 5.5 and the
      # 5.6 family are absent from litellm's registry, so they would arrive
      # with no context metadata and make enable_pre_call_checks inert for
      # this entry -- the same blind spot the openai/qwen38-flash-next entries above
      # have to work around with a hand-set max_input_tokens. Registered here
      # are 5.4 and 5.4-pro (1050000), and 5.3-codex, 5.3-codex-spark,
      # 5.3-instant, 5.3-chat-latest, 5.2, 5.2-codex, 5.1-codex-max,
      # 5.1-codex-mini (128000). 5.4 is both registered and the larger window.
      #
      # STREAMING IS MANDATORY ON /chat/completions, AND THIS IS THE ONE THING
      # MOST LIKELY TO BITE. Verified against the live backend 2026-08-22 on
      # litellm v1.97.0:
      #
      #   /v1/responses          stream or not   OK
      #   /chat/completions      stream=True     OK  ("PONG", tool calls fine)
      #   /chat/completions      stream=False    FAILS, 2 of 2 attempts
      #     APIConnectionError: ChatgptException - Unknown items in responses
      #     API response: []
      #
      # The cause is a gap in litellm, not a backend limit. The Codex endpoint
      # only speaks SSE, so responses/transformation.py:84 hard-sets
      # request["stream"] = True and then reassembles the event stream back
      # into a whole response (transform_response, ~137-204). The chat bridge
      # does NOT do that -- chat/transformation.py:74 leaves
      # optional_params.setdefault("stream", False) while common_utils still
      # sends `accept: text/event-stream`, so it asks for a non-stream, gets
      # SSE back, and parses an empty output list out of it.
      #
      # Consequence for this cluster: hermes runs streaming.enabled false (see
      # its ConfigMap, where that is load-bearing for the watchdog timing), so
      # pointing hermes at THIS alias would fail every call. hermes reaches
      # ChatGPT through its own `openai-codex` plugin instead and is unaffected
      # -- keep it that way. Open WebUI streams by default and is fine. Any new
      # non-streaming caller (cron jobs, anything calling litellm.completion
      # without stream=True) has to use /v1/responses, which is why model_info
      # declares mode: responses rather than chat.
      #
      # supports_function_calling / supports_vision below are not aspirational:
      # both were True in litellm's own registry for gpt-5.4, and a streaming
      # tool call was exercised end to end (get_weather -> {"city":"Malmo"}).
      #
      # gpt-5.5 is NOT in litellm's bundled model_prices map (its chatgpt/
      # entries stop at gpt-5.4, on main too), so litellm has no cost or
      # capability metadata for it -- which is why model_info is spelled out
      # above rather than inherited. That map is a pricing table that lags the
      # backend; it is NOT a support list, and its gaps say nothing about what
      # Codex serves. The authoritative list is the backend's own:
      #   GET https://chatgpt.com/backend-api/codex/models?client_version=0.0.0
      # which on 2026-09-02 returned gpt-5.6-{sol,terra,luna}, gpt-reserve,
      # gpt-5.5, gpt-5.4, gpt-5.4-mini, codex-auto-review.
      #
      # Note that list is the CODEX surface and is not the same as the model
      # picker on chatgpt.com -- the web app offers gpt-5-5-instant,
      # -thinking, mini variants and Deep Research, none of which exist here.
      # `chatgpt/gpt-5.4-pro` is the cautionary case: visible as a plan
      # feature, rejected by Codex with "The 'gpt-5.4-pro' model is not
      # supported when using Codex with a ChatGPT account."
      #
      # A usage_limit_reached 429 surfaces on this provider as a bare HTML
      # error page, not JSON, so it is easy to misread as the model being
      # rejected. Check the limit before concluding a model is unsupported.
      #
      # Unrelated: issue #27175 reports Cloudflare 403s on this provider. It
      # does NOT reproduce here -- filed against v1.83.14, several releases
      # older than the v1.97.0 we pin. Both the auth endpoint and inference
      # answered normally from inside the cluster.
      #
      # DELIBERATELY ABSENT FROM router_settings.fallbacks below. Every other
      # alias here is free, local compute; this one spends a metered human
      # subscription shared with hermes and the codex CLI. A `deep` outage
      # must not silently start drawing it down. Anything that wants this has
      # to name `chatgpt` explicitly.
      #
      # 2026-09-28: gpt-5.5 -> gpt-6-astra, the new flagship on the account's
      # Codex model list. litellm v1.103 has no registry entry for it, and
      # with no entry the chatgpt/ provider sends chat calls to
      # /codex/chat/completions, which Codex answers with a bare-HTML 403.
      # `mode: responses` here is load-bearing: the router registers this
      # model_info, which makes litellm bridge chat -> /codex/responses
      # (verified: 403 without it, PONG with it). Streaming only, as above.
      #
      # 2026-10-11: gpt-6-astra -> gpt-5.6-luna. `chatgpt` is the everyday
      # alias (openclaw's fallback, memini, marimo, home-assistant's fallback),
      # and astra on it drew the shared subscription's limits down at flagship
      # rate for small calls: list price $10 / $50 per M tokens against luna's
      # $0.20 / $1.20. Astra stays on `frontier-pool`, which is the alias to
      # name for a hard problem. Luna answered PONG streamed through the
      # chatgpt/ provider before the switch.
      - model_name: chatgpt
        model_info:
          mode: responses
          max_input_tokens: 272000
          max_output_tokens: 128000
          supports_function_calling: true
          supports_vision: true
        litellm_params:
          model: chatgpt/gpt-5.6-luna

      # === Cloud plans and ordered pools (kubernetes/apps/llm/PLATFORM-PLAN.md) ===
      #
      # Layout after joryirving/home-ops. Flat-rate coding plans, each capped
      # on a rolling window, sit behind pool aliases so a cap-out moves to the
      # next rung instead of failing the caller.
      #
      # `order:` is litellm's own failover: within one model_name, lower order
      # is tried first, and once retries are exhausted litellm synthesises a
      # fallback to the next order. No `fallbacks:` entry is needed for that.
      #
      # Only plans that are actually bought get a rung. An unbought plan's rung
      # does fall through (fallbacks fire on ANY exception), but it costs every
      # call a failed hop first: Kimi's empty key failed 229 reasoning-pool
      # calls a week until its rungs were removed on 2026-10-11, along with
      # Z.AI's. Kimi Coding and Z.AI GLM Coding (PLATFORM-PLAN.md) come back as
      # rungs when bought; the entries are in git history at that date, and
      # the externalsecret already templates KIMI_CODE_API_KEY / ZAI_API_KEY.
      #
      # Cap-out signals differ: MiniMax sends 429 (code 2056) once the 5-hour
      # window is spent and 402 (code 2067) once the weekly allowance is, ChatGPT sends 429 as a bare HTML page (Kimi
      # sent 403, Z.AI 429).
      #
      # The chatgpt/ rungs only work for STREAMING callers: litellm v1.103.0
      # still defaults stream=False on the chatgpt chat bridge and the Codex
      # backend only speaks SSE (see the `chatgpt` block above). A
      # non-streaming caller fails that rung and falls through to the next.
      #
      # PRIVACY: MiniMax (and Kimi and Z.AI, if bought) are China-based. The pools are opt-in
      # by alias; nothing that carries email, finance or home data may use
      # them. The local aliases above never fall back to a cloud rung.
      #
      # NEVER share a model_info block between rungs with a YAML anchor/alias.
      # PyYAML returns the SAME dict for every alias, litellm stamps its
      # deployment id into model_info, and every rung ends up with the last
      # rung's id: the pool silently collapses to one deployment (found
      # 2026-09-28 testing this block -- reasoning-pool went straight to
      # Ornith and cooled itself down). `<<:` merges on litellm_params are
      # fine, they build a new dict.
      #
      # input/output costs are the providers' list prices, so the LiteLLM UI
      # shows what the traffic would have cost pay-per-use. The plans are flat;
      # this is not what is billed.

      # --- Direct aliases, one per upstream model ---
      - model_name: MiniMax-M3
        model_info:
          mode: chat
          max_input_tokens: 1000000
          max_output_tokens: 131072
          supports_function_calling: true
          supports_prompt_caching: true
          supports_vision: true
          input_cost_per_token: 3.0e-07
          output_cost_per_token: 1.2e-06
        litellm_params:
          # litellm's minimax/ provider speaks MiniMax's OpenAI-style API, so
          # the base is /v1. Jory's .../anthropic/v1/messages (and /anthropic,
          # /anthropic/v1) all 404 through it -- tested 2026-09-28 on v1.103.0.
          model: minimax/MiniMax-M3
          api_base: https://api.minimax.io/v1
          api_key: os.environ/MINIMAX_API_KEY
          cache_control_injection_points:
            - location: message
              role: system
            - location: message
              index: -1
          # Thinking off at the deployment, not only in the callers (2026-10-08): the
          # minimax/ provider passes a top-level `thinking` only while litellm's cost map
          # says M3 supports_reasoning, and drop_params removes it silently otherwise
          # (what the openai/ rungs did until #7242, 14.7k thinking tokens a call).
          # extra_body is merged verbatim. Callers: Atlas's roles and Hindsight's retain.
          extra_body:
            thinking:
              type: disabled
          # Atlas abandons a role call at 360 s (ATLAS_LLM_ROLE_TIMEOUT_SECONDS). Without a
          # deployment timeout the upstream call runs on for up to request_timeout x
          # (1 + num_retries) and holds one of the atlas key's 3 parallel slots.
          timeout: 400
      # Same model on MiniMax's ANTHROPIC-compatible endpoint, for callers
      # that speak Anthropic Messages (OpenClaw's `minimax` provider through
      # this gateway's /v1/messages). `mode: messages` is load-bearing: it
      # makes litellm pass the Anthropic request straight through instead
      # of translating it to chat completions; without it every path 404'd
      # (the 2026-09-28 test). M3 returns real thinking blocks and tool_use
      # here, which is what OpenClaw's adapter expects (its bundled MiniMax
      # provider uses this exact endpoint); on the OpenAI endpoint the
      # reasoning arrives as reasoning_content deltas and leaks into replies.
      # Jory's minimax-m3.yaml, verbatim apart from the name.
      - model_name: MiniMax-M3-messages
        model_info:
          mode: messages
          max_input_tokens: 1000000
          max_output_tokens: 131072
          supports_function_calling: true
          supports_prompt_caching: true
          supports_vision: true
          input_cost_per_token: 3.0e-07
          cache_creation_input_token_cost: 3.0e-07
          cache_read_input_token_cost: 6.0e-08
          output_cost_per_token: 1.2e-06
        litellm_params:
          model: minimax/MiniMax-M3
          api_base: https://api.minimax.io/anthropic/v1/messages
          api_key: os.environ/MINIMAX_API_KEY
          cache_control_injection_points:
            - location: message
              role: system
            - location: message
              index: -1
      # Same model on MiniMax's OpenAI-compatible endpoint: the terminal
      # fallback for the local pools, where callers speak chat completions.
      - model_name: MiniMax-M3-chat
        model_info:
          mode: chat
          max_input_tokens: 1000000
          max_output_tokens: 131072
          supports_function_calling: true
          input_cost_per_token: 3.0e-07
          output_cost_per_token: 1.2e-06
        litellm_params:
          model: openai/MiniMax-M3
          api_base: https://api.minimax.io/v1
          api_key: os.environ/MINIMAX_API_KEY
      # Hindsight's consolidation model (llm/hindsight helmrelease, "Consolidation:
      # MiniMax-M3 first, then the 5090"), an ordered pool like the ones below.
      # Order 1, since 2026-10-05 (the weekly MiniMax allowance reset): MiniMax-M3 on
      # the flat plan, thinking off by `extra_body` here, as on `translate`: the
      # top-level "thinking" Hindsight sends is dropped by drop_params on this
      # route (the first call after the switch: 14.7k thinking tokens, 137 s). When it
      # caps out (429) or fails, order 2 answers: qwen3.8 27B (Q4_K_M) on Ollama on
      # the owner's main PC (RTX 5090), free, which Atlas's blind review found as
      # faithful as Codex luna (atlas ticket 21); Hindsight sends "think": false.
      # Never worker4 (too slow for consolidation). The PC is not always on: with
      # MiniMax capped and the PC off, consolidation fails until one is back.
      # 192.168.1.182 is the PC's DHCP lease: reserve it in DHCP. (The UI-added
      # `qwen3.8:latest` route to the same Ollama was deleted 2026-10-11; this
      # rung never depended on it.) num_ctx pinned at Ollama's
      # VRAM default for this card (32768); the largest consolidation call is about
      # 20k tokens.
      - model_name: hindsight-consolidation
        model_info:
          mode: chat
          max_input_tokens: 1000000
          max_output_tokens: 131072
          input_cost_per_token: 3.0e-07
          output_cost_per_token: 1.2e-06
        litellm_params:
          model: openai/MiniMax-M3
          api_base: https://api.minimax.io/v1
          api_key: os.environ/MINIMAX_API_KEY
          extra_body:
            thinking:
              type: disabled
          timeout: 600
          order: 1
      - model_name: hindsight-consolidation
        model_info:
          mode: chat
          max_input_tokens: 32768
        litellm_params:
          model: ollama/qwen3.8:latest
          api_base: http://192.168.1.182:11434
          num_ctx: 32768
          timeout: 600
          order: 2

      # --- pc/*: the owner's main PC (RTX 5090, Ollama), for test development ---
      # A wildcard route: `pc/<ollama tag>` reaches that tag on the PC, so
      # anything pulled there (`ollama pull`) is callable with no gateway
      # restart -- e.g. pc/qwen3.8:ctx64k, pc/qwen3.6:35b, pc/qwen3.5:9b.
      # Replaced the UI-added `qwen3.8:latest` route deleted 2026-10-11.
      #
      # Local hardware, so private data may use it. But the PC is not always on
      # and there is NO fallback: a call while it is off fails fast with a
      # connection error, which is what a dev route should do. Not a production
      # path -- hindsight-consolidation reaches the same Ollama on its own rung
      # above. ollama_chat/ (Ollama's /api/chat), not ollama/ (/api/generate),
      # so chat templates and tool calls go through. No max_input_tokens: it
      # differs per tag (the -ctxNNk tags bake num_ctx in). Same DHCP lease as
      # the rung above. Swapping a 24 GB model into VRAM takes a while, hence
      # the timeout.
      - model_name: pc/*
        model_info:
          mode: chat
        litellm_params:
          model: ollama_chat/*
          api_base: http://192.168.1.182:11434
          timeout: 600
      # M3.1 Flash Preview replaces M2.7, which MiniMax retires on 2026-11-18;
      # from 2026-10-19 plan requests for M2.5/M2.7 are routed to it anyway.
      # Tool calls verified on the chat endpoint 2026-10-17 (no
      # reasoning_content in the reply). It is not in /v1/models yet but
      # answers by this name. The 204800 window is M2.7's, kept until a larger
      # one is verified here.
      - model_name: MiniMax-M3.1-Flash-Preview
        model_info:
          mode: chat
          max_input_tokens: 204800
          max_output_tokens: 131072
          supports_function_calling: true
          supports_prompt_caching: true
          input_cost_per_token: 3.0e-07
          output_cost_per_token: 1.2e-06
        litellm_params:
          model: openai/MiniMax-M3.1-Flash-Preview
          api_base: https://api.minimax.io/v1
          api_key: os.environ/MINIMAX_API_KEY

      # --- frontier-pool: hard problems ---
      # No local floor on purpose: once every plan has rejected the request it
      # fails, rather than quietly answering with a much weaker model. Use
      # reasoning-pool when a weaker answer is acceptable.
      #
      # One rung while only ChatGPT is bought. Kimi K3 led and GLM-5.3 trailed
      # until 2026-10-11 (see "Only plans that are actually bought" above);
      # either goes back in around this rung, with `order:` on all of them.
      - model_name: frontier-pool
        model_info:
          # responses, not chat: gpt-6-astra has no litellm registry entry,
          # so this model_info is what routes it to /codex/responses (see the
          # `chatgpt` alias). mode: chat here would 403 every call.
          mode: responses
          max_input_tokens: 262144
          supports_function_calling: true
          supports_vision: true
        litellm_params:
          model: chatgpt/gpt-6-astra
          additional_drop_params: [temperature]

      # --- reasoning-pool: planning ---
      # ChatGPT terra first, MiniMax-M3 the flat-plan floor, worker4
      # (Qwen3.8-Flash-Next) the free one. 262k is worker4's per-slot window
      # and the smallest rung's. Kimi K2.7 led and GLM-5.3-flash sat third
      # until 2026-10-11 (see "Only plans that are actually bought" above).
      - model_name: reasoning-pool
        model_info:
          mode: chat
          max_input_tokens: 262144
          supports_function_calling: true
          supports_vision: true
        litellm_params:
          model: chatgpt/gpt-5.6-terra
          additional_drop_params: [temperature]
          order: 1
      - model_name: reasoning-pool
        model_info:
          mode: chat
          max_input_tokens: 262144
          supports_function_calling: true
          supports_vision: true
        litellm_params:
          model: openai/MiniMax-M3
          api_base: https://api.minimax.io/v1
          api_key: os.environ/MINIMAX_API_KEY
          order: 2
      - model_name: reasoning-pool
        model_info:
          mode: chat
          max_input_tokens: 131072
          supports_function_calling: true
          supports_vision: true
        litellm_params:
          <<: *worker4
          chat_template_kwargs:
            reasoning_effort: medium
          order: 3

      # --- implementation-pool: carrying out a plan (the coder role) ---
      # Jory's coder is a 27B on a 3090; we have no such card, so the coder
      # runs cloud-first. MiniMax leads because its Token Plan is the flat-rate
      # capacity we have (5-hour + weekly windows, metered by weighted usage,
      # not prompts -- see apps/observability/exporters/minimax-quota-exporter)
      # and a coder run is 50-200 calls. Window = 204800, M2.7's, kept for
      # MiniMax-M3.1-Flash-Preview (see its alias entry above).
      - model_name: implementation-pool
        model_info:
          mode: chat
          max_input_tokens: 204800
          supports_function_calling: true
        litellm_params:
          model: openai/MiniMax-M3.1-Flash-Preview
          api_base: https://api.minimax.io/v1
          api_key: os.environ/MINIMAX_API_KEY
          order: 1
      - model_name: implementation-pool
        model_info:
          mode: chat
          max_input_tokens: 204800
          supports_function_calling: true
        litellm_params:
          model: chatgpt/gpt-5.6-luna
          additional_drop_params: [temperature]
          order: 2
      - model_name: implementation-pool
        model_info:
          mode: chat
          max_input_tokens: 131072
          supports_function_calling: true
        litellm_params:
          <<: *worker4
          chat_template_kwargs:
            reasoning_effort: medium
          order: 3

      # --- factory-fast / factory-agent / factory-review: agent-factory, 5090 first ---
      # The agent-lab software factory (apps/agent-lab/factory) asks only for
      # these three names. The owner asked for the 5090 first (2026-10-11), so
      # order 1 of each is qwen3.8 27B on Ollama on the owner's main PC -- the
      # same Ollama as pc/* and hindsight-consolidation's order 2 -- and the
      # later orders are the hosted rungs the factory used before:
      #   factory-fast    triage (single non-streaming calls with no max_tokens
      #                   that want the JSON alone) and OpenCode's small_model.
      #                   PC with thinking off, then a copy of `fast`.
      #   factory-agent   the OpenCode worker: streams and calls tools. PC with
      #                   thinking on, then implementation-pool's rungs.
      #   factory-review  the read-only reviewer and the analysis verifier. PC,
      #                   then reasoning-pool's rungs. No "gpt-" in the name on
      #                   purpose: agent-factory refuses a review model whose
      #                   name has one (unless it also has gpt-4 or oss), since
      #                   OpenCode would then give the reviewer apply_patch.
      # The hosted rungs are copied verbatim, params and windows included; keep
      # them in step with the pools above when those change.
      #
      # Unlike pc/*, these ARE production paths, so the PC must be able to
      # disappear. A PC that is off fails its rung with a connection error, and
      # `order:` moves the call to order 2 (no `fallbacks:` entry needed). A
      # prompt over the tag's 64k window never reaches the PC: max_input_tokens
      # 65536 makes enable_pre_call_checks skip that rung and route to order 2.
      # Ollama would otherwise truncate the prompt silently to num_ctx, which
      # the qwen3.8:ctx64k tag bakes in at 65536.
      #
      # `litellm_provider: ollama_chat` in the PC rungs' model_info is
      # load-bearing for that skip, on litellm v1.105.0. Without it the router
      # registers the window under the bare tag with provider `ollama`, the
      # lookup for an ollama_chat/ deployment rejects the provider mismatch
      # (ModelNotMappedError, logged by _pre_call_checks), and the deployment
      # is kept: in one long-lived router, as here, an 80k-token prompt went to
      # the PC rung every time. With it, the same prompt went to order 2 and a
      # short one to the PC. Tested 2026-10-11 against litellm==1.105.0 with
      # this pool shape and a stub Ollama, including a refused connection
      # standing in for a PC that is off.
      #
      # THINKING OFF on factory-fast is Ollama's own top-level `think: false`,
      # set in litellm_params. litellm passes it through: ollama_chat/ is not an
      # OpenAI-compatible provider, so an unknown param lands in optional_params
      # (add_provider_specific_params_to_optional_params, utils.py), and
      # OllamaChatConfig.transform_request pops `think` into the /api/chat body
      # (llms/ollama/chat/transformation.py at v1.105.0). Not `fast`'s
      # chat_template_kwargs.enable_thinking: that is a llama.cpp template
      # switch, and on this provider an unknown param ends up in the body's
      # `options`, which is not where Ollama reads think. Capturing the body
      # litellm sends: `extra_body: {think: false}` and `reasoning_effort: none`
      # also arrive as top-level think=false, but a caller's own
      # reasoning_effort replaces the latter; `think: false` held even against a
      # caller's reasoning_effort: high.
      # Live through litellm 1.105.0 to this Ollama on 2026-10-11, the same
      # triage-style JSON prompt with no max_tokens: think false -> 13
      # completion tokens, no reasoning_content, content the JSON alone; no
      # think -> 133 tokens, 479 characters of reasoning. A streamed tool call
      # on the thinking rung came back as a proper tool_calls delta.
      #
      # Timeouts: 600 s on the agent and review rungs, as on pc/* (swapping a
      # 24 GB model into VRAM takes a while, and a long tool turn with thinking
      # on is slow). 180 s on factory-fast: triage gives a whole call 600 s
      # (FACTORY_TRIAGE_TIMEOUT_S), and with num_retries 1 a stuck PC costs
      # 2 x 180 s before `fast` gets its turn. Ollama on the PC runs with its
      # default parallelism (no OLLAMA_NUM_PARALLEL set), so the factory's
      # lanes queue there, and time spent queued counts against the timeout.
      #
      # Public code only (the `coding` team), so the hosted floors are allowed.
      # Same DHCP lease as pc/*. A different tag on the PC means editing the
      # model and max_input_tokens on all three PC rungs.
      - model_name: factory-fast
        model_info:
          mode: chat
          max_input_tokens: 65536
          litellm_provider: ollama_chat
          supports_function_calling: true
        litellm_params:
          model: ollama_chat/qwen3.8:ctx64k
          api_base: http://192.168.1.182:11434
          think: false
          timeout: 180
          order: 1
      - model_name: factory-fast
        model_info:
          mode: chat
          supports_function_calling: true
          supports_vision: true
          max_input_tokens: 131072
        litellm_params:
          <<: *worker4
          chat_template_kwargs:
            enable_thinking: false
          order: 2
      - model_name: factory-agent
        model_info:
          mode: chat
          max_input_tokens: 65536
          litellm_provider: ollama_chat
          supports_function_calling: true
        litellm_params:
          model: ollama_chat/qwen3.8:ctx64k
          api_base: http://192.168.1.182:11434
          timeout: 600
          order: 1
      - model_name: factory-agent
        model_info:
          mode: chat
          max_input_tokens: 204800
          supports_function_calling: true
        litellm_params:
          model: openai/MiniMax-M3.1-Flash-Preview
          api_base: https://api.minimax.io/v1
          api_key: os.environ/MINIMAX_API_KEY
          order: 2
      - model_name: factory-agent
        model_info:
          mode: chat
          max_input_tokens: 204800
          supports_function_calling: true
        litellm_params:
          model: chatgpt/gpt-5.6-luna
          additional_drop_params: [temperature]
          order: 3
      - model_name: factory-agent
        model_info:
          mode: chat
          max_input_tokens: 131072
          supports_function_calling: true
        litellm_params:
          <<: *worker4
          chat_template_kwargs:
            reasoning_effort: medium
          order: 4
      - model_name: factory-review
        model_info:
          mode: chat
          max_input_tokens: 65536
          litellm_provider: ollama_chat
          supports_function_calling: true
        litellm_params:
          model: ollama_chat/qwen3.8:ctx64k
          api_base: http://192.168.1.182:11434
          timeout: 600
          order: 1
      - model_name: factory-review
        model_info:
          mode: chat
          max_input_tokens: 262144
          supports_function_calling: true
          supports_vision: true
        litellm_params:
          model: chatgpt/gpt-5.6-terra
          additional_drop_params: [temperature]
          order: 2
      - model_name: factory-review
        model_info:
          mode: chat
          max_input_tokens: 262144
          supports_function_calling: true
          supports_vision: true
        litellm_params:
          model: openai/MiniMax-M3
          api_base: https://api.minimax.io/v1
          api_key: os.environ/MINIMAX_API_KEY
          order: 3
      - model_name: factory-review
        model_info:
          mode: chat
          max_input_tokens: 131072
          supports_function_calling: true
          supports_vision: true
        litellm_params:
          <<: *worker4
          chat_template_kwargs:
            reasoning_effort: medium
          order: 4

      # --- local-pool / local-pool-chat: worker4 first ---
      # Same worker4 server behind two doors, like self-hosted/fast: the bare
      # name thinks, -chat does not. Unlike self-hosted, these fall back to
      # MiniMax-M3-chat (router_settings.fallbacks) when worker4 is down, so
      # only point work that may leave the house at them.
      - model_name: local-pool
        model_info:
          mode: chat
          max_input_tokens: 131072
          supports_function_calling: true
          supports_vision: true
        litellm_params:
          <<: *worker4
          chat_template_kwargs:
            reasoning_effort: medium
      - model_name: local-pool-chat
        model_info:
          mode: chat
          max_input_tokens: 131072
          supports_function_calling: true
          supports_vision: true
        litellm_params:
          <<: *worker4
          chat_template_kwargs:
            enable_thinking: false

      # --- auto: classifier routing for interactive clients only ---
      # LLM classifier on `fast` (local, free, in every request's path). It
      # never routes to frontier-pool, so it cannot eat the capped plans that
      # interactive sessions pick by hand. REASONING folds into COMPLEX: no
      # classifier Jory tried could separate them.
      - model_name: auto
        litellm_params:
          model: auto_router/complexity_router
          complexity_router_default_model: MiniMax-M3-chat
          complexity_router_config:
            tiers:
              SIMPLE: local-pool-chat
              MEDIUM: MiniMax-M3-chat
              COMPLEX: reasoning-pool
              REASONING: reasoning-pool
            classifier_type: llm
            classifier_llm_config:
              model: fast
              timeout_ms: 20000
            classifier_fallback: default_model
            session_affinity: true
            session_affinity_ttl_seconds: 3600

      # --- Embeddings: Qwen3-Embedding-0.6B on the `embeddings` app ---
      # The only embedding model: two llmkube InferenceServices (llama.cpp,
      # CPU), balanced here by sharing one model_name. It replaced bge-m3 on
      # 2026-09-18 (same 1024 dims). Queries want an "Instruct: ...\nQuery: "
      # prefix, documents none; memini adds it, hindsight cannot.
      # Named after the model on purpose, where upstream calls it `embed`:
      # vector space is a property of the model, memini decides whether to
      # re-embed its store by comparing this NAME, and a generic alias would
      # hide a weight swap from both stores. Why this model and this server:
      # ../../embeddings/app/model.yaml.
      # If a virtual key is ever restricted by model name, it must list
      # `qwen3-embedding-0.6b`; the memini and hindsight keys were checked
      # and are not.
      - model_name: qwen3-embedding-0.6b
        model_info:
          mode: embedding
          max_input_tokens: 16384
        litellm_params:
          model: openai/embed
          api_base: http://embed-1.llm:8080/v1
          api_key: none
      - model_name: qwen3-embedding-0.6b
        model_info:
          mode: embedding
          max_input_tokens: 16384
        litellm_params:
          model: openai/embed
          api_base: http://embed-2.llm:8080/v1
          api_key: none

      # --- Rerank: memini's recall reranker ---
      # hindsight's CPU text-embeddings-inference sidecar (ms-marco MiniLM
      # cross-encoder), reused rather than adding Jory's three 8Gi reranker
      # pods. TEI speaks its own /rerank shape (query + texts); memini speaks
      # Cohere's (query + documents), and litellm's huggingface/ provider
      # translates -- verified 2026-09-28 against the live TEI pod.
      # English-only and 512-token (TEI runs --auto-truncate). If hindsight
      # is ever removed, this backend goes with it; memini then recalls
      # without reranking.
      - model_name: rerank
        model_info:
          mode: rerank
        litellm_params:
          model: huggingface/cross-encoder/ms-marco-MiniLM-L-6-v2
          api_base: http://hindsight-tei-reranker.llm.svc.cluster.local:8090
          api_key: none

    general_settings:
      health_check_endpoint: /v1/health
      # Coordination Redis -- Dragonfly, db 3.
      #
      # Silences the admin-UI "No Redis configured" banner, but the banner
      # overstates the problem for THIS deployment and it is worth writing down
      # why, so nobody later "fixes" it by scaling out. The banner warns that
      # rate limits, budgets and router state are per-worker without Redis.
      # litellm here runs one pod (`ps` in the container shows a single
      # uvicorn worker, no --num_workers), and it can never run more than one:
      # the chatgpt/ OAuth grant lives on an RWO PVC and a Codex refresh token
      # is single-use, so a second writer logs the first one out. See the long
      # comment on `strategy: Recreate` in helmrelease.yaml. There is no
      # cross-worker inconsistency to fix.
      #
      # What Redis actually buys us at one worker is PERSISTENCE. Key/team
      # budget counters and tpm/rpm windows are in-memory otherwise, and this
      # pod restarts on every config change (reloader.stakater.com/auto). Every
      # restart silently resets them. With Dragonfly they survive.
      #
      # `coordination_redis` rather than `litellm_settings.cache` on purpose:
      # this is the coordination store ONLY. Enabling the response cache would
      # also start serving cached *completions*, which is wrong for an
      # interactive proxy. _init_coordination_redis() runs before cache init and
      # is independent of it (proxy_server.py ~4658), so no cache block is
      # needed -- and litellm_settings.cache stays deliberately absent.
      #
      # db 3 is unclaimed. Dragonfly runs --cluster_mode=emulated but still
      # serves numbered DBs: db 0 is searxng/open-webui/medusa/dagster, db 1 is
      # authentik, db 2 is shared by outline/immich/thanos. `db` is not a
      # declared field on CoordinationRedisParams; it rides through on
      # extra="allow" into RedisCache(**params). Verified against the live
      # instance from inside this pod (ping, set/get, async_increment).
      #
      # No password: the dragonfly Dragonfly CR sets none, same as every other
      # consumer in this repo.
      #
      # NOT also set as router_settings.redis_host. That would move the router's
      # cooldown state for the fallbacks below into Redis, where a cooldown
      # entered just before a restart would outlive the restart. At one worker
      # in-memory cooldowns are already correct and fail open on restart, which
      # is what we want.
      coordination_redis:
        host: dragonfly.database.svc.cluster.local
        port: 6379
        db: 3
      # Store prompt and completion bodies in LiteLLM_SpendLogs.messages /
      # .response so the admin UI's Logs view can show request + response.
      # Off by default: without it litellm redacts every prompt-carrying field
      # before the row is written, and the UI renders "Request/Response Data
      # Not Available". Read from general_settings -- see
      # get_store_prompts_in_spend_logs() in spend_tracking_utils.py.
      #
      # Only affects requests made after this lands; existing rows stay empty.
      #
      # Note this writes full subtitle text (and every other caller's prompts)
      # into the shared postgres cluster.
      store_prompts_in_spend_logs: true
      # ...which is why spend rows are kept 30 days. By 2026-10-11 the table was
      # 6.5 GB / 320k rows after two months, three quarters of them hindsight
      # embedding calls. These delete whole rows (per-request history), not
      # just the bodies; key and team spend totals live on their own tables and
      # are unaffected. Postgres reuses the freed space but does not shrink the
      # file until a VACUUM FULL.
      #
      # The cleanup runs on a CRON, not the `_retention_interval` setting. The
      # interval is an APScheduler IntervalTrigger whose first fire is start +
      # interval, and this pod restarts on every ConfigMap change (reloader),
      # five times on 2026-10-11 alone -- so a 24h interval never fired once:
      # 26.6k rows older than 30 days were still there that evening. A cron
      # fires at wall-clock time whenever the pod happens to be up. One run is
      # bounded (1000 rows x 500 batches, 300 s), enough for a day's worth.
      maximum_spend_logs_retention_period: "30d"
      maximum_spend_logs_cleanup_cron: "30 3 * * *"

    router_settings:
      enable_pre_call_checks: true
      fallbacks:
        # No review/deep -> self-hosted fallbacks any more: since 2026-10-04
        # every local alias is the same qwen38-flash-next server, so falling
        # back between them would only retry the pod that just failed.
        #
        # The local pools' cloud floor, for when worker4 is down. The
        # classic local aliases above deliberately have none.
        - local-pool: ["MiniMax-M3-chat"]
        - local-pool-chat: ["MiniMax-M3-chat"]
        # Home Assistant voice: local first, then the ChatGPT subscription.
        # MiniMax was the middle rung until 2026-10-11 and is out on purpose:
        # home state may not go to the China-based plans (PRIVACY, above).
        # Reorder here to change HA's provider; HA itself is untouched.
        - home-assistant: ["chatgpt"]
        # hindsight-consolidation needs no entry: its two rungs (MiniMax-M3, then
        # the 5090) fail over by `order:`. Nor do factory-fast, factory-agent and
        # factory-review: the 5090 first, then their hosted rungs, by `order:`.
      # A prompt over worker4's 131072 window is rejected by the pre-call check
      # before it reaches the pod. Send the local pools' long prompts to the
      # same cloud floor instead of failing them; `auto` routes SIMPLE to
      # local-pool-chat, so long interactive sessions land here too. The
      # classic local aliases (self-hosted, fast, ...) stay local-only: their
      # clients compact at 131072 instead.
      context_window_fallbacks:
        - local-pool: ["MiniMax-M3-chat"]
        - local-pool-chat: ["MiniMax-M3-chat"]

    litellm_settings:
      drop_params: true
      # Emit the litellm_* Prometheus series. Without these two callbacks the
      # proxy serves /metrics but publishes NOTHING about requests, spend,
      # fallbacks or deployment health -- which is why every dashboard and alert
      # against this gateway was empty until 2026-08-29. `failure_callback` is
      # the half that matters most here: the fallback and cooldown counters the
      # PrometheusRule alerts on (litellm_deployment_failed_fallbacks_total,
      # litellm_deployment_state) are only written on the failure path.
      success_callback:
        - prometheus
      failure_callback:
        - prometheus
      # /metrics otherwise requires the master key, and a ServiceMonitor scrape
      # carries no Authorization header -- the target would sit permanently at
      # 401 while looking correctly configured. Safe to leave open: the endpoint
      # is ClusterIP-only (the Ingress routes to / on the same port but Prometheus
      # scrapes the Service directly), and it exposes counters, not prompts.
      require_auth_for_metrics_endpoint: false
      # Langfuse traces (apps/llm/langfuse), OPT-IN PER TEAM, deliberately not
      # a third entry in success_callback/failure_callback above.
      #
      # A trace stores the whole prompt and response. A global callback would
      # send everything to Langfuse, including hermes' and OpenClaw's mail and
      # calendar, memini/hindsight memories and Home Assistant state. Opting
      # those keys out does not work on this proxy: the per-key
      # `litellm_disabled_callbacks` is honoured only on a premium license, and
      # global `turn_off_message_logging` would also blank the prompts in
      # LiteLLM_SpendLogs that store_prompts_in_spend_logs is there for. So
      # tracing goes the other way: a team is traced only if it is listed
      # here, and the teams listed carry nothing private (see
      # ../keys/teams.yaml): coding (public code), research (public filings,
      # notebooks), media (subtitles), platform (cluster alerts, MCP).
      # assistants, memory and home are NOT traced, and neither is any call
      # made with the master key (no team).
      #
      # `langfuse_otel` (OTLP to /api/public/otel), not the older `langfuse`
      # SDK callback: it is the one that speaks Langfuse 4's ingestion
      # version. It reads LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY /
      # LANGFUSE_HOST; helmrelease.yaml loads the key pair from the
      # langfuse-litellm Secret, optionally, so the gateway still starts if
      # Langfuse is absent. A LiteLLM that started before that Secret existed
      # has no keys and needs one restart to start exporting.
      #
      # A team-level `logging` entry in a LiteLLMTeam's metadata would take
      # precedence over this list for that team.
      default_team_settings:
        - team_id: coding
          success_callback: ["langfuse_otel"]
          failure_callback: ["langfuse_otel"]
        - team_id: research
          success_callback: ["langfuse_otel"]
          failure_callback: ["langfuse_otel"]
        - team_id: media
          success_callback: ["langfuse_otel"]
          failure_callback: ["langfuse_otel"]
        - team_id: platform
          success_callback: ["langfuse_otel"]
          failure_callback: ["langfuse_otel"]
      # WHOLE-CALL BUDGET, and it multiplies by num_retries.
      #
      # The real ceiling litellm imposes is request_timeout * (1 + num_retries),
      # because a timed-out attempt is itself a retryable error. That product is
      # the number hermes' `stale_timeout_seconds` has to sit above -- see the
      # long comment in the hermes ConfigMap. At 600 * 3 = 1800 it did not, so
      # hermes' watchdog fired at 900s mid-retry and killed a PyMC Teacher run
      # 2h42m in (2026-08-19). Change either value and re-check that pairing.
      #
      # 1800 per attempt was sized for `deep` (Qwen3.8-27B dense, ~8-9 t/s)
      # answering with a long reasoning block on top of prompt processing for a
      # six-figure context. `deep` went on 2026-10-11 and every local alias is
      # now the faster Flash-Next, but the value stays: hermes' watchdog is
      # tuned to the 3600 s product, streaming.enabled is false there so
      # nothing comes back until the whole answer is done, and a `self-hosted`
      # call on medium reasoning over a large context still runs for many
      # minutes.
      #
      # num_retries dropped 2 -> 1 deliberately. Retries earn their keep against
      # the fast connection-error class (worker4 rebooting mid-call, which is
      # what killed the 12:00 run the same day); one is enough for that. Keeping
      # 2 here would push the product to 5400s and force a 90-minute watchdog,
      # which is far too long to notice a genuinely dead connection.
      request_timeout: 1800
      num_retries: 1
      set_verbose: false
