---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name litellm
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/managed-by: Helm
        annotations:
          meta.helm.sh/release-name: litellm
          meta.helm.sh/release-namespace: llm
      data:
        # Proxy master key — the admin credential; apps get VIRTUAL keys minted from it.
        LITELLM_MASTER_KEY: '{{ .LITELLM_MASTER_KEY }}'
        # --- Cloud coding-plan keys (kubernetes/apps/llm/PLATFORM-PLAN.md) ---
        # Fields on the `litellm` Bitwarden item, OPTIONAL until each plan is
        # bought. `index` rather than `.FIELD` is load-bearing: with dataFrom
        # extract a plain `{{ .MINIMAX_API_KEY }}` on a missing field fails
        # the whole secret ("map has no entry for key"), which took this
        # Kustomization unhealthy on 2026-09-28. `index` renders "" instead,
        # the rung answers 401 and its pool falls through to the next rung.
        # Add a field and its rungs come alive on the next refresh (15m) plus
        # the reloader restart.
        MINIMAX_API_KEY: '{{ index . "MINIMAX_API_KEY" }}'
        KIMI_CODE_API_KEY: '{{ index . "KIMI_CODE_API_KEY" }}'
        ZAI_API_KEY: '{{ index . "ZAI_API_KEY" }}'
  dataFrom:
    - extract:
        key: litellm
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name litellm-db-secret
spec:
  secretStoreRef:
    name: crunchy-pgo-secrets
    kind: ClusterSecretStore
  refreshInterval: 1m
  target:
    name: *name
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        # Direct primary, NOT pgbouncer: litellm runs Prisma migrations on boot
        # and those take session-scoped advisory locks, which pgbouncer's
        # transaction pooling silently drops.
        #
        # The primary is TLS-only -- pg_hba.conf ends at `hostssl ... scram-sha-256`
        # with no plaintext fallback, so sslmode is mandatory. `require` rather
        # than `verify-full`: Crunchy signs with its own CA.
        #
        # No URL-escaping of the password is needed; the cluster issues these as
        # `type: AlphaNumeric`.
        DATABASE_URL: 'postgresql://{{ .user }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}?sslmode=require'
  dataFrom:
    - extract:
        key: postgres-pguser-litellm
