---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name litellm
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/managed-by: Helm
        annotations:
          meta.helm.sh/release-name: litellm
          meta.helm.sh/release-namespace: llm
      data:
        # Proxy master key — clients (agentmemory, hermes) authenticate with this.
        LITELLM_MASTER_KEY: '{{ .LITELLM_MASTER_KEY }}'
        # --- Cloud upstream keys: add the fields to the `litellm` Bitwarden item
        # and uncomment as you enable the matching model_list entries in config.yaml.
        # MINIMAX_API_KEY: '{{ .MINIMAX_API_KEY }}'
        # MOONSHOT_API_KEY: '{{ .MOONSHOT_API_KEY }}'
        # OPENAI_API_KEY: '{{ .OPENAI_API_KEY }}'
        # ANTHROPIC_API_KEY: '{{ .ANTHROPIC_API_KEY }}'
  dataFrom:
    - extract:
        key: litellm
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name litellm-db-secret
spec:
  secretStoreRef:
    name: crunchy-pgo-secrets
    kind: ClusterSecretStore
  refreshInterval: 1m
  target:
    name: *name
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        # Direct primary, NOT pgbouncer: litellm runs Prisma migrations on boot
        # and those take session-scoped advisory locks, which pgbouncer's
        # transaction pooling silently drops.
        #
        # The primary is TLS-only -- pg_hba.conf ends at `hostssl ... scram-sha-256`
        # with no plaintext fallback, so sslmode is mandatory. `require` rather
        # than `verify-full`: Crunchy signs with its own CA.
        #
        # No URL-escaping of the password is needed; the cluster issues these as
        # `type: AlphaNumeric`.
        DATABASE_URL: 'postgresql://{{ .user }}:{{ .password }}@{{ .host }}:{{ .port }}/{{ .dbname }}?sslmode=require'
  dataFrom:
    - extract:
        key: postgres-pguser-litellm
