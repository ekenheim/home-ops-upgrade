---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app litellm
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      litellm:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        # Recreate, NOT RollingUpdate, since the ChatGPT OAuth grant landed on
        # an RWO PVC. Two reasons, and the second is the one that matters:
        #   1. RollingUpdate surges the new pod before the old one exits, and
        #      ceph-block RWO cannot multi-attach across nodes -- the new pod
        #      hangs in ContainerCreating until the old one is reaped.
        #   2. More importantly, a Codex refresh token is SINGLE-USE and
        #      rotates on every use. Two pods sharing auth.json (which an RWX
        #      volume would have permitted) would race to refresh it and
        #      whichever landed second would be logged out. A single writer is
        #      a correctness requirement here, not a storage-class detail.
        # Cost is a few seconds of proxy downtime per rollout.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/berriai/litellm
              tag: v1.99.0@sha256:570a872d2fde8f1bc4a147634810941103c14697270f0f2918c5aa7d8201cac5
            args:
              - --config=/app/config.yaml
            env:
              LITELLM_LOG: INFO
              LITELLM_MODE: PRODUCTION
              TZ: "${TIMEZONE}"
              # Lets the admin UI add/edit models at runtime and persist them
              # alongside the ones declared in config.yaml.
              STORE_MODEL_IN_DB: "True"
              # Payloads written to LiteLLM_SpendLogs are truncated head+tail
              # by default, which shows up as a "litellm_truncated skipped N
              # chars" marker mid-string in the UI. Only the DB copy is cut,
              # never the response handed back to the client. Raised so whole
              # Lingarr subtitle batches stay readable when debugging.
              # Watch the table size: this is the Crunchy `litellm` database.
              MAX_STRING_LENGTH_PROMPT_IN_DB: "100000"
              # Where the `chatgpt/` provider keeps its OAuth grant. Defaults
              # to $HOME/.config/litellm/chatgpt, i.e. /root -- inside the
              # container layer, so it would not survive a restart. Points at
              # the PVC instead; see pvc.yaml.
              CHATGPT_TOKEN_DIR: /chatgpt-auth
            envFrom:
              - secretRef:
                  name: litellm
              # DATABASE_URL. Without it the UI still serves HTML but
              # /health/readiness reports db "Not connected" and every login,
              # virtual key, and spend view fails.
              - secretRef:
                  name: litellm-db-secret
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
            probes:
              # Prisma applies its migrations against the freshly-created
              # `litellm` database on first boot, which takes well over the
              # ~45s the liveness probe alone would allow. The startup probe
              # holds liveness/readiness off for up to 5m so that first run
              # cannot crashloop.
              # 120 * 10s = 20 minutes, and the extra runway is NOT about
              # Prisma. It exists because a missing ChatGPT OAuth grant blocks
              # proxy STARTUP, not the first request.
              #
              # litellm resolves the `chatgpt` model at config-load time, and
              # Authenticator.get_access_token() with no auth.json on the PVC
              # starts a device-code login and polls for up to 15 minutes
              # (DEVICE_CODE_TIMEOUT_SECONDS). The listener never binds :4000
              # while that runs. At the old threshold of 30 (5 minutes) the
              # kubelet killed the container a third of the way into the flow,
              # every time -- an unbreakable CrashLoop taking the whole gateway
              # (hermes, agentmemory, foreman, Lingarr, Open WebUI) with it,
              # for a reason nothing in the events makes obvious. Observed
              # 2026-08-22 on the very first rollout of this feature.
              #
              # Normal starts are unaffected: with the grant on the PVC this
              # pod goes ready in ~25s. The window only matters when the grant
              # is absent, and then it is exactly what lets you recover -- read
              # the code from the pod log and authorize it, and the same
              # container proceeds to boot. See the runbook in configmap.yaml.
              #
              # This does not weaken failure detection meaningfully: liveness
              # below (failureThreshold 3) still kills a hung *running* proxy
              # in 30s. Only slow-start detection is relaxed, and a litellm
              # that cannot start in 5 minutes is already a page either way.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: 4000
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 120
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: 4000
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: 4000
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  failureThreshold: 3
    service:
      app:
        controller: *app
        ports:
          http:
            port: 4000
    ingress:
      app:
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Data Science
          gethomepage.dev/name: LiteLLM
          gethomepage.dev/icon: litellm.png
          gethomepage.dev/description: LLM proxy / gateway
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
        hosts:
          - host: "{{ .Release.Name }}.${SECRET_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: app
                  port: http
    persistence:
      config:
        type: configMap
        name: litellm-configmap
        globalMounts:
          - path: /app/config.yaml
            subPath: config.yaml
            readOnly: true
      cache:
        type: emptyDir
        globalMounts:
          - path: /app/cache
      # Read-WRITE: litellm rewrites auth.json on every token refresh, not just
      # at login. Mounting this read-only would work until the access token
      # expired (~1h) and then fail permanently.
      chatgpt-auth:
        existingClaim: litellm-chatgpt-auth
        globalMounts:
          - path: /chatgpt-auth
