---
# A store of its own for courier's key, same shape as ./agent-lab.yaml: this SA
# may `get` only litellm-key-courier, and only `llm` may use the store. courier
# lives in `llm` and could mount the Secret directly, but its executor takes a
# single env Secret, so courier-executor has to merge this key with the
# Bitwarden GITHUB_TOKEN, and ESO reads cluster Secrets only through a store.
#
# Consumer: llm/courier-executor
#   dataFrom: {sourceRef: {storeRef: litellm-key-secrets-courier}, extract: {key: litellm-key-courier}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-llm-courier
  namespace: llm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-llm-courier
  namespace: llm
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["litellm-key-courier"]
    verbs: ["get"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: &name external-secrets-llm-courier
  namespace: llm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: *name
subjects:
  - kind: ServiceAccount
    name: *name
    namespace: llm
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/clustersecretstore_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: litellm-key-secrets-courier
spec:
  conditions:
    - namespaces:
        - llm
  provider:
    kubernetes:
      remoteNamespace: llm
      server:
        caProvider:
          type: "ConfigMap"
          name: "kube-root-ca.crt"
          namespace: llm
          key: "ca.crt"
      auth:
        serviceAccount:
          name: external-secrets-llm-courier
          namespace: llm
