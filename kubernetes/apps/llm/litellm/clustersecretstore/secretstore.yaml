---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/clustersecretstore_v1beta1.json
# Serves litellm-operator's per-app keys (Secrets litellm-key-<app> in `llm`)
# to consumers outside `llm`:
#   development    Atlas            remoteRef: {key: litellm-key-atlas, property: api-key}
#   agent-control  agent-egress gw  remoteRef: {key: litellm-key-agent-lab, property: api-key}
# To add another consumer, widen both the Role (./rbac.yaml, one Secret by
# name) and `conditions` below. Note that any namespace listed here can read
# every Secret the Role names, not only its own; keep the list to trusted ones.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: litellm-key-secrets
spec:
  conditions:
    - namespaces:
        - development
        - agent-control
  provider:
    kubernetes:
      remoteNamespace: llm
      server:
        caProvider:
          type: "ConfigMap"
          name: "kube-root-ca.crt"
          namespace: llm
          key: "ca.crt"
      auth:
        serviceAccount:
          name: external-secrets-llm
          namespace: llm
