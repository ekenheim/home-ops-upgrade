---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/clustersecretstore_v1beta1.json
# Serves litellm-operator's per-app keys (Secrets litellm-key-<app> in `llm`)
# to consumers outside `llm`. This store serves only Atlas in development:
#   remoteRef: {key: litellm-key-atlas, property: api-key}
# Every namespace in `conditions` can read every Secret the Role names, so a
# new consumer gets its own store, ServiceAccount and Role (see
# ./agent-lab.yaml) rather than a wider list here.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: litellm-key-secrets
spec:
  conditions:
    - namespaces:
        - development
  provider:
    kubernetes:
      remoteNamespace: llm
      server:
        caProvider:
          type: "ConfigMap"
          name: "kube-root-ca.crt"
          namespace: llm
          key: "ca.crt"
      auth:
        serviceAccount:
          name: external-secrets-llm
          namespace: llm
