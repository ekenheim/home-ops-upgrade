---
# The agent-lab software factory (apps/agent-lab). No agent pod ever holds
# this key: the agent-egress gateway in agent-control injects it, reading
# litellm-key-agent-lab through its own litellm-key-secrets-agent-lab store
# (../clustersecretstore). Workers send a dummy key.
#
# The budget is the real safety net for a loop that runs unattended: $10 a
# day, 8 requests in flight (FACTORY_CONCURRENCY is 3) and 120 rpm across
# every worker and reviewer combined.
#
# Every alias here is local (qwen38-flash-next) on purpose. Run one showed
# that model cannot carry the reviewer with 60k-token prompts (2 slots, ~380
# prompt tokens/s); agent-factory v0.1.2 cuts the review prompt to the diff
# and test output, and apps/agent-lab/factory caps reviews at one in flight.
# A hosted alias for reviews only (kimi-k3, glm-5.3 or chatgpt; MiniMax's plan
# is exhausted as of 2026-10-09) goes on this list if local still misses the
# review deadline.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: agent-lab
spec:
  proxyRef: litellm-admin
  keyAlias: agent-lab
  secretName: litellm-key-agent-lab
  secretKey: api-key
  models:
    - implementation-pool
    - reasoning-pool
    - review
    - fast
    - self-hosted
    - qwen3-embedding-0.6b
  maxBudget: "10"
  budgetDuration: 1d
  maxParallelRequests: 8
  rpmLimit: 120
