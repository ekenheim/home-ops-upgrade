---
# Atlas (development/atlas), the public-market research app. Public filings
# and notes derived from them only, so MiniMax is allowed: nothing on this key
# may carry the owner's email, finance or home data.
#
# Atlas calls MiniMax-M3 by name (ATLAS_LLM_EXTRACT_ALIAS/_REFLECT_ALIAS in its
# Deployment) and records per run what it resolves to, from /model/info.
# Dedicated atlas-extract/atlas-reflect aliases in the configmap would be
# cleaner, but adding them restarts the gateway; that can come later.
# `rerank` routes to the shared llm/hindsight TEI sidecar.
#
# The Secret lands in `llm`, because the operator writes it next to the CR.
# development reads it through the `litellm-key-secrets` ClusterSecretStore
# (../clustersecretstore), which can read only this one Secret and serves
# only development.
#
# maxBudget is list-price spend (the configmap's *_cost_per_token), not a
# bill: MiniMax is a flat plan. It caps a runaway backfill. maxParallelRequests
# keeps Atlas from crowding the MiniMax plan's 3-4 concurrent slots out from
# under the other callers.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: atlas
spec:
  proxyRef: litellm-admin
  keyAlias: atlas
  secretName: litellm-key-atlas
  secretKey: api-key
  # A backstop, not the budget: Atlas paces itself at 8M MiniMax tokens per 5 h window
  # (ATLAS_MINIMAX_BUDGET_TOKENS), about $2.4 at list price per window. MiniMax is a flat
  # plan, so list-price spend here is informational. A daily cap that resets clears a trip
  # by itself; the old $25 per 30 days was >10x below Atlas's own budget and would have
  # stalled Atlas for the rest of the month once reached (2026-10-08 audit).
  maxBudget: "20"
  budgetDuration: 1d
  maxParallelRequests: 3
  models:
    - MiniMax-M3
    - qwen3-embedding-0.6b
    - rerank
