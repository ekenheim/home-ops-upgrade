---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./admin.yaml
  # Ahead of the keys that name them. Not load-bearing: the operator retries a
  # key whose team does not exist yet.
  - ./teams.yaml
  - ./alert-triage.yaml
  - ./pr-review.yaml
  - ./openclaw.yaml
  - ./toolhive.yaml
  - ./opencode.yaml
  # Off since 2026-10-18 (owner), with apps/agent-lab: its only reader, the
  # agent-egress gateway, is gone. Pruning the CR revokes the key in LiteLLM
  # (the operator's finalizer); a re-enable mints a new one.
  #- ./agent-lab.yaml
  - ./paperless-gpt.yaml
  - ./vane.yaml
  - ./karakeep.yaml
  - ./kagent.yaml
