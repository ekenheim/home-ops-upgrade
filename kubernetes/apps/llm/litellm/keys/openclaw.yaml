---
# OpenClaw. The default model is MiniMax-M3 on the plan (MiniMax-M3-messages),
# falling back to self-hosted, then chatgpt (owner decision 2026-09-30, see the
# openclaw ConfigMap); the pools stay selectable per session or cron job.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: openclaw
spec:
  proxyRef: litellm-admin
  keyAlias: openclaw
  teamID: assistants
  secretName: litellm-key-openclaw
  secretKey: api-key
  models:
    - self-hosted
    - fast
    - chatgpt
    - local-pool
    - local-pool-chat
    - MiniMax-M3-chat
    - MiniMax-M3-messages
    - MiniMax-M3.1-Flash-Preview
    - reasoning-pool
    - implementation-pool
    - frontier-pool
