---
# LiteLLM teams, grouped by what the data may touch rather than by namespace.
# Every virtual key belongs to exactly one: the operator keys here set
# `teamID`, and the hand-made keys the apps read from Bitwarden were moved
# into these teams through the admin API on 2026-10-11.
#
# A team's `models` is a CEILING on its keys, which is the point of having
# teams: a key scoped too wide (or a UI key left on `all-team-models`) still
# cannot reach a model its team does not list. So the PRIVACY rule in
# ../app/configmap.yaml lives here too -- `home` lists no cloud alias at all.
# Router fallbacks are not checked against these lists, only the model asked
# for, so a pool's cloud floor still works for a team that lists the pool.
#
# Keep every key's own `models` a subset of its team's, or LiteLLM rejects
# the key update. teamID defaults to the resource name.
#
# members: default_user_id (the proxy admin, i.e. the master key) is declared
# on EVERY team, and that is load-bearing. LiteLLM adds the creator as an
# admin when the operator creates a team, and `members` is the complete set:
# on any spec change the operator removes remote members not listed here. And
# LiteLLM's /team/member_delete also DELETES THAT USER'S KEYS IN THE TEAM. The
# hand-made keys belong to default_user_id, so a team without this entry loses
# them on its next spec change -- which is how `hermes` (assistants) and
# `repo-wiki` (coding) were deleted on 2026-10-11, when #7441 dropped `deep`
# from those two teams' model lists. A key lost this way can be re-created
# with its original value (POST /key/generate with `key`, the plaintext from
# the app's Secret), so the app and Bitwarden need no change.
#
# The ROLE must match what LiteLLM holds, since the operator deletes and
# re-adds a member whose role differs. `admin` on the five teams where LiteLLM
# added it at creation; `user` on coding/assistants, which lost it, because
# adding a team admin through the API is Enterprise-only here (member_add 400
# "Assigning team admins is a premium feature"). The keys in those two teams
# have no user_id (the restored hermes/repo-wiki included), so they never
# depended on the membership.
#
# A FAILED team update is not retried (operator <= 0.0.24): the controller
# only sends /team/update when the Ready condition's observedGeneration
# differs from the CR's, and a failure records that generation too, so the
# retry skips the update and reports "team reconciled" with the proxy still
# on the old spec. That is what happened when #7445 added `pc/*` here while
# the gateway was restarting for the same merge: the keys got the model, the
# teams did not, and zed/opencode got 403 team_model_access_denied. After any
# merge that changes BOTH ../app/configmap.yaml and this file, check
#   kubectl -n llm logs deploy/litellm-operator | grep UpdateFailed
# and if a team is listed, bump its generation with a throwaway spec change
# (patch `alias`, then patch it back). The one-line fix is to gate the update
# on `ready.Status != True` as well as the generation
# (internal/controller/litellmteam_controller.go in the operator).
#
# maxBudget is list-price spend (the configmap's *_cost_per_token), and only
# cloud aliases carry a cost: local models and the ChatGPT subscription are $0.
# A team over budget blocks EVERY key in it, embeddings included, so budgets
# sit only on teams that have no local-only member. `memory` is capped per
# model on the hindsight key instead (model_tpm_limit, set through the API --
# the operator cannot express it), so a backlog cannot eat the MiniMax plan
# without starving memini's local recall.
# NOTE 2026-10-12: a TPM cap is checked against input + max_tokens BEFORE the
# call, so that 30k refused every MiniMax retain (64k max_tokens) and most
# consolidation calls from 2026-10-08 with "Remaining: 30000". Use
# model_rpm_limit instead; the retain cap is now 8192 in ../../hindsight. See
# ../../../observability/exporters/minimax-quota-exporter/README.md.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMTeam
metadata:
  name: coding
spec:
  proxyRef: litellm-admin
  alias: coding
  # See "members" in the header: never remove this entry.
  members:
    - userID: default_user_id
      role: user
  # Public code only, so the cloud plans are allowed.
  # Keys: pr-review, opencode, zed (Git); repo-wiki (Bitwarden). agent-lab's key is off with agent-lab since 2026-10-18.
  models:
    - pc/*
    - auto
    - self-hosted
    - review
    - fast
    - chatgpt
    - local-pool
    - local-pool-chat
    - reasoning-pool
    - implementation-pool
    - frontier-pool
    - MiniMax-M3-chat
    - MiniMax-M3.1-Flash-Preview
    - qwen3-embedding-0.6b
    # agent-factory's pools (the 5090 first), for the agent-lab key. Kept
    # while that key is off (2026-10-18), so a re-enable needs no team edit.
    - factory-fast
    - factory-agent
    - factory-review
  maxBudget: "15"
  budgetDuration: 1d
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMTeam
metadata:
  name: assistants
spec:
  proxyRef: litellm-admin
  alias: assistants
  # See "members" in the header: never remove this entry.
  members:
    - userID: default_user_id
      role: user
  # Personal agents. Keys: openclaw (Git); hermes (Bitwarden).
  models:
    - self-hosted
    - review
    - fast
    - chatgpt
    - local-pool
    - local-pool-chat
    - reasoning-pool
    - implementation-pool
    - frontier-pool
    - MiniMax-M3-chat
    - MiniMax-M3-messages
    - MiniMax-M3.1-Flash-Preview
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMTeam
metadata:
  name: memory
spec:
  proxyRef: litellm-admin
  alias: memory
  # See "members" in the header: never remove this entry.
  members:
    - userID: default_user_id
      role: admin
  # Memory services. Keys: hindsight, memini (Bitwarden).
  models:
    - qwen3-embedding-0.6b
    - rerank
    - fast
    - MiniMax-M3
    - hindsight-consolidation
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMTeam
metadata:
  name: research
spec:
  proxyRef: litellm-admin
  alias: research
  # See "members" in the header: never remove this entry.
  members:
    - userID: default_user_id
      role: admin
  # Notebooks. Keys: marimo, vane (Bitwarden / UI).
  models:
    - pc/*
    - MiniMax-M3
    - MiniMax-M3-chat
    - MiniMax-M3.1-Flash-Preview
    - qwen3-embedding-0.6b
    - rerank
    - self-hosted
    - fast
    - local-pool-chat
    - chatgpt
  maxBudget: "25"
  budgetDuration: 1d
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMTeam
metadata:
  name: media
spec:
  proxyRef: litellm-admin
  alias: media
  # See "members" in the header: never remove this entry.
  members:
    - userID: default_user_id
      role: admin
  # Subtitles. Key: lingarr (Bitwarden).
  models:
    - translate
    - fast
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMTeam
metadata:
  name: home
spec:
  proxyRef: litellm-admin
  alias: home
  # See "members" in the header: never remove this entry.
  members:
    - userID: default_user_id
      role: admin
  # Home data: local aliases only. `home-assistant` itself falls back to the
  # ChatGPT subscription, never MiniMax. Keys: karakeep, paperless-gpt (Git);
  # homeassistant-chat, facebook-marketplace (Bitwarden).
  models:
    - home-assistant
    - fast
    - self-hosted
    # Local CPU embedder, for karakeep's semantic search.
    - qwen3-embedding-0.6b
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMTeam
metadata:
  name: platform
spec:
  proxyRef: litellm-admin
  alias: platform
  # See "members" in the header: never remove this entry.
  members:
    - userID: default_user_id
      role: admin
  # Cluster plumbing. Keys: alert-triage, toolhive, kagent (Git).
  # Cluster state may go to MiniMax: local-pool* fall back to it, and
  # kagent-chat (the kagent key) leads with it, owner-approved 2026-10-18.
  models:
    - local-pool
    - local-pool-chat
    - kagent-chat
    - fast
    - qwen3-embedding-0.6b
