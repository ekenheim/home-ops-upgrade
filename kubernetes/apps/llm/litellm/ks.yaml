---
# yaml-language-server: $schema=https://kubernetes-schemas.minuette.horse/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app litellm
  namespace: flux-system
spec:
  path: ./kubernetes/apps/llm/litellm/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: llm
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  dependsOn:
    - name: external-secrets-stores
    # litellm-chatgpt-auth is a ceph-block PVC (pvc.yaml). Without this the
    # Kustomization can reconcile before the storage class exists.
    - name: rook-ceph-cluster
    # general_settings.coordination_redis points at db 3 on this instance.
    - name: dragonfly-cluster
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
---
# yaml-language-server: $schema=https://kubernetes-schemas.minuette.horse/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app litellm-keys
  namespace: flux-system
spec:
  # Per-app virtual keys, minted by litellm-operator through the admin API of
  # the proxy above into Secrets named litellm-key-<app>. See keys/admin.yaml.
  #
  # Separate from `litellm` on purpose: a key that fails to mint (proxy
  # restarting, master key rotated) must not mark the gateway itself unready,
  # and eight apps dependOn `litellm`. Apps that consume one of these Secrets
  # dependOn `litellm-keys` instead.
  path: ./kubernetes/apps/llm/litellm/keys
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: llm
  # The operator deletes the remote key when a LiteLLMVirtualKey goes away, so
  # pruning a CR here revokes that app's key. That is the intent.
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  dependsOn:
    - name: litellm
    - name: litellm-operator
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
# yaml-language-server: $schema=https://kubernetes-schemas.minuette.horse/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app litellm-stores
  namespace: flux-system
spec:
  # The `litellm-key-secrets` ClusterSecretStore, which lets development read
  # litellm-key-atlas out of `llm` (see clustersecretstore/). Like
  # crunchy-postgres-stores, it needs only external-secrets. A consumer
  # dependsOn both this and `litellm-keys`, which mints the Secret it reads.
  path: ./kubernetes/apps/llm/litellm/clustersecretstore
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: llm
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  dependsOn:
    - name: external-secrets
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
