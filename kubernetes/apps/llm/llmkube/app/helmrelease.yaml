---
# yaml-language-server: $schema=https://kubernetes-schemas.minuette.horse/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: llmkube
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # HELD AT 0.9.27 -- 2026-09-16. 0.9.28 (defilantech/LLMKube#1829) stops
    # building the runtime's args whenever spec.command is set and passes
    # spec.args verbatim instead. Both our InferenceServices set
    # `command: [llama-server]` because kyuz0/amd-strix-halo-toolboxes has no
    # entrypoint (Cmd is /bin/bash), and neither sets spec.args, so 0.9.28
    # rendered ornith's Deployment with only the extraArgs: llama-server came
    # up in router mode with no model on 127.0.0.1 and the pod never went
    # Ready. Renovate is held below 0.9.28 in .github/renovate/packageRules.json5.
    # To move on: either upstream grows an opt-in, or ornith-35b.yaml and
    # qwen38-27b.yaml take over the full arg list in spec.args (the typed
    # fields contextSize/parallelSlots/cacheType*/batchSize stop mattering).
    tag: 0.9.27
  url: oci://ghcr.io/defilantech/charts/llmkube
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: llmkube
spec:
  chartRef:
    kind: OCIRepository
    name: llmkube
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    modelCache:
      enabled: true
      # `shared` renders the single llmkube-model-cache PVC. Do not switch to
      # perService: that mode provisions a PVC per InferenceService through the
      # storage class, and no provisioner can service worker4 (see
      # model-cache-pv.yaml). `shared` is also the only mode that renders a PVC
      # we can bind statically.
      mode: shared
      # RWO is correct despite `shared`: only worker4 has a GPU, so every
      # InferenceService lands on the same node. RWX would need CephFS, which
      # cannot mount on the tainted node.
      accessMode: ReadWriteOnce
      size: 300Gi
      # Deliberately a class that does NOT exist, so nothing tries to
      # dynamically provision. The PVC binds to the pre-created PV instead.
      storageClass: llmkube-local
      mountPath: /models
    prometheus:
      inferencePodMonitor:
        enabled: true
    controllerManager:
      # The controller mounts the model-cache PVC itself (to stage downloaded
      # weights), and that PVC is bound to a PV pinned to worker4, so it has to
      # run there -- it is not free to schedule anywhere despite needing no GPU:
      #   0/5 nodes are available: 1 node(s) had untolerated taint(s),
      #   4 node(s) didn't match PersistentVolume's node affinity
      # The four other nodes fail the PV's nodeAffinity and worker4 rejects it
      # on the taint, so without both of these it stays Pending forever.
      nodeSelector:
        kubernetes.io/hostname: worker4
      tolerations:
        - key: llm-workload
          operator: Exists
          effect: NoSchedule
