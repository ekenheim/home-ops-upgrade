---
# Supplementary RBAC for the LLMKube controller: permission to manage Jobs.
#
# The chart (0.9.17) ships `prefetch` on the Model CRD -- it creates an
# owner-ref'd Job that downloads weights into the shared cache PVC -- but its
# ClusterRole grants no `batch` rule, so the controller cannot watch or create
# Jobs at all:
#
#   Failed to watch *v1.Job: jobs.batch is forbidden: User
#   "system:serviceaccount:llm:llmkube-controller-manager" cannot list
#   resource "jobs" in API group "batch" at the cluster scope
#
# The failure is silent from the user's side: setting prefetch: true reconciles
# to an EMPTY status with no Job and no event -- the controller is stuck in a
# watch backoff loop instead. Nothing surfaces on the Model CR to say why.
#
# This is additive rather than a chart fork: llmkube-manager-role is
# chart-owned and would be reverted on every HelmRelease upgrade. Delete this
# file once upstream ships the batch rule.
#
# Cluster-scoped because the controller's Job informer lists at cluster scope
# (see the error above); a namespaced Role in llm does not satisfy it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: llmkube-manager-jobs
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: llmkube-manager-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: llmkube-manager-jobs
subjects:
  - kind: ServiceAccount
    name: llmkube-controller-manager
    namespace: llm
