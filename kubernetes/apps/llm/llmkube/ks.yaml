---
# yaml-language-server: $schema=https://kubernetes-schemas.minuette.horse/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app llmkube
  namespace: flux-system
spec:
  path: ./kubernetes/apps/llm/llmkube/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: llm
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  # The ROCm DRA driver must exist first: it creates the gpu.amd.com
  # DeviceClass that resourceclaim.yaml references.
  dependsOn:
    - name: k8s-gpu-dra-driver
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
