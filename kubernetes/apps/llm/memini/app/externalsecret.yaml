---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/managed-by: Helm
        annotations:
          meta.helm.sh/release-name: memini
          meta.helm.sh/release-namespace: llm
      data:
        # Bearer token for memini's own /v1 and /mcp surface. Any client (and
        # the fsck CronJob) presents this. Create it on a NEW `memini` Bitwarden
        # Secrets Manager item; BWS items are undiscoverable from the cluster,
        # and a MISSING FIELD renders empty while the ExternalSecret still
        # reports SecretSynced -- so a typo here looks healthy and fails at
        # request time with a 401.
        MEMINI_API_KEY: '{{ .MEMINI_API_KEY }}'
        # Embedding and assessment calls both go to litellm. Same reasoning as
        # agentmemory's: this is a litellm VIRTUAL key on memini's own item, not
        # litellm's master key -- the master key is the proxy's admin credential
        # and would bypass every team and model restriction.
        MEMINI_EMBED_API_KEY: '{{ .LITELLM_API_KEY }}'
        MEMINI_LLM_API_KEY: '{{ .LITELLM_API_KEY }}'
  dataFrom:
    - extract:
        key: memini
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name memini-api-keys
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Per-consumer named keys, each pinned to its own memory namespace, so
        # one caller cannot read another's memories. This is the file
        # MEMINI_API_KEYS_FILE points at; `persistence.api-keys.enabled: true`
        # in the HelmRelease is what actually mounts it, and the chart's own
        # default for that flag is false -- omit it and the volume silently
        # vanishes from the pod while memini boots happily without the file.
        api-keys.yaml: |
          keys:
            - name: hermes
              secret: "{{ .MEMINI_HERMES_KEY }}"
              default_namespace: hermes
  dataFrom:
    - extract:
        key: memini
