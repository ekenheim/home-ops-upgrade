---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app memini
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 30m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          main:
            env:
              TZ: "${TIMEZONE}"
              MEMINI_BACKEND: sqlite
              MEMINI_DEFAULT_NAMESPACE: default
              MEMINI_API_KEYS_FILE: /etc/memini/api-keys.yaml

              # --- Embeddings -------------------------------------------------
              # Through litellm, not straight at the embeddings Service: proxying
              # keeps this app on one auth path and one set of spend/latency
              # metrics (see ../../litellm/app/configmap.yaml).
              #
              # Qwen3-Embedding-0.6B, 1024 dims, served by ../../embeddings
              # (llmkube, llama.cpp, CPU) -- the model upstream memini runs.
              # History: all-minilm (384 dims, English, ~256-token window)
              # until 2026-09-18, then bge-m3 for one day, picked for
              # Swedish<->English recall that nobody here uses. Benchmarks and
              # the reasoning are in ../../embeddings/app/model.yaml.
              #
              # The window is 16384 tokens shared across slots.
              # capture_user_max_chars (1000) plus capture_assistant_max_chars
              # (3000) is ~1,400 tokens, which embeds in ~2.3 s.
              #
              # Changing the model or dims is not free: memini stores vectors,
              # so see MEMINI_REEMBED_ON_MODEL_CHANGE below.
              MEMINI_EMBED_BASE_URL: http://litellm.llm:4000/v1
              MEMINI_EMBED_MODEL: qwen3-embedding-0.6b
              MEMINI_EMBED_DIMS: "1024"
              # Qwen3-Embedding is instruction-tuned: queries carry this
              # prefix, stored documents carry none. Same string upstream
              # uses. Changing it moves every query vector, not the stored
              # ones, so it is safe to tune.
              MEMINI_EMBED_QUERY_PREFIX: "Instruct: Given a user message, retrieve relevant past memories\nQuery: "
              MEMINI_EMBED_MAX_CONCURRENCY: "2"
              # A recall query is short (~35 ms). The headroom is for one that
              # queues behind a long write on the same slot pool.
              MEMINI_RECALL_EMBED_TIMEOUT: 15s
              MEMINI_WRITE_EMBED_TIMEOUT: 30s
              # Re-embeds the whole store when the MODEL changes at the same
              # width, instead of silently mixing incompatible vectors. It does
              # NOT cover a change of dims: the sqlite-vec store is fixed at
              # its original width and the pod crash-loops with "store was
              # created with N embedding dims but is configured for M". The
              # bge-m3 -> Qwen3 move was the covered case (1024 both sides).
              # The 384 -> 1024 move earlier on 2026-09-18 went: scale to 0, `memini export
              # --all-namespaces --include-expired --include-superseded` from a
              # pod with the OLD dims, move memini.db aside, let this start a
              # fresh store, `memini import --source memini <export>`.
              MEMINI_REEMBED_ON_MODEL_CHANGE: "true"

              # --- Rerank -----------------------------------------------------
              # Deliberately absent. Upstream runs a Qwen3-Reranker-0.6B
              # InferenceService on its AMD GPU; here that would be a third pod
              # sharing worker4's single `llama-strix-gpu` ResourceClaim with
              # ornith-35b and qwen38-27b, on the node that hard-resets
              # silently. Recall falls back to pure vector similarity.
              # MEMINI_RERANK / MEMINI_RERANK_MODEL: see llmkube/app for the
              # InferenceService pattern if this is ever revisited.

              # --- Assessment / dedup ----------------------------------------
              # `fast` is ornith-35b with thinking off. That is the right shape
              # for extraction and scoring -- the same reasoning that made
              # dispatch pick `self-hosted` for grooming and NOT `fast` applies
              # in reverse here: judging scope needs reasoning, turning a
              # transcript into memory rows does not.
              MEMINI_LLM_BASE_URL: http://litellm.llm:4000/v1
              MEMINI_LLM_MODEL: fast
              MEMINI_ASSESS_BATCH: "5"
              MEMINI_WRITE_DEDUP_SCORE: "0.80"
              MEMINI_WRITE_DEDUP_ACTION: coalesce
              MEMINI_DEDUP_TIERS: episodic,semantic,procedural
              MEMINI_DEDUP_SIMILARITY: "0.80"
              MEMINI_SHORT_TERM_CAP: "300"
            envFrom:
              - secretRef:
                  name: memini
            probes:
              # sqlite opens and any pending migration runs before the listener
              # binds. Generous, in the same spirit as litellm's: a slow first
              # boot should not crashloop.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 180
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
      # Nightly consistency pass over the store. Needs MEMINI_API_KEY because it
      # calls memini's own authenticated /v1/fsck.
      fsck:
        enabled: true
        cronjob:
          schedule: "0 5 * * *"
          timeZone: "${TIMEZONE}"
        containers:
          fsck:
            env:
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini
                    key: MEMINI_API_KEY
    persistence:
      data:
        # Provisioned by ../../../../templates/volsync (claim.yaml renders a PVC
        # named ${APP}), so this app restores from restic on a rebuild rather
        # than starting empty. sqlite is single-writer; keep replicas at 1.
        existingClaim: *app
      api-keys:
        # MUST be set explicitly. The chart's own default is false and helm
        # merges chart values UNDER ours, so an omitted flag wins as false and
        # the keys file silently never mounts.
        enabled: true
        name: memini-api-keys
    serviceMonitor:
      main:
        # Scrapes the dedicated `metrics` port (9090), which is unauthenticated
        # and attached to no route, so no bearer token is needed here -- unlike
        # litellm, where /metrics shares the proxy port.
        enabled: true
    grafanaDashboards:
      # Renders the bundled dashboard as a ConfigMap labelled
      # grafana_dashboard: "1". Our Grafana runs the k8s-sidecar with
      # searchNamespace ALL and an empty labelValue, so it is picked up with no
      # further wiring and no grafana-operator. The `folder` key sets a
      # `grafana_dashboard_folder` annotation, which our sidecar does NOT read
      # (it looks for `grafana_folder`), so the dashboard lands in the default
      # folder -- cosmetic.
      enabled: true
