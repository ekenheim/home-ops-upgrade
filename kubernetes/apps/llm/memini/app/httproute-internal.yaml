---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: memini
  namespace: llm
  annotations:
    gethomepage.dev/description: "Memory service for AI agents (REST + MCP)"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: "LLM"
    gethomepage.dev/icon: "mdi-brain"
    gethomepage.dev/name: "Memini"
spec:
  hostnames:
    - "memini.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: memini
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /v1
      backendRefs:
        - name: memini
          port: 8080
    - backendRefs:
        - name: memini
          port: 8081
