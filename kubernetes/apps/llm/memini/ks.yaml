---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app memini
  namespace: flux-system
spec:
  path: ./kubernetes/apps/llm/memini/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: llm
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  dependsOn:
    - name: volsync
    - name: external-secrets-stores
    - name: rook-ceph-cluster
    # Both the embedding and the assessment model are reached through litellm;
    # nothing here talks to a model server directly.
    - name: litellm
    # litellm only proxies `bge-m3`; this is what serves it. memini embeds on
    # every write and recall, so it should not come up before it on a rebuild.
    - name: embeddings
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      # sqlite plus vectors for a homelab's memory volume. agentmemory ran on
      # 5Gi doing the same job; this matches it.
      VOLSYNC_CAPACITY: 5Gi
