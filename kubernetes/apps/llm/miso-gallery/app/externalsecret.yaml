---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name miso-gallery
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Local password auth, where upstream uses OIDC against its authentik.
        # That needs an authentik provider + application created first; to
        # switch later set AUTH_TYPE=oidc and OIDC_ENABLED=true here with
        # OIDC_ISSUER / OIDC_CLIENT_ID / OIDC_CLIENT_SECRET / OIDC_CALLBACK_URL
        # (https://miso-gallery.<domain>/auth/oidc/callback).
        #
        # Both fields live on a NEW `miso-gallery` Bitwarden Secrets Manager
        # item. A missing FIELD renders empty and still syncs green: an empty
        # ADMIN_PASSWORD then means nobody can log in.
        AUTH_TYPE: local
        # Plaintext or a Werkzeug hash (pbkdf2: / scrypt:).
        ADMIN_PASSWORD: '{{ .ADMIN_PASSWORD }}'
        # Flask session secret: python -c "import secrets; print(secrets.token_urlsafe(48))"
        SECRET_KEY: '{{ .SECRET_KEY }}'
  dataFrom:
    - extract:
        key: miso-gallery
