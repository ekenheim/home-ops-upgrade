---
# OpenClaw gateway config (JSON5), after joryirving/home-ops, trimmed to one
# agent. Validated with `openclaw config validate` and a gateway start on
# the pinned image before it landed.
#
# Two kinds of placeholder, do not mix them up:
#   $${VAR}           OpenClaw's own runtime env substitution. Written with
#                     a double dollar so Flux postBuild emits a single-dollar
#                     placeholder (an unescaped one fails the WHOLE
#                     Kustomization, comments included).
#   single-dollar SECRET_DOMAIN in the gateway block: substituted by Flux
#                     from cluster-secrets.
#
# Models: the default is MiniMax-M3 on the flat plan (owner decision
# 2026-09-30, option 3 of three: the plan sat at 2% while Ornith carried every
# turn), falling back to Ornith on worker4, then the ChatGPT subscription.
# The owner accepted, knowingly, that Home Assistant state, memory and what is
# said to the bot in Discord go to a China-hosted provider; the earlier rule
# ("never a China-hosted plan for this agent") is withdrawn. Ornith and the
# pools stay selectable per session (/model local) or per cron job.
#
# The init container copies this file into the PVC read-only (0400) on every
# start, so edits made through the Control UI do not survive a restart:
# change it here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
data:
  openclaw.json: |
    {
      agents: {
        defaults: {
          contextInjection: "continuation-skip",
          bootstrapMaxChars: 16384,
          bootstrapTotalMaxChars: 49152,
          thinkingDefault: "medium",
          timeoutSeconds: 1800,
          // Off (owner decision 2026-10-07: "stop pinging me"). Unset, the
          // default polls every 30m INSIDE the main DM session and delivers to
          // the owner DM: 48 extra turns a day in the conversation context
          // (main session at 92k tokens, prompt cache 0%), "[model] NO_REPLY"
          // posts whenever a fallback model missed the silent-ack protocol,
          // and heartbeat chatter leaking into real replies. The bot's own
          // `config set ...heartbeat.target none` on 2026-10-07 worked until
          // the next pod start, when the init container restored this file.
          // Scheduled work is in jobs.sh (cron), which does not need it.
          heartbeat: { every: "0m", target: "none" },
          model: {
            primary: "minimax/MiniMax-M3-messages",
            fallbacks: ["litellm/self-hosted", "litellm/chatgpt"],
          },
          models: {
            "litellm/self-hosted": { alias: "local", params: { cache_prompt: true } },
            "litellm/fast": { alias: "local-fast", params: { cache_prompt: true } },
            "litellm/chatgpt": { alias: "gpt" },
            "litellm/local-pool": { alias: "local-pool" },
            "litellm/local-pool-chat": { alias: "local-pool-chat" },
            "minimax/MiniMax-M3-messages": { alias: "minimax" },
            "litellm/MiniMax-M3-chat": { alias: "minimax-chat" },
            "litellm/MiniMax-M3.1-Flash-Preview": { alias: "minimax-flash" },
            "litellm/reasoning-pool": { alias: "reasoning" },
            "litellm/implementation-pool": { alias: "implementation" },
            "litellm/frontier-pool": { alias: "frontier" },
          },
          maxConcurrent: 2,
          subagents: {
            model: { primary: "litellm/fast" },
            archiveAfterMinutes: 120,
            maxConcurrent: 2,
          },
          systemAgent: { agentId: "main" },
        },
        entries: {
          main: {
            name: "Main",
            workspace: "/home/node/.openclaw/workspace",
            agentDir: "/home/node/.openclaw/agents/main/agent",
          },
        },
      },
      tools: {
        elevated: { enabled: true, allowFrom: { discord: ["$${DISCORD_ADMIN_USER_ID}"] } },
        sessions: { visibility: "all" },
        // allowlist, not full (2026-09-30): with a shell the model curled memini
        // with its key masked to *** (a 6 s retry loop for 10 minutes) and
        // echoed the key into Discord. Memory, HA, Grafana, kubectl, Flux and
        // the web all reach it through tools, so it has no everyday need for
        // a shell; grant single commands from the Control UI if one comes up.
        exec: { mode: "allowlist", strictInlineEval: false },
        web: { search: { enabled: true, provider: "searxng" }, fetch: { enabled: true } },
      },
      models: {
        providers: {
          litellm: {
            baseUrl: "http://litellm.llm.svc.cluster.local:4000/v1",
            apiKey: "$${LITELLM_API_KEY}",
            api: "openai-completions",
            timeoutSeconds: 1800,
            models: [
              { id: "self-hosted", name: "Qwen3.8 Flash-Next (worker4, thinking)", reasoning: true, input: ["text", "image"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 131072, maxTokens: 32768 },
              { id: "fast", name: "Qwen3.8 Flash-Next (worker4, no thinking)", reasoning: false, input: ["text", "image"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 131072, maxTokens: 16384 },
              { id: "chatgpt", name: "ChatGPT gpt-5.6-luna (subscription)", reasoning: true, input: ["text", "image"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 272000, maxTokens: 128000 },
              { id: "local-pool", name: "Local pool (Qwen3.8 Flash-Next -> MiniMax)", reasoning: true, input: ["text", "image"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 131072, maxTokens: 32768 },
              { id: "local-pool-chat", name: "Local pool, no thinking", reasoning: false, input: ["text", "image"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 131072, maxTokens: 16384 },
              { id: "MiniMax-M3-chat", name: "MiniMax M3 (plan)", reasoning: true, input: ["text"], cost: { input: 0.3, output: 1.2, cacheRead: 0.03, cacheWrite: 0.3 }, contextWindow: 1000000, maxTokens: 131072 },
              { id: "MiniMax-M3.1-Flash-Preview", name: "MiniMax M3.1 Flash Preview (plan)", reasoning: true, input: ["text"], cost: { input: 0.3, output: 1.2, cacheRead: 0.03, cacheWrite: 0.3 }, contextWindow: 204800, maxTokens: 131072 },
              { id: "reasoning-pool", name: "Reasoning pool", reasoning: true, input: ["text"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 262144, maxTokens: 32768 },
              { id: "implementation-pool", name: "Implementation pool", reasoning: true, input: ["text"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 204800, maxTokens: 32768 },
              { id: "frontier-pool", name: "Frontier pool (ChatGPT gpt-6-astra)", reasoning: true, input: ["text", "image"], cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }, contextWindow: 262144, maxTokens: 32768 },
            ],
          },
          // MiniMax the way OpenClaw's own MiniMax provider speaks it: Anthropic
          // Messages, here through the same gateway (/v1/messages, so the base
          // URL has no /v1) to litellm's MiniMax-M3-messages, which passes the
          // request straight to api.minimax.io/anthropic. M3 returns native
          // thinking blocks and tool_use there; on the OpenAI endpoint its
          // reasoning came back as reasoning_content deltas and leaked into
          // replies, and tool calls sometimes arrived as text (2026-09-30).
          // The flash model (minimax-flash, M2.7 until 2026-10-17) stays on the
          // chat route: OpenClaw's docs say M2.x leaks reasoning on the
          // Anthropic streaming endpoint unless thinking is disabled, and M3.1
          // Flash Preview returned no reasoning_content there in a 2026-10-17
          // tool-call test.
          minimax: {
            baseUrl: "http://litellm.llm.svc.cluster.local:4000",
            apiKey: "$${LITELLM_API_KEY}",
            api: "anthropic-messages",
            timeoutSeconds: 1800,
            models: [
              { id: "MiniMax-M3-messages", name: "MiniMax M3 (plan, Anthropic Messages)", reasoning: true, input: ["text", "image"], cost: { input: 0.3, output: 1.2, cacheRead: 0.06, cacheWrite: 0.3 }, contextWindow: 1000000, maxTokens: 131072 },
            ],
          },
        },
      },
      commands: {
        native: "auto",
        nativeSkills: "auto",
        restart: false,
        ownerAllowFrom: ["discord:$${DISCORD_ADMIN_USER_ID}"],
        allowFrom: { discord: ["$${DISCORD_ADMIN_USER_ID}"] },
      },
      bindings: [
        { agentId: "main", match: { channel: "discord", accountId: "*" } },
      ],
      channels: {
        discord: {
          enabled: true,
          defaultAccount: "default",
          actions: { messages: true, channels: true, search: true, reactions: false, stickers: false, polls: false, permissions: false, threads: false, pins: false, memberInfo: false, roleInfo: false, roles: false, channelInfo: false, voiceStatus: false, events: false, moderation: false, emojiUploads: false, stickerUploads: false },
          streaming: { block: { enabled: false } },
          groupPolicy: "allowlist",
          dmPolicy: "allowlist",
          allowFrom: ["$${DISCORD_ADMIN_USER_ID}"],
          accounts: {
            default: {
              token: "$${DISCORD_BOT_TOKEN}",
              responsePrefix: "[{model}]",
              guilds: {
                // "*", not the server ID: OpenClaw substitutes env vars in
                // VALUES only, so a placeholder key stays literal and the
                // guild never resolves. Still locked to the admin via users.
                // Only #openclaw. With groupPolicy "allowlist", a channel
                // missing from this map is ignored entirely, so the bot cannot
                // answer (or be summoned) anywhere else in the server. DMs
                // from the admin are unaffected (dmPolicy/allowFrom).
                // requireMention false: in its own channel you can just talk.
                "*": {
                  users: ["$${DISCORD_ADMIN_USER_ID}"],
                  channels: {
                    openclaw: { enabled: true, requireMention: false },
                  },
                },
              },
            },
          },
        },
      },
      plugins: {
        allow: ["discord", "memini", "searxng", "litellm"],
        entries: {
          discord: { enabled: true },
          searxng: {
            enabled: true,
            config: { webSearch: { baseUrl: "http://searxng.llm.svc.cluster.local:8080", language: "en" } },
          },
          memini: {
            enabled: true,
            hooks: { allowConversationAccess: true, timeouts: { before_prompt_build: 60000 } },
            config: {
              base_url: "http://memini.llm.svc.cluster.local:8080",
              namespace: "openclaw",
              namespace_per_agent: true,
              namespace_template: "{namespace}/{agent}",
              skip_without_agent: true,
              skip_system_turns: true,
              fallback_on_error: true,
              timeout_ms: 60000,
              recall_limit: 3,
              min_capture_chars: 24,
              recall_position: "append",
              expose_tools: true,
            },
          },
          // memini owns the memory slot, but memory-core still loaded as the
          // "dreaming sidecar" and ran its nightly job (03:00, on litellm/fast)
          // over the workspace: a second memory system writing DREAMS.md
          // (poetry about "doors" and "bearer sigils") and memory/dreaming/
          // next to memini. dreaming.enabled cannot switch it off here: with
          // another slot owner the setting is read from THAT plugin's config
          // (plugins.entries.memini.config.dreaming), which memini's schema
          // rejects. The loader skips the sidecar when memory-core is disabled
          // explicitly (resolveAuthorizedDreamingSidecar, 2026.10.3).
          "memory-core": { enabled: false },
        },
        slots: { memory: "memini" },
      },
      // Cross-conversation transcript recall needs the Active Memory plugin,
      // which is not enabled, so doctor flagged it as half-on. memini already
      // carries facts between the DM, #openclaw and cron sessions.
      memory: { search: { rememberAcrossConversations: false } },
      // Only bundled skills that work in this pod. The rest (1password,
      // github, tmux, sag, ... ~30) need binaries or keys that are not here,
      // yet were offered to the model; doctor lists them as unavailable.
      // Workshop skills (memini-store, toolhive-mcp) are not bundled and are
      // unaffected.
      skills: { allowBundled: ["clawhub", "control-ui", "diagram-maker", "healthcheck", "skill-creator", "visualize", "weather"] },
      session: {
        dmScope: "main",
        reset: { mode: "idle", idleMinutes: 1440 },
        maintenance: { mode: "enforce", pruneAfter: "7d", maxEntries: 1000, resetArchiveRetention: "7d" },
      },
      gateway: {
        auth: { mode: "token", token: "$${OPENCLAW_GATEWAY_TOKEN}" },
        controlUi: { allowedOrigins: ["https://openclaw.${SECRET_DOMAIN}"] },
        mode: "local",
        bind: "lan",
        port: 18789,
        publicOrigin: "https://openclaw.${SECRET_DOMAIN}",
        trustedProxies: ["10.42.0.0/16"],
      },
      mcp: {
        servers: {
          // Everything through toolhive's mcp-gateway: Home Assistant, arr,
          // Seerr, UniFi, Grafana, VictoriaLogs (pod logs), read-only kubectl
          // and Flux, platform, wiki, memory, tradingview, context7 (current
          // library docs).
          // The agent sees two tools (find_tool, call_tool) instead of ~280
          // schemas; find_tool searches by embedding.
          // connectionTimeoutMs: initialize blocks while vMCP embeds tool
          // descriptions. The index is built lazily by the first session after
          // a gateway restart (6.5 min on 2026-10-13) and again after a backend
          // reconcile changes tools (unifi-mcp bump, 2026-10-14: >90 s). At
          // the 30 s default the plugin gave up, backed off, and the agent
          // improvised without its tools ("toolhive is not connected",
          // curl/token detours, wrong claims that HA was unreachable). 10 min
          // matches vMCP's embeddingServiceTimeout, so the turn waits instead.
          toolhive: { url: "http://vmcp-mcp-gateway.llm.svc.cluster.local:4483/mcp", transport: "streamable-http", connectionTimeoutMs: 600000, headers: { Accept: "application/json, text/event-stream" } },
        },
      },
      meta: { lastTouchedVersion: "2026.9.7" },
    }
  # Workspace AGENTS.md (bootstrap file injected into every turn), copied
  # read-only by the init container like openclaw.json. Until 2026-10-14 it
  # was the stock template on the PVC: an empty "Local notes" section (the bot
  # kept forgetting Home Assistant is reached through toolhive and asked for HA
  # tokens instead) and a "Be Proactive" section telling it to check email,
  # calendar and social mentions 2-4 times a day and to reach out after 8 h of
  # silence -- none of which exist here, and the opposite of what the owner
  # asked for. No dollar signs in this block: Flux postBuild would substitute
  # them.
  AGENTS.md: |
    # AGENTS.md - Workspace Rules

    This file is managed in git (home-ops, `kubernetes/apps/llm/openclaw/app/configmap.yaml`) and restored read-only on every restart. Do not try to edit it. Put lessons in memini (`memory_remember`) or `MEMORY.md`, and tell Robin when a rule here looks wrong so it can be changed in git.

    ## Session Startup

    Use the runtime-provided startup context first. It already includes `AGENTS.md`, `SOUL.md`, `USER.md`, recent daily notes and, in the main session, `MEMORY.md`, plus a `memini-recall` block with relevant long-term memories. Re-read files only when Robin asks, context is missing, or a deeper read is needed.

    ## Memory

    - **Long-term memory is memini**, through the `memory_*` tools: `memory_recall` (search), `memory_briefing`, `memory_list`, `memory_remember` (store or update by id) and `memory_forget`. The plugin holds the credentials. Never reach memini with exec, curl or web_fetch, and never ask for a memini token.
    - `USER.md`: stable directives about Robin (style, preferences, active projects). One directive per entry, preceded by `<!-- observed: YYYY-MM-DD | status: active -->`. When a preference changes, mark the old entry `superseded` and rewrite it in place.
    - `MEMORY.md`: curated durable facts and decisions, main session only. Remove entries that are no longer true.
    - Daily notes: `memory/YYYY-MM-DD.md`.
    - Write workspace files with the `read`, `edit` and `write` tools. Never with exec (heredocs and `cat >>` are denied).
    - Before writing a file, read it. Write concrete facts, never placeholders.

    ## Tools

    ### toolhive: Home Assistant, Grafana/Prometheus, VictoriaLogs (pod logs), kubectl, Flux, arr, Seerr, UniFi and more

    - Everything lives behind two tools: `toolhive__find_tool` (argument `tool_description`) and `toolhive__call_tool` (arguments `tool_name` and `parameters`).
    - `tool_name` is server-prefixed exactly as find_tool returns it, e.g. `ha-mcp_ha_get_state`, `grafana_query_prometheus`, `flux-mcp_get_kubernetes_events`, `victorialogs-mcp_stats_query`.
    - **Pod logs** for every namespace (30 days) are in VictoriaLogs through `victorialogs-mcp_*` (LogsQL). Count first with `stats_query` or `hits`, then fetch a few lines with `query` and a small `limit`. Quote counts and short excerpts, never whole log dumps.
    - **Home Assistant** holds the Withings scale and sleep data, room sensors, doors and weather. Read it through `ha-mcp_*`. No HA URL, token or OAuth is needed: never ask Robin for one, and never curl Home Assistant.
    - **Lists inside `parameters` must be plain JSON arrays**: `"entity_id": ["sensor.a", "sensor.b"]`. Never wrap a list in an object such as `{"item": [...]}`. The servers reject it, and that wrapper has broken the daily health digest most mornings.
    - If toolhive is "not connected" or slow, the gateway is rebuilding its tool index (a few minutes after a toolhive change). Say so in one line and try again later. Do not fall back to curl or exec, and do not conclude that a service needs new credentials.

    ### exec

    - exec runs on an allowlist, and scheduled runs cannot ask for approval. Do not use it for HTTP, memory, config or file writes: use `web_fetch`, `memory_*`, toolhive, and `read`/`edit`/`write`.
    - When exec is denied, do not retry variants of the command. Use the right tool, or tell Robin once what you could not do.

    ### OpenClaw config

    - `openclaw.json` is managed in git and restored on every restart. A change made through the `openclaw` tool lasts only until the next restart. Say exactly that, and tell Robin it has to go into git to stick. Never report such a change as permanent.

    ### Formatting

    - On Discord use bullet lists, not markdown tables, and wrap multiple links in `<>` to suppress embeds.

    ## Replies

    - Send exactly one reply per message. If a tool call fails after you have already answered, do not write a second answer; at most add one short line about what failed.
    - Do not post tool narration ("Let me check...", "Fixing the parameter format..."). Do the work, then answer.
    - Reply in the language Robin writes in.
    - Never post `NO_REPLY`, heartbeat or status chatter to Discord.

    ## Automations

    - Recurring work runs as cron jobs kept in git as `jobs.sh`: morning-brief, upstream-watch and cluster-health (daily), weekly-workout-checkin, media-digest and network-weekly (Sundays), and energy-monthly (the 1st). Robin's own reminders come on top. OpenClaw's own weekly skill-collection-review also stays: it tidies the Skill Workshop and sends nothing. There is no heartbeat.
    - Do not create, change or delete recurring jobs unless Robin asks. One-off reminders on request are fine.
    - There are no email, calendar or social integrations here. Do not offer proactive check-ins beyond the jobs above, and do not ping Robin to fill silence.
    - Scheduled jobs and reminders Robin set always deliver at their scheduled time, whatever the hour. Quiet hours (23:00-08:00 Europe/Stockholm) apply only to unprompted messages, which should be rare and urgent.

    ## Red Lines

    - Don't exfiltrate private data. Ever. Health, food and home data stays in this DM and `#openclaw`.
    - Don't run destructive commands without asking.
    - Inspect existing state before changing any config or schedule, and merge rather than replace.
    - When in doubt, ask.
