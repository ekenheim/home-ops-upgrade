---
# Random gateway token for the Control UI / CLI, generated in-cluster once
# (refreshInterval "0") -- nothing to create in Bitwarden. Read it with:
#   kubectl -n llm get secret openclaw-gateway -o jsonpath='{.data.OPENCLAW_GATEWAY_TOKEN}' | base64 -d
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: openclaw-gateway
spec:
  length: 48
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name openclaw-gateway
spec:
  refreshInterval: "0"
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        OPENCLAW_GATEWAY_TOKEN: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: openclaw-gateway
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name openclaw
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Its own Discord bot (not hermes'): one token in two gateways means
        # both answer every message.
        DISCORD_BOT_TOKEN: '{{ .DISCORD_BOT_TOKEN }}'
        DISCORD_SERVER_ID: '{{ .DISCORD_SERVER_ID }}'
        DISCORD_ADMIN_USER_ID: '{{ .DISCORD_ADMIN_USER_ID }}'
        # memini bearer token, OpenClaw's OWN key since 2026-09-30 (memini key
        # `openclaw`, non-admin, home openclaw-discord), after the bot echoed
        # the shared admin key into Discord. Memories land in namespace
        # openclaw/<agent> (plugin config), apart from hermes'. The Bitwarden
        # field was created as `OPENCLAW_MEMINI_API_KEY.` (trailing dot);
        # `or` takes whichever spelling exists so the rename needs no PR.
        MEMINI_API_KEY: '{{ or (index . "OPENCLAW_MEMINI_API_KEY") (index . "OPENCLAW_MEMINI_API_KEY.") }}'
  dataFrom:
    - extract:
        key: openclaw
    - extract:
        key: memini
