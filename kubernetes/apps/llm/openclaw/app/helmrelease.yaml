---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openclaw
spec:
  # OpenClaw (github.com/openclaw/openclaw), after joryirving/home-ops: an
  # always-on agent gateway with a Discord bot, scheduled jobs (`openclaw cron`)
  # and a web Control UI. Trimmed from Jory's: one agent, no code-server
  # sidecar, no cluster-wide pod-delete RBAC, internal route only.
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      hostname: openclaw
      securityContext:
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      openclaw:
        annotations:
          reloader.stakater.com/auto: "true"
        # RWO PVC: a surge pod would hang in ContainerCreating on another node.
        strategy: Recreate
        initContainers:
          config:
            image:
              repository: docker.io/library/alpine
              tag: 3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
            # Git is the source of truth: replace the config on every start and
            # make it read-only, so a Control UI edit cannot drift from git.
            command:
              - sh
              - -c
              - |
                set -eu
                mkdir -p /home/node/.openclaw
                rm -f /home/node/.openclaw/openclaw.json
                cp /tmp/openclaw.json /home/node/.openclaw/openclaw.json
                chmod 400 /home/node/.openclaw/openclaw.json
        containers:
          app:
            image:
              repository: ghcr.io/openclaw/openclaw
              tag: 2026.9.9@sha256:7f10d5cc975a90b65192eaa099454fe33ce8ce2390806c61c65cd868e9ef730d
            command:
              - /bin/sh
              - -c
              - |
                FLAGS="--accept-capabilities --acknowledge-install-policy-warning"
                # memini ships through ClawHub, not npm. Pinned; reinstalled only
                # when this version changes (marker file on the PVC).
                MEMINI_PLUGIN_VERSION=0.7.29
                if [ "$(cat "$HOME/.openclaw/extensions/memini/.clawver" 2>/dev/null)" != "$MEMINI_PLUGIN_VERSION" ]; then
                  if node dist/index.js plugins install "clawhub:@eleboucher/memini@$MEMINI_PLUGIN_VERSION" --force $FLAGS; then
                    printf '%s' "$MEMINI_PLUGIN_VERSION" > "$HOME/.openclaw/extensions/memini/.clawver"
                  else
                    echo "WARN: memini plugin install failed; starting with whatever is present"
                  fi
                fi
                # Official npm plugins are not bundled and must track the gateway
                # version, or the next image bump runs a stale Discord plugin.
                OPENCLAW_VERSION="$(node dist/index.js --version | awk '{print $2}')"
                MARKER="$HOME/.openclaw/extensions/.official-plugins-version"
                if [ -n "$OPENCLAW_VERSION" ] && [ "$(cat "$MARKER" 2>/dev/null)" != "$OPENCLAW_VERSION" ]; then
                  if node dist/index.js plugins update "@openclaw/discord@$OPENCLAW_VERSION" $FLAGS \
                    && node dist/index.js plugins update searxng $FLAGS; then
                    mkdir -p "$(dirname "$MARKER")" && printf '%s' "$OPENCLAW_VERSION" > "$MARKER"
                  else
                    echo "WARN: official plugin update failed; starting with installed versions"
                  fi
                fi
                exec node dist/index.js gateway
            env:
              TZ: "${TIMEZONE}"
              HOME: /home/node
              OPENCLAW_GATEWAY_PORT: &port 18789
              OPENCLAW_LOG_LEVEL: info
              # Only surface memories the store is confident about.
              MEMINI_INJECT_RECALL_MIN_SCORE: "0.85"
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-openclaw
                    key: api-key
            envFrom:
              - secretRef:
                  name: openclaw
              - secretRef:
                  name: openclaw-gateway
            probes:
              # First start installs plugins from ClawHub and npm before the
              # gateway binds; allow 10 minutes.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 60
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 8Gi
    service:
      app:
        controller: openclaw
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Data Science"
          gethomepage.dev/name: "OpenClaw"
          gethomepage.dev/description: "Agent gateway (Discord + scheduled jobs)"
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      home:
        existingClaim: openclaw
        globalMounts:
          - path: /home/node
      config:
        type: configMap
        name: openclaw-config
        globalMounts:
          - path: /tmp/openclaw.json
            subPath: openclaw.json
            readOnly: true
