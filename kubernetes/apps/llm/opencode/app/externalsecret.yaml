---
# Password for opencode's own server auth (the web UI and API), generated in
# the cluster once. Read it with:
#   kubectl -n llm get secret opencode-server -o jsonpath='{.data.OPENCODE_SERVER_PASSWORD}' | base64 -d
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: opencode-server
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name opencode-server
spec:
  refreshInterval: "0"
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        OPENCODE_SERVER_PASSWORD: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: opencode-server
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name opencode
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # The agent PAT: clones, pushes branches, opens PRs as you.
        GITHUB_TOKEN: '{{ .GITHUB_TOKEN }}'
        GH_TOKEN: '{{ .GITHUB_TOKEN }}'
        # memini plugin, namespace opencode.
        MEMINI_API_KEY: '{{ .MEMINI_API_KEY }}'
  dataFrom:
    - extract:
        key: github_token
    - extract:
        key: memini
