---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app opencode
  namespace: flux-system
spec:
  path: ./kubernetes/apps/llm/opencode/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: llm
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  dependsOn:
    - name: volsync
    - name: external-secrets-stores
    - name: rook-ceph-cluster
    - name: litellm-keys
    - name: memini
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  postBuild:
    substitute:
      APP: *app
      # ~/projects (clones, work in progress) and opencode's session state.
      VOLSYNC_CAPACITY: 20Gi
      VOLSYNC_UID: "1000"
      VOLSYNC_GID: "1000"
