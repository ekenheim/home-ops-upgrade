---
# mkdocs.yml is joryirving/home-ops' repo-wiki verbatim. generate.py started
# there too but has diverged: it keeps its page plan in manifest.json (stable
# slugs), rewrites only the pages whose source files changed, builds in a
# staging dir and swaps, and survives a failed page. manifest.json is also the
# index the wiki-mcp server (../../toolhive/wiki-mcp) reads.
# There is no dollar sign anywhere in this file; keep it that way, Flux
# envsubst runs over it in strict mode.
apiVersion: v1
kind: ConfigMap
metadata:
  name: repo-wiki
data:
  # One `owner/repo` per line (a bare `owner` expands to all of that owner's
  # repos). Public repos need no token scope. PRIVATE ones (nordic-housing,
  # talos-and-tensors, alphaos) only work if the fine-grained agent PAT lists
  # them -- it is on "selected repositories", and an unlisted repo 404s
  # silently rather than erroring.
  repos.txt: |
    ekenheim/home-ops-upgrade
  mkdocs.yml: |
    site_name: Repo Wikis
    docs_dir: /app-data/repository
    site_dir: /tmp/site
    theme:
      name: material
      palette:
        - scheme: slate
          primary: indigo
          accent: indigo
          toggle:
            icon: material/weather-sunny
            name: Switch to light mode
        - scheme: default
          primary: indigo
          accent: indigo
          toggle:
            icon: material/weather-night
            name: Switch to dark mode
      features:
        - navigation.instant
        - navigation.indexes
        - navigation.sections
        - navigation.top
        - navigation.footer
        - search.suggest
        - search.highlight
        - content.code.copy
        - toc.follow
    plugins:
      - search
    markdown_extensions:
      - admonition
      - footnotes
      - toc:
          permalink: true
      - pymdownx.highlight
      - pymdownx.superfences:
          custom_fences:
            - name: mermaid
              class: mermaid
              format: !!python/name:pymdownx.superfences.fence_code_format
  generate.py: |
    #!/usr/bin/env python3
    # Multi-pass repo wiki: stage 1 plans pages, stage 2 writes each from its
    # relevant files. Local-model friendly, background, no truncated whole-repo dump.
    #
    # The plan is kept in manifest.json and reused, so slugs are stable and a page
    # is only rewritten when the files it is built from changed.
    import fnmatch, hashlib, io, json, os, pathlib, re, shutil, subprocess, tarfile, time
    import urllib.error, urllib.request

    LITELLM  = os.environ["OPENAI_BASE_URL"].rstrip("/")
    KEY      = os.environ["OPENAI_API_KEY"]
    TOKEN    = os.environ.get("GITHUB_TOKEN", "")
    MODEL    = os.environ.get("WIKI_MODEL", "qwen3.8-flash-next")
    MAX      = int(os.environ.get("MAX_REPOS_PER_RUN", "2"))
    MAXPAGES = int(os.environ.get("MAX_PAGES_PER_REPO", "10"))
    TIMEOUT  = int(os.environ.get("LLM_TIMEOUT", "1800"))
    PAGE_CTX = int(os.environ.get("PAGE_CTX_CHARS", "120000"))
    PLAN_AGE = int(os.environ.get("PLAN_MAX_AGE_DAYS", "14")) * 86400
    REPO     = pathlib.Path(os.environ.get("WIKI_REPO", "/app-data/repository"))
    STATE    = pathlib.Path("/app-data/.wiki-state.json")
    # Outside docs_dir so mkdocs never sees a half-written tree, same filesystem
    # so the swap is a rename.
    STAGING  = pathlib.Path("/app-data/.staging")
    MANIFEST = REPO / "manifest.json"
    ENTRIES  = [l.strip() for l in pathlib.Path("/config/repos.txt").read_text().splitlines()
                if l.strip() and not l.startswith("#")]

    SKIP = ("*.png", "*.jpg", "*.jpeg", "*.gif", "*.ico", "*.svg", "*.pdf", "*.zip",
            "*.gz", "*.tar", "*.lock", "*.woff*", "*.ttf", "*.bin", "*.wasm")

    def gh(path):
        req = urllib.request.Request(f"https://api.github.com{path}",
            headers={"Authorization": f"Bearer {TOKEN}", "User-Agent": "repo-wiki",
                     "Accept": "application/vnd.github+json"})
        return json.load(urllib.request.urlopen(req, timeout=30))

    def list_repos(owner):
        for kind in ("orgs", "users"):
            try:
                out, page = [], 1
                while True:
                    batch = gh(f"/{kind}/{owner}/repos?per_page=100&type=all&page={page}")
                    if not batch:
                        break
                    out += batch
                    page += 1
                return out
            except urllib.error.HTTPError as e:
                if e.code == 404 and kind == "orgs":
                    continue
                raise
        return []

    def expand(entry):
        if not entry.endswith("/*"):
            return [entry]
        owner = entry[:-2]
        return [r["full_name"] for r in list_repos(owner)
                if r["full_name"].startswith(owner + "/") and not r["archived"] and not r["fork"]]

    def clone_url(repo):
        return f"https://x-access-token:{TOKEN}@github.com/{repo}.git" if TOKEN \
            else f"https://github.com/{repo}.git"

    def head_sha(repo):
        out = subprocess.run(["git", "ls-remote", clone_url(repo), "HEAD"],
                             capture_output=True, text=True).stdout
        return out.split()[0] if out else ""

    def fetch_files(repo):
        req = urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball",
                                     headers={"Authorization": f"Bearer {TOKEN}", "User-Agent": "repo-wiki"})
        tar = tarfile.open(fileobj=io.BytesIO(urllib.request.urlopen(req, timeout=180).read()))
        files = {}
        for m in tar.getmembers():
            if not m.isfile() or m.size > 96_000:
                continue
            rel = m.name.split("/", 1)[-1]
            if not rel or any(fnmatch.fnmatch(rel.lower(), p) for p in SKIP):
                continue
            try:
                files[rel] = tar.extractfile(m).read().decode("utf-8")
            except Exception:
                continue
        return files

    def chat(system, user):
        body = json.dumps({"model": MODEL, "temperature": 0.2, "messages": [
            {"role": "system", "content": system},
            {"role": "user", "content": user}]}).encode()
        req = urllib.request.Request(f"{LITELLM}/chat/completions", data=body,
            headers={"Authorization": f"Bearer {KEY}", "Content-Type": "application/json"})
        return json.load(urllib.request.urlopen(req, timeout=TIMEOUT))["choices"][0]["message"]["content"]

    PLAN_SYS = (
        "You plan a detailed technical wiki for a code repository. Given the file tree and "
        "README, respond with ONLY a JSON array (no prose, no code fence) of at most %d pages "
        "that together explain the repo in depth. Each element: {\"title\": str, \"slug\": "
        "kebab-case str, \"focus\": one sentence, \"files\": [most relevant file paths]}. "
        "Always include an architecture/overview page, one page per major component or "
        "subsystem, plus setup and operations." % MAXPAGES)

    # Slugs are URLs and MCP page ids. Without this the model renames half the
    # pages on every run (overview-architecture -> overview-and-architecture).
    PLAN_KEEP = (
        "\n\nThe wiki already has the pages below. Reuse the EXACT slug and title of every "
        "page that still applies; only add or drop a page when the repository gained or "
        "lost a subsystem.\n")

    PAGE_SYS = (
        "You write one page of a technical wiki in GitHub-flavored markdown. Be detailed, "
        "accurate, and concrete: explain how things actually work, cite real file paths, and "
        "include a mermaid diagram when it clarifies structure or flow. Start with an H1 "
        "title. Do not invent features absent from the provided source.")

    def slugify(s):
        return re.sub(r"[^a-z0-9]+", "-", s.lower()).strip("-") or "page"

    def normalise(pages, files):
        out, seen = [], set()
        for pg in pages:
            if not isinstance(pg, dict):
                continue
            slug = slugify(str(pg.get("slug") or pg.get("title") or "page"))
            if slug in seen or slug == "index":
                continue
            seen.add(slug)
            out.append({"title": str(pg.get("title") or slug), "slug": slug,
                        "focus": str(pg.get("focus") or ""),
                        "files": [p for p in pg.get("files") or [] if p in files]})
        return out

    def plan(repo, files, previous):
        tree = "\n".join(sorted(files))
        readme = next((files[p] for p in files
                       if p.lower() == "readme.md" or p.lower().endswith("/readme.md")), "")[:8000]
        user = f"Repository: {repo}\n\nFile tree:\n{tree}\n\nREADME:\n{readme}"
        if previous:
            user += PLAN_KEEP + json.dumps([{"title": p["title"], "slug": p["slug"]} for p in previous])
        out = chat(PLAN_SYS, user)
        m = re.search(r"\[.*\]", out, re.S)
        try:
            return json.loads(m.group(0)) if m else []
        except Exception:
            return []

    def context(page, files):
        ctx, total = [], 0
        for p in page["files"]:
            c = files.get(p)
            if not c:
                continue
            ctx.append(f"=== {p} ===\n{c}")
            total += len(c)
            if total > PAGE_CTX:
                break
        return "\n\n".join(ctx)

    def source_hash(page, ctx):
        # Everything that shapes the page. A Renovate bump touches one HelmRelease,
        # so only the pages built from that file get rewritten.
        blob = "\0".join((MODEL, PAGE_SYS, page["title"], page["focus"], ctx))
        return hashlib.sha256(blob.encode()).hexdigest()

    def write_page(repo, page, ctx):
        user = (f"Repository: {repo}\nPage title: {page['title']}\n"
                f"Focus: {page['focus']}\n\nRelevant source files:\n" + ctx)
        text = chat(PAGE_SYS, user)
        if not text or not text.strip():
            raise RuntimeError("empty completion")
        return text

    def existing_pages(base):
        # A wiki written before manifest.json existed: recover slugs and titles
        # from the files so the first manifest run does not rename everything.
        out = []
        for f in sorted(base.glob("*.md")):
            if f.stem == "index":
                continue
            first = f.read_text().lstrip().splitlines()[:1]
            title = first[0].lstrip("# ").strip() if first and first[0].startswith("#") else f.stem
            out.append({"title": title, "slug": f.stem})
        return out

    def commit(msg):
        subprocess.run(["git", "-C", str(REPO), "add", "-A"], check=False)
        subprocess.run(["git", "-C", str(REPO), "-c", "user.email=repo-wiki@users.noreply.github.com",
                        "-c", "user.name=repo-wiki", "commit", "-q", "-m", msg], check=False)

    def regenerate(repo, sha, entry):
        now = int(time.time())
        base = REPO / repo
        files = fetch_files(repo)
        old = {p["slug"]: p for p in entry.get("pages", [])}

        pages = normalise(entry.get("pages", []), files)
        planned_at = entry.get("planned_at", 0)
        if not pages or now - planned_at > PLAN_AGE or any(not p["files"] for p in pages):
            previous = pages or (existing_pages(base) if base.exists() else [])
            pages = normalise(plan(repo, files, previous), files)[:MAXPAGES] or pages
            planned_at = now
            print(f"  planned {len(pages)} pages", flush=True)
        if not pages:
            pages = [{"title": "Overview", "slug": "overview", "focus": "repository overview",
                      "files": sorted(files)[:40]}]

        stage = STAGING / "new"
        shutil.rmtree(STAGING, ignore_errors=True)
        stage.mkdir(parents=True)
        done, wrote, failed = [], 0, 0
        for pg in pages:
            slug, ctx = pg["slug"], context(pg, files)
            digest = source_hash(pg, ctx)
            prior, prior_file = old.get(slug, {}), base / f"{slug}.md"
            if not entry and prior_file.exists():
                # First run with a manifest over a wiki written without one: adopt
                # the page as current rather than spend hours rewriting all of them.
                prior = {"source_hash": digest, "generated_at": int(prior_file.stat().st_mtime)}
            if prior.get("source_hash") == digest and prior_file.exists():
                shutil.copy2(prior_file, stage / f"{slug}.md")
                done.append({**pg, "source_hash": digest, "generated_at": prior.get("generated_at", now)})
                continue
            print(f"  page: {pg['title']} ({slug})", flush=True)
            try:
                (stage / f"{slug}.md").write_text(write_page(repo, pg, ctx))
                done.append({**pg, "source_hash": digest, "generated_at": now})
                wrote += 1
            except Exception as e:
                # One timeout must not cost the whole wiki. Keep the old page and
                # its old hash, so the next run tries this page again.
                failed += 1
                print(f"  FAILED {slug}: {e}", flush=True)
                if prior_file.exists():
                    shutil.copy2(prior_file, stage / f"{slug}.md")
                    done.append({**pg, "source_hash": prior.get("source_hash", ""),
                                 "generated_at": prior.get("generated_at", 0)})
        if not done:
            raise RuntimeError("no page could be written")

        index = [f"# {repo}\n", "_AI-generated wiki._\n", "## Pages\n"]
        index += [f"- [{p['title']}]({p['slug']}.md)" for p in done]
        (stage / "index.md").write_text("\n".join(index))

        trash = STAGING / "old"
        base.parent.mkdir(parents=True, exist_ok=True)
        if base.exists():
            base.rename(trash)
        stage.rename(base)
        shutil.rmtree(STAGING, ignore_errors=True)

        print(f"  {repo}: {wrote} written, {len(done) - wrote} kept, {failed} failed", flush=True)
        return {"sha": sha, "generated_at": now, "planned_at": planned_at, "pages": done}, failed

    subprocess.run(["git", "config", "--global", "--add", "safe.directory", str(REPO)], check=False)
    REPO.mkdir(parents=True, exist_ok=True)
    if not (REPO / ".git").exists():
        subprocess.run(["git", "init", "-q", str(REPO)], check=True)
    state = json.loads(STATE.read_text()) if STATE.exists() else {}
    manifest = json.loads(MANIFEST.read_text()) if MANIFEST.exists() else {"repos": {}}

    candidates = sorted({r for e in ENTRIES for r in expand(e)})
    stale = [(r, s) for r in candidates if (s := head_sha(r)) and state.get(r) != s][:MAX]
    print(f"{len(candidates)} repos discovered, {len(stale)} to check this run", flush=True)

    for repo, sha in stale:
        print(f"== {repo}", flush=True)
        try:
            entry, failed = regenerate(repo, sha, manifest["repos"].get(repo, {}))
            manifest["repos"][repo] = entry
            MANIFEST.write_text(json.dumps(manifest, indent=2))
            if not failed:
                # Only a clean run marks the sha done; a failed page is retried.
                state[repo] = sha
                STATE.write_text(json.dumps(state, indent=2))
            commit(f"regenerate {repo} @ {sha[:7]}")
        except Exception as e:
            print(f"  skipped {repo}: {e}", flush=True)
            continue

    root = ["# Repo Wikis\n", "_AI-generated documentation, one section per repository._\n"]
    for r in candidates:
        if (REPO / r / "index.md").exists():
            root.append(f"- [{r}]({r}/index.md)")
        else:
            root.append(f"- {r} _(pending)_")
    (REPO / "index.md").write_text("\n".join(root))
    commit("update root index")
