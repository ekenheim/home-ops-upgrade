---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name repo-wiki
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # litellm VIRTUAL key from a NEW `repo-wiki` Bitwarden Secrets Manager
        # item (field LITELLM_API_KEY). Its own key so the wiki's token use
        # shows up on its own line in litellm and can be cut off alone: this
        # is a batch job that can burn hours of ornith time.
        OPENAI_API_KEY: '{{ .LITELLM_API_KEY }}'
        # The existing agent PAT (`github_token` item), read-only use here:
        # tarball downloads and `git ls-remote`. A missing FIELD renders empty
        # and still syncs green; the generator then works for public repos
        # only, at GitHub's unauthenticated rate limit.
        GITHUB_TOKEN: '{{ .GITHUB_TOKEN }}'
  dataFrom:
    - extract:
        key: repo-wiki
    - extract:
        key: github_token
