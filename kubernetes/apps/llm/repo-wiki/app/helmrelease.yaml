---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
#
# LLM-written wikis for git repositories, after joryirving/home-ops
# (kubernetes/apps/base/llm/repo-wiki). Two controllers on one volume:
#   mkdocs          serves /app-data/repository as a Material site, plus a
#                   `raw` sidecar serving the same markdown and manifest.json
#                   on :8001 for the wiki-mcp server (../../toolhive/wiki-mcp)
#   repo-wiki-gen   CronJob; for each repo in repos.txt whose HEAD moved, writes
#                   the pages whose source files changed
#
# COST. Every page is one long non-streaming completion on `self-hosted`
# (ornith-35b), and llama.cpp does NOT stop generating when a client times out
# -- the slot keeps working for nobody (see the ornith zombie-loop and dispatch
# groomer incidents). Renovate moves this repo's HEAD many times a day, so the
# upstream guard (skip a repo whose HEAD did not move) never fired here and
# every run rewrote all 20 pages, ~3.5 h of ornith twice a day. Now the page
# plan is kept for PLAN_MAX_AGE_DAYS and a page is rewritten only when the
# files it is built from changed; a typical run is a tarball fetch and a
# handful of pages, at night. If ornith's /slots fill with dead work after a
# run, this job is still the first suspect:
#   kubectl -n llm patch cronjob repo-wiki-repo-wiki-gen -p '{"spec":{"suspend":true}}'
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app repo-wiki
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
    controllers:
      mkdocs:
        # RWO PVC: never two server pods on it at once.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Not upstream. mkdocs exits if docs_dir is missing, and on a fresh
          # volume nothing creates it until the first CronJob run, up to 12 h
          # away. A placeholder index keeps the site up until then; the
          # generator writes its own index.md over it.
          docs-dir:
            image: &mkdocs
              repository: docker.io/squidfunk/mkdocs-material
              tag: 9.7.7@sha256:51b87149d227691486b5f08993d28c65ca7e4990010664b697265b8e6fcd5287
            command:
              - sh
              - -c
              - |
                set -eu
                mkdir -p /app-data/repository
                if [ ! -f /app-data/repository/index.md ]; then
                  printf '# Repo Wikis\n\nNothing generated yet. The generator runs every 12 hours.\n' > /app-data/repository/index.md
                fi
        containers:
          app:
            image:
              repository: docker.io/squidfunk/mkdocs-material
              tag: 9.7.7@sha256:51b87149d227691486b5f08993d28c65ca7e4990010664b697265b8e6fcd5287
            command: ["mkdocs"]
            # --dirty rebuilds only changed pages when the CronJob commits.
            args: ["serve", "--dirty", "-f", "/config/mkdocs.yml", "-a", "0.0.0.0:8000"]
            env:
              TZ: "${TIMEZONE}"
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
          # Not upstream. mkdocs only serves rendered HTML and the volume is
          # RWO, so this is how anything else reads the markdown: wiki-mcp
          # fetches manifest.json and <owner>/<repo>/<slug>.md from here. Not
          # on the route; in-cluster only. It serves .git too, which holds
          # nothing but earlier versions of the same pages.
          raw:
            image:
              repository: docker.io/library/python
              tag: 3.14-slim@sha256:83ff1d245a3d57d04152252d3ef9cb361494d0b3395abd65a5ebe91c401c8e83
            command: ["python3", "-m", "http.server", "8001", "--directory", "/app-data/repository"]
            env:
              PYTHONUNBUFFERED: "1"
            securityContext:
              runAsUser: 65534
              runAsGroup: 65534
              runAsNonRoot: true
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            probes:
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /index.md
                    port: 8001
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
      repo-wiki-gen:
        type: cronjob
        pod:
          # The volume is RWO and mkdocs holds it, so the job has to land on
          # the same node.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values: ["repo-wiki"]
                      - key: app.kubernetes.io/controller
                        operator: In
                        values: ["mkdocs"]
                  topologyKey: kubernetes.io/hostname
        cronjob:
          # Nightly: ornith is shared with hermes and dispatch during the day.
          schedule: "0 3 * * *"
          timeZone: "${TIMEZONE}"
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
        containers:
          app:
            image:
              repository: docker.io/library/python
              tag: "3.14@sha256:e06cc1111ed84189e91866447f562b89faadbfbbb9937cd67e6bf4172cdb45df"
            command: ["python3", "/config/generate.py"]
            env:
              TZ: "${TIMEZONE}"
              OPENAI_BASE_URL: http://litellm.llm:4000/v1
              # ornith-35b with thinking on. Writing a page from source files
              # is the kind of work dispatch also gives this alias, not `fast`.
              WIKI_MODEL: self-hosted
              MAX_REPOS_PER_RUN: "1"
              MAX_PAGES_PER_REPO: "20"
              LLM_TIMEOUT: "1800"
              # Re-plan the page list this often; in between, slugs and each
              # page's file list are frozen (a new app shows up in the wiki at
              # the next re-plan, not before).
              PLAN_MAX_AGE_DAYS: "14"
              WIKI_REPO: /app-data/repository
            envFrom:
              - secretRef:
                  name: *app
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    service:
      app:
        controller: mkdocs
        ports:
          http:
            port: 8000
          raw:
            port: 8001
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "LLM"
          gethomepage.dev/name: "Repo Wikis"
          gethomepage.dev/icon: "mdi-book-open-page-variant"
          gethomepage.dev/description: "LLM-written wikis of my repositories"
        hostnames: ["wikis.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 8000
    persistence:
      data:
        existingClaim: *app
        advancedMounts:
          mkdocs:
            docs-dir:
              - path: /app-data
            app:
              - path: /app-data
            raw:
              - path: /app-data
                readOnly: true
          repo-wiki-gen:
            app:
              - path: /app-data
      config:
        type: configMap
        name: repo-wiki
        globalMounts:
          - path: /config
