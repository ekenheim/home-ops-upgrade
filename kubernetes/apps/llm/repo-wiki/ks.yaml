---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app repo-wiki
  namespace: flux-system
spec:
  path: ./kubernetes/apps/llm/repo-wiki/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: llm
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  dependsOn:
    - name: volsync
    - name: external-secrets-stores
    - name: rook-ceph-cluster
    # The generator writes every page through litellm (`self-hosted`).
    - name: litellm
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      # Generated markdown plus the generator's state file. Regenerable, but
      # a full regeneration is hours of ornith time, so it is backed up.
      VOLSYNC_CAPACITY: 5Gi
      # Both containers run as root (upstream images' default).
      VOLSYNC_UID: "0"
      VOLSYNC_GID: "0"
