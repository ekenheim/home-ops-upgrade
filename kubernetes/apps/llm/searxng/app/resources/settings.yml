---
use_default_settings: true

server:
  limiter: true
  image_proxy: true
  method: GET # https://github.com/searxng/searxng/pull/3619
  public_instance: false

search:
  autocomplete: duckduckgo
  favicon_resolver: duckduckgo
  languages:
    - all
    - en
    - en-US
  formats:
    - html
    - json

general:
  instance_name: LDS Search

ui:
  default_theme: simple
  infinite_scroll: true
  query_in_title: true
  results_on_new_tab: true
  static_use_hash: true
  theme_args:
    simple_style: auto

categories_as_tabs:
  general:
  images:
  videos:
  map:

enabled_plugins:
  - Basic Calculator
  - Hash plugin
  - Open Access DOI rewrite
  - Self Informations
  - Tracker URL remover
  - Unit converter plugin

# Default web engines, measured from this egress IP on 2026-10-18 (pinned
# image 2026.10.7). Vane, OpenClaw and anything else that sends no `engines=`
# get this set; a client that names engines (Atlas, ATLAS_SEARXNG_ENGINES in
# development/atlas) can still pick a disabled one.
engines:
  # Off by default, not removed: over 72 h brave answered 429 (Too many
  # requests, suspended 180 s) 14 times and duckduckgo a CAPTCHA 8 times, and
  # a test query got the same from both. Atlas still asks for duckduckgo by
  # name.
  - name: brave
    disabled: true
  - name: duckduckgo
    disabled: true
  # Upstream ships both `inactive` (never loaded, so even a client naming
  # them got nothing): each sits behind a proof-of-work CAPTCHA that the
  # engine solves itself. Startpage's is Anubis at difficulty 4, ~65k SHA-256
  # per solve and the pass cached 240 s; Mojeek's ALTCHA token is cached the
  # same way. Cheap next to the pod's idle CPU, and a test query got 10
  # results from each where brave and duckduckgo got none. `inactive: false`
  # loads them; `disabled: false` puts them in the default set.
  - name: startpage
    inactive: false
    disabled: false
  - name: mojeek
    inactive: false
    disabled: false
  # wolframalpha stays off. The key-less engine (wolframalpha_noapi) fetches a
  # token from /input/api/v1/code, which answers 504 after 15 s since
  # Wolfram moved its site to server rendering (searxng/searxng#6812, open);
  # enabled, it would only add a timeout to every query. The API engine
  # (wolframalpha_api) works but needs a Wolfram AppID.

hostnames:
  high_priority:
    - (.*)\/blog\/(.*)
    - (.*\.)?wikipedia.org$
    - (.*\.)?github.com$
    - (.*\.)?reddit.com$
    - (.*\.)?docker.com$
    - (.*\.)?archlinux.org$
    - (.*\.)?stackoverflow.com$
    - (.*\.)?askubuntu.com$
    - (.*\.)?superuser.com$