---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
# Browser sign-in for tavern.${SECRET_DOMAIN}, done by envoy-internal. SillyTavern
# runs with its own whitelist, CSRF and auth guards off (see helmrelease.yaml).
# Every request through the route must carry an Authentik session
# (application `sillytavern`, authentik Admins only, defined in
# security/authentik/app/sillytavern-oidc.yaml). Same shape as vane's.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: sillytavern-oidc
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: sillytavern
  oidc:
    provider:
      issuer: https://sso.${SECRET_DOMAIN}/application/o/sillytavern/
    clientID: sillytavern
    clientSecret:
      # Cross-namespace; allowed by the ReferenceGrant in security.
      name: authentik-sillytavern-oidc
      namespace: security
    redirectURL: https://tavern.${SECRET_DOMAIN}/oauth2/callback
    logoutPath: /oauth2/logout
    scopes:
      - openid
      - email
      - profile
      - offline_access
    # The UI keeps XHR and websocket traffic going in the background; the
    # refresh token renews the session without a redirect those can't follow.
    refreshToken: true
