---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app sillytavern
  namespace: flux-system
spec:
  path: ./kubernetes/apps/llm/sillytavern/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: llm
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  dependsOn:
    - name: volsync
    - name: external-secrets-stores
    - name: rook-ceph-cluster
    # The chat backend it gets pointed at (Chat Completion -> Custom
    # OpenAI-compatible -> http://litellm.llm:4000/v1).
    - name: litellm
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      # Characters, chats, settings, extensions. Small, but it is the only
      # copy of all of it.
      VOLSYNC_CAPACITY: 5Gi
      # The image runs as node (1001 here, as upstream sets it).
      VOLSYNC_UID: "1001"
      VOLSYNC_GID: "1001"
