---
apiVersion: v1
kind: ConfigMap
metadata:
  name: supermemory-machine-id
data:
  # The server derives the key that encrypts its PGlite store from
  # /etc/machine-id AND the hostname (supermemoryai/supermemory#1317). Neither
  # is stable for a pod by default: debian:bookworm-slim ships no machine-id,
  # and the hostname is the pod name, which changes on every restart. Both are
  # pinned -- this file is mounted over /etc/machine-id and the HelmRelease
  # sets defaultPodOptions.hostname -- so the store unlocks on every boot.
  #
  # DO NOT CHANGE THIS VALUE. A store encrypted under one identity cannot be
  # opened under another and there is no env override for the key; the only
  # way back is a fresh store. If you must rotate it, wipe the PVC too.
  machine-id: |
    8f0c2b7e4a1d4c6f9b3e5a7d1c2e4f60
