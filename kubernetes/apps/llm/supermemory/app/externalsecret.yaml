---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name supermemory
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # One litellm VIRTUAL key on a NEW `supermemory` Bitwarden Secrets
        # Manager item, field LITELLM_API_KEY, allowed models `fast` and
        # `all-minilm`. Same reasoning as memini's: never the master key, and a
        # key of its own so it can be revoked without touching memini.
        #
        # BWS items are undiscoverable from the cluster and a MISSING FIELD
        # renders empty while the ExternalSecret still reports SecretSynced, so
        # a typo here looks healthy and fails at ingest time as a litellm 401
        # in the pod log ("[llm] ... 401" / "[embeddings] ... 401").
        #
        # The server's own bearer token (sm_...) is NOT here: it is generated
        # on first boot into /data/api-key and cannot be supplied from outside
        # (SUPERMEMORY_API_KEY is a client-side variable; a seeded file is
        # ignored, verified 2026-09-17 on 0.0.8). Read it with
        #   kubectl exec -n llm deploy/supermemory -- cat /data/api-key
        OPENAI_API_KEY: '{{ .LITELLM_API_KEY }}'
        SUPERMEMORY_EMBEDDING_API_KEY: '{{ .LITELLM_API_KEY }}'
  dataFrom:
    - extract:
        key: supermemory
