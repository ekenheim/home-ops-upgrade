---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app supermemory
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 5.2.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      # Half of the store's encryption-key derivation (the other half is
      # /etc/machine-id, see configmap.yaml). Without this the hostname is the
      # pod name, the key changes on every restart, and the server exits 1 with
      # "Could not unlock local storage". DO NOT CHANGE.
      hostname: supermemory
      securityContext:
        # 568 is the volsync template's default mover uid, so restic restores
        # land owned by the user the server runs as with no chown pass.
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      supermemory:
        annotations:
          reloader.stakater.com/auto: "true"
        # PGlite is single-writer and the lite licence is one org on one
        # machine. Keep this at 1.
        replicas: 1
        strategy: Recreate
        initContainers:
          fetch:
            # There is no container image and no source for the server:
            # upstream (supermemoryai/supermemory) is MIT for the SDKs, MCP
            # server and web app, but `supermemory-server` itself ships only as
            # a prebuilt Bun binary on the GitHub release (#1299, open since
            # 2026-07). So this fetches the pinned release into an emptyDir on
            # every pod start (~300 MB) and verifies it against the release's
            # own manifest.json before the app container may run it.
            #
            # The checksum comes from the same release rather than being
            # hardcoded here on purpose: a Renovate bump of SUPERMEMORY_VERSION
            # below would otherwise fail every start until someone updated the
            # hash by hand. Same trust root either way (GitHub over TLS).
            image:
              repository: docker.io/curlimages/curl
              tag: 8.22.0@sha256:58adaa4e8dca9c988bae2aba4ab3434a0bb2da16bbe3f92dec39ec7785166777
            env:
              # Release tags are `server-vX.Y.Z`; .github/renovate/packageRules.json5
              # carries the extractVersion that maps them onto this bare value.
              # renovate: datasource=github-releases depName=supermemoryai/supermemory
              SUPERMEMORY_VERSION: 0.0.8
            command:
              - /bin/sh
              - -ec
              - |
                B="https://github.com/supermemoryai/supermemory/releases/download/server-v$${SUPERMEMORY_VERSION}"
                cd /opt/supermemory
                curl -fsSL --retry 5 -o manifest.json "$$B/manifest.json"
                curl -fsSL --retry 5 -o supermemory-server "$$B/supermemory-server-linux-x64"
                SUM=$$(tr -d '\n' < manifest.json | sed -n 's/.*"linux-x64":[^}]*"checksum": *"\([0-9a-f]*\)".*/\1/p')
                [ -n "$$SUM" ] || { echo "no linux-x64 checksum in manifest.json"; exit 1; }
                echo "$$SUM  supermemory-server" | sha256sum -c
                chmod 0755 supermemory-server
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            # Plain glibc base: the binary links only libc/libm/libpthread/libdl
            # (alpine would need gcompat). Everything the app needs is on the
            # emptyDir the init container filled.
            image:
              repository: docker.io/library/debian
              tag: bookworm-slim@sha256:88200866dfff7ea7f5cbcb6ec7c8a701889efe6fe859fe64d6990e4b07ea4171
            command:
              - /opt/supermemory/supermemory-server
            env:
              # Root is read-only; Bun and the `~/.supermemory/env` lookup need
              # somewhere writable that is not the store.
              HOME: /tmp
              TMPDIR: /tmp
              TZ: "${TIMEZONE}"
              SUPERMEMORY_DATA_DIR: /data
              SUPERMEMORY_PORT: "6767"
              # --- Memory extraction via litellm --------------------------------
              # `fast` is ornith-35b with thinking off: the same shape memini uses
              # for assessment. Turning a document into memory rows is bulk
              # extraction, not reasoning. Upstream's default is gpt-5.1, so
              # OPENAI_MODEL must be set or every ingest 404s at litellm.
              OPENAI_BASE_URL: http://litellm.llm:4000/v1
              OPENAI_MODEL: fast
              # --- Embeddings via litellm ---------------------------------------
              # all-minilm at 384 dims, same as agentmemory and memini, served by
              # ollama-igpu behind litellm. Upstream's default is an in-process
              # Xenova/bge-base-en-v1.5 at 768d on CPU; that path is the one
              # with the open segfault-under-concurrency bug (#1320) and it
              # would pull ~1 GB of RAM per worker into this pod. Remote
              # embeddings sidestep both.
              #
              # Dims are baked into the store (the boot log prints
              # `reshaped ... → vector(384)`); changing model or dims later
              # means re-ingesting, there is no re-embed switch like memini's.
              SUPERMEMORY_EMBEDDING_PROVIDER: openai
              SUPERMEMORY_EMBEDDING_BASE_URL: http://litellm.llm:4000/v1
              SUPERMEMORY_EMBEDDING_MODEL: all-minilm
              SUPERMEMORY_EMBEDDING_DIMENSIONS: "384"
              # One document at a time through ornith. Upstream's default of 2
              # would put two ~60s extraction agents on the same llama.cpp
              # slots that hermes, dispatch and foreman share.
              SUPERMEMORY_INGEST_CONCURRENCY: "1"
              # --- Quiet, headless -----------------------------------------------
              SUPERMEMORY_DISABLE_TELEMETRY: "1"
              SUPERMEMORY_NO_UPDATE_CHECK: "1"
              SUPERMEMORY_NO_STARTUP_ANIMATION: "1"
              SUPERMEMORY_NO_COLOR: "1"
              SUPERMEMORY_NO_OPEN: "1"
            envFrom:
              - secretRef:
                  name: supermemory
            probes:
              # No /health route (404). `/` serves the built-in UI and answers
              # 200 once the store is unlocked and the listener is up.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 6767
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 6767
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 6767
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            resources:
              requests:
                cpu: 100m
                memory: 1536Mi
              limits:
                # Idle in-pod is ~1.7 GiB (Bun + PGlite ~1.6 GiB, plus the rivet
                # workflow engine it spawns as a child process ~120 MiB), and
                # ingest admits up to 1 GiB on top of that by default
                # (SUPERMEMORY_EMBEDDING_RAM_LIMIT). Measured 2026-09-17 on 0.0.8.
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    service:
      app:
        controller: *app
        ports:
          http:
            port: 6767
    ingress:
      app:
        className: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: LLM
          gethomepage.dev/name: Supermemory
          gethomepage.dev/icon: mdi-brain
          gethomepage.dev/description: Memory API (trial, next to agentmemory + memini)
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
        hosts:
          - host: "{{ .Release.Name }}.${SECRET_DOMAIN}"
            paths:
              # UI and /v3 + /v4 API share one port. Auth is skipped for
              # loopback callers only; anything arriving through the ingress or
              # the Service needs `Authorization: Bearer sm_...` (see
              # externalsecret.yaml for where that key lives).
              - path: /
                service:
                  identifier: app
                  port: http
    persistence:
      data:
        # Provisioned by ../../../../templates/volsync (claim.yaml renders a PVC
        # named ${APP}), so a rebuild restores from restic instead of starting
        # empty. The PGlite store, the generated api key and the rivet engine's
        # working files all live here.
        existingClaim: *app
        advancedMounts:
          supermemory:
            app:
              - path: /data
      bin:
        type: emptyDir
        globalMounts:
          - path: /opt/supermemory
      tmp:
        type: emptyDir
        advancedMounts:
          supermemory:
            app:
              - path: /tmp
      machine-id:
        type: configMap
        name: supermemory-machine-id
        advancedMounts:
          supermemory:
            app:
              - path: /etc/machine-id
                subPath: machine-id
                readOnly: true
