---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app supermemory
  namespace: flux-system
spec:
  path: ./kubernetes/apps/llm/supermemory/app
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: llm
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  dependsOn:
    - name: volsync
    - name: external-secrets-stores
    - name: rook-ceph-cluster
    # Memory extraction (`fast`) and embeddings (`all-minilm`) both go through
    # litellm; nothing here talks to an InferenceService or ollama directly.
    - name: litellm
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      # PGlite store plus vectors. The "lite" licence caps the store at 10k
      # documents, so this will not grow past what agentmemory/memini use.
      VOLSYNC_CAPACITY: 5Gi
