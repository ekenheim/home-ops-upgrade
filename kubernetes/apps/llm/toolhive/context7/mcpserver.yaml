---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &name context7
spec:
  groupRef:
    name: mcp-tools
  # ToolHive's own build of @upstash/context7-mcp. The npm package is baked
  # into /app/node_modules, so the `npx` entrypoint resolves locally and does
  # NOT fetch from the registry at pod start (unlike arr-mcp in downloads).
  image: ghcr.io/stacklok/dockyard/npx/context7:4.2.0@sha256:17d8bd8c7949aa35977250e6760b0136edc8dc8d6835b6f2c736a2857c42d9eb
  # HTTP, not stdio. Every 4.x release is built on MCP SDK v2, whose stdio
  # entry pins the protocol era of the FIRST client for the process lifetime.
  # toolhive multiplexes all clients onto that one stdio pipe, so once Hermes
  # (2026-07-28, direct) got there first, every 2025-11-25 health check from
  # the mcp-gateway was rejected with -32022 and context7 sat "unavailable"
  # (17k failures). The HTTP entry is stateless and classifies each request
  # on its own, so both eras are served side by side, as ha-mcp/unifi-mcp do.
  transport: streamable-http
  mcpPort: 3000
  proxyPort: 8080
  args:
    - --transport
    - http
    - --port
    - "3000"
  backendReplicas: 1
  # toolConfigRef: { name: *name }  -- off until stacklok/toolhive#6684 ships.
  # The proxy's tool-filter middleware rebuilds tools/list as {"tools":[...]}
  # and drops the 2026-07-28 resultType, so the mcp-gateway rejected every
  # health check ("Legacy-shaped body (no resultType)") once context7 spoke
  # the modern revision over HTTP. ./mcptoolconfig.yaml stays applied but
  # unreferenced; restore this ref (and the library-ID hints) when fixed.
  audit:
    enabled: true
  env:
    # toolhive enforces readOnlyRootFilesystem; npx wants a writable HOME and
    # cache even when it only resolves a local binary.
    - name: HOME
      value: /tmp
    - name: NPM_CONFIG_CACHE
      value: /tmp/.npm
  # Context7 works anonymously. Registering at context7.com/dashboard yields an
  # API key for higher rate limits. In HTTP mode the server ignores
  # CONTEXT7_API_KEY / --api-key and reads the key per request from a header
  # (Authorization: Bearer or X-Context7-Api-Key), so a key has to be injected
  # by the caller or by toolhive header forwarding, not as an env var.
  #
  # The CRD documents spec.resources as "the resource requirements for the MCP
  # server container", but on operator v0.42.0 it is applied to the toolhive
  # proxy Deployment instead — the backend StatefulSet's `mcp` container comes
  # out with resources:{}. Set both here so limits hold either way.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
