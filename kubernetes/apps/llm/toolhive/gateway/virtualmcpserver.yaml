---
# One MCP endpoint for every agent, after joryirving/home-ops:
#   http://vmcp-mcp-gateway.llm.svc.cluster.local:4483/mcp
# It aggregates every server in the mcp-tools group (tool names prefixed with
# the server, e.g. grafana_search_dashboards), and the optimizer answers a
# find-tool query by embedding similarity instead of handing an agent all
# ~250 tool schemas at once -- which a 262k local model cannot afford.
#
# Cluster-internal and unauthenticated, like the individual servers; every
# backend is read-only or scoped to what its own token allows.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: mcp-gateway
spec:
  groupRef:
    name: mcp-tools
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: discovered
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
      # kubectl-mcp's filter lives here rather than on its MCPServer, whose
      # proxy filter breaks a 2026-07-28 backend (stacklok/toolhive#6684, see
      # ../kubectl-mcp/mcpserver.yaml). Move it back when that ships.
      tools:
        - workload: kubectl-mcp
          toolConfigRef:
            name: kubectl-mcp
    optimizer:
      embeddingProvider: openai
      embeddingService: http://litellm.llm.svc.cluster.local:4000/v1
      embeddingModel: qwen3-embedding-0.6b
      # The CPU embedder needs minutes to index a few hundred tool
      # descriptions; at 180s the first session was dropped mid-index.
      # The index is built lazily by the FIRST session after a start or a
      # tool change, as one batched request (281 inputs): 1-4 min on worker3,
      # 6.5-7 min on a master. New sessions block on initialize until it is
      # done, so clients need a connect timeout above that (openclaw: 10 min).
      embeddingServiceTimeout: 600s
    operational:
      failureHandling:
        # Defaults are 30s / 10s. tradingview-mcp is a stdio bridge to
        # TradingView's hosted MCP, and every check is a modern-revision
        # initialize (400 there, it stops at 2025-11-25), the legacy retry,
        # then tools/resources/prompts lists, each a 1-7 s round trip
        # (tools/list 6.7 s on 2026-10-14). All of them succeed, yet the
        # whole check ran past 10 s: 84 "unhealthy" warnings in 24 h,
        # flapping healthy/degraded/unhealthy. 30 s fits a slow-but-healthy
        # remote; 60 s keeps the check under the interval and halves the
        # calls the checks cost the account's ~100/min limit.
        healthCheckInterval: 60s
        healthCheckTimeout: 30s
        unhealthyThreshold: 3
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-key-toolhive
                  key: api-key
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 2Gi
