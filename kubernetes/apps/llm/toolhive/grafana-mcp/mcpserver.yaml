---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/toolhive.stacklok.dev/mcpserver_v1beta1.json
# grafana/mcp-grafana, after joryirving/home-ops: dashboards, datasource
# queries (Prometheus), alert rules and deeplinks for agents. Lives in
# `observability` next to Grafana because its token generator must read
# grafana-secret, which is namespaced there. --disable-write on top of the
# Viewer role, so an agent cannot change a dashboard even if the role widens.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: grafana-mcp
spec:
  image: docker.io/grafana/mcp-grafana:1.6.3@sha256:0479c026fd40a95e6a176855b8570e06845790f8a45de2f9c1ec8ba3ba06a8bf
  transport: streamable-http
  mcpPort: 8000
  proxyPort: 8080
  args:
    - --transport
    - streamable-http
    - --address
    - 0.0.0.0:8000
    - --disable-write
    # mcp-grafana >= 1.6 rejects any Host header that is not loopback
    # (DNS-rebinding protection), and toolhive's proxy is a different pod, so
    # without this every request -- including toolhive's own initialize --
    # gets 403 while the MCPServer still reports Ready. Exact matches only, no
    # wildcards: the service and headless-service names in every DNS form.
    - --allowed-hosts
    # yamllint disable-line rule:line-length
    - localhost:8000,127.0.0.1:8000,mcp-grafana-mcp:8000,mcp-grafana-mcp.observability:8000,mcp-grafana-mcp.observability.svc:8000,mcp-grafana-mcp.observability.svc.cluster.local:8000,mcp-grafana-mcp-headless:8000,mcp-grafana-mcp-headless.observability:8000,mcp-grafana-mcp-headless.observability.svc:8000,mcp-grafana-mcp-headless.observability.svc.cluster.local:8000,grafana-mcp-0.mcp-grafana-mcp-headless.observability.svc.cluster.local:8000
  env:
    - name: GRAFANA_URL
      value: http://grafana.observability.svc.cluster.local
  secrets:
    - name: grafana-mcp
      key: GRAFANA_SERVICE_ACCOUNT_TOKEN
      targetEnvName: GRAFANA_SERVICE_ACCOUNT_TOKEN
  audit:
    enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
