apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app grafana-mcp
  namespace: flux-system
spec:
  path: ./kubernetes/apps/llm/toolhive/grafana-mcp
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # observability, not llm: the ESO Grafana generator reads grafana-secret,
  # which only exists there. toolhive's operator watches every namespace
  # (the arr MCPServer lives in downloads).
  targetNamespace: observability
  dependsOn:
    - name: toolhive
    - name: grafana
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
