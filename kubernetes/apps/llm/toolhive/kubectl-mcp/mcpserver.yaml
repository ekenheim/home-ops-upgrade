---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/toolhive.stacklok.dev/mcpserver_v1beta1.json
# kubectl-mcp-server in --read-only mode on a ServiceAccount that cannot read
# Secrets (rbac.yaml). Lets agents inspect pods, events, logs and any CR.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubectl-mcp
spec:
  groupRef:
    name: mcp-tools
  image: docker.io/rohitghumare64/kubectl-mcp-server:2.0.0@sha256:f1f57aa5d4952f3c49e4d9bb8071a143d0812bdc8253922d51eeca8a2615ea29
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  serviceAccount: kubectl-mcp
  # No toolConfigRef here while stacklok/toolhive#6684 is open: the proxy's
  # tool-filter middleware rebuilds tools/list without the 2026-07-28
  # resultType, which 2.0.0 speaks, so the mcp-gateway rejected every health
  # check ("Legacy-shaped body (no resultType)") from 2026-10-23. The gateway
  # applies ./mcptoolconfig.yaml instead (aggregation.tools in
  # ../gateway/virtualmcpserver.yaml). Direct callers of the proxy (kagent)
  # see every --read-only tool and pick theirs by name.
  audit:
    enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          # 2.0.0 refuses a non-loopback bind without OAuth. The toolhive
          # proxy is the only caller, and the CiliumNetworkPolicy
          # (toolhive/app/ciliumnetworkpolicy.yaml) admits only configured
          # callers to it, so --allow-unauthenticated. --toolsets names the
          # sets that hold the MCPToolConfig filter's tools (default is
          # core,helm, and the filter uses no helm tool).
          args:
            - --transport
            - streamable-http
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --read-only
            - --allow-unauthenticated
            - --toolsets
            - core,diagnostics,certs,cilium
          # 2.0.0's image runs as 10001 with HOME and WORKDIR /home/mcp
          # (mode 0700), but toolhive runs the pod as 1000, so the startup
          # stat of ./.env and ~/.config/kubectl-mcp-server/config.toml
          # failed with EACCES (CrashLoopBackOff, 2026-10-23). HOME and the
          # working dir go to a writable emptyDir; kubectl caches under HOME.
          workingDir: /tmp
          env:
            - name: HOME
              value: /tmp
            - name: MCP_K8S_PROVIDER
              value: in-cluster
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
