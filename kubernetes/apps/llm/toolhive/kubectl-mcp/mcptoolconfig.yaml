---
# kubectl-mcp-server 2.0.0 ships 209 tools (145 under --read-only; helm,
# kind, kubevirt, capi, ...). Through mcp-gateway every one is embedded for
# the tool-search index on each new session, and 500 tools took past the
# 180s embedding timeout on the CPU embedder (2026-09-28). This keeps the
# read-only diagnostics an agent actually reaches for; everything mutating is
# also denied by RBAC and --read-only regardless.
#
# 2.0.0 (2026-10-23) folded the per-kind getters (get_pods, get_events,
# get_configmaps, get_crds, ...) into kubectl_get, the log getters into
# kubectl_logs (`previous` for a crashed container) and the metrics getters
# into kubectl_top; get_pod_conditions, get_pod_events and
# rollout_status_tool are gone. kubectl_generic (any kubectl command) stays
# out. Each name below is in a toolset that mcpserver.yaml's --toolsets
# loads (core, diagnostics, certs, cilium).
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: kubectl-mcp
spec:
  toolsFilter:
    # core
    - kubectl_get
    - kubectl_describe
    - kubectl_logs
    - kubectl_top
    - kubectl_explain
    - get_api_resources
    - diagnose_pod_crash
    - detect_pending_pods
    # diagnostics
    - check_pod_health
    - get_evicted_pods
    - get_nodes_summary
    # certs
    - explain_cert_status
    # cilium
    - cilium_get_status
