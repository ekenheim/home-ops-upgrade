---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: &name memory-mcp
spec:
  image: ghcr.io/bjw-s-labs/mcp-memory:2026.8.31@sha256:81f1ec66d6c771a516f47705a827b6ac7400e197b4f48b487c3488ee68f2f72d
  transport: stdio
  # stdio backends serve a single client connection and cannot be scaled.
  backendReplicas: 1
  toolConfigRef:
    name: *name
  audit:
    enabled: true
  # The CRD documents spec.resources as "the resource requirements for the MCP
  # server container", but on operator v0.42.0 it is applied to the toolhive
  # proxy Deployment instead — the backend StatefulSet's `mcp` container comes
  # out with resources:{}. Set both here so limits hold either way.
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi
  podTemplateSpec:
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: *name
      containers:
        - name: mcp
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
