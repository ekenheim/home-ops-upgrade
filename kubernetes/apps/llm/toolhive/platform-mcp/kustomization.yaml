---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./mcptoolconfig.yaml
  - ./mcpserver.yaml

configMapGenerator:
  - name: platform-mcp-server
    files:
      - platform_mcp.py=./server/platform_mcp.py
    options:
      # The MCPServer references this ConfigMap by a fixed name, so the hash
      # suffix has to go. Consequence: editing the script does NOT roll the
      # backend StatefulSet on its own -- see the reloader annotation note in
      # the README.
      disableNameSuffixHash: true
