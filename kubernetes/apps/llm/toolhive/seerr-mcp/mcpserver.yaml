---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/toolhive.stacklok.dev/mcpserver_v1beta1.json
# Overseerr / Seerr requests for agents ("request Dune 2", "what is pending"),
# after joryirving/home-ops. The npm package is pinned; Jory's floats.
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: seerr-mcp
spec:
  groupRef:
    name: mcp-tools
  image: docker.io/node:26-alpine@sha256:40cd011b55415bc894e45b02fdd5a5dfde056921b7d23a64c74f80497af48797
  transport: stdio
  proxyMode: streamable-http
  proxyPort: 8080
  backendReplicas: 1
  audit:
    enabled: true
  env:
    - name: HOME
      value: /tmp
    - name: NPM_CONFIG_CACHE
      value: /tmp/.npm
    - name: SEERR_URL
      value: http://overseerr.media.svc.cluster.local:5055
  secrets:
    - name: toolhive-seerr
      key: SEERR_API_KEY
      targetEnvName: SEERR_API_KEY
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          command: ["npx"]
          args: ["-y", "@jhomen368/overseerr-mcp@2.3.1"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
