---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/toolhive.stacklok.dev/mcptoolconfig_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPToolConfig
metadata:
  name: tradingview-mcp
spec:
  # Explicit allow list of read tools, taken from the live tools/list
  # (2026-10-01, 35 tools). The docs page names them get_ohlcv etc.; the
  # server actually serves mcp-tv-* and mcp-watchlist-* names. Pins the
  # surface so the beta server cannot silently add tools, and keeps every
  # watchlist/alert write off a gateway that is anonymous.
  toolsFilter:
    # watchlists
    - mcp-watchlist-list-watchlists
    - mcp-watchlist-get-watchlist
    # Not annotated read-only: it activates the first custom watchlist when
    # none is active, and creates a default one for an account with none.
    # Harmless on this account, and it is the "my watchlist" read.
    - mcp-watchlist-get-active-watchlist
    # market data
    - mcp-tv-get-ohlcv
    - mcp-tv-get-economic-data
    - mcp-tv-get-economic-symbols
    # symbol search
    - mcp-tv-search-symbols
    # screener
    - mcp-tv-get-symbol-data
    - mcp-tv-get-symbol-data-batch
    - mcp-tv-run-screener
    - mcp-tv-get-screener-columns
    - mcp-tv-get-technicals-rating
    # news
    - mcp-tv-get-news
    - mcp-tv-get-news-story
    # fundamentals and forecasts
    - mcp-tv-get-forecasts
    - mcp-tv-get-financials
    - mcp-tv-get-financial-history
    # documents (filings, earnings call transcripts)
    - mcp-tv-get-documents
    - mcp-tv-get-document-view
    # calendars
    - mcp-tv-get-earnings-calendar
    - mcp-tv-get-economic-calendar
    - mcp-tv-get-dividends-calendar
    # alerts (read)
    - mcp-tv-list-alerts
    - mcp-tv-get-alerts
    - mcp-tv-get-alerts-log
