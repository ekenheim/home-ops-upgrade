---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# UnPoller's local UniFi account: read-only on the controller, so the MCP
# cannot change the network whatever its own settings say. Two Secrets
# because an MCPServer may reference each Secret only once.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-unifi-username
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        UNIFI_NETWORK_USERNAME: '{{ .UNPOLLER_UNIFI_USER }}'
  dataFrom:
    - extract:
        key: unifi
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# UnPoller's local UniFi account: read-only on the controller, so the MCP
# cannot change the network whatever its own settings say. Two Secrets
# because an MCPServer may reference each Secret only once.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-unifi-password
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        UNIFI_NETWORK_PASSWORD: '{{ .UNPOLLER_UNIFI_PASS }}'
  dataFrom:
    - extract:
        key: unifi
