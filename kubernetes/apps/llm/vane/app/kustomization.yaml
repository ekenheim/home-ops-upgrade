---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ciliumnetworkpolicy.yaml
  - ./helmrelease.yaml
  - ./securitypolicy.yaml
  - ../../../../templates/volsync
  - ../../../../templates/gatus/guarded
configMapGenerator:
  - name: vane-seed
    files:
      - ./resources/seed.mjs
generatorOptions:
  disableNameSuffixHash: true
