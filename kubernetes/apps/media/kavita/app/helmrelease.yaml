---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kavita
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: storage
  values:
    controllers:
      kavita:
        labels:
          nfsMount: "true"
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            # kizaing/kavita stopped publishing at 0.7.8 (2024-01); upstream
            # now pushes the same multi-arch index to docker.io/jvmilazz0/kavita
            # and ghcr.io/kareadita/kavita (digest sha256:31181a32... on both,
            # 2026-10-19). Image tag 0.9.1 is GitHub release v0.9.1.4.
            # Every release since 0.7.9 runs one-way DB migrations on start
            # (0.7.8 -> 0.9.1 crosses the 0.8.0 rewrite). The old image cannot
            # open a migrated kavita.db: roll back with a VolSync restore, not
            # a tag. packageRules.json5 keeps Renovate bumps here hand-merged.
            # No probes on purpose: the migrations run before port 5000 opens,
            # and a probe that kills the pod mid-migration corrupts the DB.
            image:
              repository: ghcr.io/kareadita/kavita
              tag: 0.9.1@sha256:31181a32f0dda73cae68721867028a7253d57881b58bea5754cd9e578e75421a
            env:
              TZ: ${TIMEZONE}
            resources:
              requests:
                cpu: 15m
                memory: 300Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: *app
        ports:
          http:
            port: 5000
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Books"
          gethomepage.dev/name: "Kavita"
          gethomepage.dev/icon: "kavita.png"
          gethomepage.dev/description: "Comic/Ebook Web Reader"
          gethomepage.dev/widget.type: "kavita"
          gethomepage.dev/widget.url: "http://kavita.media:5000"
          gethomepage.dev/widget.username: '{{ `{{HOMEPAGE_VAR_KAVITA_USERNAME}}` }}'
          gethomepage.dev/widget.password: '{{ `{{HOMEPAGE_VAR_KAVITA_PASSWORD}}` }}'
        hostnames: ["comics.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 5000
    persistence:
      config:
        existingClaim: *app
        globalMounts:
          # The official image still reads /kavita/config (0.9.1 docs:
          # "/kavita/config must not be changed"). /config is only the
          # LinuxServer.io image's path.
          - path: /kavita/config
      data:
        type: nfs
        server: ${NAS_IP:=temp}
        path: ${SECRET_NFS_DATA:=temp}
        globalMounts:
          - path: /data
