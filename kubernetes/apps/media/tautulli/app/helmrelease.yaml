---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tautulli
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.2.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: volsync
      namespace: storage
  values:
    controllers:
      tautulli:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/tautulli/tautulli
              tag: v2.18.1@sha256:7feb72192d5f477f2e4e28ed6b871b57478aff693c279462577cb4dad16556de
            env:
              TZ: ${TIMEZONE}
            command: ["/usr/local/bin/python", "Tautulli.py"]
            args: [
              "--config", "/config/config.ini",
              "--datadir", "/config",
              "--port", "80"
            ]
            # NFS stale-handle watchdog: see posterizarr helmrelease for context.
            # Tautulli's notify script writes trigger files into /config/watcher;
            # if the mount goes stale every Plex addition silently fails with
            # OSError 116 and posters never get generated.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/bin/sh", "-c", "test -d /config/watcher"]
                  initialDelaySeconds: 60
                  periodSeconds: 60
                  timeoutSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 20m
                memory: 100M
              limits:
                memory: 250M
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 140
        fsGroup: 150
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: 80
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Video"
          gethomepage.dev/name: "Tautulli"
          gethomepage.dev/icon: "tautulli.png"
          gethomepage.dev/description: "Plex Stream Monitoring"
          gethomepage.dev/widget.type: "tautulli"
          gethomepage.dev/widget.url: "http://tautulli.media"
          gethomepage.dev/widget.key: '{{ `{{HOMEPAGE_VAR_TAUTULLI_TOKEN}}` }}'
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: 80
    persistence:
      config:
        existingClaim: *app
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/logs
      tmp:
        type: emptyDir
      posterizarr-watcher-script:
        type: configMap
        name: posterizarr-watcher
        globalMounts:
          - path: /scripts
      cache:
        existingClaim: tautulli-cache
        globalMounts:
          - path: /config/cache
      posterizarr-watcher:
        # Mount the export root and reach the directory through subPath, like
        # every other NAS consumer here. Mounting the ppm directories
        # themselves made a deep directory the NFS mount root; Unraid's FUSE
        # layer drops its handle every ~15 min and a stale mount ROOT cannot be
        # re-resolved, so the pod died. Through the root it is re-walked by name.
        type: nfs
        server: ${NAS_IP:=temp}
        path: ${SECRET_NFS_DATA:=temp}
        globalMounts:
        - path: /config/watcher
          subPath: Media/ppm/watcher
      assets:
        type: nfs
        server: ${NAS_IP:=temp}
        path: ${SECRET_NFS_DATA:=temp}
        globalMounts:
        - path: /assets
          subPath: Media/ppm/assets

