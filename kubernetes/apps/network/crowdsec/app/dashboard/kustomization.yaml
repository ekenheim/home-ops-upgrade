# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# grafana.com 21419 rev 6 ("CrowdSec Metrics"), vendored 2026-10-27: upstream
# filters every panel on one pod-IP $instance, but agent, LAPI and AppSec
# each export a different part of the metrics and every rollout adds a new
# IP. Panels match the three containers instead; process stats per container.
configMapGenerator:
  - name: crowdsec-dashboard
    files:
      - crowdsec.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
    grafana_folder: Network
  labels:
    grafana_dashboard: "true"
