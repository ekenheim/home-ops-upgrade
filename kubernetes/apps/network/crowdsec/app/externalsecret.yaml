---
# The envoy bouncer's LAPI API key, generated in-cluster (no Bitwarden item).
# LAPI's start script registers a bouncer named ENVOY from BOUNCER_KEY_ENVOY,
# and the bouncer reads the same key. The script skips a name that already
# exists, so if this key is ever regenerated, run `cscli bouncers delete
# ENVOY` on the LAPI pod and restart it.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: crowdsec-bouncer-key
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://lds-schemas-5hg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name crowdsec-bouncer-key
spec:
  # CreatedOnce: generate the key once. OnChange also regenerates it when the
  # ExternalSecret's labels or annotations change. On 2026-10-25 a Flux pass
  # that touched every ExternalSecret did that; LAPI kept the old key and
  # locked the bouncer out (403). Deleting the Secret still makes a new key.
  refreshPolicy: CreatedOnce
  refreshInterval: "0"
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        BOUNCER_KEY_ENVOY: '{{ .password }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: crowdsec-bouncer-key
