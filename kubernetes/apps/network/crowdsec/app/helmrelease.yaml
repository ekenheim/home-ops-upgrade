---
# yaml-language-server: $schema=https://lds-schemas-5hg.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: crowdsec
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: crowdsec
  install:
    # The chart schema only knows the k8s-audit source, not kubernetes.
    disableSchemaValidation: true
    remediation:
      retries: -1
  upgrade:
    disableSchemaValidation: true
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # The default (docker) mounts /var/lib/docker/containers into the agent.
    container_runtime: containerd
    image:
      repository: mirror.gcr.io/crowdsecurity/crowdsec
    lapi:
      env:
        - name: USE_WAL
          value: "true"
        # Local-only: no signal sharing with CrowdSec's central API, so no
        # community blocklist and no console. See README.
        - name: DISABLE_ONLINE_API
          value: "true"
      # BOUNCER_KEY_ENVOY registers the envoy bouncer (externalsecret.yaml).
      # No Reloader annotation. A restart never changes an existing bouncer's
      # key, and the start script registers every env var matching
      # BOUNCER_KEY, so Reloader's STAKATER_CROWDSEC_BOUNCER_KEY_SECRET became
      # a bouncer of its own.
      envFrom:
        - secretRef:
            name: crowdsec-bouncer-key
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 512Mi
      metrics:
        serviceMonitor:
          enabled: true
    agent:
      isDeployment: true
      hostVarLog: false
      serviceAccountName: crowdsec-agent
      additionalAcquisition:
        - source: kubernetes
          namespace: network
          selector: gateway.envoyproxy.io/owning-gateway-name=envoy-external
          labels:
            type: envoy
      env:
        # plex is only an allowlist: it stops Plex's metadata/transcode
        # request bursts on the public plex route from tripping the crawl
        # scenarios.
        - name: COLLECTIONS
          value: yanis-kouidri/envoy crowdsecurity/plex
        # A parser, not a collection: drops RFC1918 sources (LAN, pods).
        - name: PARSERS
          value: crowdsecurity/whitelists
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 512Mi
      metrics:
        serviceMonitor:
          enabled: true
    # WAF: the bouncer sends each request on the hosts in its config.waf.routes
    # here before letting it through, and a matching rule blocks it inline,
    # on the first request rather than after a pattern builds up in the logs.
    # appsec-default = crowdsecurity/base-config + the virtual-patching
    # (vpatch-*, one rule per known CVE) and generic rules, all in-band. No
    # OWASP CRS: it is broad and false-positive prone on CMS traffic.
    appsec:
      enabled: true
      acquisitions:
        - source: appsec
          listen_addr: "0.0.0.0:7422"
          path: /
          appsec_config: crowdsecurity/appsec-default
          labels:
            type: appsec
      env:
        - name: COLLECTIONS
          value: crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-generic-rules
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      metrics:
        serviceMonitor:
          enabled: true
    config:
      parsers:
        s02-enrich:
          # crowdsecurity/whitelists covers RFC1918 but not Tailscale.
          tailscale-whitelist.yaml: |
            name: home-ops/tailscale-whitelist
            description: "Whitelist the Tailscale CGNAT range"
            whitelist:
              reason: "tailscale"
              cidr:
                - "100.64.0.0/10"
