---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Envoy ext_authz bouncer (kdwils/envoy-proxy-bouncer): envoy-external asks it
# about every request (securitypolicy.yaml) and it answers from LAPI's
# decisions, pulled every 10s. Client IP: the rightmost X-Forwarded-For entry
# outside trustedProxies, so Cloudflare traffic resolves to the real client
# (cloudflared's pod address is skipped) and a forged leading XFF entry is
# ignored. LAN clients resolve to their private address, which LAPI never
# bans (crowdsecurity/whitelists).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app crowdsec-bouncer
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: crowdsec-bouncer
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: *app
    podAnnotations:
      secret.reloader.stakater.com/reload: crowdsec-bouncer-key
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        # On the hot path of every public request; the chart's 100m would
        # throttle it under a scan.
        cpu: 500m
        memory: 256Mi
    config:
      trustedProxies:
        - ${CLUSTER_CIDR}
      bouncer:
        lapiURL: http://crowdsec-service.network.svc.cluster.local:8080
        metrics: true
        apiKeySecretRef:
          name: crowdsec-bouncer-key
          key: BOUNCER_KEY_ENVOY
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
