---
# yaml-language-server: $schema=https://lds-schemas-5hg.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Envoy ext_authz bouncer (kdwils/envoy-proxy-bouncer): envoy-external asks it
# about every request (securitypolicy.yaml) and it answers from LAPI's
# decisions, pulled every 10s. Client IP: the rightmost X-Forwarded-For entry
# outside trustedProxies, so Cloudflare traffic resolves to the real client
# (cloudflared's pod address is skipped) and a forged leading XFF entry is
# ignored. LAN clients resolve to their private address, which LAPI never
# bans (crowdsecurity/whitelists).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app crowdsec-bouncer
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: crowdsec-bouncer
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: *app
    podAnnotations:
      secret.reloader.stakater.com/reload: crowdsec-bouncer-key
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        # On the hot path of every public request; the chart's 100m would
        # throttle it under a scan.
        cpu: 500m
        memory: 256Mi
    config:
      trustedProxies:
        - ${CLUSTER_CIDR}
      bouncer:
        lapiURL: http://crowdsec-service.network.svc.cluster.local:8080
        metrics: true
        apiKeySecretRef:
          name: crowdsec-bouncer-key
          key: BOUNCER_KEY_ENVOY
      # CrowdSec AppSec (app/helmrelease.yaml `appsec`), authenticated with
      # the same LAPI key. With routes set, a host matching none of them is
      # allowed without inspection, so this is the WAF's scope: public apps
      # with logins, admin panels or dynamic backends. Left out: plex
      # (streaming volume), s3 (pgBackRest), flux-webhook, status/kromgo, and
      # the private-CIDR-only routes (comics, rybbit-main).
      # Headers, URI and query only: Envoy Gateway 1.9.2 can forward bodies
      # (extAuth.bodyToExtAuth) but answers 413 to anything over the buffer,
      # failOpen or not, which would break uploads. Body inspection is a
      # per-route decision for later.
      waf:
        enabled: true
        appSecURL: http://crowdsec-appsec-service.network.svc.cluster.local:7422
        apiKeySecretRef:
          name: crowdsec-bouncer-key
          key: BOUNCER_KEY_ENVOY
        httpTimeout: 2s
        # On a WAF error or timeout the request passes; LAPI bans still apply.
        failOpen: true
        routes:
          - hosts:
              - strapi.${SECRET_DOMAIN}
              - sso.${SECRET_DOMAIN}
              - grafana.${SECRET_DOMAIN}
              - hass.${SECRET_DOMAIN}
              - requests.${SECRET_DOMAIN}
              - join.${SECRET_DOMAIN}
              - hempriser.${SECRET_DOMAIN}
              - blog.${SECRET_DOMAIN}
              - ${SECRET_SECONDARY_DOMAIN}
              - www.${SECRET_SECONDARY_DOMAIN}
            path: /
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
