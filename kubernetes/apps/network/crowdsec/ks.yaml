---
# yaml-language-server: $schema=https://lds-schemas-5hg.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app crowdsec
  namespace: flux-system
spec:
  targetNamespace: network
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # The bouncer key is a generated ExternalSecret.
    - name: external-secrets-stores
    # LAPI keeps its database and config on ceph-block PVCs.
    - name: rook-ceph-cluster
  path: ./kubernetes/apps/network/crowdsec/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
# yaml-language-server: $schema=https://lds-schemas-5hg.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app crowdsec-web-ui
  namespace: flux-system
spec:
  targetNamespace: network
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # Registers against LAPI with the chart's crowdsec-lapi-secrets token.
    - name: crowdsec
    - name: rook-ceph-cluster
  path: ./kubernetes/apps/network/crowdsec/web-ui
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: crowdsec
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
# yaml-language-server: $schema=https://lds-schemas-5hg.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app crowdsec-bouncer
  namespace: flux-system
spec:
  targetNamespace: network
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # LAPI must have registered the ENVOY bouncer key first.
    - name: crowdsec
  path: ./kubernetes/apps/network/crowdsec/bouncer
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  wait: false # no flux ks dependents
  interval: 30m
  retryInterval: 1m
  timeout: 5m
