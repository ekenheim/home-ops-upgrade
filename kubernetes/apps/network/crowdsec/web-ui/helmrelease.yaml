---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
#
# CrowdSec Web UI: alerts with their evidence, decisions and the agent/LAPI
# metrics, read from our LAPI. Read-only (CONFIG_UI_READ_ONLY) and no update
# check, so it makes no outbound calls of its own.
#
# NO LOGIN OF ITS OWN (CONFIG_AUTH_ENABLED=false). The Authentik OIDC
# SecurityPolicy on the HTTPRoute (securitypolicy.yaml) signs people in, and
# a CiliumNetworkPolicy lets only envoy-internal reach the pod, so nothing in
# the cluster can go around the sign-in to the Service.
#
# LAPI login: the register init container signs up as a LAPI machine with the
# chart's auto-registration token, the same way the agent does (auto-validated,
# no cscli machines add). The credentials are kept on the PVC, so a restart
# reuses them. If the PVC is ever lost, LAPI refuses to register the name a
# second time: `cscli machines delete crowdsec-web-ui` on the LAPI pod, then
# restart this one.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app crowdsec-web-ui
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      crowdsec-web-ui:
        strategy: Recreate
        initContainers:
          register:
            image:
              repository: mirror.gcr.io/crowdsecurity/crowdsec
              tag: v1.8.2@sha256:65b74942f7e7ed5c60fde4ac15fc4ba715904c398c8b16dd451f4907d90347d4
            command:
              - sh
              - -ec
              - |-
                mkdir -p /app/data/lapi
                [ -s /app/data/lapi/credentials.yaml ] || cscli -c /staging/etc/crowdsec/config.yaml lapi register \
                  --machine "$MACHINE" --url "$LAPI_URL" --token "$REGISTRATION_TOKEN" --file /app/data/lapi/credentials.yaml
                yq -r .password /app/data/lapi/credentials.yaml > /app/data/lapi/password
            env:
              LAPI_URL: &lapi http://crowdsec-service.network.svc.cluster.local:8080
              MACHINE: &machine crowdsec-web-ui
              REGISTRATION_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: crowdsec-lapi-secrets
                    key: registrationToken
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
        containers:
          app:
            image:
              repository: ghcr.io/theduffman85/crowdsec-web-ui
              tag: 2026.10.13@sha256:3b7d608ea3fb1d8ecf12079c188f9a8c705c89cf03685db4a1b89303d8e17477
            env:
              TZ: ${TIMEZONE}
              CONFIG_AUTH_ENABLED: "false"
              CONFIG_UI_READ_ONLY: "true"
              CONFIG_UPDATES_ENABLED: "false"
              CONFIG_SERVER_PORT: &port 3000
              CONFIG_INSTANCE_LAPI_URL: *lapi
              CONFIG_INSTANCE_LAPI_AUTH_USERNAME: *machine
              CONFIG_INSTANCE_LAPI_AUTH_PASSWORD_FILE: /app/data/lapi/password
              CONFIG_INSTANCE_METRICS_0_NAME: LAPI
              CONFIG_INSTANCE_METRICS_0_URL: http://crowdsec-service.network.svc.cluster.local:6060/metrics
              CONFIG_INSTANCE_METRICS_1_NAME: Agent
              CONFIG_INSTANCE_METRICS_1_URL: http://crowdsec-agent-service.network.svc.cluster.local:6060/metrics
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness: *probe
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        hostnames: ["crowdsec.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: *port
    persistence:
      data:
        # SQLite (alert/decision history, 7-day lookback) and the LAPI
        # credentials. Rebuilt from LAPI if lost, so no VolSync.
        type: persistentVolumeClaim
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /app/data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      cscli:
        # cscli needs a writable data dir.
        type: emptyDir
        advancedMounts:
          crowdsec-web-ui:
            register:
              - path: /var/lib/crowdsec/data
