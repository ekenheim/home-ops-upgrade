---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  # envoy-gateway's own CRDs live in the chart's crds/ dir, which Helm only
  # ever creates; CreateReplace is what upgrades them on a chart bump. The same
  # dir bundles the Gateway API CRDs, which the gateway-api-crds Kustomization
  # owns and re-asserts every 10m. Keep apps/istio-system/gateway-api/crds.yaml
  # on the bundle version this chart ships (v1.9.1 -> v1.6.1) so the two agree.
  # (The standalone gateway-crds-helm chart would avoid the overlap, but its
  # Helm release Secret is over the 1MiB limit and cannot install.)
  install:
    crds: CreateReplace
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    crds:
      gatewayAPI:
        # Denies standard -> experimental CRD moves; already patched out of the
        # gateway-api-crds bundle for the same reason.
        safeUpgradePolicy:
          enabled: false
    config:
      envoyGateway:
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              # Proxy pods and their LoadBalancer Services land next to the
              # Gateway (network) instead of in the controller namespace.
              type: GatewayNamespace
    deployment:
      replicas: 2
      pod:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            # Not DoNotSchedule: with worker4 tainted that wedges rollouts
            # (same failure cloudflared and pgbouncer had).
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                control-plane: envoy-gateway
    global:
      imageRegistry: mirror.gcr.io
