---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway-crds
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: envoy-gateway-crds
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    crds:
      # Owned by the gateway-api-crds Kustomization (apps/istio-system/gateway-api),
      # which Istio also depends on. Two owners would fight over them.
      gatewayAPI:
        enabled: false
      envoyGateway:
        enabled: true
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  dependsOn:
    - name: envoy-gateway-crds
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # The chart's crds subchart bundles the Gateway API CRDs with no way to
    # leave them out; all CRDs come from envoy-gateway-crds above instead.
    crds:
      enabled: false
    config:
      envoyGateway:
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              # Proxy pods and their LoadBalancer Services land next to the
              # Gateway (network) instead of in the controller namespace.
              type: GatewayNamespace
    deployment:
      replicas: 2
      pod:
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            # Not DoNotSchedule: with worker4 tainted that wedges rollouts
            # (same failure cloudflared and pgbouncer had).
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                control-plane: envoy-gateway
    global:
      imageRegistry: mirror.gcr.io
