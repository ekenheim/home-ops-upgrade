---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app external-dns
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: 1.22.0
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values:
    # external-dns has no leader election, so two replicas would race on the
    # same records. Chart 1.22.0 made that explicit: values.schema.json caps
    # replicaCount at 1 and the Deployment template fails on anything higher.
    # 1.21.1 hardcoded `replicas: 1`, so the previous `2` was silently ignored
    # and this is what has always actually run.
    replicaCount: 1
    fullnameOverride: *app
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: &secret external-dns-secret
            key: api-token
    extraArgs:
      # external-dns v0.22.0 (chart 1.22.0) changed the default annotation
      # prefix to external-dns.kubernetes.io/ with NO fallback to the alpha
      # prefix every Ingress/Service in this repo still uses. Without this
      # flag the target/hostname annotations are invisible: on 2026-09-14 it
      # deleted 12 CNAMEs (blog, harbor, hempriser, rybbit, strapi, ...) and
      # then failed to replace them with proxied A records to 192.168.50.153.
      - --annotation-prefix=external-dns.alpha.kubernetes.io/
      - --cloudflare-dns-records-per-page=1000
      - --cloudflare-proxied
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --events
      - --ignore-ingress-tls-spec
      - --ingress-class=external
    policy: sync
    sources: ["crd", "ingress"]
    txtPrefix: k8s.
    txtOwnerId: homelab
    domainFilters:
      - "${SECRET_DOMAIN}"
      - "${SECRET_SECONDARY_DOMAIN}"
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
