---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/tailscale.com/connector_v1alpha1.json
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: pitower
spec:
  # Two replicas advertising the same routes give HA subnet routing and exit
  # node failover (https://tailscale.com/kb/1115/high-availability). hostname
  # is not allowed above one replica; devices are pitower-0 and pitower-1.
  replicas: 2
  hostnamePrefix: pitower-
  proxyClass: connector
  subnetRouter:
    advertiseRoutes:
      - ${CLUSTER_CIDR}    # 10.42.0.0/16 for Kubernetes pods
      - ${SERVICE_CIDR}    # 10.43.0.0/16 for Kubernetes services
      - ${NODE_CIDR}       # 192.168.50.0/24 for nodes
      - 192.168.1.0/24
  exitNode: true
