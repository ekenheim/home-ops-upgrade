---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app lingarr-exporter
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      lingarr-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            # Same json_exporter as minimax-quota-exporter.
            image:
              repository: ghcr.io/prometheus-community/json-exporter
              tag: v0.8.0@sha256:3aad20d41a0b31dfaaf7ab1a091440e92a82a61ef68b76750eac0ad50a983652
            args:
              - --config.file=/config/config.yml
              - --web.listen-address=:7979
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
    service:
      app:
        controller: *app
        ports:
          http:
            port: 7979
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: http
            scheme: http
            path: /probe
            interval: 1m
            scrapeTimeout: 30s
            params:
              module: [lingarr_stats]
              target: [http://lingarr.downloads.svc.cluster.local:9876/api/statistics]
          - port: http
            scheme: http
            path: /probe
            interval: 1m
            scrapeTimeout: 30s
            params:
              module: [lingarr_active]
              target: [http://lingarr.downloads.svc.cluster.local:9876/api/translationrequest/active]
    persistence:
      config:
        type: configMap
        name: lingarr-exporter-config
        globalMounts:
          - path: /config
            readOnly: true
