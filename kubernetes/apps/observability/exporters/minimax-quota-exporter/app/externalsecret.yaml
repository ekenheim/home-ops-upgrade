---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name minimax-quota-exporter-secret
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 15m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # The same MiniMax Token Plan key LiteLLM uses (field on the `litellm`
        # Bitwarden item, see ../../../../llm/litellm/app/externalsecret.yaml).
        # The remains endpoint reports the quota of the key that calls it, so
        # this must be the plan key the gateway spends from, not a second one.
        # `index` renders "" if the field is missing: the probe then gets 401,
        # `up` goes to 0 and MiniMaxQuotaExporterDown fires instead of the
        # whole Kustomization going unhealthy.
        MINIMAX_API_KEY: '{{ index . "MINIMAX_API_KEY" }}'
  dataFrom:
    - extract:
        key: litellm
