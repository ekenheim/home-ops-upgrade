---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app nut-exporter
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    controllers:
      nut-exporter:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/druggeri/nut_exporter
              tag: 3.3.0@sha256:276460d141c732772f8b1fcd785a7de272473e6d39fd85c32b163efc2999cb9a
            env:
              TZ: ${TIMEZONE}
              # The NAS (Unraid NUT plugin, upsd 2.8.5 on :3493, anonymous reads)
              # by IP: `nas.internal` stopped resolving, which is why this was
              # off from 2026-03-29 (680fbb373) until 2026-10-18.
              NUT_EXPORTER_SERVER: ${NAS_IP}
              # Riello VSD 2200 over SNMP (snmp-ups, ietf MIB). It has no
              # ups.realpower and reports every *.nominal as 0, so ups.load (%)
              # can't be turned into watts: output.realpower is the UPS's own
              # wattmeter and is what Kromgo and the Kepler dashboard read.
              # An env var rather than `--nut.vars_enable="..."` in args: there
              # the quotes were literal, glued to the first and last names, and
              # those two were silently dropped.
              NUT_EXPORTER_VARIABLES: battery.charge,battery.runtime,battery.voltage,battery.temperature,input.voltage,output.voltage,output.current,output.realpower,ups.load,ups.status
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
            # No CPU limit: it uses about 1m, but the 50m limit throttled each
            # scrape's short burst, so CPUThrottlingHigh fired.
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 100Mi
    service:
      app:
        controller: *app
        ports:
          metrics:
            enabled: true
            protocol: TCP
            port: 9199
