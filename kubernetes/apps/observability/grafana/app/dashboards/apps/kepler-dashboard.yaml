---
# Kepler power dashboard (apps/kube-tools/kepler). Hand-written rather than the
# upstream compose dashboard: that one is built around per-process and VM
# series, which this install does not export (metricsLevel: node, pod,
# container). Every Kepler query pins zone="package"; zones overlap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kepler-grafana-dashboard
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: System
data:
  kepler_dashboard.json: |
    {
      "title": "Kepler",
      "uid": "keplerPower",
      "description": "CPU power per node, namespace and pod from Kepler (RAPL package zone), with worker4's iGPU alongside.",
      "tags": [
        "kepler",
        "power"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "hide": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Cluster CPU power",
          "description": "RAPL package zone, summed over every node Kepler runs on.",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum(kepler_node_cpu_watts{zone=\"package\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "worker4 iGPU power",
          "description": "amdgpu hwmon from node-exporter. Kepler does not attribute AMD GPU power to pods.",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum(node_hwmon_power_average_watt{kubernetes_node=\"worker4\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "CPU energy, last 24h",
          "description": "",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "kwatth",
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum(increase(kepler_node_cpu_joules_total{zone=\"package\"}[24h])) / 3600000",
              "legendFormat": "",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Attributed to pods",
          "description": "Share of package power Kepler assigns to pods; the rest is idle and host processes.",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum(rate(kepler_pod_cpu_joules_total{zone=\"package\"}[5m])) / sum(rate(kepler_node_cpu_joules_total{zone=\"package\"}[5m]))",
              "legendFormat": "",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "CPU package power by node",
          "description": "",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum by (node_name) (kepler_node_cpu_watts{zone=\"package\"})",
              "legendFormat": "{{node_name}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Cross-check: node-exporter RAPL",
          "description": "The same powercap counters read by node-exporter. Should track the panel to the left.",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum by (kubernetes_node) (rate(node_rapl_package_joules_total[5m]))",
              "legendFormat": "{{kubernetes_node}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Power by namespace",
          "description": "",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 30,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum by (pod_namespace) (rate(kepler_pod_cpu_joules_total{zone=\"package\"}[5m]))",
              "legendFormat": "{{pod_namespace}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Idle vs active by node",
          "description": "",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 22
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum by (node_name) (kepler_node_cpu_idle_watts{zone=\"package\"})",
              "legendFormat": "{{node_name}} idle",
              "refId": "A"
            },
            {
              "datasource": "${datasource}",
              "expr": "sum by (node_name) (kepler_node_cpu_active_watts{zone=\"package\"})",
              "legendFormat": "{{node_name}} active",
              "refId": "B"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "worker4 iGPU (amdgpu hwmon)",
          "description": "llama.cpp on worker4 runs here. Not part of the RAPL CPU numbers above.",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 22
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "node_hwmon_power_average_watt{kubernetes_node=\"worker4\"}",
              "legendFormat": "{{chip}} {{sensor}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 10,
          "type": "table",
          "title": "Top pods (package power, 5m)",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 30
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Value",
                "desc": true
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value": "Watts"
                }
              }
            }
          ],
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "topk(20, sum by (pod_namespace, pod_name, node_name) (rate(kepler_pod_cpu_joules_total{zone=\"package\"}[5m])))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ]
        }
      ]
    }
