---
# Kepler power dashboard (apps/kube-tools/kepler). Hand-written rather than the
# upstream compose dashboard: that one is built around per-process and VM
# series, which this install does not export (metricsLevel: node, pod,
# container). Every Kepler query pins zone="package"; zones overlap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kepler-grafana-dashboard
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: System
data:
  kepler_dashboard.json: |
    {
      "title": "Kepler",
      "uid": "keplerPower",
      "description": "Package power per node, namespace and pod from Kepler (RAPL package zone; worker4's is CPU+iGPU), worker4 J/token, and the UPS total.",
      "tags": [
        "kepler",
        "power"
      ],
      "schemaVersion": 39,
      "version": 2,
      "editable": true,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "hide": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Cluster package power",
          "description": "RAPL package zone, summed over every node Kepler runs on. worker4's package is its whole APU socket, so this includes its iGPU (llama.cpp) as well.",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum(kepler_node_cpu_watts{zone=\"package\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "worker4 socket power (amdgpu PPT)",
          "description": "amdgpu hwmon power1_average from node-exporter. On an APU this is the SMU's socket PPT, the same quantity as worker4's RAPL package (CPU+iGPU), not the iGPU alone: a cross-check, not an addition to the panels above.",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum(node_hwmon_power_average_watt{kubernetes_node=\"worker4\"})",
              "legendFormat": "",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Package energy, last 24h",
          "description": "",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "kwatth",
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum(increase(kepler_node_cpu_joules_total{zone=\"package\"}[24h])) / 3600000",
              "legendFormat": "",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Attributed to pods",
          "description": "Share of package power Kepler assigns to pods; the rest is idle and host processes. Reads low on worker4, whose package includes iGPU work Kepler can't attribute.",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum(rate(kepler_pod_cpu_joules_total{zone=\"package\"}[5m])) / sum(rate(kepler_node_cpu_joules_total{zone=\"package\"}[5m]))",
              "legendFormat": "",
              "refId": "A"
            }
          ]
        },
        {
          "id": 11,
          "type": "stat",
          "title": "worker4 J/token",
          "description": "worker4 package energy (CPU+iGPU, the whole APU) per generated token, across the llama.cpp servers on worker4. Prompt processing is in the joules but not in the tokens, so long prompts raise it. Empty while nothing is generating.",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: J/token",
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum(rate(kepler_node_cpu_joules_total{node_name=\"worker4\",zone=\"package\"}[5m])) / (sum(rate(llamacpp:tokens_predicted_total[5m]) * on (namespace, pod) group_left () max by (namespace, pod) (kube_pod_info{node=\"worker4\"})) > 0.1)",
              "legendFormat": "",
              "refId": "A"
            }
          ]
        },
        {
          "id": 12,
          "type": "stat",
          "title": "Idle floor (24h)",
          "description": "Lowest 5-minute average package power per node over the last 24h, from node-exporter's RAPL counters (no Kepler scrape gaps). worker4's includes the iGPU.",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 4,
            "w": 12,
            "x": 6,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "worker4"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "worker4 CPU+iGPU (APU socket)"
                  }
                ]
              }
            ]
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "min_over_time((sum by (kubernetes_node) (rate(node_rapl_package_joules_total[5m])))[24h:5m])",
              "legendFormat": "{{kubernetes_node}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 13,
          "type": "stat",
          "title": "UPS output (whole rack)",
          "description": "output.realpower from the Riello UPS via nut-exporter: everything on the UPS (nodes, NAS, network), measured at the UPS, so it includes PSU losses, disks and NICs that RAPL never sees.",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 4
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum(network_ups_tools_output_realpower)",
              "legendFormat": "",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Package power by node",
          "description": "worker4's package is the APU socket: CPU and iGPU together.",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "showPoints": "never"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "worker4"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "worker4 CPU+iGPU (APU socket)"
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum by (node_name) (kepler_node_cpu_watts{zone=\"package\"})",
              "legendFormat": "{{node_name}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Cross-check: node-exporter RAPL",
          "description": "The same powercap counters read by node-exporter. Should track the panel to the left.",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "showPoints": "never"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "worker4"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "worker4 CPU+iGPU (APU socket)"
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum by (kubernetes_node) (rate(node_rapl_package_joules_total[5m]))",
              "legendFormat": "{{kubernetes_node}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Power by namespace",
          "description": "",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 30,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum by (pod_namespace) (rate(kepler_pod_cpu_joules_total{zone=\"package\"}[5m]))",
              "legendFormat": "{{pod_namespace}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Idle vs active by node",
          "description": "Kepler's split of package power by CPU utilisation. It is modelled, not measured: idle can exceed the node's actual total. For the real floor see the Idle floor stat.",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 26
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum by (node_name) (kepler_node_cpu_idle_watts{zone=\"package\"})",
              "legendFormat": "{{node_name}} idle",
              "refId": "A"
            },
            {
              "datasource": "${datasource}",
              "expr": "sum by (node_name) (kepler_node_cpu_active_watts{zone=\"package\"})",
              "legendFormat": "{{node_name}} active",
              "refId": "B"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "worker4 socket power, amdgpu vs RAPL",
          "description": "amdgpu's power1_average (the SMU's socket PPT) against worker4's RAPL package. Both are the whole APU, CPU+iGPU: they should overlap. Not additive.",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 26
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "node_hwmon_power_average_watt{kubernetes_node=\"worker4\"}",
              "legendFormat": "amdgpu PPT ({{chip}} {{sensor}})",
              "refId": "A"
            },
            {
              "datasource": "${datasource}",
              "expr": "sum(rate(node_rapl_package_joules_total{kubernetes_node=\"worker4\"}[5m]))",
              "legendFormat": "RAPL package",
              "refId": "B"
            }
          ]
        },
        {
          "id": 10,
          "type": "table",
          "title": "Top pods (package power, 5m)",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 34
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Value",
                "desc": true
              }
            ]
          },
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value": "Watts"
                }
              }
            }
          ],
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "topk(20, sum by (pod_namespace, pod_name, node_name) (rate(kepler_pod_cpu_joules_total{zone=\"package\"}[5m])))",
              "legendFormat": "",
              "refId": "A",
              "instant": true,
              "range": false,
              "format": "table"
            }
          ]
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "worker4 J/token over time",
          "description": "worker4 package energy (CPU+iGPU, the whole APU) per generated token, across the llama.cpp servers on worker4. Prompt processing is in the joules but not in the tokens, so long prompts raise it. Empty while nothing is generating.",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 44
          },
          "fieldConfig": {
            "defaults": {
              "unit": "suffix: J/token",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum(rate(kepler_node_cpu_joules_total{node_name=\"worker4\",zone=\"package\"}[5m])) / (sum(rate(llamacpp:tokens_predicted_total[5m]) * on (namespace, pod) group_left () max by (namespace, pod) (kube_pod_info{node=\"worker4\"})) > 0.1)",
              "legendFormat": "J/token",
              "refId": "A"
            }
          ]
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "UPS output vs RAPL package total",
          "description": "What the UPS delivers against what RAPL measures on the cluster nodes. The gap is the NAS, network gear, PSU losses, disks, NICs and board power.",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 44
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none",
                  "group": "A"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "mean",
                "max",
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": "${datasource}",
              "expr": "sum(network_ups_tools_output_realpower)",
              "legendFormat": "UPS output",
              "refId": "A"
            },
            {
              "datasource": "${datasource}",
              "expr": "sum(rate(node_rapl_package_joules_total[5m]))",
              "legendFormat": "RAPL package, all nodes",
              "refId": "B"
            }
          ]
        }
      ]
    }
