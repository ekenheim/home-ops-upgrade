---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lingarr-grafana-dashboard
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Data
data:
  lingarr_dashboard.json: |
    {
      "title": "Lingarr",
      "uid": "lingarrOverview",
      "description": "Lingarr subtitle translation: throughput, queue, MiniMax quota and the end-of-week top-up.",
      "tags": [
        "lingarr",
        "downloads",
        "minimax"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "hide": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Now",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Translated (24h)",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "increase(lingarr_files_translated_total[24h])"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "description": "Subtitle files Lingarr finished in the last 24 hours (lingarr-exporter, /api/statistics).",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Lines (24h)",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 3,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "increase(lingarr_lines_translated_total[24h])"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Pending",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 6,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(lingarr_translation_request_active{status=\"Pending\"}) or vector(0)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "description": "Queued translation requests. In the last 48 h before the MiniMax weekly reset quota-topup keeps up to 100 queued, fewer as the quota runs down.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "In progress",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 9,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(lingarr_translation_request_active{status=\"InProgress\"}) or vector(0)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "description": "Running translations; at most MAX_CONCURRENT_JOBS (6).",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "MiniMax week left",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(minimax_token_plan_weekly_remaining_percent{model=\"general\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 10
                  },
                  {
                    "color": "yellow",
                    "value": 35
                  },
                  {
                    "color": "green",
                    "value": 60
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "description": "quota-topup sizes the queue so queued work fits above 10% of the week.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "5h window left",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 15,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(minimax_token_plan_interval_remaining_percent{model=\"general\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 10
                  },
                  {
                    "color": "yellow",
                    "value": 35
                  },
                  {
                    "color": "green",
                    "value": 60
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "description": "quota-topup sizes the queue so queued work fits above 10% of the window: a 429 from the 5-hour cap fails Lingarr requests for good.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Weekly reset in",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 18,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(minimax_token_plan_weekly_remains_ms{model=\"general\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "description": "MiniMax's week resets Monday 00:00 UTC; quota-topup is active in the last 48 h.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 9,
          "type": "stat",
          "title": "API errors (24h)",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 4,
            "w": 3,
            "x": 21,
            "y": 1
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(litellm_deployment_failure_responses_total{api_key_alias=\"lingarr\"}[24h])) or vector(0)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 20
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "description": "Failed LiteLLM calls on the lingarr key (402 = week spent, 429 = 5-hour cap or throttle).",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 10,
          "type": "row",
          "title": "Throughput",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "panels": []
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Files translated per hour",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "increase(lingarr_files_translated_total[1h])",
              "legendFormat": "files/h"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": true
              }
            },
            "overrides": []
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Queue",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (lingarr_translation_request_active)",
              "legendFormat": "{{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 40,
                "spanNulls": true,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "translate calls per minute",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(litellm_deployment_success_responses_total{requested_model=\"translate\"}[5m])) * 60",
              "legendFormat": "ok"
            },
            {
              "refId": "B",
              "expr": "sum by (exception_status) (rate(litellm_deployment_failure_responses_total{api_key_alias=\"lingarr\"}[5m])) * 60",
              "legendFormat": "error {{exception_status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": true
              }
            },
            "overrides": []
          }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Tokens per hour",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(litellm_input_tokens_metric_total{requested_model=\"translate\"}[1h]))",
              "legendFormat": "input"
            },
            {
              "refId": "B",
              "expr": "sum(increase(litellm_output_tokens_metric_total{requested_model=\"translate\"}[1h]))",
              "legendFormat": "output"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": true
              }
            },
            "overrides": []
          }
        },
        {
          "id": 15,
          "type": "row",
          "title": "MiniMax quota",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 22
          },
          "panels": []
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Quota left",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 23
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(minimax_token_plan_weekly_remaining_percent{model=\"general\"})",
              "legendFormat": "week"
            },
            {
              "refId": "B",
              "expr": "min(minimax_token_plan_interval_remaining_percent{model=\"general\"})",
              "legendFormat": "5h window"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "transparent",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": true,
                "thresholdsStyle": {
                  "mode": "line+area"
                }
              },
              "min": 0,
              "max": 100
            },
            "overrides": []
          },
          "description": "Threshold line: 10%, the floor quota-topup sizes the queue against, for both the week and the 5-hour window."
        },
        {
          "id": 17,
          "type": "timeseries",
          "title": "LLM latency per call",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 23
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le) (rate(litellm_llm_api_latency_metric_bucket{requested_model=\"translate\"}[10m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(litellm_llm_api_latency_metric_bucket{requested_model=\"translate\"}[10m])))",
              "legendFormat": "p95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": true
              }
            },
            "overrides": []
          },
          "description": "MiniMax response time for one translate batch (up to 150 lines)."
        },
        {
          "id": 18,
          "type": "row",
          "title": "Pod and jobs",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 31
          },
          "panels": []
        },
        {
          "id": 19,
          "type": "timeseries",
          "title": "Lingarr memory",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 0,
            "y": 32
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(container_memory_working_set_bytes{namespace=\"downloads\", pod=~\"lingarr-[a-z0-9]+-[a-z0-9]+\", container=\"app\"})",
              "legendFormat": "working set"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": true
              }
            },
            "overrides": []
          }
        },
        {
          "id": 20,
          "type": "timeseries",
          "title": "Lingarr CPU",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 7,
            "w": 8,
            "x": 8,
            "y": 32
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"downloads\", pod=~\"lingarr-[a-z0-9]+-[a-z0-9]+\", container=\"app\"}[5m]))",
              "legendFormat": "cores"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": true
              }
            },
            "overrides": []
          }
        },
        {
          "id": 21,
          "type": "stat",
          "title": "quota-topup last success",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 7,
            "w": 4,
            "x": 16,
            "y": 32
          },
          "targets": [
            {
              "refId": "A",
              "expr": "time() - max(kube_cronjob_status_last_successful_time{namespace=\"downloads\", cronjob=\"lingarr-quota-topup\"})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1800
                  },
                  {
                    "color": "red",
                    "value": 3600
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "description": "Seconds since the top-up CronJob last succeeded (runs every 5 min). Its decision is in the job log.",
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "area"
          }
        },
        {
          "id": 22,
          "type": "stat",
          "title": "Library",
          "description": "Items Lingarr knows about and the files it has translated over its lifetime. The gap is not a backlog: most of it already had Swedish from Bazarr or has no English subtitle file to translate from (2026-10-18: 13,807 of 15,086 episodes and 1,167 of 1,170 movies have Swedish, 1,193 episodes have no subtitles). Lingarr's API has no 'left to translate' figure.",
          "datasource": "${datasource}",
          "gridPos": {
            "h": 7,
            "w": 4,
            "x": 20,
            "y": 32
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(lingarr_library_episodes)",
              "legendFormat": "episodes"
            },
            {
              "refId": "B",
              "expr": "max(lingarr_library_movies)",
              "legendFormat": "movies"
            },
            {
              "refId": "C",
              "expr": "max(lingarr_files_translated_total)",
              "legendFormat": "translated (lifetime)"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name"
          }
        }
      ]
    }
