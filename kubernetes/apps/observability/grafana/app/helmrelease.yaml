---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app grafana
spec:
  interval: 30m
  # Not the 5m default: three replicas roll one at a time (maxSurge 1), and
  # each pulls the image, installs plugins synchronously and builds its
  # search index; the first also runs the Grafana 13 storage migration. A
  # timeout here triggers the Helm rollback below, which cannot bring 12.x
  # back on a migrated database (see the chart comment).
  timeout: 15m
  chart:
    spec:
      chart: grafana
      # grafana-community chart. 14.x renders Grafana 13 on the distroless
      # image with a read-only root filesystem, installs `plugins:` through
      # GF_PLUGINS_PREINSTALL_SYNC and validates values against a schema.
      # Grafana 13 moves dashboards and folders into unified storage on first
      # start and renames the old tables to *_legacy, so going back to 12.x
      # means restoring the pre-upgrade pg_dump of the grafana database, not
      # just reverting this file.
      version: 14.1.0
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    replicas: 3
    podAnnotations:
      reloader.stakater.com/auto: "true"
    env:
      GF_DATE_FORMATS_USE_BROWSER_LOCALE: true
      GF_EXPLORE_ENABLED: true
      # No GF_FEATURE_TOGGLES_ENABLE=publicDashboards: that toggle is not in
      # the 12.3 or 13.2 feature registry (public/shared dashboards are on via
      # [public_dashboards] enabled, default true), so it was a no-op.
      # No GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS either: every plugin
      # installed below is signed (pr0ps-trackmap-panel 3.x is), and the
      # unsigned ones it named were Angular or never installed.
      # `lax`, not the release name: "grafana" is not a SameSite mode and
      # Grafana silently fell back to lax, so this only states what ran.
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SERVER_ROOT_URL: https://grafana.${SECRET_DOMAIN}
    # `envFromSecrets`, NOT `envFrom`: this chart has no `envFrom` value and
    # drops it silently. From 2024-12-27 (88fa3a395) to 2026-09-30 that left
    # Grafana with no OAuth client id ("client_id is missing or invalid" at
    # Authentik) and no database settings: each replica ran on its own
    # throwaway SQLite.
    envFromSecrets:
      - name: grafana-secret
      - name: grafana-db-secret
    grafana.ini:
      analytics:
        check_for_updates: false
        check_for_plugin_updates: false
        reporting_enabled: false
      # Add security section to allow embedding
      security:
        allow_embedding: true
      # Public on envoy-external, so every browser session goes through
      # Authentik (which only admits the Grafana Admins / Monitoring groups).
      # Break-glass if Authentik is down: /login?disableAutoLogin shows the
      # local form for the admin user. Basic auth stays on: ESO's Grafana
      # generator (apps/llm/toolhive/grafana-mcp) mints tokens with it.
      auth:
        signout_redirect_url: https://sso.${SECRET_DOMAIN}/application/o/grafana/end-session/
        oauth_auto_login: true
        oauth_allow_insecure_email_lookup: true
      auth.anonymous:
        enabled: false
      auth.generic_oauth:
        name: authentik
        enabled: true
        scopes: openid email profile
        auth_url: https://sso.${SECRET_DOMAIN}/application/o/authorize/
        token_url: https://sso.${SECRET_DOMAIN}/application/o/token/
        api_url: https://sso.${SECRET_DOMAIN}/application/o/userinfo/
        # Optionally map user groups to Grafana roles
        role_attribute_path: contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'
    deploymentStrategy:
      type: RollingUpdate
    # Grafana 12.3.1 working set over 7 days (2026-10-18): p95 192Mi, max
    # 198Mi, against a 219M (209Mi) limit. Grafana 13 adds the unified-storage
    # migration on first start and a bleve search index per pod, so the limit
    # gets headroom. The chart sets GOMEMLIMIT to 90% of it.
    resources:
      requests:
        cpu: 23m
        memory: 192Mi
      limits:
        memory: 512Mi
    admin:
      existingSecret: grafana-secret
      passwordKey: adminPass
      userKey: adminUser
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
          - name: data
            orgId: 1
            folder: Data
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/data
          - name: kubernetes
            orgId: 1
            folder: Kubernetes
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/kubernetes
          - name: network
            orgId: 1
            folder: Network
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/network
          - name: storage
            orgId: 1
            folder: Storage
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/storage
          - name: system
            orgId: 1
            folder: System
            type: file
            disableDeletion: false
            editable: true
            allowUiUpdates: true
            options:
              path: /var/lib/grafana/dashboards/system
    datasources:
      datasources.yaml:
        apiVersion: 1
        deleteDatasources:
          - { name: Alertmanager, orgId: 1 }
          - { name: Prometheus, orgId: 1 }
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            access: proxy
            url: http://prometheus-operated.observability.svc.cluster.local:9090
            isDefault: true
          - name: Alertmanager
            type: alertmanager
            uid: alertmanager
            access: proxy
            url: http://alertmanager-operated.observability.svc.cluster.local:9093
            jsonData:
              implementation: prometheus
    dashboards:
      data:
        # The crunchy-* dashboards are pinned to postgres-operator-examples
        # 397165d28, the last commit that has them: eb3de7c4f (2025-12-18)
        # removed kustomize/monitoring, so `main` returns 404. Chart 10.x
        # ignored that and provisioned empty files; chart 14's download
        # script runs curl -f under pipefail and fails the init container
        # (download-dashboards exit 22, 2026-10-18).
        crunchy-pgbackrest: #https://github.com/CrunchyData/postgres-operator-examples/issues/264
          url: https://raw.githubusercontent.com/CrunchyData/postgres-operator-examples/397165d28014b9c4676a122223c44683d5bfb015/kustomize/monitoring/grafana/dashboards/pgbackrest.json
          datasource: Prometheus
        crunchy-pod-details:
          url: https://raw.githubusercontent.com/CrunchyData/postgres-operator-examples/397165d28014b9c4676a122223c44683d5bfb015/kustomize/monitoring/grafana/dashboards/pod_details.json
          datasource: Prometheus
        crunchy-postgresql-details:
          url: https://raw.githubusercontent.com/CrunchyData/postgres-operator-examples/397165d28014b9c4676a122223c44683d5bfb015/kustomize/monitoring/grafana/dashboards/postgresql_details.json
          datasource: Prometheus
        crunchy-postgresql-overview:
          url: https://raw.githubusercontent.com/CrunchyData/postgres-operator-examples/397165d28014b9c4676a122223c44683d5bfb015/kustomize/monitoring/grafana/dashboards/postgresql_overview.json
          datasource: Prometheus
        crunchy-postgresql-service_health:
          url: https://raw.githubusercontent.com/CrunchyData/postgres-operator-examples/397165d28014b9c4676a122223c44683d5bfb015/kustomize/monitoring/grafana/dashboards/postgresql_service_health.json
          datasource: Prometheus
        crunchy-prometheus-alerts:
          url: https://raw.githubusercontent.com/CrunchyData/postgres-operator-examples/397165d28014b9c4676a122223c44683d5bfb015/kustomize/monitoring/grafana/dashboards/prometheus_alerts.json
          datasource: Prometheus
        crunchy-query-statistics:
          url: https://raw.githubusercontent.com/CrunchyData/postgres-operator-examples/397165d28014b9c4676a122223c44683d5bfb015/kustomize/monitoring/grafana/dashboards/query_statistics.json
          datasource: Prometheus
        dragonfly:
          url: https://raw.githubusercontent.com/dragonflydb/dragonfly/refs/heads/main/tools/local/monitoring/grafana/provisioning/dashboards/dragonfly.json
          datasource: Prometheus
      kubernetes:
        kubernetes-api-server:
          # renovate: depName="Kubernetes / System / API Server"
          gnetId: 15761
          revision: 21
          datasource: Prometheus
        kubernetes-coredns:
          # renovate: depName="Kubernetes / System / CoreDNS"
          gnetId: 15762
          revision: 22
          datasource: Prometheus
        kubernetes-global:
          # renovate: depName="Kubernetes / Views / Global"
          gnetId: 15757
          revision: 43
          datasource: Prometheus
        kubernetes-namespaces:
          # renovate: depName="Kubernetes / Views / Namespaces"
          gnetId: 15758
          revision: 46
          datasource: Prometheus
        kubernetes-nodes:
          # renovate: depName="Kubernetes / Views / Nodes"
          gnetId: 15759
          revision: 40
          datasource: Prometheus
        kubernetes-pods:
          # renovate: depName="Kubernetes / Views / Pods"
          gNetId: 15760
          revision: 21
          datasource: Prometheus
        kubernetes-volumes:
          # renovate: depName="K8s / Storage / Volumes / Cluster"
          gnetId: 11454
          revision: 14
          datasource: Prometheus
      network:
        blackbox-exporter:
          # renovate: depName="Prometheus Blackbox Exporter"
          gnetId: 7587
          revision: 3
          datasource: Prometheus
        cert-manager:
          # renovate: depName="Cert-manager-Kubernetes"
          gnetId: 20842
          revision: 3
          datasource: Prometheus
        crowdsec:
          # Lines-read and AppSec panels stay empty: it predates the kubernetes
          # acquisition source and we run no WAF. Alerts, decisions, buckets,
          # parsers, whitelists and LAPI work.
          # renovate: depName="CrowdSec Metrics"
          gnetId: 21419
          revision: 6
          datasource: Prometheus
        unifi-insights:
          # renovate: depName="UniFi-Poller: Client Insights - Prometheus"
          gnetId: 11315
          revision: 9
          datasource: Prometheus
        unifi-pdu:
          # renovate: depName="UniFi-Poller: PDU Insights - Prometheus"
          gnetId: 23027
          revision: 1
          datasource:
            - { name: DS_PROMETHEUS, value: Prometheus }
        cloudflared:
          # renovate: depName="Cloudflare Tunnels (cloudflared)"
          gnetId: 17457
          revision: 6
          datasource:
            - { name: DS_PROMETHEUS, value: Prometheus }
        external-dns:
          # renovate: depName="External-dns"
          gnetId: 15038
          revision: 3
          datasource: Prometheus
        speedtest-exporter-hub:
          # renovate: depName="Speedtest Exporter"
          gnetId: 13665
          revision: 4
          datasource:
            - { name: datasource, value: Prometheus }
        unifi-network-sites:
          # renovate: depName="UniFi-Poller: Network Sites - Prometheus"
          gnetId: 11311
          revision: 5
          datasource: Prometheus
        unifi-uap:
          # renovate: depName="UniFi-Poller: UAP Insights - Prometheus"
          gnetId: 11314
          revision: 10
          datasource: Prometheus
        unifi-usw:
          # renovate: depName="UniFi-Poller: USW Insights - Prometheus"
          gnetId: 11312
          revision: 9
          datasource: Prometheus
      storage:
        etcd-storage:
          # renovate: depName="etcd"
          gnetId: 22236
          revision: 5
          datasource:
            - { name: DS_VICTORIAMETRICS, value: Prometheus }
        ceph-cluster:
          # renovate: depName="Ceph Cluster"
          gnetId: 2842
          revision: 18
          datasource: Prometheus
        ceph-osd:
          # renovate: depName="Ceph - OSD (Single)"
          gnetId: 5336
          revision: 9
          datasource: Prometheus
        ceph-pools:
          # renovate: depName="Ceph - Pools"
          gnetId: 5342
          revision: 9
          datasource: Prometheus
        ceph-usage:
          # renovate: depName="Ceph Usage"
          gnetId: 23246
          revision: 1
          datasource:
            - { name: DS_VICTORIAMETRICS, value: Prometheus }
        host-overview:
          url: https://raw.githubusercontent.com/ceph/ceph/main/monitoring/ceph-mixin/dashboards_out/hosts-overview.json
          datasource: Prometheus
        kubernetes-pvc:
          # renovate: depName="Kubernetes PVC Stats"
          gnetId: 23233
          revision: 10
          datasource:
            - { name: DS_PROMETHEUS, value: Prometheus }
        minio:
          # Not tracked by Renovate: MinIO delisted 13502 from grafana.com
          # (its API 404s), but the revision download still works.
          gnetId: 13502
          revision: 26
          datasource:
            - { name: DS_PROMETHEUS, value: Prometheus }
        volsync:
          # renovate: depName="VolSync Dashboard"
          gnetId: 21356
          revision: 3
          datasource:
            - { name: DS_PROMETHEUS, value: Prometheus }
            - { name: VAR_REPLICATIONDESTNAME, value: '.*-bootstrap'}
      system:
        node-exporter-full:
          # renovate: depName="Node Exporter Full"
          gnetId: 1860
          revision: 45
          datasource: Prometheus
        smartctl-exporter:
          # renovate: depName="SMARTctl Exporter Dashboard"
          gnetId: 22604
          revision: 4
          datasource:
            - { name: DS_PROMETHEUS, value: Prometheus }
        node-feature-discovery:
          url: https://raw.githubusercontent.com/kubernetes-sigs/node-feature-discovery/master/examples/grafana-dashboard.json
          datasource:
            - { name: DS_PROMETHEUS, value: Prometheus }
        spegel:
          # renovate: depName="Spegel"
          gnetId: 18089
          revision: 1
          datasource:
            - { name: DS_PROMETHEUS, value: Prometheus }
    sidecar:
      image:
        registry: ghcr.io
        repository: home-operations/k8s-sidecar
        tag: 2.14.1@sha256:22eccb80b828a956eb31214ed5a0358c9efcbf575f196c2b859ac00bfd5dcef4
      dashboards:
        enabled: true
        searchNamespace: ALL
        labelValue: ""
        label: grafana_dashboard
        folderAnnotation: grafana_folder
        provider:
          disableDelete: true
          foldersFromFilesStructure: true
      datasources:
        enabled: true
        searchNamespace: ALL
        labelValue: ""
    # The chart passes this list as GF_PLUGINS_PREINSTALL_SYNC, and a plugin
    # that fails to install stops Grafana from starting. Dropped 2026-10-18
    # with the move to Grafana 13: grafana-piechart-panel,
    # grafana-worldmap-panel and natel-discrete-panel, all Angular and
    # deprecated on grafana.com. Grafana 12 already refused to load them, and
    # none of the 97 dashboards used them (only grafana-clock-panel is used).
    plugins:
      - grafana-clock-panel
      - pr0ps-trackmap-panel
      - vonage-status-panel
      # Pinned as "id@version": preinstall_sync splits entries on commas AND
      # spaces, so the old "id version" form would become two plugin ids
      # ("0.33.1" being one) and fail startup. Renovate bumps it from the
      # GitHub releases of VictoriaMetrics/victorialogs-datasource
      # (customManagers.json5). Grafana installs from the grafana.com
      # catalog, which can trail a GitHub release by hours; if a bump fails
      # to install, check
      # https://grafana.com/api/plugins/victoriametrics-logs-datasource/versions.
      # 0.33.1 is in the catalog (2026-10-16), adds Drilldown and needs
      # Grafana >=10.4.
      - victoriametrics-logs-datasource@0.33.1
    serviceMonitor:
      enabled: true
      metricRelabelings:
        - action: labeldrop
          regex: (pod)
    # envoy-gateway: replaces the `external` Ingress below at cutover.
    route:
      main:
        enabled: true
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: grafana.png
          gethomepage.dev/name: Grafana
          gethomepage.dev/group: Observability
          gethomepage.dev/description: Monitoring Dashboards
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        # Public again since 2026-09-30, now that anonymous access is off and
        # login is forced through Authentik (see grafana.ini above).
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
    ingress:
      enabled: false  # moved to an HTTPRoute on envoy-gateway
      ingressClassName: external
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/icon: grafana.png
        gethomepage.dev/name: Grafana
        gethomepage.dev/group: Observability
        gethomepage.dev/description: Monitoring Dashboards
        # gethomepage.dev/widget.type: grafana
        # gethomepage.dev/widget.url: http://grafana.observability
        # gethomepage.dev/widget.username: '{{`{{HOMEPAGE_VAR_GRAFANA_USERNAME}}`}}'
        # gethomepage.dev/widget.password: '{{`{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}`}}'
        external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
      hosts:
        - "{{ .Release.Name }}.${SECRET_DOMAIN}"
    persistence:
      enabled: false
    topologySpreadConstraints:
      # ScheduleAnyway, not DoNotSchedule: with master1/master3 down and
      # worker4 tainted only master2 and worker3 take pods, so 3 replicas at
      # maxSkew 1 cannot all place. Two ReplicaSets sat Pending for days,
      # every rollout hit ProgressDeadlineExceeded and the Helm rollback
      # failed the same way, in a loop (2026-10-14). The spread stays a
      # strong preference; replicas return to one per node when nodes do.
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: *app
