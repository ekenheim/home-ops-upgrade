---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kube-prometheus-stack
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 93.11.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    disableWait: true
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    disableWait: true
    crds: Skip
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: prometheus-operator-crds
      namespace: observability
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    crds:
      enabled: false
    alertmanager:
      ingress:
        enabled: false  # moved to an HTTPRoute on envoy-gateway
        pathType: Prefix
        ingressClassName: internal
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
        hosts:
          - alertmanager.${SECRET_DOMAIN}
      alertmanagerSpec:
        replicas: 2
        useExistingSecret: true
        configSecret: alertmanager-secret
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-filesystem
              resources:
                requests:
                  storage: 1Gi
    grafana:
      enabled: false
      forceDeployDashboards: true
      sidecar:
        dashboards:
          annotations:
            grafana_folder: Kubernetes
          multicluster:
            etcd:
              enabled: true
    kubeApiServer:
      enabled: true
    kubelet:
      enabled: true
    kubeControllerManager:
      enabled: true
      endpoints: &cp
        - 192.168.50.31
        - 192.168.50.33
        - 192.168.50.34
    kubeEtcd:
      enabled: true
      endpoints: *cp
    kubeScheduler:
      enabled: true
      endpoints: *cp
    kubeProxy:
      enabled: false
    kubeStateMetrics:
      enabled: true
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      metricLabelsAllowlist:
        - pods=[*]
        - deployments=[*]
        - persistentvolumeclaims=[*]
      # Flux status as a metric (gotk_resource_info), after
      # fluxcd/flux2-monitoring-example. The Flux controllers export no
      # per-object readiness, so a release that failed and rolled back was
      # invisible to Prometheus: healthy pods, no error logs, no alert
      # (karakeep, bazarr and paperless-gpt sat like that for one to five weeks
      # until 2026-11-23). No alert rule reads this, on purpose (owner decision
      # 2026-11-23: no extra pings); OpenClaw's 09:00 cluster-health digest
      # does (llm/openclaw/jobs.sh).
      # `reason` is the Ready condition's reason, the only hint at the cause
      # once the events have expired. A wrong API version or missing RBAC here
      # gives zero series and no error.
      rbac:
        extraRules:
          - apiGroups: ["kustomize.toolkit.fluxcd.io", "helm.toolkit.fluxcd.io"]
            resources: ["kustomizations", "helmreleases"]
            verbs: ["list", "watch"]
          # kube-state-metrics discovers the kinds above through their CRDs.
          - apiGroups: ["apiextensions.k8s.io"]
            resources: ["customresourcedefinitions"]
            verbs: ["list", "watch"]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux Kustomization resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      reason: [status, conditions, "[type=Ready]", reason]
                      suspended: [spec, suspend]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmRelease resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      reason: [status, conditions, "[type=Ready]", reason]
                      suspended: [spec, suspend]
                      chart_version: [status, history, "0", chartVersion]
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
    nodeExporter:
      enabled: true
    prometheus-node-exporter:
      fullnameOverride: node-exporter
      # RAPL energy_uj is root-only (0400), so the non-root exporter's rapl collector
      # failed on every node and no CPU package power was ever scraped. The chart's
      # init container chgrps it to the exporter's group before it starts.
      permissionInitContainer:
        fixes:
          rapl: true
      prometheus:
        monitor:
          enabled: true
          relabelings:
            - action: replace
              regex: (.*)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: kubernetes_node
          metricRelabelings:
            # master3's nct6798 (Meigao AHBNB board): SYSTIN/AUXTIN0-2/AUXTIN4 read 95-111 C and
            # AUXTIN3 reads -25 C (unconnected thermistor inputs), the PCH_* temps are always 0 and
            # fan1/3/4/5/7 have no tach. Only CPUTIN (temp2), PECI (temp7) and fan2 (CPU fan) are real.
            - action: drop
              sourceLabels: [chip, sensor]
              separator: ";"
              regex: platform_nct6775_[0-9]+;(temp([1345689]|1[012])|fan[13457])
            # master3's ACPI thermal zone is a constant 27.8 C; the NUCs' acpitz is real, so keep theirs.
            - action: drop
              sourceLabels: [kubernetes_node, chip]
              separator: ";"
              regex: master3;thermal_thermal_zone0
    prometheus:
      thanosService:
        enabled: true
      thanosServiceMonitor:
        enabled: true
      ingress:
        enabled: false  # moved to an HTTPRoute on envoy-gateway
        ingressClassName: internal
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: prometheus.png
          gethomepage.dev/name: Prometheus
          gethomepage.dev/group: Observability
          gethomepage.dev/app: prometheus
          gethomepage.dev/description: Monitoring Scrape Service
          gethomepage.dev/widget.type: prometheus
          gethomepage.dev/widget.url: http://kube-prometheus-stack-prometheus.observability:9090
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
        pathType: Prefix
        hosts:
          - prometheus.${SECRET_DOMAIN}
      prometheusSpec:
        thanos:
          version: v0.41.0
        scrapeInterval: 1m # Must match interval in Grafana Helm chart
        enableAdminAPI: true
        enableFeatures:
          - memory-snapshot-on-shutdown
        externalLabels:
          cluster: ${CLUSTER_NAME}
        resources:
          requests:
            cpu: 100m
            memory: 2Gi
          limits:
            memory: 4Gi
        replicaExternalLabelName: __replica__
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        retention: 14d
        retentionSize: 70GB
        replicas: 2
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 75Gi
    cleanPrometheusOperatorObjectNames: true
