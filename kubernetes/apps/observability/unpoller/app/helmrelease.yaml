---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app unpoller
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      unpoller:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/unpoller/unpoller
              tag: v5.1.0@sha256:4ead2ffec4ff53ffb8eea0a1d522b871e8024eac211d7321a74a61a6856d7e7d
            env:
              UP_UNIFI_DEFAULT_URL: ${UNIFI_CONTROLLER_IP}
              UP_INFLUXDB_DISABLE: true
            envFrom:
              - secretRef:
                  name: unpoller-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              # unpoller does not bind :9130 at startup. It logs "Prometheus is
              # enabled", then fills its scrape cache with one full controller
              # poll and only binds afterwards -- measured at 59s against this
              # controller, i.e. one whole [prometheus] interval (default 60s):
              #   17:22:51 Prometheus is enabled
              #   17:23:50 Prometheus exported at http://0.0.0.0:9130/
              # The default liveness probe gives up long before that
              # (initialDelay 0 + period 10 x failureThreshold 3 = 30s), so the
              # container is killed mid-warmup and never serves a scrape --
              # "connect: connection refused" on every probe, CrashLoopBackOff,
              # exit 2. A startup probe suspends liveness/readiness until the
              # listener is actually up. 36 x 5s = 180s leaves room for a slow
              # controller; lowering the cache interval instead would work but
              # would poll the UniFi API far harder than the 2m ServiceMonitor
              # needs.
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 9130
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  failureThreshold: 36
                  timeoutSeconds: 2
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
    service:
      app:
        controller: *app
        ports:
          http:
            port: 9130
    serviceMonitor:
      app:
        serviceName: *app
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 2m # Unifi API only polls at 2m intervals
            scrapeTimeout: 10s
