---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# vlagent on every node: tails /var/log/pods and writes to victoria-logs with
# the namespace, pod, container and pod labels as fields. It tolerates every
# taint on purpose -- master2 (sole-etcd-member) and worker4 (llm-workload)
# are where the logs that matter most come from.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-collector
spec:
  interval: 30m
  chart:
    spec:
      chart: victoria-logs-collector
      version: 0.3.8
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: victoria-logs
  values:
    image:
      registry: quay.io
      repository: victoriametrics/vlagent
      tag: v1.53.0@sha256:a82f93ffecc153fb068606903e512368b070272739d823abe99fad0eff6e1849
    remoteWrite:
      # Buffered on the node (hostPath /var/lib/vl-collector) while
      # victoria-logs is down; capped so a long outage cannot fill /var.
      - url: http://victoria-logs.observability.svc.cluster.local:9428
        maxDiskUsagePerURL: 2GiB
    collector:
      includePodLabels: true
    tolerations:
      - operator: Exists
    podAnnotations:
      reloader.stakater.com/auto: "true"
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 512Mi
    podMonitor:
      enabled: true
