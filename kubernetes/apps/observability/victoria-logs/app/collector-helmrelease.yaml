---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# vlagent on every node: tails /var/log/pods and writes to victoria-logs with
# the namespace, pod, container and pod labels as fields. It tolerates every
# taint on purpose -- master2 (sole-etcd-member) and worker4 (llm-workload)
# are where the logs that matter most come from.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-collector
spec:
  interval: 30m
  chart:
    spec:
      chart: victoria-logs-collector
      version: 0.3.8
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: victoria-logs
  values:
    image:
      registry: quay.io
      repository: victoriametrics/vlagent
      tag: v1.53.0@sha256:a82f93ffecc153fb068606903e512368b070272739d823abe99fad0eff6e1849
    remoteWrite:
      # Buffered on the node (hostPath /var/lib/vl-collector) while
      # victoria-logs is down; capped so a long outage cannot fill /var.
      - url: http://victoria-logs.observability.svc.cluster.local:9428
        maxDiskUsagePerURL: 2GiB
    collector:
      includePodLabels: true
    # Fixed send-side sizing. vlagent defaults -remoteWrite.queues to 2x the
    # CPUs it sees, and with no CPU limit that is the host's: 64 queues on
    # worker3 and worker4, each with an 8 MiB pending block, and an in-memory
    # queue of 100 blocks per queue (6400) before it spills to disk. On first
    # start there is no checkpoint, so it reads every container log from the
    # beginning; worker3 (211 pods) filled 512Mi in under a second and was
    # OOMKilled before it could write a checkpoint, so every restart began
    # from zero again. 4 queues x 2 MiB blocks keeps the in-memory side at
    # 400 small blocks; the rest of the backlog goes to the 2 GiB disk buffer.
    extraArgs:
      remoteWrite.queues: 4
      remoteWrite.maxBlockSize: 2MiB
    tolerations:
      - operator: Exists
    podAnnotations:
      reloader.stakater.com/auto: "true"
    # Steady state is 30-50Mi (master2, worker4); the request leaves room for
    # worker3's larger pod count, the limit for the first-start backlog.
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 2Gi
    podMonitor:
      enabled: true
