---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: rook-ceph
      version: v1.20.3
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  dependsOn:
    - name: snapshot-controller
      namespace: storage
  values:
    csi:
      cephFSKernelMountOptions: ms_mode=prefer-crc
      cephFSFuseMountOptions: _netdev
      forceCephFSKernelClient: false
      cephFSMountOptions: _netdev
      enableLiveness: true
      serviceMonitor:
        enabled: true
      # worker4 is a dedicated LLM node tainted llm-workload=true:NoSchedule.
      # The CSI node plugins are DaemonSets, so without this they are evicted
      # from it and nothing on that node can mount RBD or CephFS -- including
      # LLMKube's RWX model cache, which lives on ceph-filesystem.
      # Provisioners are Deployments and can run anywhere, so they need nothing.
      pluginTolerations:
        - key: llm-workload
          operator: Exists
          effect: NoSchedule
    monitoring:
      enabled: true
    resources:
      requests:
        memory: 128Mi # unchangable
        cpu: 100m # unchangable
