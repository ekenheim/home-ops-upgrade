---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: rook-ceph
      version: v1.21.0
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  dependsOn:
    - name: snapshot-controller
      namespace: storage
  values:
    csi:
      cephFSKernelMountOptions: ms_mode=prefer-crc
      cephFSFuseMountOptions: _netdev
      forceCephFSKernelClient: false
      cephFSMountOptions: _netdev
      enableLiveness: true
      serviceMonitor:
        enabled: true
      # NOTE: do not add pluginTolerations here. This chart runs with
      # csi.installCsiOperator=true, and rook-ceph v1.20.3 has no CSI toleration
      # values at all -- the only toleration keys are the top-level `tolerations`
      # (operator Deployment) and `discover.toleration*`. Helm silently ignores
      # unknown values, so a csi.pluginTolerations block upgrades "successfully"
      # while doing precisely nothing.
      #
      # The CSI node plugins are owned by Driver CRs (csi.ceph.io/v1), reconciled
      # by ceph-csi-controller-manager, and Rook itself owns both those CRs and
      # the OperatorConfig -- so a hand patch gets reverted on reconcile. If CSI
      # ever needs to tolerate a taint, the field is nodePlugin.tolerations on
      # OperatorConfig.spec.driverSpecDefaults, and Kyverno is the practical way
      # to inject it. worker4 avoids the problem entirely by keeping LLMKube's
      # model cache on local-hostpath rather than ceph-filesystem.
    monitoring:
      enabled: true
    # OBC additionalConfig fields Rook will act on (ROOK_OBC_ALLOW_ADDITIONAL_CONFIG_FIELDS).
    # The chart default is the two quota fields; bucketLifecycle is added for
    # llm/langfuse-bucket's 30-day expiry of raw events. A lifecycle rule can
    # only expire objects in the claim's own bucket, so this is the low-risk
    # one; bucketPolicy and bucketOwner, which reach other users' buckets,
    # stay off. No other OBC in the cluster sets additionalConfig (2026-10-18).
    # The operator re-reads this on its config reconcile; until then an OBC
    # using the field fails Provision before touching its Secret and retries.
    obcAllowAdditionalConfigFields: "maxObjects,maxSize,bucketLifecycle"
    resources:
      requests:
        memory: 128Mi # unchangable
        cpu: 100m # unchangable
