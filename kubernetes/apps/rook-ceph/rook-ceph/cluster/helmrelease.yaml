---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: rook-ceph-cluster
      version: v1.20.7
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  uninstall:
    keepHistory: false
  dependsOn:
    - name: rook-ceph-operator
      namespace: rook-ceph
    - name: snapshot-controller
      namespace: storage
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    ingress:
      dashboard:
        ingressClassName: internal
        annotations:
          external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
        host:
          name: rook.${SECRET_DOMAIN}
          path: /
    toolbox:
      enabled: true
    configOverride: |
      [global]
      bdev_enable_discard = true
      bdev_async_discard = true
      osd_class_update_on_start = false
      ; end of ceph.conf

    cephClusterSpec:
      # Ceph v20.2.4 regression workaround (remove once a fixed release ships).
      #
      # v20.2.4 carries the fix for CVE-2026-54330, which makes RGW reject
      # SigV4 requests whose `host`/`x-amz-*` headers are not in the signed
      # subset. Upstream documents this as breaking only the multisite REST
      # client, but on this single-zone cluster it rejects *every* PUT that
      # carries a body -- from any client, any user, any bucket -- with a
      # bare `AccessDenied` (empty message).
      #
      # The tell: reads (GET/HEAD/LIST/DELETE) and a zero-byte PUT all return
      # 200, so the bucket, OBC, RGW user, ACL and quotas all look healthy.
      # In the RGW access log a denied PUT shows an empty user field and
      # `bucket=` at latency=0, because auth fails before bucket resolution.
      #
      # Effect of leaving this unset: thanos-compact CrashLoopBackOff on
      # "retention failed: ... Access Denied" and thanos-rule silently unable
      # to upload blocks, i.e. no Thanos long-term storage at all.
      #
      # Trade-off: this re-opens CVE-2026-54330 (a holder of a presigned PUT
      # URL can attach arbitrary x-amz-* headers -> privilege escalation).
      # Accepted here because RGW is published only on the `internal` ingress
      # class (the rgw host is LAN-only, not the external class) and nothing
      # in this cluster hands out presigned PUT URLs.
      cephConfig:
        client.rgw:
          rgw_sigv4_insecure: "true"
      crashCollector:
        disable: false
      dashboard:
        enabled: true
        urlPrefix: /
        ssl: false
        prometheusEndpoint: http://thanos-query-frontend.observability.svc.cluster.local:10902
      mgr:
        modules:
          - name: pg_autoscaler
            enabled: true
      mon:
        count: 3
        allowMultiplePerNode: false
      healthCheck:
        livenessProbe:
          mon:
            disabled: false
            probe:
              # Rook's default mon probe (5s timeout, 3 failures on a 10s period)
              # is too tight for master1: its install disk is 111G against 222G on
              # master2/master3, runs at ~83% full, and the fsync-heavy mon cannot
              # answer `ceph --admin-daemon ... mon_status` inside 5s under I/O
              # contention. The probe was SIGKILLing a *healthy* mon.a (exit 137),
              # dropping Ceph to 2/3 quorum -- which is what makes a control-plane
              # reboot during an upgrade dangerous. Widen the window so only a
              # genuinely wedged mon is restarted.
              timeoutSeconds: 15
              periodSeconds: 30
              failureThreshold: 5
      network:
        provider: host
        connections:
          requireMsgr2: true
      storage:
        useAllNodes: true
        useAllDevices: true
        deviceFilter: nvme0n1
        config:
          osdsPerDevice: "1"
      placement:
        # worker4 is a dedicated LLM node tainted llm-workload=true:NoSchedule,
        # but it still carries osd.1 (the 2TB Kingston). Rook merges `all` with
        # the per-daemon placement below, so this tolerates the taint for every
        # Ceph daemon -- osd, prepareosd, crashcollector, exporter -- while mgr
        # and mon stay pinned to the control plane by their own nodeAffinity.
        all:
          tolerations:
            - key: llm-workload
              operator: Exists
              effect: NoSchedule
        mgr: &placement
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: Exists
        # mon must NOT reuse mgr's *hard* control-plane affinity. There are
        # exactly 3 control-plane nodes and allowMultiplePerNode is false, so
        # once a mon drops out of quorum Rook has nowhere to place its
        # replacement and failover fails forever:
        #   "failed to failover mon a: failed to place new mon on a node:
        #    failed to schedule mons"
        # That is what stranded mon.a out of quorum indefinitely. Prefer the
        # control plane, but allow a worker as a fallback so failover can
        # actually complete.
        mon:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: node-role.kubernetes.io/control-plane
                      operator: Exists
      resources:
        mgr:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 4Gi
        mon:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            memory: 2Gi
        osd:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            memory: 12Gi
        mgr-sidecar:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
    cephBlockPools:
      - name: ceph-blockpool
        spec:
          failureDomain: host
          replicated:
            size: 3
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: WaitForFirstConsumer
          parameters:
            imageFormat: "2"
            imageFeatures: layering
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            csi.storage.k8s.io/fstype: ext4
    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    cephFileSystems:
      - name: &cephFileSystemName ceph-filesystem
        spec:
          metadataPool:
            replicated:
              size: 3
          dataPools:
            - failureDomain: host
              replicated:
                size: 3
              name: data0
          metadataServer:
            activeCount: 1
            activeStandby: true
            priorityClassName: system-cluster-critical
            placement:
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ceph-mds
                      app.kubernetes.io/part-of: *cephFileSystemName
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 8Gi
        storageClass:
          enabled: true
          isDefault: false
          name: ceph-filesystem
          pool: data0
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: rook-ceph
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph
            csi.storage.k8s.io/fstype: ext4
    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      isDefault: false
      deletionPolicy: Delete
    cephObjectStores:
      - name: ceph-objectstore
        spec:
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
          dataPool:
            failureDomain: host
            erasureCoded:
              dataChunks: 2
              codingChunks: 2
          preservePoolsOnDelete: true
          # With network.provider: host, RGW must not use port 80 or it conflicts with ingress/node
          # and causes "RGW REST API cannot be reached: Connection refused". Use a dedicated port.
          gateway:
            port: 8080
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 4Gi
            instances: 2
            priorityClassName: system-cluster-critical
          healthCheck:
            bucket:
              interval: 60s
        storageClass:
          enabled: true
          name: ceph-bucket
          reclaimPolicy: Delete
          volumeBindingMode: Immediate
          parameters:
            region: ca-west-1
        ingress:
          enabled: true
          ingressClassName: internal
          annotations:
            external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
          host:
            name: rgw.${SECRET_DOMAIN}
            path: /
