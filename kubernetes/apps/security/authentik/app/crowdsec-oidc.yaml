---
# CrowdSec Web UI sign-in (apps/network/crowdsec/web-ui). The UI runs with
# its own login off, so envoy-internal does it: the SecurityPolicy
# crowdsec-web-ui-oidc in `network` signs the browser in against the
# application below, on top of its private-CIDR rule. Copied from
# victoria-logs-oidc.yaml, same shape as trackinizer-oidc.yaml; see there for why the
# client secret is generated in-cluster and carried twice in one Secret.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: authentik-crowdsec-oidc
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://lds-schemas-5hg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name authentik-crowdsec-oidc
spec:
  # OnChange, not a bare refreshInterval "0"; see trackinizer-oidc.yaml.
  refreshPolicy: OnChange
  refreshInterval: "0"
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        client-secret: '{{ .password }}'
        crowdsec.yaml: |
          version: 1
          metadata:
            name: crowdsec
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              id: provider
              identifiers:
                name: crowdsec
              attrs:
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                client_type: confidential
                client_id: crowdsec
                client_secret: '{{ .password }}'
                redirect_uris:
                  - matching_mode: strict
                    url: https://crowdsec.${SECRET_DOMAIN}/oauth2/callback
                    redirect_uri_type: authorization
                # Required: an empty list rejects every authorize request.
                grant_types:
                  - authorization_code
                  - refresh_token
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
                access_token_validity: hours=1
                refresh_token_validity: days=30
            - model: authentik_core.application
              id: app
              identifiers:
                slug: crowdsec
              attrs:
                name: CrowdSec
                provider: !KeyOf provider
                group: Infrastructure
                meta_launch_url: https://crowdsec.${SECRET_DOMAIN}/
                policy_engine_mode: any
            # Only authentik Admins may sign in: the UI lists every client
            # address that reached envoy-external, with the requests it made.
            - model: authentik_policies.policybinding
              identifiers:
                order: 0
                target: !KeyOf app
                group: !Find [authentik_core.group, [name, authentik Admins]]
              attrs:
                enabled: true
                timeout: 30
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: authentik-crowdsec-oidc
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/referencegrant_v1beta1.json
# Lets the one SecurityPolicy in `network` read the client secret above,
# and nothing else in that namespace.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: crowdsec-oidc-client-secret
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: network
  to:
    - group: ""
      kind: Secret
      name: authentik-crowdsec-oidc
