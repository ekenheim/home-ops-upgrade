---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  interval: 30m
  chart:
    spec:
      chart: authentik
      version: 2026.8.5
      sourceRef:
        kind: HelmRepository
        name: authentik-charts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    global:
      podAnnotations:
        secret.reloader.stakater.com/reload: authentik-secret
      deploymentStrategy:
        type: RollingUpdate
      envFrom:
        - secretRef:
            name: authentik-secret
        - secretRef:
            name: authentik-db-secret
    authentik:
      redis:
        host: dragonfly.database.svc.cluster.local
    # Mounted on the worker at /blueprints/mounted/secret-<name>.
    blueprints:
      secrets:
        # Remove only together with trackinizer-oidc.yaml in
        # kustomization.yaml: a missing Secret holds the worker pod.
        - authentik-trackinizer-oidc  # trackinizer-oidc.yaml
        - authentik-paperless-gpt-oidc  # paperless-gpt-oidc.yaml
        - authentik-vane-oidc  # vane-oidc.yaml
        - authentik-dawarich-oidc  # dawarich-oidc.yaml
        - authentik-karakeep-oidc  # karakeep-oidc.yaml
        - authentik-langfuse-oidc  # langfuse-oidc.yaml
        - authentik-homelable-oidc  # homelable-oidc.yaml
        - authentik-kagent-oidc  # kagent-oidc.yaml
        - authentik-victoria-logs-oidc  # victoria-logs-oidc.yaml
        - authentik-crowdsec-oidc  # crowdsec-oidc.yaml
        - authentik-jupyter-oidc  # jupyter-oidc.yaml
        - authentik-langflow-oidc  # langflow-oidc.yaml
        - authentik-hermes-code-oidc  # hermes-code-oidc.yaml
        - authentik-sillytavern-oidc  # sillytavern-oidc.yaml
        - authentik-kuberay-oidc  # kuberay-oidc.yaml
      # Mounted at /blueprints/mounted/cm-<name>.
      configMaps:
        - authentik-lan-autologin  # lan-autologin.yaml
    server:
      autoscaling:
        enabled: true
        minReplicas: 2
      metrics:
        prometheus:
          serviceMonitor:
            enabled: true
      # envoy-gateway: replaces the `external` Ingress below at cutover.
      route:
        main:
          enabled: true
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/icon: authentik.png
            gethomepage.dev/name: Authentik
            gethomepage.dev/group: Infrastructure
            gethomepage.dev/app: authentik
            gethomepage.dev/description: OIDC User Management
            gethomepage.dev/widget.type: authentik
            gethomepage.dev/widget.url: http://authentik-server.security
            gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_AUTHENTIK_TOKEN}}"
          hostnames:
            - sso.${SECRET_DOMAIN}
          parentRefs:
            - name: envoy-external
              namespace: network
              sectionName: https
          filters:
            # Authentik takes the first X-Forwarded-For entry as the client
            # address, and a client can write that entry: through Cloudflare a
            # forged 192.168.1.x arrived first in the list. Replace the header
            # with the address envoy-external detected (it walks the list from
            # the right and trusts only pod hops), so Authentik's events,
            # reputation and lan-autologin.yaml see the real client.
            - type: RequestHeaderModifier
              requestHeaderModifier:
                set:
                  - name: X-Forwarded-For
                    value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
      ingress:
        enabled: false  # moved to an HTTPRoute on envoy-gateway
        ingressClassName: external
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: authentik.png
          gethomepage.dev/name: Authentik
          gethomepage.dev/group: Infrastructure
          gethomepage.dev/app: authentik
          gethomepage.dev/description: OIDC User Management
          gethomepage.dev/widget.type: authentik
          gethomepage.dev/widget.url: http://authentik-server.security
          gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_AUTHENTIK_TOKEN}}"
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
        hosts:
          - sso.${SECRET_DOMAIN}
        https: false
    worker:
      autoscaling:
        enabled: true
        minReplicas: 2
