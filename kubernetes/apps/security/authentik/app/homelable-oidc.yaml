---
# Homelable's sign-in (default/homelable). Homelable speaks OIDC itself
# (AUTH_MODE=oidc and OIDC_* in its HelmRelease: Authorization Code + PKCE,
# confidential client), so this file only registers the provider and hands
# Homelable the client secret.
#
# The client secret is generated in-cluster (refreshPolicy OnChange), so
# there is nothing to create in Bitwarden for it. One Secret carries it twice:
# rendered into the blueprint the worker mounts (blueprints.secrets in
# helmrelease.yaml), and as `client-secret`, which default/homelable-oidc reads
# through the store at the bottom of this file. A spec change here
# regenerates it; Homelable picks the new value up within its 15m refresh.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: authentik-homelable-oidc
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://lds-schemas-5hg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name authentik-homelable-oidc
spec:
  # OnChange, not a bare refreshInterval "0": see trackinizer-oidc.yaml.
  refreshPolicy: OnChange
  refreshInterval: "0"
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        client-secret: '{{ .password }}'
        homelable.yaml: |
          version: 1
          metadata:
            name: homelable
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              id: provider
              identifiers:
                name: homelable
              attrs:
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                client_type: confidential
                client_id: homelable
                client_secret: '{{ .password }}'
                redirect_uris:
                  # Must equal OIDC_REDIRECT_URI in the HelmRelease exactly.
                  - matching_mode: strict
                    url: https://homelable.${SECRET_DOMAIN}/api/v1/auth/oidc/callback
                    redirect_uri_type: authorization
                # Required: an empty list rejects every authorize request with
                # "Invalid grant_type for provider".
                grant_types:
                  - authorization_code
                  - refresh_token
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
            - model: authentik_core.application
              id: app
              identifiers:
                slug: homelable
              attrs:
                name: Homelable
                provider: !KeyOf provider
                group: Home
                meta_launch_url: https://homelable.${SECRET_DOMAIN}/
                policy_engine_mode: any
            # Only authentik Admins may sign in. Homelable has no per-user
            # data or roles: whoever gets past Authentik edits the one shared
            # map of the network and can start scans of the LAN.
            - model: authentik_policies.policybinding
              identifiers:
                order: 0
                target: !KeyOf app
                group: !Find [authentik_core.group, [name, authentik Admins]]
              attrs:
                enabled: true
                timeout: 30
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: authentik-homelable-oidc
---
# A store of its own for the Homelable client secret, same shape as
# llm/litellm/clustersecretstore/agent-lab.yaml: this SA may `get` only
# authentik-homelable-oidc in `security`, and only `default` may use the store.
#
# Consumer: default/homelable-oidc
#   remoteRef: {key: authentik-homelable-oidc, property: client-secret}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-authentik-homelable
  namespace: security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-authentik-homelable
  namespace: security
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["authentik-homelable-oidc"]
    verbs: ["get"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: &name external-secrets-authentik-homelable
  namespace: security
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: *name
subjects:
  - kind: ServiceAccount
    name: *name
    namespace: security
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/clustersecretstore_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: authentik-oidc-secrets-homelable
spec:
  conditions:
    - namespaces:
        - default
  provider:
    kubernetes:
      remoteNamespace: security
      server:
        caProvider:
          type: "ConfigMap"
          name: "kube-root-ca.crt"
          namespace: security
          key: "ca.crt"
      auth:
        serviceAccount:
          name: external-secrets-authentik-homelable
          namespace: security
