---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  # Off for a few hours on 2026-10-18 with the rest of apps/agent-lab, back
  # the same day because the owner keeps using Trackinizer. The application,
  # provider and binding it made outlived the pause (a dropped blueprint is
  # forgotten, not reversed), and its identifiers match them, so it adopts
  # them and writes the newly generated client secret. Pairs with the
  # blueprints.secrets entry in helmrelease.yaml: drop or restore both.
  # Unused since 2026-10-22: Trackinizer's SecurityPolicy is off, so it is
  # open to the LAN. Kept so Authentik can go back in front.
  - ./trackinizer-oidc.yaml
  - ./paperless-gpt-oidc.yaml
  - ./vane-oidc.yaml
  - ./dawarich-oidc.yaml
  - ./karakeep-oidc.yaml
  - ./langfuse-oidc.yaml
  - ./homelable-oidc.yaml
  - ./kagent-oidc.yaml
  - ./victoria-logs-oidc.yaml
  - ./crowdsec-oidc.yaml
  - ./jupyter-oidc.yaml
  - ./langflow-oidc.yaml
  - ./hermes-code-oidc.yaml
  - ./sillytavern-oidc.yaml
  - ./kuberay-oidc.yaml
  # Pairs with blueprints.configMaps in helmrelease.yaml: a missing ConfigMap
  # holds the worker pod.
  - ./lan-autologin.yaml
  - ../../../../templates/gatus/infra
