---
# Langflow's browser sign-in (apps/llm/langflow). Langflow runs with
# LANGFLOW_AUTO_LOGIN, so its UI and /api/v1/auto_login hand an admin session
# to anyone; envoy-internal signs the browser in first (SecurityPolicy
# langflow-oidc in `llm`). Admins only: custom components run Python.
# Same shape as vane-oidc.yaml; see trackinizer-oidc.yaml for why the client
# secret is generated in-cluster and carried twice in one Secret.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: authentik-langflow-oidc
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://lds-schemas-5hg.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name authentik-langflow-oidc
spec:
  # OnChange, not a bare refreshInterval "0"; see trackinizer-oidc.yaml.
  refreshPolicy: OnChange
  refreshInterval: "0"
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        client-secret: '{{ .password }}'
        langflow.yaml: |
          version: 1
          metadata:
            name: langflow
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              id: provider
              identifiers:
                name: langflow
              attrs:
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                client_type: confidential
                client_id: langflow
                client_secret: '{{ .password }}'
                redirect_uris:
                  - matching_mode: strict
                    url: https://langflow.${SECRET_DOMAIN}/oauth2/callback
                    redirect_uri_type: authorization
                # Required: an empty list rejects every authorize request.
                grant_types:
                  - authorization_code
                  - refresh_token
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
                access_token_validity: hours=1
                refresh_token_validity: days=30
            - model: authentik_core.application
              id: app
              identifiers:
                slug: langflow
              attrs:
                name: Langflow
                provider: !KeyOf provider
                group: LLM
                meta_launch_url: https://langflow.${SECRET_DOMAIN}/
                policy_engine_mode: any
            # Only authentik Admins may sign in.
            - model: authentik_policies.policybinding
              identifiers:
                order: 0
                target: !KeyOf app
                group: !Find [authentik_core.group, [name, authentik Admins]]
              attrs:
                enabled: true
                timeout: 30
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: authentik-langflow-oidc
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/referencegrant_v1beta1.json
# Lets the one SecurityPolicy in `llm` read the client secret above, and
# nothing else in that namespace.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: langflow-oidc-client-secret
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: llm
  to:
    - group: ""
      kind: Secret
      name: authentik-langflow-oidc
