---
# Langfuse's sign-in (apps/llm/langfuse). Unlike trackinizer, Langfuse speaks
# OIDC itself (AUTH_CUSTOM_*), so the client secret has to reach a pod in
# `llm` rather than Envoy. Same generated-secret pattern as
# trackinizer-oidc.yaml: one Secret carries the value twice, rendered into the
# blueprint the worker mounts (blueprints.secrets in helmrelease.yaml) and as
# `client-secret`. The ClusterSecretStore below lets `llm` read that one
# Secret, and nothing else here; llm/langfuse-oidc copies it.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: authentik-langfuse-oidc
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name authentik-langfuse-oidc
spec:
  # OnChange for the reason in trackinizer-oidc.yaml. A regenerated secret
  # reaches Langfuse through llm/langfuse-oidc (hourly) and Reloader.
  refreshPolicy: OnChange
  refreshInterval: "0"
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        client-secret: '{{ .password }}'
        langfuse.yaml: |
          version: 1
          metadata:
            name: langfuse
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              id: provider
              identifiers:
                name: langfuse
              attrs:
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                client_type: confidential
                client_id: langfuse
                client_secret: '{{ .password }}'
                redirect_uris:
                  - matching_mode: strict
                    url: https://langfuse.${SECRET_DOMAIN}/api/auth/callback/custom
                    redirect_uri_type: authorization
                grant_types:
                  - authorization_code
                  - refresh_token
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
            - model: authentik_core.application
              id: app
              identifiers:
                slug: langfuse
              attrs:
                name: Langfuse
                provider: !KeyOf provider
                group: LLM
                meta_launch_url: https://langfuse.${SECRET_DOMAIN}/
                policy_engine_mode: any
            # Only authentik Admins. Langfuse puts every new SSO user in the
            # org and project as OWNER (LANGFUSE_DEFAULT_*), and traces hold
            # full prompts, so this binding is the access control.
            - model: authentik_policies.policybinding
              identifiers:
                order: 0
                target: !KeyOf app
                group: !Find [authentik_core.group, [name, authentik Admins]]
              attrs:
                enabled: true
                timeout: 30
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: authentik-langfuse-oidc
---
# Read access to that one Secret for the store below. No list/watch, same as
# llm/litellm/clustersecretstore/agent-lab.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-security-langfuse
  namespace: security
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-security-langfuse
  namespace: security
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["authentik-langfuse-oidc"]
    verbs: ["get"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: &name external-secrets-security-langfuse
  namespace: security
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: *name
subjects:
  - kind: ServiceAccount
    name: *name
    namespace: security
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/clustersecretstore_v1beta1.json
# Consumer: llm/langfuse-oidc
#   dataFrom: {extract: {key: authentik-langfuse-oidc}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: authentik-oidc-langfuse
spec:
  conditions:
    - namespaces:
        - llm
  provider:
    kubernetes:
      remoteNamespace: security
      server:
        caProvider:
          type: "ConfigMap"
          name: "kube-root-ca.crt"
          namespace: security
          key: "ca.crt"
      auth:
        serviceAccount:
          name: external-secrets-security-langfuse
          namespace: security
