---
# VictoriaLogs vmui sign-in (apps/observability/victoria-logs). VictoriaLogs
# has no login of its own, so envoy-internal does it: the SecurityPolicy
# victoria-logs-allow-private in `observability` signs the browser in against
# the application below, on top of its private-CIDR rule. Copied from
# kagent-oidc.yaml, same shape as trackinizer-oidc.yaml; see there for why the
# client secret is generated in-cluster and carried twice in one Secret.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: authentik-victoria-logs-oidc
spec:
  length: 64
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name authentik-victoria-logs-oidc
spec:
  # OnChange, not a bare refreshInterval "0"; see trackinizer-oidc.yaml.
  refreshPolicy: OnChange
  refreshInterval: "0"
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        client-secret: '{{ .password }}'
        victoria-logs.yaml: |
          version: 1
          metadata:
            name: victoria-logs
          entries:
            - model: authentik_providers_oauth2.oauth2provider
              id: provider
              identifiers:
                name: victoria-logs
              attrs:
                authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
                invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
                client_type: confidential
                client_id: victoria-logs
                client_secret: '{{ .password }}'
                redirect_uris:
                  - matching_mode: strict
                    url: https://logs.${SECRET_DOMAIN}/oauth2/callback
                    redirect_uri_type: authorization
                # Required: an empty list rejects every authorize request.
                grant_types:
                  - authorization_code
                  - refresh_token
                property_mappings:
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
                  - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-offline_access]]
                signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
                access_token_validity: hours=1
                refresh_token_validity: days=30
            - model: authentik_core.application
              id: app
              identifiers:
                slug: victoria-logs
              attrs:
                name: VictoriaLogs
                provider: !KeyOf provider
                group: Infrastructure
                meta_launch_url: https://logs.${SECRET_DOMAIN}/select/vmui/
                policy_engine_mode: any
            # Only authentik Admins may sign in: vmui reads every pod's logs
            # for 30 days, `default` (paperless, Dawarich, Immich, HA) included.
            - model: authentik_policies.policybinding
              identifiers:
                order: 0
                target: !KeyOf app
                group: !Find [authentik_core.group, [name, authentik Admins]]
              attrs:
                enabled: true
                timeout: 30
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: authentik-victoria-logs-oidc
---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/gateway.networking.k8s.io/referencegrant_v1beta1.json
# Lets the one SecurityPolicy in `observability` read the client secret above,
# and nothing else in that namespace.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: victoria-logs-oidc-client-secret
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: observability
  to:
    - group: ""
      kind: Secret
      name: authentik-victoria-logs-oidc
