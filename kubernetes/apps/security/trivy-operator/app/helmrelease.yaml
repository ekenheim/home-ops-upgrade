---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Trivy Operator: vulnerability, config-audit, exposed-secret, RBAC and
# infra-assessment reports as CRDs (aquasecurity.github.io), plus findings
# metrics for Grafana (observability/grafana/app/dashboards/apps/
# trivy-operator-dashboard.yaml) and the alerts in prometheusrule.yaml.
# Tetragon (kube-system/tetragon) covers runtime behaviour; this covers what
# is inside the images. Nothing here enforces or blocks: reports only.
#
# Two constraints shape the values below:
#   - master2 is the sole etcd member and every report is an etcd object.
#     No SBOM reports, init containers skipped, fixed-only findings from
#     MEDIUM up, single-use run pods skipped, and a 48h rescan cycle.
#   - Scan jobs pull image layers from the registry themselves (image mode;
#     not through containerd or Spegel), and the ROCm llama.cpp images in
#     the llm namespace are many GB. Two at a time, long timeouts, and never
#     on worker4: they carry no tolerations, so llm-workload keeps them off.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: trivy-operator
      version: 0.37.0
      sourceRef:
        kind: HelmRepository
        name: aquasecurity
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    image:
      # Not published on ghcr.io; mirror.gcr.io is the chart default and
      # already serves Envoy Gateway here.
      registry: mirror.gcr.io
      repository: aquasec/trivy-operator
      tag: 0.35.0@sha256:4cdb11af98ff409cfa7af980098203a841a5fe957cc6a0bbb0df7668065eb5fa
    # Every namespace. Churn is cut by label below rather than by namespace,
    # so the long-lived workloads in actions-runner-system and datasci are
    # still scanned.
    excludeNamespaces: ""
    operator:
      annotations:
        reloader.stakater.com/auto: "true"
      # One trivy-server StatefulSet holds the vuln DB and the layer cache;
      # scan jobs run in ClientServer mode against it instead of each one
      # downloading the DB. (The chart's switch for this is
      # builtInTrivyServer, which also sets trivy.mode and serverURL.)
      builtInTrivyServer: true
      scanJobsConcurrentLimit: 2
      # Job deadline. trivy.timeout below is the scanner's own limit and has
      # to be raised with it, or multi-GB images still die at 5m.
      scanJobTimeout: 20m
      # A failing scan (OOM, timeout) frees its slot; without a longer delay
      # the same multi-GB image would be retried every 30s and starve the
      # other slot.
      scanJobsRetryDelay: 10m
      # "" = delete the job as soon as its report is written.
      scanJobTTL: ""
      # Reports expire and are rescanned after this, which is how new CVEs in
      # the DB reach old images. Rescans are cheap (layers already analysed
      # are cached in trivy-server); the etcd write volume is what this
      # trades against.
      scannerReportTTL: 48h
      vulnerabilityScannerScanOnlyCurrentRevisions: true
      configAuditScannerScanOnlyCurrentRevisions: true
      # SbomReports (one per container, large) are only needed for
      # ClusterVulnerabilityReports and the cluster SBOM cache. Not worth the
      # etcd space.
      sbomGenerationEnabled: false
      clusterSbomCacheEnabled: false
      vulnerabilityScannerEnabled: true
      configAuditScannerEnabled: true
      rbacAssessmentScannerEnabled: true
      # Node-collector job per node; Talos-safe mounts in nodeCollector below.
      infraAssessmentScannerEnabled: true
      clusterComplianceEnabled: true
      # Secrets baked into images, mostly a check on our own ghcr.io/ekenheim
      # builds. Trivy masks the matched value in the report, and the chart's
      # aggregate ClusterRole only extends view/edit/admin, which nothing in
      # this cluster is bound to.
      exposedSecretScannerEnabled: true
      # The blog, datasci and development pods pull private images with a
      # ghcr-pull imagePullSecret; scanning them needs cluster-wide get on
      # Secrets and ServiceAccounts for the operator.
      accessGlobalSecretsAndServiceAccount: true
      # Per-severity counts per workload, which the dashboard and alerts use.
      # The per-CVE and per-check *Info metrics stay off (chart default):
      # their series count would scale with findings.
      metricsFindingsEnabled: true
    serviceMonitor:
      enabled: true
    # Operator informers cache every Pod, ReplicaSet, Role and report.
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 2Gi
    trivyOperator:
      # Init containers here are almost all the main image again (Cilium,
      # Istio, Crunchy, Rook) or a wait loop; skipping them saves a report per
      # init container.
      skipInitContainers: true
      # Label keys (key presence, not key=value). Single-use pods and Jobs
      # with a non-workload owner are scanned one by one, and their report
      # goes when they do:
      #   actions-ephemeral-runner  ARC runner pods (owner EphemeralRunner)
      #   dagster/run-id            Dagster run Jobs; the same images run as
      #                             Deployments in development, which are scanned
      #   prefect.io/flow-run-id    stale Jobs from the disabled Prefect install
      skipResourceByLabels: actions-ephemeral-runner,dagster/run-id,prefect.io/flow-run-id
      # No scanJobTolerations / scanJobNodeSelector: image-mode scan jobs get
      # neither from the scanned workload, so the llm-workload taint keeps
      # them off worker4, and master2's PreferNoSchedule taints steer them to
      # worker3. (filesystem/rootfs mode would pin each job to the workload's
      # node with nodeName, past the taint; that is why command stays image.)
    trivy:
      image:
        registry: ghcr.io
        repository: aquasecurity/trivy
        # The digest suffix is safe here: the operator's version checks fall
        # back to current flags when the tag does not parse as semver.
        tag: 0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
      command: image
      # ghcr.io rate-limits trivy-db pulls and scans then fail quietly; these
      # are Google's mirror of the same OCI artifacts (also the chart default,
      # pinned here so an upgrade cannot move them back).
      dbRegistry: mirror.gcr.io
      dbRepository: aquasec/trivy-db
      javaDbRegistry: mirror.gcr.io
      javaDbRepository: aquasec/trivy-java-db
      # Fixed-only, MEDIUM and up: what can be acted on, and it keeps a large
      # Ubuntu/ROCm image's VulnerabilityReport well under etcd's 1.5 MiB
      # object limit. LOW/UNKNOWN panels on the dashboard stay empty.
      ignoreUnfixed: true
      severity: MEDIUM,HIGH,CRITICAL
      timeout: 15m0s
      # Scan jobs and node-collector. The CPU limit is deliberate: a scan job
      # that lands on master2 must not starve etcd.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 1
          memory: 3Gi
      storageClassEnabled: true
      storageClassName: ceph-block
      # trivy-db, trivy-java-db and the per-layer analysis cache.
      storageSize: 10Gi
      server:
        resources:
          requests:
            cpu: 50m
            memory: 512Mi
          limits:
            cpu: null
            memory: 2Gi
    nodeCollector:
      # Image left to the chart (ghcr.io/aquasecurity/node-collector:0.3.1 in
      # 0.37.0): Renovate's helm-values manager only reads image blocks under
      # a key ending in `image`, so a pin here would never be bumped.
      # One job per node (useNodeSelector pins it), worker4 and the sole etcd
      # member included, same as tetragon: an infra assessment that skips a
      # node is quietly incomplete.
      useNodeSelector: true
      tolerations:
        - operator: Exists
      # Chart defaults minus /etc/systemd and /lib/systemd: Talos has no
      # systemd and a read-only /etc and /lib, so those hostPaths leave the
      # pod stuck in ContainerCreating (aquasecurity/trivy-operator#2566).
      # The /var/lib ones that only exist on a control plane are created
      # empty on the workers; /var is writable on Talos, so that is harmless.
      volumeMounts:
        - name: var-lib-etcd
          mountPath: /var/lib/etcd
          readOnly: true
        - name: var-lib-kubelet
          mountPath: /var/lib/kubelet
          readOnly: true
        - name: var-lib-kube-scheduler
          mountPath: /var/lib/kube-scheduler
          readOnly: true
        - name: var-lib-kube-controller-manager
          mountPath: /var/lib/kube-controller-manager
          readOnly: true
        - name: etc-kubernetes
          mountPath: /etc/kubernetes
          readOnly: true
        - name: etc-cni-netd
          mountPath: /etc/cni/net.d/
          readOnly: true
      volumes:
        - name: var-lib-etcd
          hostPath:
            path: /var/lib/etcd
        - name: var-lib-kubelet
          hostPath:
            path: /var/lib/kubelet
        - name: var-lib-kube-scheduler
          hostPath:
            path: /var/lib/kube-scheduler
        - name: var-lib-kube-controller-manager
          hostPath:
            path: /var/lib/kube-controller-manager
        - name: etc-kubernetes
          hostPath:
            path: /etc/kubernetes
        - name: etc-cni-netd
          hostPath:
            path: /etc/cni/net.d/
