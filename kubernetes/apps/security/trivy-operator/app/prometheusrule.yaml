---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
# The standing alert is per namespace, not per image: one image with a
# Critical CVE usually runs in several workloads, and a per-image alert would
# fire once for each. The "new" alert is per namespace and image repository,
# because it only fires on a change and has to say which image changed. With
# ignoreUnfixed on, every Critical counted here has a fixed version upstream.
#
# max_over_time bridges the rescans: when a report reaches scannerReportTTL
# it is deleted and its series disappears until the rescan lands, which with
# two scan slots can be a while. Without it the `for` would restart on every
# rescan cycle.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: trivy-operator
spec:
  groups:
    - name: trivy-operator.vulnerabilities
      rules:
        # Per namespace and image repository, the highest Critical count of
        # the last 6h (bridging rescans, as above). Not per tag, so a
        # Renovate bump that keeps the same CVEs is not "new".
        - record: trivy:image_critical_vulnerabilities:max6h
          expr: >-
            max by (namespace, image_repository) (
              max_over_time(trivy_image_vulnerabilities{severity="Critical"}[6h])
            )
        - alert: TrivyCriticalVulnerabilities
          expr: >-
            sum by (namespace) (
              max_over_time(trivy_image_vulnerabilities{severity="Critical"}[6h])
            ) > 0
          for: 6h
          labels:
            # info, not warning: this stays firing for as long as a
            # namespace carries fixable Criticals, often waiting on an
            # upstream release. Alertmanager only sends warning/critical to
            # alert-triage (MiniMax quota); info reaches Discord through its
            # own route (kube-prometheus-stack alertmanager-secret): one
            # message per namespace, repeated weekly rather than twice a day.
            # TrivyNewCriticalVulnerabilities is the one that asks for action.
            severity: info
          annotations:
            summary: >-
              {{ $value }} fixable Critical vulnerabilities in {{ $labels.namespace }}
            description: >-
              Trivy reports {{ $value }} Critical vulnerabilities with a fixed
              version available, summed over the workloads in
              {{ $labels.namespace }}. Per image in the Trivy Operator
              dashboard, or `kubectl get vulnerabilityreports -n
              {{ $labels.namespace }} -o wide`.
        # Fires when an image's Critical count is higher than a day ago, or
        # it had none a day ago: a new image deployed with Criticals, or a
        # new CVE in one already running. It resolves on its own a day
        # later, once the offset catches up, so it reaches alert-triage
        # without staying on. The last clause holds it back until the
        # recording rule has two days of history: without it every existing
        # Critical would look new on the first day, and reports from the
        # first scan wave (two slots, hours for the whole cluster) on the
        # second.
        - alert: TrivyNewCriticalVulnerabilities
          # `and` binds tighter than `or` in PromQL, hence the outer brackets.
          expr: >-
            (
              (
                trivy:image_critical_vulnerabilities:max6h > 0
                  unless
                trivy:image_critical_vulnerabilities:max6h offset 1d
              )
              or
              (
                trivy:image_critical_vulnerabilities:max6h
                  >
                trivy:image_critical_vulnerabilities:max6h offset 1d
              )
            )
            and on ()
            (count(trivy:image_critical_vulnerabilities:max6h offset 2d) > 0)
          labels:
            severity: warning
          annotations:
            summary: >-
              New Critical vulnerabilities in {{ $labels.image_repository }} ({{ $labels.namespace }})
            description: >-
              {{ $labels.image_repository }} in {{ $labels.namespace }} has
              {{ $value }} fixable Critical vulnerabilities, more than a day
              ago. `kubectl get vulnerabilityreports -n {{ $labels.namespace }}
              -o wide` lists the report; update or replace the image.
    - name: trivy-operator.health
      rules:
        - alert: TrivyOperatorDown
          expr: >-
            absent(up{job="trivy-operator", namespace="security"} == 1)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Trivy Operator is down or not scraped
            description: >-
              No healthy trivy-operator metrics target in security for 15m.
              Reports are not being created or refreshed, and the
              vulnerability alerts above go quiet with it.
        - alert: TrivyServerDown
          expr: >-
            kube_statefulset_status_replicas_ready{namespace="security", statefulset="trivy-server"} < 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: trivy-server has no ready replica
            description: >-
              Scan jobs run in ClientServer mode against trivy-server; while
              it is down every vulnerability scan fails and is retried.
