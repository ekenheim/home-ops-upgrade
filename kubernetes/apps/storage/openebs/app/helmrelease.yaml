---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  interval: 1h
  # Storage: Renovate never automerges this chart (autoMergeApps.json5).
  # Read the release notes and render the old and new chart before merging.
  # 4.4.0 -> 4.6.2 changed only the provisioner Deployment and its RBAC; the
  # local-hostpath StorageClass rendered byte-identical.
  chart:
    spec:
      chart: openebs
      version: 4.6.2
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
  install:
    disableHooks: true
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    disableHooks: true
    remediation:
      retries: 3
  values:
    localpv-provisioner:
      localpv:
        image:
          registry: quay.io/
        basePath: &hostPath /var/mnt/local-hostpath
      hostpathClass:
        enabled: true
        name: local-hostpath
        isDefaultClass: false
        basePath: *hostPath
      helperPod:
        image:
          registry: quay.io/
    loki:
      enabled: false
    alloy:
      enabled: false
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: false
          keep: false
    # Only Local PV Hostpath runs here. The umbrella chart gates each engine
    # on engines.*, and its defaults turn on LVM, ZFS and Mayastor. Unlike
    # 4.4.0, 4.6.2 also gates the hostpath provisioner itself on
    # engines.local.hostpath.enabled (default true). Rawfile is off by
    # default upstream ("not marked as stable yet"); it is pinned off here so
    # a later default flip cannot add an engine. The old top-level `minio`,
    # `zfs-localpv.enabled`, `lvm-localpv.enabled` and `mayastor.enabled`
    # keys were removed on 2026-10-19: they are not conditions in the chart
    # and dropping them leaves the rendered 4.6.2 manifests unchanged.
    engines:
      local:
        hostpath:
          enabled: true
        lvm:
          enabled: false
        zfs:
          enabled: false
        rawfile:
          enabled: false
      replicated:
        mayastor:
          enabled: false
