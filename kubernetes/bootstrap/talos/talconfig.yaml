# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json
---
# Renovate reads the version from installer-base: ghcr.io/siderolabs/installer
# stops at v1.13.11 and Talos 1.14 publishes only installer-base. Nodes still
# install from the factory images below; this only tracks the version.
# renovate: datasource=docker depName=ghcr.io/siderolabs/installer-base
talosVersion: v1.14.4
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.35.9

clusterName: &cluster home-kubernetes
endpoint: https://192.168.50.10:6443
clusterPodNets:
  - "10.42.0.0/16"
clusterSvcNets:
  - "10.43.0.0/16"
additionalApiServerCertSans: &sans
  - "192.168.50.10"
  - 127.0.0.1 # KubePrism
additionalMachineCertSans: *sans
cniConfig:
  name: none

nodes:
  - hostname: "master1"
    ipAddress: "192.168.50.31"
    # ASRock DeskMini B760 (B760M-STX, i5-14400, 64GB), installed 2026-10-22
    # replacing the dead NUC. Installs to a 200GB PLP SSD (HPE MK0200GCTYV, an
    # Intel OEM drive by its WWID prefix), pinned by WWID, not serial: the HPE
    # firmware leaves the Disk resource's serial field empty, so a serial
    # selector would never match. The 980 PRO with Heatsink on nvme0n1
    # (S6WSNS0W543068N, old master3's) is this node's OSD.
    installDiskSelector:
      wwid: "naa.55cd2e404c10726b"
    talosImageURL: factory.talos.dev/metal-installer/a30c16a32db3c99cb35f22401fad96807f80896dfc86aa4ec716ed6b4aff09de
    controlPlane: true
    patches:
      # openebs local-hostpath keeps its PVs under /var/mnt/local-hostpath.
      # Since Talos 1.10 /var/mnt is read-only and only user volumes may live
      # there, so a fresh install needs it declared. Here it gets the Kingston
      # A400 120GB (sdb) to itself, like master3, so the Crunchy replica's
      # fsyncs stay off the etcd disk.
      - |-
        apiVersion: v1alpha1
        kind: UserVolumeConfig
        name: local-hostpath
        provisioning:
          diskSelector:
            match: disk.wwid == "naa.50026b778355e654"
          minSize: 100GB
          grow: true
    networkInterfaces:
      # Single onboard Realtek RTL8125 2.5G (enp2s0). Static for the same
      # reason as master3.
      - deviceSelector:
          hardwareAddr: "9c:6b:00:ab:79:c5"
        dhcp: false
        addresses:
          - "192.168.50.31/24"
        mtu: 1500
        routes:
          - network: 0.0.0.0/0
            gateway: "192.168.50.1"
        vip:
          ip: "192.168.50.10"
  - hostname: "master2"
    ipAddress: "192.168.50.33"
    # Intel DC S3710 200GB (HPE MK0200GEYKC), moved over from the dead master1
    # on 2026-10-06 to replace the SanDisk SSD Plus, whose ~740 ms writes
    # stalled etcd. Pinned by WWID like master3. The 980 PRO on nvme0n1 is osd.3.
    installDiskSelector:
      wwid: "naa.55cd2e414db5ee67"
    talosImageURL: factory.talos.dev/metal-installer/a30c16a32db3c99cb35f22401fad96807f80896dfc86aa4ec716ed6b4aff09de
    controlPlane: true
    patches:
      # /var/mnt is read-only on Talos 1.13, so openebs local-hostpath needs a
      # user volume. A directory volume is just a directory on EPHEMERAL
      # bind-mounted at /var/mnt/<name>.
      - |-
        apiVersion: v1alpha1
        kind: UserVolumeConfig
        name: local-hostpath
        volumeType: directory
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: 48:21:0b:51:95:9d
        dhcp: true
        mtu: 1500
        routes:
          - network: 0.0.0.0/0
            gateway: "192.168.50.1"
        vip:
          ip: "192.168.50.10"
  - hostname: "master3"
    ipAddress: "192.168.50.34"
    # ASRock DeskMini B760 (B760M-STX, i3-14100, 64GB), installed 2026-10-21
    # replacing the dead NUC. Installs to a SanDisk SSD PLUS 240GB (sda), pinned
    # by WWID: its firmware reports no serial either. Not a PLP drive; swap in
    # one when available (reinstall). The 980 PRO on nvme0n1 was master1's
    # osd.2, wiped for a fresh OSD here; the second M.2 slot is empty.
    installDiskSelector:
      wwid: "naa.5001b448be5ea978"
    talosImageURL: factory.talos.dev/metal-installer/a30c16a32db3c99cb35f22401fad96807f80896dfc86aa4ec716ed6b4aff09de
    controlPlane: true
    patches:
      # local-hostpath gets the second SSD PLUS (sdb) to itself instead of a
      # directory on EPHEMERAL. Its only tenant on a master is the Crunchy
      # replica, and Postgres fsyncs on the install disk stall etcd there.
      - |-
        apiVersion: v1alpha1
        kind: UserVolumeConfig
        name: local-hostpath
        provisioning:
          diskSelector:
            match: disk.wwid == "naa.5001b448be5e75e4"
          minSize: 200GB
          grow: true
    networkInterfaces:
      # Single onboard Realtek RTL8125 2.5G (enp3s0).
      - deviceSelector:
          hardwareAddr: "9c:6b:00:ab:7a:8a"
        # Static, not DHCP: on 2026-09-22 the .34 reservation stopped matching
        # the old NUC's MAC after a re-cable and it came up on a dynamic lease.
        # etcd advertises its peer URL by IP, so a control-plane node on the
        # wrong address is an etcd member that can never rejoin.
        dhcp: false
        addresses:
          - "192.168.50.34/24"
        mtu: 1500
        routes:
          - network: 0.0.0.0/0
            gateway: "192.168.50.1"
        vip:
          ip: "192.168.50.10"

  - hostname: "worker3"
    ipAddress: "192.168.50.37"
    installDisk: "/dev/nvme1n1"
    # Schematic encodes node-specific addons; for Talos upgrade use a 1.12.x schematic with same addons and set e.g. .../NEW_SCHEMATIC:v1.12.3
    # Schematic: siderolabs/amd-ucode + siderolabs/amdgpu, no extra kernel args.
    # amdgpu drives the Granite Ridge Radeon iGPU for VAAPI video work (Immich,
    # Frigate decode), exposed as devic.es/dri by kube-tools/generic-device-plugin.
    # Do not copy worker4's Strix Halo kernel args here. Was 96f8c146... (amd-ucode only).
    talosImageURL: factory.talos.dev/metal-installer/9c1d1b442d73f96dcd04e81463eb20000ab014062d22e1b083e1773336bc1dd5
    controlPlane: false
    networkInterfaces:
      # 2x 10G bonded via LACP
      - interface: bond0
        bond:
          mode: 802.3ad
          lacpRate: fast
          xmitHashPolicy: layer3+4
          miimon: 100
          updelay: 200
          downdelay: 200
          deviceSelectors:
            - hardwareAddr: "58:47:ca:7e:9f:cf"
            - hardwareAddr: "58:47:ca:7e:9f:d0"
        dhcp: true
        mtu: 9000
        routes:
          - network: 0.0.0.0/0
            gateway: "192.168.50.1"

  - hostname: "worker4"
    ipAddress: "192.168.50.38"
    # Two NVMe drives, both matched by name-based selectors, so pin the OS disk
    # by serial: a reordered enumeration would otherwise point the installer at
    # the 2TB Kingston that Rook claims as an OSD (deviceFilter: nvme0n1).
    # Samsung 970 EVO Plus 500GB, currently nvme1n1.
    installDiskSelector:
      serial: "S4EVNMFN814603N"
    # AMD Ryzen AI MAX+ 395 "Strix Halo" (Radeon 8060S iGPU, 128GB unified).
    # Its own schematic, NOT worker3's (amd-ucode + plain amdgpu): adds
    # the Strix Halo kernel args ROCm needs. amd_iommu=off is required for
    # the iGPU to work at all; the gttsize/ttm values size the GPU's share of
    # unified memory and assume a 128GB board. pcie_ports=native and
    # pcie_ecrc=on are in the schematic too (see the AER note under patches).
    talosImageURL: factory.talos.dev/metal-installer/0d2744ab5638d670407dfe725f771748f1a95f402c859f82406f0baddc8de163
    controlPlane: false
    nodeLabels:
      topology.kubernetes.io/gpus: amd
      node-role.kubernetes.io/rocm-worker: "true"
    # Dedicated LLM node. On this UMA part the amdgpu GTT pins system RAM that
    # the kernel OOM killer cannot reclaim, so co-tenanting general workloads
    # here risks deadlocking the node. Rook tolerates this taint (see the
    # rook-ceph cluster HelmRelease placement.all) so osd.1 stays put.
    #
    # registerWithTaints, NOT talhelper's `nodeTaints`. nodeTaints is applied
    # post-registration by Talos's k8s.NodeApplyController using the *kubelet's*
    # kubeconfig, and the NodeRestriction admission plugin forbids a kubelet
    # from modifying its own node's taints:
    #   nodes "worker4" is forbidden: node "worker4" is not allowed to modify taints
    # That failure is atomic, so it also blocks nodeLabels from reconciling.
    # A kubelet may only set taints when it first registers the node, which is
    # what registerWithTaints does.
    #
    # Consequence: this has no effect on an already-registered node. If the Node
    # object is ever deleted and re-registers, the taint comes back by itself;
    # to taint an existing node, apply it with admin credentials:
    #   kubectl taint node worker4 llm-workload=true:NoSchedule --overwrite
    patches:
      - |-
        machine:
          kubelet:
            extraConfig:
              registerWithTaints:
                - key: llm-workload
                  value: "true"
                  effect: NoSchedule
      # worker4 (MS-S1 MAX) hard-resets under sustained GPU load; every boot
      # reports `x86/amd: Previous system reset reason [0x08000800]: an
      # uncorrected error caused a data fabric sync flood event`. The firmware
      # keeps PCIe error handling to itself (`_OSC: platform does not support
      # [AER LTR DPC]`), so the OS never sees whether a device (the DRAM-less
      # Kingston NVMe with its 64 MiB host memory buffer is the suspect) is
      # throwing errors before the fabric resets. Take AER natively so the
      # counters logged by apps/llm/llmkube/app/pcie-aer-logger.yaml are real.
      # An hour of 90 GB CPU-only memory stress (2026-09-16) did NOT reset the
      # node, so the memory controller is not the problem on its own.
      # The args live in the schematic, not machine.install.extraKernelArgs:
      # worker4 boots with systemd-boot, which takes the cmdline from the UKI
      # and ignores extraKernelArgs. They sat in this config (with
      # grubUseUKICmdline: false) from 2026-09-22 and never reached the kernel,
      # not even after the 2026-09-29 upgrade. Schematic 0d2744ab... is
      # c38bf6e7... plus these two args. Applied by a Talos upgrade (reboot).
      # BIOS UMA Frame Buffer stays Auto (VRAM 2 GiB, everything in GTT). A
      # FIXED 96 GB carve-out was planned here, but qwen38-flash-next keeps its
      # 27 GiB n-gram table in host RAM (measured 2026-10-11), so 96 GB would
      # leave ~32 GB for host + table + Ceph and not fit. See the BUDGET notes in
      # apps/llm/llmkube/app/qwen38-flash-next.yaml.
    networkInterfaces:
      # 2x 10G bonded via LACP (switch LAG on USW Pro XG 24 ports 11+12).
      # Both ports are RTL8127 10GbE on r8169 (pciID 10EC:8127, verified
      # 2026-09-29); an older note here called one of them 2.5G, it is not.
      # Bonded rather than two NICs because both sit on the same L2 and the
      # Cilium L2 policy matches ^(ens|enp|bond).*: unbonded, the second MAC
      # can answer ARP for LoadBalancer VIPs -- the failure that forced
      # master3 onto a bond. worker3 (ports 13+14) is set up the same way.
      - interface: bond0
        bond:
          mode: 802.3ad
          lacpRate: fast
          xmitHashPolicy: layer3+4
          miimon: 100
          updelay: 200
          downdelay: 200
          deviceSelectors:
            # :13 first so bond0 inherits the MAC the node has always used.
            - hardwareAddr: "38:05:25:31:97:13"
            - hardwareAddr: "38:05:25:31:97:12"
        # Static, not DHCP, for the same reason as master3: a re-cable can
        # leave the .38 reservation keyed to a MAC the bond no longer shows.
        dhcp: false
        addresses:
          - "192.168.50.38/24"
        # Jumbo verified end-to-end: ping -M do -s 8972 worker3 -> worker4 is
        # 0% loss. Note the first install stalled here for ~90s retrying the
        # installer blob with "TLS handshake timeout" -- the LAN is 9000 but
        # the internet path is 1500, so an external pull waits on PMTU
        # discovery. It self-recovers; do not lower the MTU chasing it.
        mtu: 9000
        routes:
          - network: 0.0.0.0/0
            gateway: "192.168.50.1"

patches:
  # Configure containerd
  - |-
    machine:
      files:
        - op: create
          path: /etc/cri/conf.d/20-customization.part
          content: |-
            [plugins."io.containerd.grpc.v1.cri"]
              enable_unprivileged_ports = true
              enable_unprivileged_icmp = true
            [plugins."io.containerd.grpc.v1.cri".containerd]
              discard_unpacked_layers = false
            [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
              discard_unpacked_layers = false
    # Configure NFS Mounts
  - |-
    machine:
      files:
        - op: overwrite
          path: /etc/nfsmount.conf
          permissions: 420
          content: |-
            [ NFSMount_Global_Options ]
              nfsvers = 4.2
              hard = True
              noatime = True
              nodiratime = True
              rsize = 131072
              wsize = 131072
              nconnect = 8

  # Disable search domain everywhere
  - |-
    machine:
      network:
        disableSearchDomain: true

  # Enable cluster discovery -- service registry only. The Kubernetes registry
  # needs to list Nodes, which NodeRestriction forbids a worker kubelet, so on
  # worker4 it failed every ~2s ("cannot list resource nodes") and flooded the
  # kernel ring buffer: the boot-time "Previous system reset reason" line was
  # gone within ~35 min of every reset (2026-10-11). It is deprecated upstream.
  - |-
    cluster:
      discovery:
        registries:
          kubernetes:
            disabled: true
          service:
            disabled: false

  # Configure kubelet
  - |-
    machine:
      kubelet:
        extraArgs:
          image-gc-low-threshold: 50
          image-gc-high-threshold: 55
          rotate-server-certificates: true
          max-pods: "250"
          system-reserved: "memory=2Gi"
          kube-reserved: "memory=1Gi"
          # Evict before the kernel OOM killer has to act. Most apps request
          # less than they can burst to (low requests, generous limits), so
          # under node pressure the kubelet must get there first: it evicts
          # pods running over their requests, lowest priority first, while the
          # OOM killer just shoots whatever scores highest -- on master2 that
          # can be etcd's or the apiserver's neighbour mid-write. The stock hard
          # threshold (100Mi) left no room for that. Soft at 2Gi gives a
          # graceful 90s eviction, hard at 1Gi is immediate. eviction-hard
          # replaces the kubelet's defaults wholesale, so the disk signals
          # below are the stock values restated. Lowers allocatable by ~0.9Gi
          # per node. Blind to worker4's GTT (not cgroup-charged): requests
          # are what protect that node, see apps/llm/llmkube.
          eviction-hard: "memory.available<1Gi,nodefs.available<10%,nodefs.inodesFree<5%,imagefs.available<15%,imagefs.inodesFree<5%"
          eviction-soft: "memory.available<2Gi"
          eviction-soft-grace-period: "memory.available=90s"
          eviction-max-pod-grace-period: "60"
        nodeIP:
          validSubnets:
            - "192.168.50.0/24"

  # Force nameserver
  - |-
    machine:
      network:
        nameservers:
          - 192.168.1.1
          - 1.1.1.1

  # Configure NTP
  - |-
    machine:
      time:
        disabled: false
        servers:
          - time.cloudflare.com

  # Custom sysctl settings
  - |-
    machine:
      sysctls:
        fs.inotify.max_queued_events: "65536"
        fs.inotify.max_user_watches: "524288"
        fs.inotify.max_user_instances: "8192"
        net.core.rmem_max: "2500000"
        net.core.wmem_max: "2500000"

  # Mount openebs-hostpath in kubelet
  - |-
    machine:
      kubelet:
        extraMounts:
          - destination: /var/openebs/local
            type: bind
            source: /var/openebs/local
            options: ["bind", "rshared", "rw"]

  # Stable /dev/zwave symlink for Aeotec Z-Stick 10 Pro (CP2105 10c4:ea70)
  # if01 = Z-Wave port; if00 = Zigbee port
  - |-
    machine:
      udev:
        rules:
          - SUBSYSTEM=="tty", ATTRS{idVendor}=="10c4", ATTRS{idProduct}=="ea70", ENV{ID_USB_INTERFACE_NUM}=="01", SYMLINK+="zwave"

  # Disable predictable NIC naming
  #- |-
  #  machine:
  #    install:
  #      extraKernelArgs:
  #        - net.ifnames=0

  # Add kernel modules
  #- |-
  #  machine:
  #    kernel:
  #      modules:
  #        - name: nvidia
  #        - name: nvidia_uvm
  #        - name: nvidia_drm
  #        - name: nvidia_modeset

controlPlane:
  patches:
    # Cluster configuration
    - |-
      cluster:
        allowSchedulingOnMasters: true
        controllerManager:
          extraArgs:
            bind-address: 0.0.0.0
            # The stock 40s grace period is far too twitchy for this cluster. etcd
            # on the consumer SATA install disk (see the etcd block below) stalls
            # long enough that a kubelet's status POST through KubePrism exceeds its
            # 10s timeout; at 40s the node is marked NotReady, and 5 minutes later
            # the taint manager evicts every pod on it (~85). That mass deletion
            # floods the API, slows etcd further, and flaps the next node -- a
            # self-feeding spiral that took out Postgres, MariaDB and most of
            # datasci on 2026-08-22. Widening the grace period lets a node ride out
            # a stall instead of triggering an eviction storm.
            # Revert to the default if etcd is ever moved onto the NVMe.
            node-monitor-grace-period: 2m
        coreDNS:
          disabled: true
        proxy:
          disabled: true
        scheduler:
          extraArgs:
            bind-address: 0.0.0.0

    # ETCD configuration
    - |-
      cluster:
        etcd:
          extraArgs:
            listen-metrics-urls: http://0.0.0.0:2381
            # etcd lives in /var/lib/etcd on the install disk (/dev/sda), which on
            # these masters is a DRAM-less consumer SATA SSD (Kingston A400 /
            # SanDisk SSD Plus). WAL fsync p99 measures 15-50ms where etcd wants
            # <10ms, so the stock 100ms heartbeat / 1s election timeout was
            # triggering ~400 leader elections a week. Each election stalls writes
            # long enough for every leader-elected controller in the cluster
            # (ceph-csi, kyverno, cilium-operator, ...) to drop its lease and
            # crashloop. Widening the timeouts absorbs the disk's latency.
            # These MUST stay identical on all three members.
            # Revert to defaults if etcd is ever moved onto the NVMe.
            heartbeat-interval: "250"
            election-timeout: "2500"
          advertisedSubnets:
            - "192.168.50.0/24"

    # Configure API server admission to allow privileged by default.
    # Namespaces opt into restrictions via pod-security labels.
    - |-
      cluster:
        apiServer:
          admissionControl:
            - name: PodSecurity
              configuration:
                apiVersion: pod-security.admission.config.k8s.io/v1alpha1
                kind: PodSecurityConfiguration
                defaults:
                  enforce: privileged
                  enforce-version: latest
                  audit: restricted
                  audit-version: latest
                  warn: restricted
                  warn-version: latest
                exemptions:
                  namespaces: []
                  runtimeClasses: []
                  usernames: []

    # Enable K8s Talos API Access
    - |-
      machine:
        features:
          kubernetesTalosAPIAccess:
            enabled: true
            allowedRoles:
              - os:admin
              # kube-tools/etcd-backup: etcd snapshots only.
              - os:etcd:backup
            allowedKubernetesNamespaces:
              - kube-tools

    # Enable hostDNS:
    - |-
      machine:
        features:
          hostDNS:
            enabled: true
            forwardKubeDNSToHost: true
            resolveMemberNames: true
