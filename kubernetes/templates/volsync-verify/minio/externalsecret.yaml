---
# The MinIO restic secret kubernetes/templates/volsync renders next to
# each app, rendered into backup-verify once per app in the rotation
# (kubernetes/apps/backup-verify/volsync-verify/ks.yaml) so the verifier
# restores in its own namespace and never reads a Secret itself.
# Static credentials, so a daily refresh is plenty.
# yaml-language-server: $schema=https://lds-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: "${APP}-volsync"
spec:
  secretStoreRef:
    name: bitwarden-secrets-manager
    kind: ClusterSecretStore
  refreshInterval: 24h
  target:
    name: "${APP}-volsync"
    template:
      engineVersion: v2
      data:
        RESTIC_REPOSITORY: "{{ .REPOSITORY_TEMPLATE }}/${APP}"
        RESTIC_PASSWORD: "{{ .RESTIC_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
  dataFrom:
  - extract:
      key: volsync-bucket
  - extract:
      key: volsync-minio-template
      property: RESTIC_REPOSITORY
